/* Midas tokens, docs/DESIGN.md 2.1, 2.2, 2.4. Page chrome is light; the phone carries its own theme. */
:root {
  --page: #FAFAFA;
  --volt: #CEFF00;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", sans-serif;
  --hand: "MidasHand", "Caveat", cursive;
}
.theme-light {
  --paper: #FFFFFF; --ink: #111111; --ink-2: #6B6B6B; --ink-3: #BDBDBD;
  --rule: rgba(17, 17, 17, 0.12); --paper-2: #F3F2EF; --shadow: rgba(0, 0, 0, 0.14);
  --wall: #E9E6DF; --frost: rgba(255, 255, 255, 0.8); --frost-edge: rgba(17, 17, 17, 0.12);
  --sheet: #FFFFFF; --dim: rgba(0, 0, 0, 0.32); --red: #FF3B30;
  --finger-body: rgba(255, 255, 255, 0.55); --finger-edge: #111111;
  --badge: rgba(214, 214, 214, 0.95); --badge-mark: #111111; --bezel: #111111;
  --listen: #CEFF00; --orb-body: #FFFFFF; --orb-ring: #111111; --orb-core: #111111; --orb-glow: rgba(0, 0, 0, 0.18);
}
.theme-dark {
  --paper: #111111; --ink: #FFFFFF; --ink-2: #A3A3A3; --ink-3: #5C5C5C;
  --rule: rgba(255, 255, 255, 0.14); --paper-2: #1C1C1C; --shadow: rgba(0, 0, 0, 0.55);
  --wall: #1C1C1C; --frost: rgba(44, 44, 46, 0.78); --frost-edge: rgba(255, 255, 255, 0.18);
  --sheet: #1C1C1C; --dim: rgba(0, 0, 0, 0.55); --red: #FF453A;
  --finger-body: rgba(17, 17, 17, 0.45); --finger-edge: #FFFFFF;
  --badge: rgba(72, 72, 74, 0.95); --badge-mark: #FFFFFF; --bezel: #2E2E2E;
  --listen: #E7FF85; --orb-body: #000000; --orb-ring: #2A2A2A; --orb-core: #FFFFFF; --orb-glow: rgba(255, 255, 255, 0.22);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: #111111; font-family: var(--font); -webkit-font-smoothing: antialiased; }
.page { max-width: 1180px; margin: 0 auto; padding: 0 16px 64px; }
h1 { font-size: 28px; margin: 24px 0 0; letter-spacing: -0.4px; }
.date { color: #6B6B6B; font-size: 14px; margin: 4px 0 0; }

/* Picks, sticky */
.picks { position: sticky; top: 0; z-index: 40; background: rgba(250, 250, 250, 0.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid rgba(17, 17, 17, 0.12); margin: 12px -16px 0; padding: 10px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.picks b { font-size: 15px; margin-right: 6px; }
.pick-chip { font-size: 14px; font-weight: 600; border: 1.5px solid #111111; border-radius: 999px; padding: 3px 11px; min-width: 44px; text-align: center; }

.layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 32px; margin-top: 24px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.side { display: flex; flex-direction: column; gap: 6px; }
.side h3 { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: #6B6B6B; text-transform: uppercase; margin: 16px 0 2px; }
.side h3:first-child { margin-top: 0; }
.pick-row { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: center; background: #FFFFFF; border: 1.5px solid rgba(17, 17, 17, 0.12); border-radius: 16px; padding: 10px 14px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.pick-row:hover { border-color: #6B6B6B; }
.pick-row[aria-pressed="true"] { border-color: #111111; box-shadow: 0 0 0 1.5px #111111; }
.pick-id { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.pick-name { font-size: 15px; font-weight: 600; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { font: inherit; font-size: 14px; background: #FFFFFF; color: #111111; border: 1px solid rgba(17, 17, 17, 0.14); border-radius: 999px; padding: 6px 13px; min-height: 34px; cursor: pointer; }
.btn[aria-pressed="true"] { background: #111111; color: #FFFFFF; border-color: #111111; }
.btn.round { width: 40px; padding: 0; font-size: 18px; }
.scrub { width: 100%; accent-color: #111111; }
.time-out { font-size: 13px; color: #6B6B6B; font-variant-numeric: tabular-nums; }

.stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.nav { display: flex; gap: 10px; align-items: center; }
.fit { position: relative; flex-shrink: 0; }
.fit-inner { position: absolute; left: 10px; top: 10px; transform-origin: top left; }

/* The phone: iPhone 16 Pro, 402 x 874 pt */
.phone { width: 402px; height: 874px; position: relative; overflow: hidden; border-radius: 56px; background: #000000; box-shadow: 0 0 0 10px #111111, 0 20px 50px rgba(0, 0, 0, 0.18); user-select: none; -webkit-user-select: none; }
.screen { position: absolute; inset: 0; background: var(--paper); color: var(--ink); border-radius: 56px; overflow: hidden; font-family: var(--font); touch-action: pan-y; cursor: grab; }
.screen.dragging { cursor: grabbing; }
.island { position: absolute; top: 11px; left: 50%; width: 126px; height: 37px; margin-left: -63px; background: #000000; border-radius: 19px; z-index: 60; }
.status { position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 59; color: var(--ink); font-size: 17px; font-weight: 600; pointer-events: none; }
.status .time { position: absolute; left: 50px; top: 17px; }
.status .icons { position: absolute; right: 34px; top: 21px; display: flex; gap: 6px; align-items: center; }
.status .bars { width: 18px; height: 12px; background: currentColor; clip-path: polygon(0 100%, 100% 0, 100% 100%); }
.status .battery { width: 26px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; position: relative; opacity: 0.9; }
.status .battery::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: currentColor; border-radius: 1.5px; }
.home-bar { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); z-index: 61; }

/* The swipe-over */
.track { position: absolute; left: 0; top: 0; height: 874px; display: flex; will-change: transform; }
.card { position: relative; width: 402px; height: 874px; flex-shrink: 0; }
.holder { position: absolute; overflow: hidden; }
.title { position: absolute; left: 24px; right: 24px; text-align: center; color: var(--ink); }
.line { position: absolute; left: 24px; right: 24px; text-align: center; color: var(--ink-2); font-size: 17px; line-height: 22px; }
.dots { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 7px; z-index: 5; pointer-events: none; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.dots i.on { background: var(--ink); }
.finish { position: absolute; left: 24px; right: 24px; bottom: 34px; height: 52px; border-radius: 999px; border: none; background: var(--ink); color: var(--paper); font: inherit; font-size: 17px; font-weight: 600; z-index: 5; cursor: pointer; }

/* T1: a phone in a phone */
.l-T1 .holder { left: 72.5px; top: 70px; width: 257px; height: 559px; border-radius: 40px; box-shadow: 0 0 0 5px var(--bezel), 0 10px 30px var(--shadow); }
.l-T1 .title { top: 662px; font-size: 28px; font-weight: 700; letter-spacing: -0.4px; }
.l-T1 .line { top: 702px; }
.l-T1 .dots { top: 758px; }
/* T2: the Add Widget card */
.l-T2 .wallcard { position: absolute; left: 20px; right: 20px; top: 66px; height: 570px; border-radius: 30px; background: var(--wall); box-shadow: inset 0 0 0 1px var(--rule); }

// ---------- Small helpers ----------

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) {
    node.className = className;
  }
  if (text !== undefined && text !== null) {
    node.textContent = text;
  }
  return node;
}

function clamp01(value) {
  return Math.max(0, Math.min(1, value));
}

// The Add Widget demo's easing: 0 before start, 1 after end, smoothstep between (nothing overshoots)
function progress(time, start, end) {
  const linear = clamp01((time - start) / (end - start));
  return linear * linear * (3 - 2 * linear);
}

function linearProgress(time, start, end) {
  return clamp01((time - start) / (end - start));
}

function within(time, start, end) {
  return time >= start && time < end;
}

function mix(from, to, amount) {
  return from + (to - from) * amount;
}

const ICON_PATHS = {
  check: "M5 12.5l4.5 4.5L19 7.5",
  drop: "M12 3.5c3.5 4.4 6 7.8 6 10.7a6 6 0 0 1-12 0c0-2.9 2.5-6.3 6-10.7z",
  leaf: "M5 19c0-8 5-13 14-14 0 9-5 14-13 14z M5 19l8-8",
  x: "M6 6l12 12 M18 6L6 18",
  up: "M12 19V5 M5.5 11.5L12 5l6.5 6.5"
};

function svgIcon(name, size, weight) {
  const holder = element("span");
  holder.style.display = "flex";
  const stroke = weight || 2;
  holder.innerHTML = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + stroke + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + ICON_PATHS[name] + '"/></svg>';
  return holder;
}

// The word in the Midas hand, sized by the font's own scale
function writtenWord(word, fontPx) {
  const glyph = GLYPHS[word];
  const box = glyph.box;
  const width = box[2] - box[0];
  const height = box[3] - box[1];
  const scale = fontPx / 1000;
  const holder = element("span");
  holder.style.display = "flex";
  holder.innerHTML = '<svg viewBox="' + box[0] + " " + box[1] + " " + width + " " + height + '" width="' + (width * scale).toFixed(1) + '" height="' + (height * scale).toFixed(1) + '" aria-hidden="true"><path d="' + glyph.d + '" fill="currentColor"/></svg>';
  return holder;
}

// Text width at the tag's font, for the tag's width as its word changes
let measurer = null;
function textWidth(text, font) {
  if (!measurer) {
    measurer = element("span");
    measurer.style.position = "absolute";
    measurer.style.visibility = "hidden";
    measurer.style.whiteSpace = "nowrap";
    document.body.append(measurer);
  }
  measurer.style.font = font;
  measurer.textContent = text;
  return measurer.getBoundingClientRect().width;
}

function statusBar() {

  bar.append(element("span", "time", "9:41"));

  bar.append(icons);
  return bar;
}

function addChrome(screen) {
  screen.append(element("div", "island"), statusBar(), element("div", "home-bar"));
}

function buildFinger(screen) {
  const finger = element("div", "finger");
  screen.append(finger);
  return finger;
}

// Where the touch is: visible fades it, pressed shrinks it to 82% as the Add Widget demo does
function placeFinger(finger, x, y, visible, pressed) {
  finger.style.left = x.toFixed(1) + "px";
  finger.style.top = y.toFixed(1) + "px";
  finger.style.opacity = visible.toFixed(3);
  finger.style.transform = pressed ? "scale(0.82)" : "scale(1)";
}

// jess's orb, small: body, ring, core; listening turns the core Volt; thinking sweeps an arc
function buildOrb(size) {
  const orb = element("div", "orb");
  orb.style.width = size + "px";
  orb.style.height = size + "px";
  const ripple = element("div", "o-ripple");
  const body = element("div", "o-body");
  const core = element("div", "o-core");
  const arcHolder = element("span");
  arcHolder.innerHTML = '<svg class="o-arc" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.6" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="13.5 60"/></svg>';
  const arc = arcHolder.firstChild;
  orb.append(ripple, body, core, arc);
  return { root: orb, ripple: ripple, core: core, arc: arc };
}

function setOrbListening(orb, listening, time) {
  orb.core.style.background = listening ? "var(--listen)" : "";
  // The outline ripples with the voice
  const wave = listening ? 0.5 + 0.5 * Math.sin(time * 9) : 0;
  orb.core.style.width = listening ? (34 + wave * 6).toFixed(1) + "%" : "30%";
  orb.core.style.height = orb.core.style.width;
  orb.ripple.style.opacity = listening ? (0.5 * (1 - wave)).toFixed(3) : "0";
  orb.ripple.style.transform = "scale(" + (1 + wave * 0.22).toFixed(3) + ")";
}

function setOrbThinking(orb, thinking, time) {
  orb.arc.style.opacity = thinking ? "1" : "0";
  orb.arc.style.transform = "rotate(" + ((time / 1.1) * 360).toFixed(1) + "deg)";
}

// ---------- Home grid ----------

const GRID_TOP = 104;
const COLUMN_WIDTH = (402 - 40 - 24) / 4;
const ROW_STEP = 60 + 6 + 15 + 22;

const SIDEKICKS = {
  jess: { name: "Jess", builtIn: true },
  make: { name: "Make", builtIn: true },
  reminders: { name: "Reminders", colour: "#C9F24D", glyph: "check" },
  water: { name: "Water", colour: "#30D5C8", glyph: "drop" },
  plants: { name: "Plants", colour: "#9CAF88", glyph: "leaf" }
};

function cellPosition(index) {
  const column = index % 4;
  const row = Math.floor(index / 4);
  const left = 20 + column * (COLUMN_WIDTH + 8) + (COLUMN_WIDTH - 84) / 2;
  return { left: left, top: GRID_TOP + row * ROW_STEP };
}

// A tile: Jess and Make are their written word on paper, the rest a palette colour and glyph
function buildTile(id, size) {
  const sidekick = SIDEKICKS[id];
  const tile = element("div", "tile");
  tile.style.width = size + "px";
  tile.style.height = size + "px";
  tile.style.borderRadius = (size * 0.225).toFixed(1) + "px";
  if (sidekick.builtIn) {
    tile.classList.add("edge");
    tile.style.background = "var(--paper)";
    tile.style.color = "var(--ink)";
    tile.append(writtenWord(sidekick.name, size * 0.322));
    return tile;
  }
  tile.style.background = sidekick.colour;
  tile.style.color = "#111111";
  tile.append(svgIcon(sidekick.glyph, size * 0.5, 2.2));
  return tile;
}

function buildHome(ids) {
  const layer = element("div", "layer");
  layer.append(element("div", "h-title", "Midas"), element("div", "h-initial", "B"));
  const cells = {};
  for (let index = 0; index < ids.length; index++) {
    const id = ids[index];
    const position = cellPosition(index);
    const cell = element("div", "cell");
    cell.style.left = position.left + "px";
    cell.style.top = position.top + "px";
    const tile = buildTile(id, 60);
    const badge = element("div", "badge");
    tile.append(badge);
    const label = element("span", null, SIDEKICKS[id].name);
    cell.append(tile, label);
    layer.append(cell);
    cells[id] = { cell: cell, tile: tile, badge: badge, label: label, centre: { x: position.left + 42, y: position.top + 30 } };
  }
  return { layer: layer, cells: cells };
}

// ---------- The pill (PillBar: orb, words, Send) ----------

function buildPill(placeholder) {
  const pill = element("div", "pillbar");
  const orb = buildOrb(44);
  orb.root.classList.add("p-orb");
  const words = element("div", "p-text ph", placeholder);

function setPillWords(pill, words) {
  const hasWords = words.length > 0;
  pill.words.textContent = hasWords ? words : pill.placeholder;
  pill.words.classList.toggle("ph", !hasWords);
  pill.send.classList.toggle("on", hasWords);
}

// The words heard so far, one word at a time
function heardWords(sentence, time, start, end) {
  const all = sentence.split(" ");
  const count = Math.floor(linearProgress(time, start, end) * all.length + 0.0001);
  return all.slice(0, count).join(" ");
}

const EDIT = { down: 0.7, open: 1.45, listen: 2.4, heard: 3.9, send: 4.7, onIt: 4.8, editing: 5.9, leave: 6.9 };

function editTagWord(time) {
  if (time < EDIT.onIt) {
    return { from: "Edit", to: "Edit", amount: 1 };
  }
  if (time < EDIT.editing) {
    return { from: "Edit", to: "On it", amount: progress(time, EDIT.onIt, EDIT.onIt + 0.2) };
  }
  return { from: "On it", to: "Editing", amount: progress(time, EDIT.editing, EDIT.editing + 0.2) };
}

function renderEditDemo(parts, time) {
  // Three fingers press near the top and pull down
  const fingersIn = progress(time, 0.3, 0.5) * (1 - progress(time, EDIT.open, EDIT.open + 0.2));
  const pull = progress(time, EDIT.down, EDIT.open);
  const pressed = within(time, 0.55, EDIT.open);
  for (let index = 0; index < 3; index++) {
    placeFinger(parts.fingers[index], 136 + index * 65, 260 + pull * 200 + (index === 1 ? -12 : 0), fingersIn, pressed);
  }
  // The rim traces in with the pull, drains after Send
  const rimIn = progress(time, EDIT.down + 0.1, EDIT.open) * (1 - progress(time, EDIT.send, EDIT.send + 0.3));
  parts.rim.style.opacity = rimIn.toFixed(3);
  // Tag drops in, words change after Send, leaves at the end
  const tagIn = progress(time, EDIT.open, EDIT.open + 0.26);
  const tagOut = progress(time, EDIT.leave, EDIT.leave + 0.4);
  const word = editTagWord(time);
  const width = mix(parts.tagWidths[word.from], parts.tagWidths[word.to], word.amount);
  parts.tag.style.width = width.toFixed(1) + "px";
  parts.tag.style.transform = "translate(" + (201 - width / 2).toFixed(1) + "px," + ((1 - tagIn) * -36).toFixed(1) + "px)";
  parts.tag.style.opacity = (tagIn * (1 - tagOut)).toFixed(3);
  for (const key of Object.keys(parts.tagWords)) {
    let shown = 0;
    if (key === word.to) {
      shown = word.amount;
    } else if (key === word.from) {
      shown = 1 - word.amount;
    }
    parts.tagWords[key].style.opacity = shown.toFixed(3);
  }
  setOrbThinking(parts.tagOrb, time > EDIT.send + 0.1, time);
  // Close, Undo / Clear and the pill come in after the pull and leave after Send
  const controlsIn = progress(time, EDIT.open, EDIT.open + 0.4);
  const controlsOut = progress(time, EDIT.send + 0.2, EDIT.send + 0.52);
  const controlsShown = controlsIn * (1 - progress(time, EDIT.send, EDIT.send + 0.2));
  parts.close.style.opacity = controlsShown.toFixed(3);
  parts.minis.style.opacity = controlsShown.toFixed(3);
  parts.pill.root.style.transform = "translateY(" + ((1 - controlsIn) * 110 + controlsOut * 110).toFixed(1) + "px)";
  parts.pill.root.style.opacity = (controlsIn * (1 - progress(time, EDIT.send + 0.3, EDIT.send + 0.52))).toFixed(3);
  // Tap the orb, say the change
  const listening = within(time, EDIT.listen, EDIT.heard + 0.3);
  setOrbListening(parts.pill.orb, listening, time);
  setPillWords(parts.pill, heardWords(EDIT_ASK, time, EDIT.listen + 0.2, EDIT.heard));
  // One finger: the orb, then Send
  if (time < EDIT.listen + 0.4) {
    placeFinger(parts.finger, ORB_X, PILL_Y, progress(time, EDIT.listen - 0.5, EDIT.listen - 0.3) * (1 - progress(time, EDIT.listen + 0.2, EDIT.listen + 0.4)), within(time, EDIT.listen - 0.15, EDIT.listen));
  } else {
    placeFinger(parts.finger, SEND_X, PILL_Y, progress(time, EDIT.heard + 0.2, EDIT.heard + 0.4) * (1 - progress(time, EDIT.send + 0.1, EDIT.send + 0.3)), within(time, EDIT.send - 0.15, EDIT.send));
  }
}

const BACK = { touch: 0.8, release: 1.9, gone: 2.25, tap: 3.6, pushed: 4.05 };

function backPageOffset(time) {
  if (time < BACK.touch) {
    return 0;
  }
  if (time < BACK.release) {
    // The page follows the finger from the edge
    return progress(time, BACK.touch + 0.05, BACK.release) * 300;
  }
  if (time < BACK.tap) {
    return mix(300, 402, progress(time, BACK.release, BACK.gone));
  }
  // Tapping Water pushes the page back in
  return 402 * (1 - progress(time, BACK.tap + 0.05, BACK.pushed));
}

function renderBackDemo(parts, time) {
  const offset = backPageOffset(time);
  const share = offset / 402;
  parts.page.style.transform = "translateX(" + offset.toFixed(1) + "px)";
  parts.edgeShadow.style.opacity = (share > 0 && share < 1 ? 1 : 0).toString();
  parts.home.layer.style.transform = "translateX(" + (-120 * (1 - share)).toFixed(1) + "px)";
  parts.shade.style.opacity = (0.1 * (1 - share)).toFixed(3);
  if (time < BACK.gone + 0.3) {
    const fingerX = 10 + progress(time, BACK.touch + 0.05, BACK.release) * 300;
    const visible = progress(time, BACK.touch - 0.4, BACK.touch - 0.2) * (1 - progress(time, BACK.release, BACK.release + 0.2));
    placeFinger(parts.finger, fingerX, 430, visible, within(time, BACK.touch - 0.1, BACK.release));
    return;
  }
  const water = parts.home.cells.water.centre;
  const visible = progress(time, BACK.tap - 0.5, BACK.tap - 0.3) * (1 - progress(time, BACK.tap + 0.2, BACK.tap + 0.4));
  placeFinger(parts.finger, water.x, water.y, visible, within(time, BACK.tap - 0.15, BACK.tap));
}

const MAKE_ASK = "I forget to water my plants";
const MAKE = { tapMake: 0.7, pushed: 1.15, listen: 1.8, heard: 3.6, send: 4.3, building: 5.1, built: 5.9, builtScreen: 6.5, move: 8.2, landed: 8.96 };
const MAKE_STATUS = [
  { from: 0, word: "Sent", steps: 0, grey: true },

function makeStatusAt(time) {
  let current = MAKE_STATUS[0];
  for (const status of MAKE_STATUS) {
    if (time >= status.from) {
      current = status;
    }
  }
  return current;
}

// The tile path: Built screen centre to the grid slot, 2x to 1x, dipping to 94% as it lands
function flyerFrame(time, slot) {
  const start = { x: 201, y: 290 };
  const move = progress(time, MAKE.move, MAKE.landed);
  let scale = mix(2, 1, move);
  const settle = linearProgress(time, MAKE.landed - 0.12, MAKE.landed + 0.25);
  if (settle > 0 && settle < 1) {
    scale = 1 - 0.06 * Math.sin(settle * Math.PI);
  }
  return { x: mix(start.x, slot.x, move), y: mix(start.y, slot.y, move), scale: scale };
}

function placeFingerTap(finger, point, tapAt, time) {
  const visible = progress(time, tapAt - 0.5, tapAt - 0.3) * (1 - progress(time, tapAt + 0.2, tapAt + 0.4));
  placeFinger(finger, point.x, point.y, visible, within(time, tapAt - 0.15, tapAt));
}

function renderMakeDemo(parts, time) {
  const plants = parts.home.cells.plants;
  // Plants is not on the grid until it lands
  const landed = time >= MAKE.landed;
  plants.tile.style.opacity = landed ? "1" : "0";
  plants.label.style.opacity = progress(time, MAKE.landed + 0.1, MAKE.landed + 0.4).toFixed(3);
  // Make pushes in over the grid, then gives way to the Built screen
  const push = progress(time, MAKE.tapMake + 0.05, MAKE.pushed);
  const makeGone = time >= MAKE.builtScreen + 0.4;
  parts.make.style.transform = "translateX(" + (402 * (1 - push)).toFixed(1) + "px)";
  parts.make.style.visibility = makeGone ? "hidden" : "visible";
  parts.home.layer.style.transform = makeGone ? "none" : "translateX(" + (-120 * push).toFixed(1) + "px)";
  parts.shade.style.opacity = makeGone ? "0" : (0.1 * push).toFixed(3);
  // Say the problem
  const listening = within(time, MAKE.listen, MAKE.heard + 0.3);
  setOrbListening(parts.pill.orb, listening, time);
  const sent = time >= MAKE.send + 0.05;
  setPillWords(parts.pill, sent ? "" : heardWords(MAKE_ASK, time, MAKE.listen + 0.2, MAKE.heard));
  parts.empty.style.opacity = (1 - progress(time, MAKE.send, MAKE.send + 0.2)).toFixed(3);
  const rowIn = progress(time, MAKE.send + 0.05, MAKE.send + 0.35);
  parts.row.style.opacity = rowIn.toFixed(3);
  parts.row.style.transform = "translateY(" + ((1 - rowIn) * 12).toFixed(1) + "px)";
  const status = makeStatusAt(time);
  parts.statusWord.textContent = status.word;
  parts.statusWord.style.color = status.grey ? "var(--ink-2)" : "var(--ink)";
  for (let index = 0; index < 4; index++) {
    parts.stepDots[index].classList.toggle("on", index < status.steps);
  }
  // Built screen, then the tile locks into its slot
  const builtIn = progress(time, MAKE.builtScreen, MAKE.builtScreen + 0.3);
  const builtOut = progress(time, MAKE.move - 0.1, MAKE.move + 0.3);
  parts.built.style.opacity = (builtIn * (1 - builtOut)).toFixed(3);
  const frame = flyerFrame(time, plants.centre);
  parts.flyer.style.opacity = (time >= MAKE.builtScreen && !landed ? builtIn : 0).toFixed(3);
  parts.flyer.style.transform = "translate(" + (frame.x - 30).toFixed(1) + "px," + (frame.y - 30).toFixed(1) + "px) scale(" + frame.scale.toFixed(3) + ")";
  // The finger: Make's tile, the orb, Send
  if (time < MAKE.pushed + 0.2) {
    placeFingerTap(parts.finger, parts.home.cells.make.centre, MAKE.tapMake, time);
  } else if (time < MAKE.heard) {
    placeFingerTap(parts.finger, { x: ORB_X, y: PILL_Y }, MAKE.listen, time);
  } else {
    placeFingerTap(parts.finger, { x: SEND_X, y: PILL_Y }, MAKE.send, time);
  }
}

function renderDeleteDemo(parts, time) {
  const jiggling = within(time, DELETE.jiggle, DELETE.done);
  const badgeIn = progress(time, DELETE.jiggle, DELETE.jiggle + 0.25) * (1 - progress(time, DELETE.done, DELETE.done + 0.2));
  for (let index = 0; index < DELETE_IDS.length; index++) {
    const id = DELETE_IDS[index];
    const cell = parts.home.cells[id];
    const angle = jiggling ? Math.sin(time * 1000 / 70 + index) * 2 : 0;
    let tileScale = 1;
    // The held tile lifts a little before the jiggle
    if (id === "water" && within(time, DELETE.hold, DELETE.jiggle + 0.2)) {
      tileScale = 1 + 0.08 * progress(time, DELETE.hold, DELETE.jiggle) * (1 - progress(time, DELETE.jiggle, DELETE.jiggle + 0.2));
    }
    let gone = 0;
    if (id === "water") {
      gone = progress(time, DELETE.gone + 0.15, DELETE.gone + 0.45);
    }
    cell.cell.style.transform = "rotate(" + angle.toFixed(2) + "deg) scale(" + (tileScale * (1 - gone)).toFixed(3) + ")";
    cell.cell.style.opacity = (1 - gone).toFixed(3);
    // jess and Make cannot be deleted: no badge
    const deletable = !SIDEKICKS[id].builtIn;
    cell.badge.style.transform = "scale(" + (deletable ? badgeIn : 0).toFixed(3) + ")";
  }
  const sheetIn = progress(time, DELETE.sheet, DELETE.sheet + 0.35) * (1 - progress(time, DELETE.gone, DELETE.gone + 0.3));
  parts.dim.style.opacity = sheetIn.toFixed(3);
  parts.sheet.style.transform = "translateY(" + ((1 - sheetIn) * 110).toFixed(1) + "%)";
  const water = parts.home.cells.water.centre;
  if (time < DELETE.lift + 0.3) {
    const visible = progress(time, DELETE.hold - 0.4, DELETE.hold - 0.2) * (1 - progress(time, DELETE.lift, DELETE.lift + 0.2));
    placeFinger(parts.finger, water.x, water.y, visible, within(time, DELETE.hold - 0.1, DELETE.lift));
  } else if (time < DELETE.sheet + 0.4) {
    placeFingerTap(parts.finger, { x: water.x - 30, y: water.y - 30 }, DELETE.minus, time);
  } else if (time < DELETE.gone + 0.4) {
    placeFingerTap(parts.finger, { x: 201, y: SCREEN_H - 46 - 44 - 52 - 26 }, DELETE.tapDelete, time);
  } else {
    // A tap on empty space ends the jiggle
    placeFingerTap(parts.finger, { x: 280, y: 520 }, DELETE.done, time);
  }
}

const HAND_TITLES = { edit: "Edit", back: "Go Back", make: "Make", delete: "Delete" };

function activeCards() {
  if (state.cards === "K4") {
    return CARDS;
  }
  return CARDS.slice(0, 3);

function currentLayout() {
  for (const layout of LAYOUTS) {
    if (layout.id === state.layout) {

  return LAYOUTS[0];

// ---------- Storage (per-viewer convenience only) ----------

function loadPicks() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    const saved = raw ? JSON.parse(raw) : null;
    if (saved) {
      state.layout = saved.layout || state.layout;
      state.cards = saved.cards || state.cards;
      state.theme = saved.theme || state.theme;
    }
  } catch (error) {
    // Storage blocked: picks last for this visit
  }
}

function savePicks() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ layout: state.layout, cards: state.cards, theme: state.theme }));
  } catch (error) {
    // Storage blocked: picks last for this visit
  }
}

// ---------- The phone ----------

let built = null;

function buildCard(card, layout) {
  const node = element("div", "card");
  if (layout.id === "T2") {
    node.append(element("div", "wallcard"));
  }
  const holder = element("div", "holder");
  const screen = element("div", "ds");
  screen.style.transform = "scale(" + layout.scale + ")";
  holder.append(screen);
  const parts = card.build(screen);
  const titleText = layout.id === "T3" ? HAND_TITLES[card.key] : card.title;
  node.append(holder, element("div", "title", titleText), element("div", "line", card.line));
  return { node: node, parts: parts, card: card };
}

function buildPhone() {
  const cards = activeCards();
  const layout = currentLayout();
  if (state.index >= cards.length) {
    state.index = cards.length - 1;
  }
  const phone = element("div", "phone theme-" + state.theme);
  const screen = element("div", "screen l-" + layout.id);
  const track = element("div", "track");
  const builtCards = [];
  for (const card of cards) {
    const cardBuilt = buildCard(card, layout);
    track.append(cardBuilt.node);
    builtCards.push(cardBuilt);
  }
  const dots = element("div", "dots");
  const dotNodes = [];
  for (let index = 0; index < cards.length; index++) {
    const dot = element("i");
    dots.append(dot);
    dotNodes.push(dot);
  }
  const finish = element("button", "finish", "Continue");
  finish.addEventListener("click", finishTapped);
  screen.append(track, dots, finish, element("div", "island"), statusBar(), element("div", "home-bar"));
  phone.append(screen);
  const fitInner = document.getElementById("fitInner");
  fitInner.replaceChildren(phone);
  built = { phone: phone, screen: screen, track: track, cards: builtCards, dotNodes: dotNodes, finish: finish, offset: -state.index * SCREEN_W, drag: null };
  attachSwipe(screen);
  fitPhone();
  renderTrack();
  renderSide();
}

// In the whole-flow page the phone fills the frame it is given
function flowScale() {
  const byWidth = (window.innerWidth - 20) / (SCREEN_W + 20);
  const byHeight = (window.innerHeight - 20) / (SCREEN_H + 20);
  return Math.min(byWidth, byHeight);
}

function fitPhone() {
  const available = Math.max(420, window.innerHeight - 120);
  const scale = FLOW ? flowScale() : Math.min(1, available / (SCREEN_H + 20));
  const fitInner = document.getElementById("fitInner");
  const fit = document.getElementById("fit");
  fitInner.style.transform = "scale(" + scale + ")";
  fit.style.width = ((SCREEN_W + 20) * scale) + "px";
  fit.style.height = ((SCREEN_H + 20) * scale) + "px";
  if (built) {
    built.scale = scale;
  }
}

// The track follows a drag; at rest it sits on the current card
function renderTrack() {
  const count = built.cards.length;
  built.track.style.transform = "translateX(" + built.offset.toFixed(1) + "px)";
  const position = clamp01(-built.offset / SCREEN_W / Math.max(1, count - 1)) * (count - 1);
  const nearest = Math.round(position);
  for (let index = 0; index < count; index++) {
    built.dotNodes[index].classList.toggle("on", index === nearest);
  }
  if (FLOW) {
    // As built: one button, "Next" until the last card, then "Continue"
    built.finish.textContent = nearest === count - 1 ? "Continue" : "Next";
    built.finish.style.opacity = "1";
    built.finish.style.pointerEvents = "auto";
  } else {
    // Continue shows on the last card only
    const finishShown = clamp01(1 - Math.abs(position - (count - 1)));
    built.finish.style.opacity = finishShown.toFixed(3);
    built.finish.style.pointerEvents = finishShown > 0.9 ? "auto" : "none";
  }
  document.getElementById("where").textContent = (state.index + 1) + " / " + count;
}

let settle = null;

function settleTo(index) {
  const count = built.cards.length;
  const target = Math.max(0, Math.min(count - 1, index));
  if (target !== state.index) {
    state.times[target] = 0;
  }
  state.index = target;
  settle = { from: built.offset, to: -target * SCREEN_W, start: performance.now() };
  renderSide();
}

function finishTapped() {
  if (!FLOW) {
    settleTo(0);
    return;
  }
  const lastIndex = built.cards.length - 1;
  if (state.index < lastIndex) {
    settleTo(state.index + 1);
    return;
  }
  window.parent.postMessage({ from: "teach", event: "continue" }, "*");
}

// The whole-flow page sets the theme and starts again from the first card
function onFlowMessage(event) {
  const message = event.data || {};
  if (message.cmd === "theme") {
    state.theme = message.value === "Dark" ? "dark" : "light";
    buildPhone();
  } else if (message.cmd === "reset") {
    state.index = 0;
    state.times = [0, 0, 0, 0];
    buildPhone();
  }
}

// ---------- Swipe: mouse and touch ----------

function swipeStart(event) {
  if (event.target.closest("button")) {
    return;
  }
  settle = null;
  built.drag = { startX: event.clientX, startOffset: built.offset, lastX: event.clientX, lastTime: performance.now(), velocity: 0 };
  built.screen.classList.add("dragging");
  built.screen.setPointerCapture(event.pointerId);
}

function swipeMove(event) {
  const drag = built.drag;
  if (!drag) {
    return;
  }
  const scale = built.scale || 1;
  const deltaX = (event.clientX - drag.startX) / scale;
  const minOffset = -(built.cards.length - 1) * SCREEN_W;
  let offset = drag.startOffset + deltaX;
  // Rubber band past the first and last card
  if (offset > 0) {
    offset = offset * 0.35;
  } else if (offset < minOffset) {
    offset = minOffset + (offset - minOffset) * 0.35;
  }
  built.offset = offset;
  const now = performance.now();
  const elapsed = Math.max(1, now - drag.lastTime);
  drag.velocity = (event.clientX - drag.lastX) / scale / elapsed;
  drag.lastX = event.clientX;
  drag.lastTime = now;
  renderTrack();
}

function swipeEnd() {
  const drag = built.drag;
  if (!drag) {
    return;
  }
  built.drag = null;
  built.screen.classList.remove("dragging");
  const moved = built.offset - drag.startOffset;
  let target = state.index;
  // A fling or a drag past a sixth of the screen turns the page
  if (moved < -SCREEN_W / 6 || drag.velocity < -0.5) {
    target = state.index + 1;
  } else if (moved > SCREEN_W / 6 || drag.velocity > 0.5) {
    target = state.index - 1;
  }
  settleTo(target);
}

function attachSwipe(screen) {
  screen.addEventListener("pointerdown", swipeStart);
  screen.addEventListener("pointermove", swipeMove);
  screen.addEventListener("pointerup", swipeEnd);
  screen.addEventListener("pointercancel", swipeEnd);
}

// ---------- Side panel ----------

function pickRow(id, name, pressed, onPick) {
  const row = element("button", "pick-row");
  row.setAttribute("aria-pressed", pressed ? "true" : "false");
  row.append(element("span", "pick-id", id), element("span", "pick-name", name));
  row.addEventListener("click", onPick);
  return row;
}

function layoutPicker(id) {
  return function pickLayout() {
    state.layout = id;
    savePicks();
    buildPhone();
  };
}

function cardsPicker(id) {
  return function pickCards() {
    state.cards = id;
    savePicks();
    buildPhone();
  };
}

function themePicker(theme) {
  return function pickTheme() {
    state.theme = theme;
    savePicks();
    buildPhone();
  };
}

function speedPicker(speed) {
  return function pickSpeed() {
    state.speed = speed;
    renderSide();
  };
}

function momentPicker(moment) {
  return function pickMoment() {
    state.times[state.index] = moment;
    state.playing = false;
    renderSide();
  };
}

function togglePlay() {
  state.playing = !state.playing;
  renderSide();
}

function stepFrame(seconds) {
  return function stepBy() {
    const card = built.cards[state.index].card;
    state.playing = false;
    state.times[state.index] = Math.max(0, Math.min(card.length, state.times[state.index] + seconds));
    renderSide();
  };
}

function scrubbed(event) {
  state.playing = false;
  state.times[state.index] = Number(event.target.value);
  renderSide();
}

function toolButton(text, pressed, onClick) {
  const button = element("button", "btn", text);
  button.setAttribute("aria-pressed", pressed ? "true" : "false");
  button.addEventListener("click", onClick);
  return button;
}

function renderPicks() {
  const picks = document.getElementById("picks");
  picks.replaceChildren(element("b", null, "Picks"), element("span", "pick-chip", state.layout), element("span", "pick-chip", state.cards));
}

let scrubInput = null;
let timeOut = null;

function renderSide() {
  renderPicks();
  const side = document.getElementById("side");
  side.replaceChildren();
  side.append(element("h3", null, "Layout"));
  for (const layout of LAYOUTS) {
    side.append(pickRow(layout.id, layout.name, state.layout === layout.id, layoutPicker(layout.id)));
  }
  side.append(element("h3", null, "Cards"));
  for (const set of CARD_SETS) {
    side.append(pickRow(set.id, set.name, state.cards === set.id, cardsPicker(set.id)));
  }
  side.append(element("h3", null, "Theme"));
  const themes = element("div", "tools");
  themes.append(toolButton("Light", state.theme === "light", themePicker("light")), toolButton("Dark", state.theme === "dark", themePicker("dark")));
  side.append(themes);
  side.append(element("h3", null, "Demo"));
  const play = element("div", "tools");
  play.append(toolButton(state.playing ? "Pause" : "Play", false, togglePlay), toolButton("−0.1 s", false, stepFrame(-0.1)), toolButton("+0.1 s", false, stepFrame(0.1)));
  for (const speed of [0.5, 1, 2]) {
    play.append(toolButton(speed + "×", state.speed === speed, speedPicker(speed)));
  }
  side.append(play);
  const card = built ? built.cards[state.index].card : CARDS[0];
  scrubInput = element("input", "scrub");
  scrubInput.type = "range";
  scrubInput.min = "0";
  scrubInput.max = String(card.length);
  scrubInput.step = "0.01";
  scrubInput.value = String(state.times[state.index]);
  scrubInput.addEventListener("input", scrubbed);
  timeOut = element("span", "time-out");
  side.append(scrubInput, timeOut);
  const moments = element("div", "tools");
  for (const moment of card.moments) {
    moments.append(toolButton(moment.toFixed(1) + " s", false, momentPicker(moment)));
  }
  side.append(moments);
}

function goPrevious() {
  settleTo(state.index - 1);
}

function goNext() {
  settleTo(state.index + 1);
}

function keyPressed(event) {
  if (event.key === "ArrowLeft") {
    goPrevious();
  } else if (event.key === "ArrowRight") {
    goNext();
  }
}

// ---------- The clock ----------

let lastFrame = performance.now();

function tick(now) {
  const elapsed = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  if (built) {
    if (settle) {
      const amount = progress(now, settle.start, settle.start + 320);
      built.offset = mix(settle.from, settle.to, amount);
      if (amount >= 1) {
        settle = null;
      }
      renderTrack();
    }
    const active = built.cards[state.index];
    if (state.playing) {
      for (let index = 0; index < built.cards.length; index++) {
        const length = built.cards[index].card.length;
        state.times[index] = (state.times[index] + elapsed * state.speed) % length;
      }
    }
    // Every card draws, so a card half in view during a swipe still moves
    for (let index = 0; index < built.cards.length; index++) {
      const cardBuilt = built.cards[index];
      cardBuilt.card.render(cardBuilt.parts, state.times[index]);
    }
    if (scrubInput && document.activeElement !== scrubInput) {
      scrubInput.value = String(state.times[state.index]);
    }
    if (timeOut) {
      timeOut.textContent = state.times[state.index].toFixed(2) + " s / " + active.card.length.toFixed(1) + " s";
    }
  }
  requestAnimationFrame(tick);
}

function startFlowMode() {
  document.body.classList.add("flow");
  state.layout = "T2";
  state.cards = "K4";
  state.theme = TEACH_PARAMS.get("theme") === "dark" ? "dark" : "light";
  window.addEventListener("message", onFlowMessage);
}

function start() {
  if (FLOW) {
    startFlowMode();
  } else {
    loadPicks();
  }
  buildPhone();
  document.getElementById("prev").addEventListener("click", goPrevious);
  document.getElementById("next").addEventListener("click", goNext);
  document.addEventListener("keydown", keyPressed);
  window.addEventListener("resize", fitPhone);
  requestAnimationFrame(tick);
}

start();
</script>
</body>
</html>
