<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calm Colour Combinations</title>
<style>
/* B2 "Size by urgency" in calm colour combinations. Baseline: overdue is soft amber, never red;
   off-white and off-black; one accent for the next task only; muted sage completion; counts hidden.
   Tile shapes copied from med-reminders-b2-2026-10-12.html. Mockup, 2026-10-12. Not product code. */
:root { --stage: #E9E7E2; --stage-ink: #1F1E1C; --stage-ink2: #67635D; --stage-chip: rgba(0,0,0,.06); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --stage: #121211; --stage-ink: #EEEAE3; --stage-ink2: #9C978F; --stage-chip: rgba(255,255,255,.07); }
}
:root[data-theme="dark"] { --stage: #121211; --stage-ink: #EEEAE3; --stage-ink2: #9C978F; --stage-chip: rgba(255,255,255,.07); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--stage); color: var(--stage-ink);
  font-family: -apple-system, system-ui, "SF Pro Text", sans-serif; -webkit-font-smoothing: antialiased; }
.ic { width: 1em; height: 1em; display: inline-block; flex: none; vertical-align: middle; }

.top { max-width: 1240px; margin: 0 auto; padding: 28px 16px 4px; }
.top h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
.top ul { margin: 8px 0 0; padding-left: 18px; color: var(--stage-ink2); font-size: 14px; line-height: 1.6; }

.combo { max-width: 1240px; margin: 0 auto; padding: 28px 16px 8px; border-top: 1px solid var(--stage-chip); }
.combo-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.combo-head h2 { margin: 0; font-size: 20px; }
.combo-head .mood { color: var(--stage-ink2); font-size: 14px; }
.strip { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
.chip { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 12px; background: var(--stage-chip); font-size: 12px; }
.chip i { width: 26px; height: 26px; border-radius: 8px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); display: block; }
.chip b { display: block; font-size: 12px; }
.chip span { color: var(--stage-ink2); font-variant-numeric: tabular-nums; }
.ratios { font-size: 12px; color: var(--stage-ink2); margin: -6px 0 14px; line-height: 1.6; font-variant-numeric: tabular-nums; }
.ratios .fail { color: #B5532C; font-weight: 700; }
.pair { display: flex; flex-wrap: wrap; gap: 28px; }
.mode-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--stage-ink2); margin: 0 0 8px 4px; }

/* Phone, themed per combo through inline custom properties */
.phone { position: relative; width: 340px; max-width: 100%; height: 640px; border-radius: 46px; overflow: hidden;
  background: var(--bg); color: var(--ink); box-shadow: 0 0 0 9px #1C1C1E, 0 0 0 10px #3A3A3C, 0 20px 40px rgba(0,0,0,.2); }
.status { position: absolute; top: 0; left: 0; right: 0; height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 4px 30px 0 38px; font-size: 15px; font-weight: 600; }
.status i { display: block; width: 24px; height: 11px; border-radius: 3px; border: 1.5px solid currentColor; opacity: .9; }
.island { position: absolute; top: 10px; left: 50%; width: 110px; height: 32px; margin-left: -55px; border-radius: 16px; background: #000; }
.screen { position: absolute; inset: 50px 0 0 0; display: flex; flex-direction: column; }
.home-bar { position: absolute; bottom: 8px; left: 50%; width: 124px; height: 5px; margin-left: -62px; border-radius: 3px; background: var(--ink); opacity: .8; }
.head { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 18px 12px; }
.head .h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
.head .soft { font-size: 14px; font-weight: 600; color: var(--ink2); }
.mosaic { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 14px; }
.mt { border-radius: 22px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; position: relative; background: var(--surf); box-shadow: inset 0 0 0 1px var(--rule); }
.mt.xl { grid-column: span 4; height: 168px; padding: 16px; background: var(--acc); color: var(--acc-ink); box-shadow: none; }
.mt.md { grid-column: span 2; height: 112px; }
.mt .lname { font-size: 13px; font-weight: 700; opacity: .85; }
.mt.xl .big { display: flex; align-items: center; gap: 14px; }
.mt.xl .big .ic { font-size: 48px; }
.mt.xl .what { font-size: 23px; font-weight: 800; letter-spacing: -0.01em; }
.mt.xl .when { font-size: 15px; font-weight: 600; opacity: .85; margin-top: 2px; }
.mt.xl .done { position: absolute; right: 14px; bottom: 14px; height: 42px; padding: 0 16px; border-radius: 21px; background: var(--ink); color: var(--bg); display: flex; align-items: center; gap: 6px; font-weight: 700; }
.mt.md .glyph { font-size: 26px; color: var(--ink2); }
.mt.md .what { font-size: 16px; font-weight: 700; }
.mt.md .when { font-size: 13px; font-weight: 600; color: var(--ink2); }
.rows { padding: 10px 0 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 18px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 66px; right: 18px; height: 1px; background: var(--rule); }
.ichip { width: 36px; height: 36px; border-radius: 12px; background: var(--surf); color: var(--ink2); display: flex; align-items: center; justify-content: center; flex: none; }
.ichip .ic { font-size: 20px; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-size: 16px; font-weight: 600; }
.row .d { font-size: 13px; color: var(--ink2); margin-top: 2px; }
.soon { height: 26px; padding: 0 10px; border-radius: 13px; background: var(--amber-bg); color: var(--amber-ink); font-size: 12.5px; font-weight: 700; display: flex; align-items: center; flex: none; }
.row.overdue .ichip { background: var(--amber-bg); color: var(--amber-ink); }
.ring { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--ink2); opacity: .6; flex: none; }
.row.done .t { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--sage-ink); }
.row.done .d { color: var(--sage-ink); opacity: .8; }
.row.done .ichip { background: var(--sage-bg); color: var(--sage-ink); }
.tick { width: 24px; height: 24px; border-radius: 50%; background: var(--sage-bg); color: var(--sage-ink); display: flex; align-items: center; justify-content: center; flex: none; }
.tick .ic { font-size: 14px; }
</style>
</head>

    <li>"3 today", never a total.</li>
  </ul>
</header>

<main id="combos"></main>

<script>
// Shared calm states, the same in every combination so overdue and done always look alike.
const SHARED_STATES = {
  light: { amberBg: '#F6E6C0', amberInk: '#7A5512', sageBg: '#E1E9DA', sageInk: '#4E6650' },
  dark: { amberBg: '#33291A', amberInk: '#E9C77A', sageBg: '#243024', sageInk: '#A9C3A6' },
};
const CREAM_HEX = '#FFFDF8';
const MIN_CONTRAST = 4.5;

// Each combination: off-white and off-black paper, two inks, one accent per mode.
const CALM_COMBOS = [
  { name: 'Linen and Terracotta', mood: 'Warm cream, clay accent',
    light: { bg: '#FAF7F2', surf: '#F0EBE2', ink: '#2B2926', ink2: '#6B665E', acc: '#B0502A' },
    dark: { bg: '#1C1B19', surf: '#272522', ink: '#EDE8DF', ink2: '#A39E95', acc: '#D9774E' } },
  { name: 'Oat and Sage', mood: 'Green-grey, herbal',
    light: { bg: '#F6F3EA', surf: '#ECE8DC', ink: '#2E322D', ink2: '#5E6359', acc: '#4F7A5A' },
    dark: { bg: '#1A1D1A', surf: '#252924', ink: '#E8EBE3', ink2: '#9DA397', acc: '#7FA889' } },
  { name: 'Fog and Dusk Blue', mood: 'Cool and quiet',
    light: { bg: '#F5F6F3', surf: '#EAECE7', ink: '#25292D', ink2: '#62676C', acc: '#46699C' },
    dark: { bg: '#191B1E', surf: '#24272B', ink: '#E9EBEE', ink2: '#9BA0A6', acc: '#86A6D6' } },
  { name: 'Sand and Teal', mood: 'Beach, clinic-clean',
    light: { bg: '#FBF6EC', surf: '#F1EADB', ink: '#2A2723', ink2: '#6C655A', acc: '#2C7A74' },
    dark: { bg: '#1D1B17', surf: '#292620', ink: '#EFE9DD', ink2: '#A49D90', acc: '#5FB3AB' } },
  { name: 'Bone and Plum', mood: 'Soft, a little evening',
    light: { bg: '#F8F5F1', surf: '#EEE9E3', ink: '#2D2830', ink2: '#69636C', acc: '#7A4E7E' },
    dark: { bg: '#1D1A1F', surf: '#29252B', ink: '#EEE9F0', ink2: '#A49DA7', acc: '#B48BB8' } },
  { name: 'Paper and Tomato', mood: 'Closest to Midas today',
    light: { bg: '#FAF8F5', surf: '#F0EDE8', ink: '#1F1E1C', ink2: '#67635D', acc: '#E8613F' },
    dark: { bg: '#1A1918', surf: '#262422', ink: '#F0EDE8', ink2: '#A29E98', acc: '#F07A5A' } },
];

// WCAG relative luminance of one sRGB channel (0-255).
function channelToLinear(channelValue) {
  const scaled = channelValue / 255;
  if (scaled <= 0.03928) {
    return scaled / 12.92;
  }
  return Math.pow((scaled + 0.055) / 1.055, 2.4);
}

function relativeLuminance(hex) {
  const red = parseInt(hex.slice(1, 3), 16);
  const green = parseInt(hex.slice(3, 5), 16);
  const blue = parseInt(hex.slice(5, 7), 16);
  return 0.2126 * channelToLinear(red) + 0.7152 * channelToLinear(green) + 0.0722 * channelToLinear(blue);
}

function contrastRatio(firstHex, secondHex) {
  const firstLuminance = relativeLuminance(firstHex);
  const secondLuminance = relativeLuminance(secondHex);
  const lighter = Math.max(firstLuminance, secondLuminance);
  const darker = Math.min(firstLuminance, secondLuminance);
  return (lighter + 0.05) / (darker + 0.05);
}

// Text on the accent tile: in light mode cream or ink, in dark mode the dark paper or the light ink,
// whichever contrasts more.
function chooseAccentInk(palette, modeName) {
  const firstChoice = modeName === 'light' ? CREAM_HEX : palette.bg;
  const secondChoice = palette.ink;
  const firstRatio = contrastRatio(palette.acc, firstChoice);
  const secondRatio = contrastRatio(palette.acc, secondChoice);
  if (firstRatio >= secondRatio) {
    return { hex: firstChoice, ratio: firstRatio };
  }
  return { hex: secondChoice, ratio: secondRatio };
}

function iconMarkup(iconId) {
  return '<svg class="ic"><use href="#' + iconId + '"/></svg>';
}

function ratioMarkup(label, ratio) {
  const ratioText = label + ' ' + ratio.toFixed(1) + ':1';
  if (ratio < MIN_CONTRAST) {
    return '<span class="fail">' + ratioText + '</span>';
  }
  return ratioText;
}

function buildRatioLine(palette, modeName) {
  const states = SHARED_STATES[modeName];
  const accentInk = chooseAccentInk(palette, modeName);
  const parts = [
    ratioMarkup('Ink', contrastRatio(palette.ink, palette.bg)),
    ratioMarkup('Ink 2', contrastRatio(palette.ink2, palette.bg)),
    ratioMarkup('Ink 2 on tile', contrastRatio(palette.ink2, palette.surf)),
    ratioMarkup('Accent text', accentInk.ratio),
    ratioMarkup('Overdue', contrastRatio(states.amberInk, states.amberBg)),
    ratioMarkup('Done', contrastRatio(states.sageInk, palette.bg)),
  ];
  return (modeName === 'light' ? 'Light · ' : 'Dark · ') + parts.join(' · ');
}

function buildPhoneStyle(palette, modeName) {
  const states = SHARED_STATES[modeName];
  const accentInk = chooseAccentInk(palette, modeName);
  const ruleColour = modeName === 'light' ? 'rgba(0,0,0,.07)' : 'rgba(255,255,255,.08)';
  const declarations = [
    '--bg:' + palette.bg, '--surf:' + palette.surf, '--ink:' + palette.ink, '--ink2:' + palette.ink2,
    '--acc:' + palette.acc, '--acc-ink:' + accentInk.hex, '--rule:' + ruleColour,
    '--amber-bg:' + states.amberBg, '--amber-ink:' + states.amberInk,
    '--sage-bg:' + states.sageBg, '--sage-ink:' + states.sageInk,
  ];
  return declarations.join(';');
}

function buildPhone(palette, modeName) {
  const nextTile =
    '<div class="mt xl"><div class="lname">Appointments</div>' +
    '<div class="big">' + iconMarkup('i-tooth') + '<div><div class="what">Dentist</div><div class="when">in 40 min</div></div></div>' +
    '<span class="done">' + iconMarkup('i-check') + 'Done</span></div>';
  const medicineTile =
    '<div class="mt md"><div class="lname">Medicine</div><span class="glyph">' + iconMarkup('i-pill') + '</span>' +
    '<div><div class="what">Metformin</div><div class="when">20:00</div></div></div>';
  const waterTile =
    '<div class="mt md"><div class="lname">Water</div><span class="glyph">' + iconMarkup('i-drop') + '</span>' +
    '<div><div class="what">Glass 4</div><div class="when">16:00</div></div></div>';
  const overdueRow =
    '<div class="row overdue"><span class="ichip">' + iconMarkup('i-drop') + '</span>' +
    '<div class="grow"><div class="t">Glass 3</div><div class="d">Water · 14:00</div></div><span class="soon">When you can</span></div>';
  const doneRow =
    '<div class="row done"><span class="ichip">' + iconMarkup('i-pill') + '</span>' +
    '<div class="grow"><div class="t">Metformin</div><div class="d">Medicine · 08:00</div></div><span class="tick">' + iconMarkup('i-check') + '</span></div>';
  const laterRow =
    '<div class="row"><span class="ichip">' + iconMarkup('i-syringe') + '</span>' +
    '<div class="grow"><div class="t">Insulin</div><div class="d">Injections · Fri 09:00</div></div><span class="ring"></span></div>';

  return '<div><div class="mode-label">' + (modeName === 'light' ? 'Light' : 'Dark') + '</div>' +
    '<div class="phone" style="' + buildPhoneStyle(palette, modeName) + '">' +
    '<div class="status"><span>9:41</span><i></i></div><div class="island"></div>' +
    '<div class="screen"><div class="head"><span class="h1">Today</span><span class="soft">3 today</span></div>' +
    '<div class="mosaic">' + nextTile + medicineTile + waterTile + '</div>' +
    '<div class="rows">' + overdueRow + doneRow + laterRow + '</div></div>' +
    '<div class="home-bar"></div></div></div>';
}

function buildChip(roleName, hex) {
  return '<div class="chip"><i style="--c:' + hex + '"></i><div><b>' + roleName + '</b><span>' + hex + '</span></div></div>';
}

function buildCombo(combo) {
  const lightPalette = combo.light;
  const darkPalette = combo.dark;
  const chips = [
    buildChip('Paper', lightPalette.bg), buildChip('Tile', lightPalette.surf), buildChip('Ink', lightPalette.ink),
    buildChip('Accent', lightPalette.acc), buildChip('Dark paper', darkPalette.bg), buildChip('Dark ink', darkPalette.ink),
    buildChip('Dark accent', darkPalette.acc), buildChip('Overdue', SHARED_STATES.light.amberBg), buildChip('Done', SHARED_STATES.light.sageBg),
  ];
  return '<section class="combo"><div class="combo-head"><h2>' + combo.name + '</h2><span class="mood">' + combo.mood + '</span></div>' +
    '<div class="strip">' + chips.join('') + '</div>' +
    '<div class="ratios">' + buildRatioLine(lightPalette, 'light') + '<br>' + buildRatioLine(darkPalette, 'dark') + '</div>' +
    '<div class="pair">' + buildPhone(lightPalette, 'light') + buildPhone(darkPalette, 'dark') + '</div></section>';
}

function renderCombos() {
  const container = document.getElementById('combos');
  let comboHtml = '';
  for (const combo of CALM_COMBOS) {
    comboHtml += buildCombo(combo);
  }
  container.innerHTML = comboHtml;
}

renderCombos();
</script>
</body>
</html>
