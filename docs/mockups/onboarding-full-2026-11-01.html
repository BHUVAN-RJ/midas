<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding Whole Flow</title>
<style>
/* Midas tokens, docs/DESIGN.md 2.1, 2.2, 2.4. Page chrome is light; the phone carries its own theme. */
:root {
  --page: #FAFAFA;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", sans-serif;
}
.theme-light {
  --paper: #FFFFFF; --ink: #111111; --ink-2: #6B6B6B; --ink-3: #BDBDBD;
  --field: rgba(116, 116, 128, 0.08); --sheet: #F2F2F7; --sheet-card: #FFFFFF; --dim: rgba(0, 0, 0, 0.32);
  --tint: #007AFF; --tint-ink: #FFFFFF;
}
.theme-dark {
  --paper: #000000; --ink: #FFFFFF; --ink-2: #A3A3A3; --ink-3: #5C5C5C;
  --field: rgba(118, 118, 128, 0.24); --sheet: #1C1C1E; --sheet-card: #2C2C2E; --dim: rgba(0, 0, 0, 0.55);
  --tint: #0A84FF; --tint-ink: #FFFFFF;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: #111111; font-family: var(--font); -webkit-font-smoothing: antialiased; }
.page { max-width: 900px; margin: 0 auto; padding: 0 16px 48px; }
h1 { font-size: 26px; margin: 24px 0 0; letter-spacing: -0.4px; }
.date { color: #6B6B6B; font-size: 14px; margin: 4px 0 14px; }

/* The four steps, as a strip; tap one to jump there */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.step { font: inherit; text-align: left; background: #FFFFFF; color: #111111; border: 1.5px solid rgba(17, 17, 17, 0.14); border-radius: 14px; padding: 9px 11px; cursor: pointer; }
.step b { display: block; font-size: 14px; }
.step span { display: block; font-size: 12px; color: #6B6B6B; margin-top: 2px; }
.step[aria-current="true"] { background: #111111; color: #FFFFFF; border-color: #111111; }
.step[aria-current="true"] span { color: #BDBDBD; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.btn { font: inherit; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #111111; border: 1px solid rgba(17, 17, 17, 0.14); border-radius: 999px; padding: 7px 13px; cursor: pointer; }
.btn[aria-pressed="true"] { background: #111111; color: #FFFFFF; border-color: #111111; }
.hint { font-size: 13px; font-weight: 600; color: #6B6B6B; margin-left: auto; }

/* The phone: iPhone 16 Pro, 402 x 874 pt, same frame for every step */
.stage { margin-top: 14px; display: flex; justify-content: center; }
.holder { position: relative; flex-shrink: 0; }
.holder iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
.holder .native { position: absolute; left: 0; top: 0; }
.hidden { visibility: hidden; pointer-events: none; }
.phone { position: absolute; left: 10px; top: 10px; width: 402px; height: 874px; overflow: hidden; border-radius: 56px; background: var(--paper); color: var(--ink); box-shadow: 0 0 0 10px #111111, 0 20px 50px rgba(0, 0, 0, 0.18); transform-origin: top left; user-select: none; -webkit-user-select: none; }
.island { position: absolute; top: 11px; left: 50%; width: 126px; height: 37px; margin-left: -63px; background: #000000; border-radius: 19px; z-index: 60; }
.home-bar { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); z-index: 61; }
.status { position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 59; color: var(--ink); font-size: 17px; font-weight: 600; pointer-events: none; }
.status .time { position: absolute; left: 50px; top: 17px; }
.status .icons { position: absolute; right: 34px; top: 21px; display: flex; gap: 6px; align-items: center; }
.status .bars { width: 18px; height: 12px; background: currentColor; clip-path: polygon(0 100%, 100% 0, 100% 100%); }
.status .battery { width: 26px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; position: relative; opacity: 0.9; }
.status .battery::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: currentColor; border-radius: 1.5px; }

/* Sign in: WelcomeView as built (VStack spacing 24, padding 24, system font and tint) */
.welcome { position: absolute; left: 24px; right: 24px; top: 331px; display: flex; flex-direction: column; gap: 24px; }
.welcome .title { font-size: 34px; font-weight: 700; line-height: 41px; letter-spacing: 0.4px; text-align: center; }
.welcome input { font: inherit; font-size: 17px; color: var(--ink); background: var(--field); border: 0; border-radius: 12px; padding: 16px; outline: none; width: 100%; }
.welcome input::placeholder { color: var(--ink-3); }
.prominent { font: inherit; font-size: 17px; font-weight: 600; height: 50px; border-radius: 12px; border: 0; background: var(--tint); color: var(--tint-ink); cursor: pointer; }
.prominent:disabled { opacity: 0.35; cursor: default; }
.plain { position: absolute; left: 0; right: 0; bottom: 58px; text-align: center; font: inherit; font-size: 17px; color: var(--tint); background: none; border: 0; cursor: pointer; }

/* The passkey sheet is drawn by iOS; this is a stand-in for where it sits */
.dimmer { position: absolute; inset: 0; background: var(--dim); z-index: 70; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.sheet { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 71; background: var(--sheet); border-radius: 42px; padding: 26px 20px 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; transform: translateY(110%); transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1); }
.sheet.open { transform: translateY(0); }
.dimmer.open { opacity: 1; pointer-events: auto; }
.sheet .key { width: 56px; height: 56px; border-radius: 14px; background: var(--sheet-card); display: flex; align-items: center; justify-content: center; }
.sheet .t { font-size: 20px; font-weight: 700; }
.sheet .m { font-size: 15px; color: var(--ink-2); text-align: center; }
.sheet .who { align-self: stretch; background: var(--sheet-card); border-radius: 14px; padding: 13px 16px; font-size: 17px; }
.sheet .prominent { align-self: stretch; border-radius: 999px; margin-top: 6px; }
.sheet .os { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ink-3); }

/* Home: not part of onboarding; the flow ends here */
.end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.end .t { font-size: 22px; font-weight: 700; }
.end .m { font-size: 15px; color: var(--ink-2); }
.end .prominent { width: 200px; border-radius: 999px; background: var(--ink); color: var(--paper); }
</style>
</head>
<body>
<div class="page">
  <h1>Onboarding Whole Flow</h1>
  <p class="date">2026-11-01 · as built on main (bd047c7)</p>

  <div class="steps" id="steps"></div>
  <div class="tools" id="tools"></div>

  <div class="stage">
    <div class="holder" id="holder">
      <iframe id="introFrame" title="First-open animation" src="onboarding-icons-ios27-2026-11-01.html?bare=1&amp;flow=1"></iframe>
      <iframe id="teachFrame" class="hidden" title="Teaching cards" src="onboarding-teach-2026-10-31.html?flow=1"></iframe>
      <div class="native hidden" id="welcomeScreen"></div>
      <div class="native hidden" id="homeScreen"></div>
    </div>
  </div>
</div>

<script>
"use strict";

const SCREEN_W = 402;
const SCREEN_H = 874;

// Once per install, in this order (docs/briefs/onboarding-build.md, "Order on a new install")
const STEPS = [
  { key: "intro", title: "1 · Intro", note: "Touch and hold", hint: "Touch and hold the screen, let go, wait for Get Started" },
  { key: "welcome", title: "2 · Sign in", note: "Name, then passkey", hint: "Type a name, tap Get Started (or Sign In)" },
  { key: "teach", title: "3 · Four cards", note: "Next … Continue", hint: "Swipe or tap Next; Continue on the last card" },
  { key: "home", title: "4 · Home", note: "Onboarding done", hint: "Never shown again on this phone" }
];

const state = { step: 0, theme: "Light", scale: 1 };

// ---------- Small helpers ----------

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) {
    node.className = className;
  }
  if (text !== undefined) {
    node.textContent = text;
  }
  return node;
}

function statusBar() {
  const bar = element("div", "status");
  bar.append(element("span", "time", "9:41"));
  const icons = element("span", "icons");
  icons.append(element("span", "bars"), element("span", "battery"));
  bar.append(icons);
  return bar;
}

function phoneShell() {
  const phone = element("div", "phone theme-" + state.theme.toLowerCase());
  phone.append(element("div", "island"), statusBar(), element("div", "home-bar"));
  return phone;
}

function sendToFrame(frameId, message) {
  const frame = document.getElementById(frameId);
  if (frame.contentWindow) {
    frame.contentWindow.postMessage(message, "*");
  }
}

// ---------- Sign in (WelcomeView) ----------

function keyGlyph() {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", "30");
  svg.setAttribute("height", "30");
  const path = document.createElementNS(ns, "path");
  path.setAttribute("d", "M8 14a5 5 0 1 1 4.6-7H22v3h-2v3h-3v-3h-4.4A5 5 0 0 1 8 14Zm0-3a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z");
  path.setAttribute("fill", "currentColor");
  path.setAttribute("transform", "translate(0 3)");
  svg.append(path);
  return svg;
}

// The passkey sheet: iOS draws its own; words here are a stand-in, not ours to set
function buildPasskeySheet(phone) {
  const dimmer = element("div", "dimmer");
  const sheet = element("div", "sheet");
  const key = element("div", "key");
  key.append(keyGlyph());
  const title = element("div", "t", "");
  const message = element("div", "m", "");
  const who = element("div", "who", "");
  const go = element("button", "prominent", "Continue");
  sheet.append(element("div", "os", "iOS sheet"), key, title, message, who, go);
  phone.append(dimmer, sheet);
  go.addEventListener("click", passkeyAccepted);
  dimmer.addEventListener("click", closePasskeySheet);
  return { dimmer: dimmer, sheet: sheet, title: title, message: message, who: who };
}

let welcomeParts = null;

function buildWelcome() {
  const holder = document.getElementById("welcomeScreen");
  const phone = phoneShell();
  const stack = element("div", "welcome");
  const title = element("div", "title", "Midas");
  const name = element("input");
  name.placeholder = "Name";
  name.autocomplete = "off";
  const getStarted = element("button", "prominent", "Get Started");
  getStarted.disabled = true;
  stack.append(title, name, getStarted);
  const signIn = element("button", "plain", "Sign In");
  phone.append(stack, signIn);
  const sheet = buildPasskeySheet(phone);
  holder.replaceChildren(phone);
  name.addEventListener("input", nameChanged);
  name.addEventListener("keydown", nameKeyPressed);
  getStarted.addEventListener("click", newUserTapped);
  signIn.addEventListener("click", returningUserTapped);
  welcomeParts = { phone: phone, name: name, getStarted: getStarted, sheet: sheet };
  fitNative();
}

// Get Started is off until a name is typed (as built)
function nameChanged() {
  const typed = welcomeParts.name.value.trim();
  welcomeParts.getStarted.disabled = typed.length === 0;
}

function nameKeyPressed(event) {
  if (event.key === "Enter" && !welcomeParts.getStarted.disabled) {
    newUserTapped();
  }
}

function openPasskeySheet(title, message, who) {
  const sheet = welcomeParts.sheet;
  sheet.title.textContent = title;
  sheet.message.textContent = message;
  sheet.who.textContent = who;
  sheet.dimmer.classList.add("open");
  sheet.sheet.classList.add("open");
}

function closePasskeySheet() {
  const sheet = welcomeParts.sheet;
  sheet.dimmer.classList.remove("open");
  sheet.sheet.classList.remove("open");
}

function newUserTapped() {
  const typed = welcomeParts.name.value.trim();
  openPasskeySheet("Save a passkey?", "Signs you in with Face ID.", typed);
}

function returningUserTapped() {
  openPasskeySheet("Sign in?", "Use your saved passkey.", "Midas passkey");
}

function passkeyAccepted() {
  closePasskeySheet();
  goToStep(2);
}

// ---------- Home (end of the flow) ----------

function buildHome() {
  const holder = document.getElementById("homeScreen");
  const phone = phoneShell();
  const end = element("div", "end");
  const again = element("button", "prominent", "Play Again");
  again.addEventListener("click", playAgainTapped);
  end.append(element("div", "t", "Home"), element("div", "m", "Onboarding done"), again);
  phone.append(end);
  holder.replaceChildren(phone);
  fitNative();
}

function playAgainTapped() {
  goToStep(0);
}

// ---------- Steps ----------

function renderSteps() {
  const strip = document.getElementById("steps");
  strip.replaceChildren();
  for (let index = 0; index < STEPS.length; index++) {
    const step = STEPS[index];
    const button = element("button", "step");
    button.append(element("b", null, step.title), element("span", null, step.note));
    button.setAttribute("aria-current", index === state.step ? "true" : "false");
    button.addEventListener("click", stepPicker(index));
    strip.append(button);
  }
}

function stepPicker(index) {
  return function pickStep() {
    goToStep(index);
  };
}

function themePicker(theme) {
  return function pickTheme() {
    state.theme = theme;
    applyTheme();
    renderTools();
  };
}

function renderTools() {
  const tools = document.getElementById("tools");
  tools.replaceChildren();
  for (const theme of ["Light", "Dark"]) {
    const button = element("button", "btn", theme);
    button.setAttribute("aria-pressed", state.theme === theme ? "true" : "false");
    button.addEventListener("click", themePicker(theme));
    tools.append(button);
  }
  const restart = element("button", "btn", "Start Over");
  restart.addEventListener("click", playAgainTapped);
  tools.append(restart);
  tools.append(element("span", "hint", STEPS[state.step].hint));
}

function applyTheme() {
  sendToFrame("introFrame", { cmd: "theme", value: state.theme });
  sendToFrame("teachFrame", { cmd: "theme", value: state.theme });
  buildWelcome();
  buildHome();
}

function showOnly(visibleId) {
  const ids = ["introFrame", "teachFrame", "welcomeScreen", "homeScreen"];
  for (const id of ids) {
    const node = document.getElementById(id);
    node.classList.toggle("hidden", id !== visibleId);
  }
}

// Entering a step starts it fresh
function goToStep(index) {
  state.step = index;
  const key = STEPS[index].key;
  if (key === "intro") {
    sendToFrame("introFrame", { cmd: "reset" });
    showOnly("introFrame");
  } else if (key === "welcome") {
    buildWelcome();
    showOnly("welcomeScreen");
  } else if (key === "teach") {
    sendToFrame("teachFrame", { cmd: "reset" });
    showOnly("teachFrame");
  } else {
    showOnly("homeScreen");
  }
  renderSteps();
  renderTools();
}

// The two mockups say when their button is tapped
function onFrameMessage(event) {
  const message = event.data || {};
  if (message.from === "intro" && message.event === "getStarted") {
    goToStep(1);
  } else if (message.from === "teach" && message.event === "continue") {
    goToStep(3);
  }
}

// ---------- Size: one frame for every step ----------

function fitHolder() {
  const top = document.getElementById("holder").getBoundingClientRect().top + window.scrollY;
  const byHeight = (window.innerHeight - Math.min(top, 220) - 16) / (SCREEN_H + 20);
  const byWidth = (Math.min(window.innerWidth, 900) - 32) / (SCREEN_W + 20);
  state.scale = Math.max(0.3, Math.min(1, byHeight, byWidth));
  const holder = document.getElementById("holder");
  holder.style.width = ((SCREEN_W + 20) * state.scale) + "px";
  holder.style.height = ((SCREEN_H + 20) * state.scale) + "px";
  fitNative();
}

// Same size and place as the phones the two mockups draw inside their frames
// (they fit 402 x 874 plus a 10 px ring into the frame, 10 px in from the top)
function fitNative() {
  const holderWidth = (SCREEN_W + 20) * state.scale;
  const holderHeight = (SCREEN_H + 20) * state.scale;
  const byWidth = (holderWidth - 20) / (SCREEN_W + 20);
  const byHeight = (holderHeight - 20) / (SCREEN_H + 20);
  const phoneScale = Math.min(byWidth, byHeight);
  const frameWidth = SCREEN_W * phoneScale + 20;
  const left = (holderWidth - frameWidth) / 2 + 10;
  const phones = document.querySelectorAll(".native .phone");
  for (const phone of phones) {
    phone.style.left = left + "px";
    phone.style.top = "10px";
    phone.style.transform = "scale(" + phoneScale + ")";
  }
}

function introLoaded() {
  sendToFrame("introFrame", { cmd: "theme", value: state.theme });
}

function teachLoaded() {
  sendToFrame("teachFrame", { cmd: "theme", value: state.theme });
}

function start() {
  window.addEventListener("message", onFrameMessage);
  window.addEventListener("resize", fitHolder);
  document.getElementById("introFrame").addEventListener("load", introLoaded);
  document.getElementById("teachFrame").addEventListener("load", teachLoaded);
  buildWelcome();
  buildHome();
  fitHolder();
  goToStep(0);
}

start();
</script>
</body>
</html>
