<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>jess Listening and Icon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column, two parts. Part 1: the listening colour (research running). Part 2: the jess
   icon, eight options (J or j, plain or underline, centred like Midas or in the corner), each at the
   big preview and the real 60 pt home tile, light and dark. Chrome is Midas DESIGN.md: ink on paper. */
:root {
  --paper: #FFFFFF; --ink: #111111; --ink-2: #6B6B6B; --rule: rgba(17,17,17,0.12); --paper-2: #F3F2EF;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111111; --ink: #FFFFFF; --ink-2: #A3A3A3; --rule: rgba(255,255,255,0.14); --paper-2: #1C1C1C; color-scheme: dark } }
:root[data-theme="dark"] { --paper: #111111; --ink: #FFFFFF; --ink-2: #A3A3A3; --rule: rgba(255,255,255,0.14); --paper-2: #1C1C1C; color-scheme: dark }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--font); }
.page { max-width: 1120px; margin: 0 auto; padding-block: 40px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px; }
header { display: grid; gap: 8px; max-width: 70ch; }
h1 { font: 700 30px/1.15 var(--font-display); margin: 0; text-wrap: balance; }
h2 { font: 700 22px/1.2 var(--font-display); margin: 0; text-wrap: balance; }
p { margin: 0; color: var(--ink-2); }
.eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.part { display: grid; gap: 18px; padding-top: 28px; border-top: 1px solid var(--rule); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.facts div { background: var(--paper-2); border-radius: 14px; padding: 14px; display: grid; gap: 4px; min-width: 0; }
.facts b { font-weight: 600; }
.facts p { font-size: 13px; }
.facts i { font-style: normal; opacity: 0.75; font-size: 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar button { font: 600 13px/1 var(--font); padding: 9px 14px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer; }
.bar button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.gap { width: 12px; }
.now { font-size: 13px; color: var(--ink-2); min-width: 9ch; }
.options { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.option { border: 1px solid var(--rule); border-radius: 18px; overflow: hidden; display: grid; min-width: 0; }
.pair { display: grid; grid-template-columns: 1fr 1fr; }
.stage { aspect-ratio: 1 / 1; max-width: 100%; display: grid; place-items: center; }
.stage.light { background: #FFFFFF; }
.stage.dark { background: #0A0A0A; }
.stage canvas { width: 82%; height: 82%; display: block; }
.meta { padding: 12px 14px 14px; display: grid; gap: 6px; border-top: 1px solid var(--rule); }
.meta .title { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
.meta .title b { font-size: 15px; font-variant-numeric: tabular-nums; }
.meta .title span { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 12px; }
.strips { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--ink-2); }
.strips canvas { display: block; }

/* Icon options */
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--ink-2); }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 14px; }
.icon-card { border: 1px solid var(--rule); border-radius: 18px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.icon-name { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
.icon-name b { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
.icon-name span { color: var(--ink-2); }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.ground { border-radius: 14px; padding: 10px; display: grid; place-items: center; }
.ground.light { background: #F3F2EF; }
.ground.dark { background: #000000; }
.tile { display: block; }
.cell { display: grid; gap: 4px; justify-items: center; }
.cell span { font-size: 11px; color: var(--ink-2); white-space: nowrap; }
.compare { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
</style>

// The Midas icon sets Caveat at 330 px on a 1024 px canvas (shell/icon-source/icon-light.html).
const MIDAS_SCALE = 330 / 1000;
const NAMESPACE = "http://www.w3.org/2000/svg";
const LOOKS = {
  light: { paper: "#FFFFFF", ink: "#111111", edge: "rgba(0,0,0,0.10)" },
  dark: { paper: "#111111", ink: "#FFFFFF", edge: "rgba(255,255,255,0.14)" }
};

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) { node.className = className; }
  if (text) { node.textContent = text; }
  return node;
}

function svgElement(tag, attributes) {
  const node = document.createElementNS(NAMESPACE, tag);
  for (const name of Object.keys(attributes)) { node.setAttribute(name, attributes[name]); }
  return node;
}

// The word as SVG paths in font units: filled outlines, or a drawn stroke for the smooth "s".
function wordGroup(wordKey, colour) {
  const word = S_DATA.words[wordKey];
  const group = svgElement("g", {});
  for (const part of word.parts) {
    const isStroke = part.kind === "stroke";
    group.append(svgElement("path", {
      d: part.d,
      fill: isStroke ? "none" : colour,
      // A soft outline in the same ink rounds off the rough brush edges.
      stroke: isStroke || part.soften ? colour : "none",
      "stroke-width": isStroke ? (part.width || word.stroke) : (part.soften || 0),
      "stroke-linecap": "round",
      "stroke-linejoin": "round"
    }));
  }
  return group;
}

const placedWords = [];

function iconTile(wordKey, side, lookName) {
  const look = LOOKS[lookName];

  const svg = svgElement("svg", { viewBox: "0 0 1024 1024", width: side, height: side, role: "img", "aria-label": wordKey + " " + lookName });
  const clip = svgElement("clipPath", { id: clipId });
  clip.append(svgElement("rect", { width: 1024, height: 1024, rx: 230 }));
  svg.append(clip);
  const holder = svgElement("g", { "clip-path": "url(#" + clipId + ")" });
  holder.append(svgElement("rect", { width: 1024, height: 1024, fill: look.paper }));
  const placed = svgElement("g", {});
  placed.append(wordGroup(wordKey, look.ink));
  holder.append(placed);
  svg.append(holder);
  svg.append(svgElement("rect", { x: 1, y: 1, width: 1022, height: 1022, rx: 229, fill: "none", stroke: look.edge, "stroke-width": 2 * 1024 / side }));
  placedWords.push(placed);
  return svg;
}

// Centre on the word's ink box, like the Midas icon.
function centreWord(placed) {
  const box = placed.firstChild.getBBox();
  const x = 512 - (box.x + box.width / 2) * MIDAS_SCALE;
  const y = 512 - (box.y + box.height / 2) * MIDAS_SCALE;
  placed.setAttribute("transform", "translate(" + x + " " + y + ") scale(" + MIDAS_SCALE + ")");
}

function cell(svg, groundClass, labelText) {
  const wrapper = element("div", "cell");
  const ground = element("div", "ground " + groundClass);
  ground.append(svg);
  wrapper.append(ground, element("span", null, labelText));
  return wrapper;
}

  const last = parts[parts.length - 1].getBBox();
  const left = Math.min(first.x, last.x) - 70;
  const top = Math.min(first.y, last.y) - 70;
  const right = Math.max(first.x + first.width, last.x + last.width) + 70;
  const bottom = Math.max(first.y + first.height, last.y + last.height) + 70;
  const width = right - left;
  const height = bottom - top;
  entry.svg.setAttribute("viewBox", left + " " + top + " " + width + " " + height);
  entry.svg.firstChild.setAttribute("x", left);
  entry.svg.firstChild.setAttribute("y", top);
  entry.svg.firstChild.setAttribute("width", width);
  entry.svg.firstChild.setAttribute("height", height);
}

function buildCard(variant) {

  card.id = "s-" + variant.id;

  );
  card.append(name, tiles);
  return card;
}

const iconHolder = document.getElementById("icons");
for (const variant of S_DATA.variants) { iconHolder.append(buildCard(variant)); }
// getBBox needs the SVGs in the page, so centre after they are attached.
for (const placed of placedWords) { centreWord(placed); }
for (const entry of closeUps) { frameCloseUp(entry); }

<script>
// ---------- Listening colour: live orbs (ported from jess-orb-2026-10-15, "Neon core", no core halo) ----------

const RESULT = { light: { green: "#00873A", red: "#E00000" }, dark: { green: "#3DDC84", red: "#FF5C5C" } };
const MODE_COLOURS = {
  light: { body: "#FFFFFF", bodyGlow: "rgba(0,0,0,0.18)", line: "#111111", core: "#000000", arc: "#111111", arcGlow: "rgba(0,0,0,1)", ground: "#FFFFFF" },
  dark: { body: "#000000", bodyGlow: "rgba(255,255,255,0.22)", line: "#2A2A2A", core: "#FFFFFF", arc: "#FFFFFF", arcGlow: "rgba(255,255,255,0.95)", ground: "#0A0A0A" }
};

// Low-chroma candidates (OKLCH chroma 0 to 0.053; every rejected colour was 0.059 or more).
// W: the hue wheel every 12 degrees at full strength (violet band 276-324 left out). K: named colours. R: comparison only.
const OPTIONS = [{"id": "W1", "name": "Pink", "light": "#F00580", "dark": "#FF68A0", "lc": "hue 0"}, {"id": "W2", "name": "Coral pink", "light": "#F6005D", "dark": "#FF6D87", "lc": "hue 12"}, {"id": "W3", "name": "Coral", "light": "#F90330", "dark": "#FF716D", "lc": "hue 24"}, {"id": "W4", "name": "Coral", "light": "#E94101", "dark": "#FE7550", "lc": "hue 36"}, {"id": "W5", "name": "Vermilion", "light": "#D35F03", "dark": "#FF781B", "lc": "hue 48"}, {"id": "W6", "name": "Orange", "light": "#C36D05", "dark": "#EF8604", "lc": "hue 60"}, {"id": "W7", "name": "Tangerine", "light": "#B67703", "dark": "#DF9201", "lc": "hue 72"}, {"id": "W8", "name": "Saffron", "light": "#AA7E05", "dark": "#D09B00", "lc": "hue 84"}, {"id": "W9", "name": "Yellow", "light": "#C8A901", "dark": "#FFE88B", "lc": "hue 96"}, {"id": "W10", "name": "Citron", "light": "#B5B109", "dark": "#F6F005", "lc": "hue 108"}, {"id": "W11", "name": "Lime", "light": "#9EB909", "dark": "#D6FC07", "lc": "hue 120"}, {"id": "W12", "name": "Volt", "light": "#78C307", "dark": "#BEFF85", "lc": "hue 132"}, {"id": "W13", "name": "Spring", "light": "#04A322", "dark": "#07C72C", "lc": "hue 144"}, {"id": "W14", "name": "Mint", "light": "#00AE67", "dark": "#05F895", "lc": "hue 156"}, {"id": "W15", "name": "Jade", "light": "#0BAB83", "dark": "#02F4BB", "lc": "hue 168"}, {"id": "W16", "name": "Aqua", "light": "#0DA995", "dark": "#00F2D5", "lc": "hue 180"}, {"id": "W17", "name": "Turquoise", "light": "#0AA7A4", "dark": "#13EFE9", "lc": "hue 192"}, {"id": "W18", "name": "Cyan", "light": "#04A6B2", "dark": "#08ECFD", "lc": "hue 204"}, {"id": "W19", "name": "Sky", "light": "#0196B0", "dark": "#00B8D7", "lc": "hue 216"}, {"id": "W20", "name": "Azure", "light": "#067A9E", "dark": "#05A0CF", "lc": "hue 228"}, {"id": "W21", "name": "Cobalt", "light": "#0076AF", "dark": "#069CE4", "lc": "hue 240"}, {"id": "W22", "name": "Electric blue", "light": "#006FC9", "dark": "#1E94FF", "lc": "hue 252"}, {"id": "W23", "name": "Ultramarine", "light": "#1A57FF", "dark": "#588CFF", "lc": "hue 264"}, {"id": "W24", "name": "Magenta", "light": "#E001C2", "dark": "#FF51DF", "lc": "hue 336"}, {"id": "W25", "name": "Hot pink", "light": "#EA02A1", "dark": "#FF5FBC", "lc": "hue 348"}, {"id": "K1", "name": "Klein blue", "light": "#002FA7", "dark": "#3D6BFF", "lc": "named colour"}, {"id": "K2", "name": "Volt", "light": "#8DB600", "dark": "#CEFF00", "lc": "named colour"}, {"id": "K3", "name": "Safety orange", "light": "#E85D00", "dark": "#FF7A1A", "lc": "named colour"}, {"id": "K4", "name": "Tiffany", "light": "#0A9C97", "dark": "#0ABAB5", "lc": "named colour"}, {"id": "K5", "name": "Hot pink", "light": "#E0117F", "dark": "#FF4FA3", "lc": "named colour"}, {"id": "K6", "name": "Ice", "light": "#0091B3", "dark": "#9EF0FF", "lc": "named colour"}, {"id": "K7", "name": "Sodium", "light": "#D98200", "dark": "#FFB21A", "lc": "named colour"}, {"id": "K8", "name": "Cherenkov", "light": "#0077E6", "dark": "#2EC5FF", "lc": "named colour"}, {"id": "K9", "name": "Laser green", "light": "#00A86B", "dark": "#39FF88", "lc": "named colour"}, {"id": "K10", "name": "Acid yellow", "light": "#B8A600", "dark": "#EFFF3A", "lc": "named colour"}, {"id": "K11", "name": "Neon red-orange", "light": "#F2300F", "dark": "#FF5F3D", "lc": "named colour"}, {"id": "K12", "name": "Electric teal", "light": "#008C8C", "dark": "#00FFE0", "lc": "named colour"}, {"id": "R", "name": "Reference: the original violet (banned)", "light": "#8002DF", "dark": "#A96AFF", "lc": "hue 300, comparison only"}];

// Machado 2009 deuteranopia matrix, applied in linear RGB.
const DEUTAN = [[0.367322, 0.860646, -0.227968], [0.280085, 0.672501, 0.047413], [-0.011820, 0.042940, 0.968881]];
const POINTS = 72;
const MODES = [2, 3, 4];
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const RUN_STEPS = [
  { state: "idle", seconds: 1.0 }, { state: "listening", seconds: 3.2 }, { state: "thinking", seconds: 1.6 }, { state: "added", seconds: 1.8 },
  { state: "idle", seconds: 0.8 }, { state: "listening", seconds: 3.2 }, { state: "thinking", seconds: 1.6 }, { state: "failed", seconds: 1.8 }
];
const STATE_WORDS = { idle: "Idle", listening: "Listening", thinking: "Thinking", added: "Done", failed: "Not done" };
let chosenState = "run";
let coreGlow = false;
let colourSpread = "core";

function hexToRgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}

function toLinear(channel) {
  const value = channel / 255;
  return value <= 0.04045 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4);
}

function toSrgb(linear) {
  const clamped = Math.min(1, Math.max(0, linear));
  const value = clamped <= 0.0031308 ? clamped * 12.92 : 1.055 * Math.pow(clamped, 1 / 2.4) - 0.055;
  return Math.round(value * 255);
}

function luminance(hex) {
  const linear = hexToRgb(hex).map(toLinear);
  return 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2];
}

// WCAG contrast ratio between two colours.
function contrast(hexA, hexB) {
  const lighter = Math.max(luminance(hexA), luminance(hexB));
  const darker = Math.min(luminance(hexA), luminance(hexB));
  return (lighter + 0.05) / (darker + 0.05);
}

// How a colour looks with deuteranopia (the most common colour blindness).
function simulateDeutan(hex) {
  const linear = hexToRgb(hex).map(toLinear);
  const channels = [];
  for (const row of DEUTAN) {
    channels.push(toSrgb(row[0] * linear[0] + row[1] * linear[1] + row[2] * linear[2]));
  }
  return "rgb(" + channels.join(",") + ")";
}

function setupCanvas(canvas, width, height) {
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";
  const context = canvas.getContext("2d");
  context.setTransform(ratio, 0, 0, ratio, 0, 0);
  return context;
}

// Which state the shared timeline is in, for "Full run".
function runState(time) {
  let total = 0;
  for (const step of RUN_STEPS) { total += step.seconds; }
  let position = time % total;
  for (const step of RUN_STEPS) {
    if (position < step.seconds) { return step.state; }
    position -= step.seconds;
  }
  return "idle";
}

function currentState(time) {
  return chosenState === "run" ? runState(time) : chosenState;
}

function makeOrb(canvas, mode, listenColour) {
  const zeroes = MODES.map(function zero() { return 0; });
  const phases = MODES.map(function randomPhase() { return Math.random() * Math.PI * 2; });
  return { canvas: canvas, context: canvas.getContext("2d"), mode: mode, listenColour: listenColour,
    amplitudes: zeroes.slice(), velocities: zeroes.slice(), phases: phases, arc: 0, size: 1 };
}

function resizeOrb(orb) {
  const ratio = window.devicePixelRatio || 1;
  const box = orb.canvas.getBoundingClientRect();
  orb.size = Math.max(1, box.width);
  orb.canvas.width = Math.round(orb.size * ratio);
  orb.canvas.height = Math.round(orb.size * ratio);
  orb.context.setTransform(ratio, 0, 0, ratio, 0, 0);
}

// A made-up voice level: bursts while listening, a slow breath otherwise.
function voiceLevel(stateName, time) {
  if (stateName === "listening") {
    const syllables = Math.abs(Math.sin(time * 7.3)) * Math.abs(Math.sin(time * 2.1 + 1));
    return 0.25 + 0.75 * syllables;
  }
  if (stateName === "thinking") { return 0.18; }
  return 0.06 + 0.05 * Math.sin(time * 1.5);
}

// Springs pull each wobble mode toward a target set by the level.
function stepModes(orb, level) {
  for (let index = 0; index < MODES.length; index += 1) {
    const target = level * (0.05 / (index + 1));
    const pull = (target - orb.amplitudes[index]) * 0.08;
    orb.velocities[index] = (orb.velocities[index] + pull) * 0.88;
    orb.amplitudes[index] += orb.velocities[index];
    orb.phases[index] += 0.02 + index * 0.012;
  }
}

function outlinePath(orb, centre, radius, withBulge) {
  const context = orb.context;
  context.beginPath();
  for (let pointIndex = 0; pointIndex <= POINTS; pointIndex += 1) {
    const angle = (pointIndex / POINTS) * Math.PI * 2;
    let offset = 0;
    for (let index = 0; index < MODES.length; index += 1) {
      offset += orb.amplitudes[index] * Math.sin(MODES[index] * angle + orb.phases[index]);
    }
    // While thinking, the wall bulges just ahead of the sweeping arc.
    if (withBulge) {
      const distance = Math.atan2(Math.sin(angle - orb.arc), Math.cos(angle - orb.arc));
      offset += 0.05 * Math.exp(-(distance * distance) / 0.12);
    }
    const pointRadius = radius * (1 + offset);
    const x = centre + Math.cos(angle) * pointRadius;
    const y = centre + Math.sin(angle) * pointRadius;
    if (pointIndex === 0) { context.moveTo(x, y); } else { context.lineTo(x, y); }
  }
  context.closePath();
}

// Core colour by state: listening is the candidate; done and not done are fixed; the rest ink.
function coreFill(orb, stateName) {
  if (stateName === "added") { return RESULT[orb.mode].green; }
  if (stateName === "failed") { return RESULT[orb.mode].red; }
  if (stateName === "listening") { return orb.listenColour; }
  return MODE_COLOURS[orb.mode].core;
}

function drawOrb(orb, time) {
  const stateName = currentState(time);
  const context = orb.context;
  const colours = MODE_COLOURS[orb.mode];
  const size = orb.size;
  const centre = size / 2;
  const radius = size * 0.33;
  const lineWidth = Math.max(1.5, size * 0.02);
  const level = voiceLevel(stateName, time);
  const thinking = stateName === "thinking";
  stepModes(orb, level);
  if (thinking) { orb.arc += 0.06; }
  context.clearRect(0, 0, size, size);

  function bodyShape() { outlinePath(orb, centre, radius, thinking); }

  // Body: a soft glow around it, then the fill.
  context.save();
  const listening = stateName === "listening";
  // Colour in the body glow while listening, when the switch says so.
  context.shadowColor = listening && colourSpread !== "core" ? withAlpha(orb.listenColour, 0.6) : colours.bodyGlow;
  context.shadowBlur = size * (0.14 + level * 0.08);
  bodyShape();
  context.fillStyle = colours.body;
  context.fill();
  context.restore();

  // Ring: never changes colour with the state.
  bodyShape();
  context.lineWidth = lineWidth;
  context.strokeStyle = listening && colourSpread === "all" ? orb.listenColour : colours.line;
  context.stroke();

  // Thinking arc sweeping the rim.
  if (thinking) {
    context.save();
    context.shadowColor = colours.arcGlow;
    context.shadowBlur = size * 0.04;
    context.beginPath();
    context.arc(centre, centre, radius * 1.02, orb.arc - 0.55, orb.arc + 0.15);
    context.lineWidth = lineWidth * 1.4;
    context.lineCap = "round";
    context.strokeStyle = colours.arc;
    context.stroke();
    context.restore();
  }

  // Core: crisp and flat, no halo (founder, 2026-10-15).
  const coreRadius = radius * (0.3 + (stateName === "listening" ? level * 0.08 : 0));
  context.save();
  // Optional neon glow while listening (the core is crisp by the 2026-10-15 decision).
  if (coreGlow && stateName === "listening") {
    context.shadowColor = orb.listenColour;
    context.shadowBlur = size * (0.08 + level * 0.06);
  }
  context.beginPath();
  context.arc(centre, centre, coreRadius, 0, Math.PI * 2);
  context.fillStyle = coreFill(orb, stateName);
  context.fill();
  context.restore();
}

function withAlpha(hex, alpha) {
  const rgb = hexToRgb(hex);
  return "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + "," + alpha + ")";
}

function selectSpread(event) {
  const button = event.currentTarget;
  colourSpread = button.dataset.spread;
  for (const other of document.querySelectorAll("[data-spread]")) {
    other.setAttribute("aria-pressed", other === button ? "true" : "false");
  }
  if (reducedMotion) { frame(performance.now()); }
}

function selectGlow(event) {
  const button = event.currentTarget;
  coreGlow = button.dataset.glow === "on";
  for (const other of document.querySelectorAll("[data-glow]")) {
    other.setAttribute("aria-pressed", other === button ? "true" : "false");
  }
  if (reducedMotion) { frame(performance.now()); }
}

// Three dots: listening, done, not done; as seen normally or with deuteranopia.
function drawStrip(canvas, option, mode, colourBlind) {
  const context = setupCanvas(canvas, 120, 22);
  const colours = [option[mode], RESULT[mode].green, RESULT[mode].red];
  context.fillStyle = MODE_COLOURS[mode].ground;
  context.beginPath(); context.roundRect(0, 0, 120, 22, 11); context.fill();
  context.strokeStyle = "rgba(128,128,128,0.35)";
  context.lineWidth = 1;
  context.stroke();
  for (let index = 0; index < colours.length; index += 1) {
    context.fillStyle = colourBlind ? simulateDeutan(colours[index]) : colours[index];
    context.beginPath(); context.arc(20 + index * 40, 11, 7, 0, Math.PI * 2); context.fill();
  }
}

function stripRow(labelText, option, mode, colourBlind) {
  const canvas = document.createElement("canvas");
  canvas.setAttribute("aria-hidden", "true");
  drawStrip(canvas, option, mode, colourBlind);
  const label = document.createElement("span");
  label.textContent = labelText;
  return [label, canvas];
}

function textNode(tag, className, text) {
  const node = document.createElement(tag);
  if (className) { node.className = className; }
  node.textContent = text;
  return node;
}

function buildOptionCard(option, orbs) {
  const card = document.createElement("article");
  card.className = "option";
  card.id = "option-" + option.id;
  const pair = document.createElement("div");
  pair.className = "pair";
  for (const mode of ["light", "dark"]) {
    const stage = document.createElement("div");
    stage.className = "stage " + mode;
    const canvas = document.createElement("canvas");
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label", option.id + " " + option.name + " orb, " + mode + " mode");
    stage.append(canvas);
    pair.append(stage);
    orbs.push(makeOrb(canvas, mode, option[mode]));
  }
  const meta = document.createElement("div");
  meta.className = "meta";
  const title = document.createElement("div");
  title.className = "title";
  title.append(textNode("b", null, option.id), textNode("span", null, option.name));
  const onWhite = contrast(option.light, "#FFFFFF").toFixed(1);
  const onBlack = contrast(option.dark, "#000000").toFixed(1);
  const numbers = textNode("div", "num", option.light + " / " + option.dark + " · " + option.lc + " · contrast " + onWhite + " on white, " + onBlack + " on black");
  const strips = document.createElement("div");
  strips.className = "strips";
  strips.append(...stripRow("listen · done · not", option, "light", false));
  strips.append(...stripRow("dark mode", option, "dark", false));
  strips.append(...stripRow("colour-blind", option, "light", true));
  meta.append(title, numbers, strips);
  card.append(pair, meta);
  return card;
}

const orbs = [];
const optionsHolder = document.getElementById("options");
for (const option of OPTIONS) { optionsHolder.append(buildOptionCard(option, orbs)); }

const nowLabel = document.getElementById("now");
let lastShown = "";

function frame(milliseconds) {
  const time = milliseconds / 1000;
  for (const orb of orbs) { drawOrb(orb, time); }
  const shown = chosenState === "run" ? STATE_WORDS[runState(time)] : "";
  if (shown !== lastShown) { nowLabel.textContent = shown; lastShown = shown; }
  if (!reducedMotion) { window.requestAnimationFrame(frame); }
}

function resizeAll() {
  for (const orb of orbs) { resizeOrb(orb); }
  // With Reduce Motion nothing animates, so draw the still frame again at the new size.
  if (reducedMotion) { frame(performance.now()); }
}

function selectState(event) {
  const button = event.currentTarget;
  chosenState = button.dataset.state;
  for (const other of document.querySelectorAll("[data-state]")) {
    other.setAttribute("aria-pressed", other === button ? "true" : "false");
  }
  if (reducedMotion) { frame(performance.now()); }
}

for (const button of document.querySelectorAll("[data-state]")) { button.addEventListener("click", selectState); }
for (const button of document.querySelectorAll("[data-glow]")) { button.addEventListener("click", selectGlow); }
for (const button of document.querySelectorAll("[data-spread]")) { button.addEventListener("click", selectSpread); }
window.addEventListener("resize", resizeAll);
window.addEventListener("load", resizeAll);
resizeAll();
// Settle the springs once so the first still frame already shows the shape.
for (let warmup = 0; warmup < 40; warmup += 1) {
  for (const orb of orbs) { stepModes(orb, voiceLevel("listening", warmup / 30)); }
}
if (reducedMotion) { chosenState = "listening"; }
frame(performance.now());
