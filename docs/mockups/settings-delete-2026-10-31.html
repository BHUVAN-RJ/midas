<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings and Delete</title>
<style>
/* Midas tokens, docs/DESIGN.md 2.1 and 2.4. Page chrome is light; each phone carries its own theme. */
:root {
  --page: #FAFAFA;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", sans-serif;
  --scale: 0.8;
}
.theme-light {
  --paper: #FFFFFF; --ink: #111111; --ink-2: #6B6B6B; --ink-3: #BDBDBD;
  --rule: rgba(17, 17, 17, 0.12); --paper-2: #F3F2EF; --shadow: rgba(0, 0, 0, 0.16);
  --red: #FF3B30; --group: #F3F2EF; --card: #FFFFFF; --sheet: #FFFFFF;
  --glass: rgba(246, 246, 246, 0.86); --blur-tint: rgba(255, 255, 255, 0.35); --dim: rgba(0, 0, 0, 0.3);
  --kb: #D1D3D9; --key: #FFFFFF;
}
.theme-dark {
  --paper: #111111; --ink: #FFFFFF; --ink-2: #A3A3A3; --ink-3: #5C5C5C;
  --rule: rgba(255, 255, 255, 0.14); --paper-2: #1C1C1C; --shadow: rgba(0, 0, 0, 0.6);
  --red: #FF453A; --group: #111111; --card: #1C1C1C; --sheet: #1C1C1C;
  --glass: rgba(38, 38, 40, 0.86); --blur-tint: rgba(0, 0, 0, 0.35); --dim: rgba(0, 0, 0, 0.55);
  --kb: #2B2B2D; --key: #5A5A5E;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: #111111; font-family: var(--font); -webkit-font-smoothing: antialiased; }
.page { max-width: 1320px; margin: 0 auto; padding: 0 24px 96px; }
h1 { font-size: 28px; margin: 28px 0 0; letter-spacing: -0.4px; }
.date { color: #6B6B6B; font-size: 14px; margin: 4px 0 0; }
h2 { font-size: 22px; margin: 0; letter-spacing: -0.3px; }
h2 small { color: #6B6B6B; font-weight: 600; margin-right: 8px; }
section { margin-top: 56px; display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 1100px) { section { grid-template-columns: minmax(0, 1fr); } }

/* Sticky picks */
.picks { position: sticky; top: 0; z-index: 40; background: rgba(250, 250, 250, 0.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid rgba(17, 17, 17, 0.12); margin: 0 -24px; padding: 10px 24px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.picks b { font-size: 15px; margin-right: 6px; }
.pick-chip { font-size: 13px; font-weight: 700; border: 1.5px solid #111111; border-radius: 999px; padding: 3px 10px; }

/* Pick rows */
.rows { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.rows h3 { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: #6B6B6B; text-transform: uppercase; margin: 12px 0 0; }
.pick-row { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: center; background: #FFFFFF; border: 1.5px solid rgba(17, 17, 17, 0.12); border-radius: 16px; padding: 10px 14px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.pick-row:hover { border-color: #6B6B6B; }
.pick-row[aria-pressed="true"] { border-color: #111111; box-shadow: 0 0 0 1.5px #111111; }
.pick-id { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.pick-name { font-size: 15px; font-weight: 600; }
.pick-words { font-size: 12.5px; color: #6B6B6B; margin-top: 2px; line-height: 17px; }

/* Previews */
.stage { display: flex; flex-direction: column; gap: 12px; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.step-btn { font: inherit; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #111111; border: 1px solid rgba(17, 17, 17, 0.14); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.step-btn[aria-pressed="true"] { background: #111111; color: #FFFFFF; border-color: #111111; }
.phones { display: flex; gap: 24px; flex-wrap: wrap; }
.frame { width: calc(402px * var(--scale) + 16px); height: calc(874px * var(--scale) + 16px); position: relative; flex-shrink: 0; }
.frame-inner { position: absolute; left: 8px; top: 8px; transform: scale(var(--scale)); transform-origin: top left; }

/* The phone: iPhone 16 Pro, 402 x 874 pt */
.phone { width: 402px; height: 874px; position: relative; overflow: hidden; border-radius: 56px; background: #000000; box-shadow: 0 0 0 10px #111111, 0 20px 50px rgba(0, 0, 0, 0.18); user-select: none; -webkit-user-select: none; }
.screen { position: absolute; inset: 0; background: var(--paper); color: var(--ink); border-radius: 56px; overflow: hidden; font-family: var(--font); }
.island { position: absolute; top: 11px; left: 50%; width: 126px; height: 37px; margin-left: -63px; background: #000000; border-radius: 19px; z-index: 60; }
.status { position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 59; color: var(--ink); font-size: 17px; font-weight: 600; pointer-events: none; }
.status.on-dark { color: #FFFFFF; }
.status .time { position: absolute; left: 50px; top: 17px; }
.status .icons { position: absolute; right: 34px; top: 21px; display: flex; gap: 6px; align-items: center; }
.status .bars { width: 18px; height: 12px; background: currentColor; clip-path: polygon(0 100%, 100% 0, 100% 100%); }
.status .battery { width: 26px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; position: relative; opacity: 0.9; }
.status .battery::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: currentColor; border-radius: 1.5px; }
.home-bar { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); z-index: 61; }
.home-bar.on-dark { background: #FFFFFF; }
[data-go] { cursor: pointer; }

/* Touch marker */
.tap { position: relative; }
.tap::after { content: ""; position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(140, 140, 140, 0.35); box-shadow: 0 0 0 2px rgba(140, 140, 140, 0.5); pointer-events: none; z-index: 8; }

/* Home */
.home-title { position: absolute; top: 62px; left: 0; right: 0; text-align: center; font-size: 15px; font-weight: 600; color: var(--ink-2); display: flex; justify-content: center; }
.home-title span { display: inline-flex; align-items: center; gap: 3px; padding: 0 6px; }
.corner { position: absolute; top: 56px; right: 20px; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--ink-2); }
.initial { background: var(--paper-2); color: var(--ink-2); font-size: 14px; font-weight: 600; }
.theme-dark .initial { background: #262626; }
.cell { position: absolute; width: 84px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; }
.cell .label { white-space: nowrap; }
.tile { position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
.tile.edge::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--rule); }
.me-row { position: absolute; left: 0; right: 0; display: flex; justify-content: center; }
.me-row span { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--ink-2); padding: 8px 12px; }
.me-row .initial { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }

/* Context menu */
.blur { position: absolute; inset: 0; background: var(--blur-tint); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); z-index: 30; }
.lifted { position: absolute; z-index: 31; transform: scale(1.08); box-shadow: 0 10px 30px var(--shadow); border-radius: 13.5px; }
.cmenu { position: absolute; z-index: 32; width: 250px; background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 16px; box-shadow: 0 12px 40px var(--shadow); overflow: hidden; }
.cmenu div { display: flex; justify-content: space-between; align-items: center; height: 46px; padding: 0 16px; font-size: 17px; }
.cmenu div + div { border-top: 1px solid var(--rule); }
.cmenu .danger { color: var(--red); }

/* Settings */
.sheet-back { position: absolute; inset: 0; background: #000000; }
.sheet-peek { position: absolute; top: 48px; left: 14px; right: 14px; height: 40px; border-radius: 12px 12px 0 0; background: var(--paper); opacity: 0.55; }
.sheet-page { position: absolute; top: 60px; left: 0; right: 0; bottom: 0; border-radius: 14px 14px 0 0; overflow: hidden; }
.push-page { position: absolute; inset: 0; background: var(--paper); }
.nav-done { position: absolute; top: 14px; right: 18px; font-size: 17px; font-weight: 600; }
.nav-back { position: absolute; top: 58px; left: 10px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
.profile { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.avatar { box-shadow: inset 0 0 0 1px var(--rule); border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--paper-2); color: var(--ink); font-weight: 600; flex-shrink: 0; }
.theme-dark .avatar { background: #2A2A2A; }
.who-name { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.big-name { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
.sec-label { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--ink-2); padding: 0 32px 7px; text-transform: uppercase; letter-spacing: 0.3px; }
.sec-label.plain { padding: 0 20px 7px; }
.sec-label b { font-size: 15px; color: var(--ink); text-transform: none; letter-spacing: 0; font-weight: 600; }
.group { margin: 0 16px; border-radius: 14px; background: var(--card); overflow: hidden; --row-bg: var(--card); }
.group.visible { overflow: visible; position: relative; }
.group .r.first { border-radius: 14px 14px 0 0; }
.group .r.last { border-radius: 0 0 14px 14px; }
.group .r.first.last { border-radius: 14px; }
.rows-wrap { position: relative; }
.r { position: relative; height: 52px; overflow: hidden; }
.r-in { position: absolute; inset: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--row-bg); transition: transform 0.2s; }
.r + .r .r-in::before { content: ""; position: absolute; top: 0; left: 58px; right: 0; height: 1px; background: var(--rule); }
.r .nm { flex: 1; font-size: 17px; }
.r .trail { color: var(--ink-3); display: flex; }
.r .swipe-del { position: absolute; top: 0; right: 0; bottom: 0; width: 88px; background: var(--red); color: #FFFFFF; font-size: 17px; font-weight: 500; display: flex; align-items: center; justify-content: center; }
.r.swiped .r-in { transform: translateX(-88px); }
.minus { width: 22px; height: 22px; border-radius: 50%; background: var(--red); position: relative; flex-shrink: 0; transition: transform 0.2s; }
.minus::after { content: ""; position: absolute; left: 5px; right: 5px; top: 10px; height: 2px; background: #FFFFFF; border-radius: 1px; }
.minus.open { transform: rotate(-90deg); }
.minus-gap { width: 22px; flex-shrink: 0; }
.row-menu { position: absolute; right: 10px; top: 44px; z-index: 20; width: 220px; background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 14px; box-shadow: 0 10px 36px var(--shadow); overflow: hidden; }
.row-menu div { display: flex; justify-content: space-between; align-items: center; height: 44px; padding: 0 14px; font-size: 16px; }
.row-menu div + div { border-top: 1px solid var(--rule); }
.row-menu .danger { color: var(--red); }
.act { height: 52px; display: flex; align-items: center; padding: 0 16px; font-size: 17px; position: relative; }
.act.danger { color: var(--red); }
.act.center { justify-content: center; }
.chip-btn { font-size: 15px; font-weight: 600; border-radius: 999px; padding: 7px 14px; box-shadow: inset 0 0 0 1px var(--rule); }
.text-link { position: absolute; left: 0; right: 0; text-align: center; font-size: 15px; }
.text-link span { padding: 10px 14px; display: inline-block; position: relative; }

/* Overlays */
.dim { position: absolute; inset: 0; background: var(--dim); z-index: 40; }
.asheet { position: absolute; left: 8px; right: 8px; bottom: 34px; z-index: 41; display: flex; flex-direction: column; gap: 8px; }
.asheet .blk { background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 16px; overflow: hidden; text-align: center; }
.theme-light .asheet .blk { background: rgba(250, 250, 250, 0.96); }
.asheet .head { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.asheet .t { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.asheet .m { font-size: 13px; color: var(--ink-2); }
.asheet .b { height: 58px; display: flex; align-items: center; justify-content: center; font-size: 20px; border-top: 1px solid var(--rule); position: relative; }
.asheet .b.first { border-top: none; }
.asheet .danger { color: var(--red); }
.asheet .cancel { font-weight: 600; }
.alert { position: absolute; left: 50%; top: 50%; width: 280px; transform: translate(-50%, -50%); z-index: 41; background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 22px; overflow: hidden; text-align: center; }
.theme-light .alert { background: rgba(250, 250, 250, 0.97); }
.alert .head { padding: 20px 18px 16px; display: flex; flex-direction: column; gap: 4px; }
.alert .t { font-size: 17px; font-weight: 600; }
.alert .m { font-size: 13px; color: var(--ink-2); line-height: 18px; }
.alert .btns { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--rule); }
.alert .btns.stack { grid-template-columns: 1fr; }
.alert .btns div { height: 46px; display: flex; align-items: center; justify-content: center; font-size: 17px; position: relative; }
.alert .btns div + div { border-left: 1px solid var(--rule); }
.alert .btns.stack div + div { border-left: none; border-top: 1px solid var(--rule); }
.alert .danger { color: var(--red); font-weight: 600; }
.msheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--sheet); border-radius: 30px 30px 0 0; padding: 26px 24px 46px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 -8px 30px var(--shadow); }
.msheet .grab { position: absolute; top: 7px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--ink-3); }
.msheet .t { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin-top: 4px; }
.msheet .m { font-size: 15px; color: var(--ink-2); }
.pill { width: 100%; height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; position: relative; overflow: hidden; border: none; font-family: inherit; }
.pill.red { background: var(--red); color: #FFFFFF; }
.pill.ink { background: var(--ink); color: var(--paper); }
.pill.ghost { background: none; color: var(--ink); height: 44px; font-weight: 500; }
.pill.off { opacity: 0.35; }
.pill.hold { background: none; color: var(--red); box-shadow: inset 0 0 0 1.5px var(--red); touch-action: none; }
.pill.hold .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--red); width: 0; overflow: hidden; z-index: 2; }
.pill.hold .lbl-on { position: absolute; left: 0; top: 0; bottom: 0; width: 354px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; }
.pill.hold .lbl { position: relative; z-index: 1; }
.pill.hold.full { color: #FFFFFF; }
.field { width: 100%; height: 48px; border-radius: 12px; background: var(--paper-2); border: 1px solid var(--rule); padding: 0 14px; font: inherit; font-size: 17px; color: var(--ink); outline: none; margin: 6px 0 4px; }
.theme-dark .field { background: #262626; }
.field::placeholder { color: var(--ink-3); }
.kb { position: absolute; left: 0; right: 0; bottom: 0; height: 290px; background: var(--kb); z-index: 42; padding: 10px 3px 0; display: flex; flex-direction: column; gap: 11px; }
.kb .krow { display: flex; justify-content: center; gap: 6px; }
.kb .k { width: 33px; height: 44px; border-radius: 6px; background: var(--key); color: var(--ink); font-size: 22px; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25); }
.kb .k.wide { width: 190px; font-size: 16px; }
.faceid { position: absolute; left: 50%; top: 50%; width: 156px; height: 156px; transform: translate(-50%, -50%); z-index: 45; border-radius: 30px; background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--ink); font-size: 15px; }
.toast { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 41; background: var(--ink); color: var(--paper); border-radius: 999px; padding: 12px 10px 12px 20px; display: flex; align-items: center; gap: 16px; font-size: 15px; white-space: nowrap; box-shadow: 0 8px 24px var(--shadow); }
.toast b { padding: 4px 12px; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(127, 127, 127, 0.6); }

/* After and welcome */
.center-line { position: absolute; left: 36px; right: 36px; top: 360px; text-align: center; font-size: 22px; font-weight: 600; line-height: 29px; letter-spacing: -0.2px; }
.bottom-btn { position: absolute; left: 24px; right: 24px; bottom: 48px; }
.welcome-mark { position: absolute; left: 0; right: 0; top: 330px; display: flex; justify-content: center; }
.banner { position: absolute; left: 16px; right: 16px; top: 62px; z-index: 5; background: var(--paper-2); border-radius: 18px; padding: 14px 16px; font-size: 15px; line-height: 20px; text-align: center; }
.theme-dark .banner { background: #262626; }
</style>
</head>

  <h1>Settings and Delete</h1>
  <p class="date">2026-10-31</p>
  <div class="picks" id="picks"></div>
  <div id="parts"></div>
</div>

    { key: "after", label: "After", rows: [
      { id: "X1", name: "Own screen, then signed out", words: "“Your account will be deleted within 7 days.” · “OK” → welcome" },
      { id: "X2", name: "Signed out, line on welcome", words: "Welcome + “Your account will be deleted within 7 days.” · “Get Started”" }
    ] }
  ] }
];

let picks = { entry: "E1", layout: "S1", route: "R1", confirm: "C1", account: "A1", after: "X1" };
let steps = { p1: 0, p2: 0, p3: 0, p4: 0 };
let typed = { light: "", dark: "" };

// ---------- Storage (per-viewer convenience only) ----------

function loadPicks() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    const saved = raw ? JSON.parse(raw) : null;
    if (saved) {
      picks = Object.assign(picks, saved);
    }
  } catch (error) {
    // Storage blocked: picks last for this visit
  }
}

function savePicks() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(picks));
  } catch (error) {
    // Storage blocked: picks last for this visit
  }
}

// ---------- Drawing pieces ----------

const ICON_PATHS = {
  check: "M5 12.5l4.5 4.5L19 7.5",
  drop: "M12 3.5c3.5 4.4 6 7.8 6 10.7a6 6 0 0 1-12 0c0-2.9 2.5-6.3 6-10.7z",
  basket: "M4 9h16l-1.6 9.2a1.5 1.5 0 0 1-1.5 1.3H7.1a1.5 1.5 0 0 1-1.5-1.3z M8.5 9l3.5-5 3.5 5",
  leaf: "M5 19c0-8 5-13 14-14 0 9-5 14-13 14z M5 19l8-8",
  gear: "M12 8.8a3.2 3.2 0 1 1 0 6.4 3.2 3.2 0 0 1 0-6.4z M12 2.8v2.6 M12 18.6v2.6 M2.8 12h2.6 M18.6 12h2.6 M5.5 5.5l1.8 1.8 M16.7 16.7l1.8 1.8 M5.5 18.5l1.8-1.8 M16.7 7.3l1.8-1.8",
  chevron: "M9.5 5.5l6.5 6.5-6.5 6.5",
  chevDown: "M7 10l5 5 5-5",
  back: "M15 5l-7 7 7 7",
  pencil: "M14.5 5.5l4 4L9 19H5v-4z M12.5 7.5l4 4",
  trash: "M4.5 7h15 M9.5 7V4.5h5V7 M6.5 7l1 12.5h9l1-12.5 M10 10.5v6 M14 10.5v6",
  dots: "M6 12h.1 M12 12h.1 M18 12h.1",
  faceid: "M4 8V6a2 2 0 0 1 2-2h2 M16 4h2a2 2 0 0 1 2 2v2 M20 16v2a2 2 0 0 1-2 2h-2 M8 20H6a2 2 0 0 1-2-2v-2 M9 9.5v1.5 M15 9.5v1.5 M12 9.5v4h-1 M9 16c1.8 1.4 4.2 1.4 6 0"
};

function icon(name, size, weight) {
  const stroke = weight || 1.8;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + stroke + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + ICON_PATHS[name] + '"/></svg>';
}

// The word in the Midas hand, sized by the font's own scale
function written(word, fontPx, colour) {
  const glyph = GLYPHS[word];
  const box = glyph.box;
  const width = box[2] - box[0];
  const height = box[3] - box[1];
  const scale = fontPx / 1000;
  const viewBox = box[0] + " " + box[1] + " " + width + " " + height;
  return '<svg viewBox="' + viewBox + '" width="' + (width * scale).toFixed(1) + '" height="' + (height * scale).toFixed(1) + '" aria-hidden="true"><path d="' + glyph.d + '" fill="' + colour + '"/></svg>';
}

function themeInk(theme) {
  return theme === "dark" ? "#FFFFFF" : "#111111";
}

function themePaper(theme) {
  return theme === "dark" ? "#111111" : "#FFFFFF";
}

function findSidekick(id) {
  for (const sidekick of SIDEKICKS) {
    if (sidekick.id === id) {
      return sidekick;
    }
  }
  return null;
}

// A Sidekick's tile: Jess and Make are their written word on paper, the rest a palette colour and glyph
function tileHtml(sidekick, size, theme) {
  const radius = (size * 0.225).toFixed(1);
  const sizeStyle = "width:" + size + "px;height:" + size + "px;border-radius:" + radius + "px;";
  if (sidekick.builtIn) {
    const word = written(sidekick.name, size * 0.322, themeInk(theme));
    return '<div class="tile edge" style="' + sizeStyle + "background:" + themePaper(theme) + '">' + word + "</div>";
  }
  const glyph = '<span style="color:' + sidekick.mark + ';display:flex">' + icon(sidekick.glyph, size * 0.5, 2.2) + "</span>";
  return '<div class="tile" style="' + sizeStyle + "background:" + sidekick.colour + '">' + glyph + "</div>";
}

function shownSidekicks(without) {
  const shown = [];
  for (const sidekick of SIDEKICKS) {
    if (without.indexOf(sidekick.id) === -1) {
      shown.push(sidekick);
    }
  }
  return shown;
}

function statusBar(onDark) {
  const darkClass = onDark ? " on-dark" : "";
  return '<div class="island"></div><div class="status' + darkClass + '"><span class="time">9:41</span><span class="icons"><span class="bars"></span><span class="battery"></span></span></div>';
}

function homeBar(onDark) {
  return '<div class="home-bar' + (onDark ? " on-dark" : "") + '"></div>';
}

function goAttr(step) {
  if (step === null || step === undefined) {
    return "";
  }
  return ' data-go="' + step + '"';
}

function tapClass(isTapped) {
  return isTapped ? " tap" : "";
}

// ---------- Home ----------

// The grid's geometry from SidekickHomeGrid.swift: 4 columns, 20 pt sides, 8 pt gaps, 22 pt rows
const GRID_TOP = 104;
const COLUMN_WIDTH = (402 - 40 - 24) / 4;
const ROW_STEP = 60 + 6 + 15 + 22;

function cellPosition(index) {
  const column = index % 4;
  const row = Math.floor(index / 4);
  const left = 20 + column * (COLUMN_WIDTH + 8) + (COLUMN_WIDTH - 84) / 2;
  return { left: left, top: GRID_TOP + row * ROW_STEP };
}

function homeTop(entry, tapEntry, goStep) {
  const go = goAttr(goStep);
  if (entry === "E2") {
    return '<div class="home-title"><span class="' + tapClass(tapEntry) + '"' + go + ">Midas" + icon("chevDown", 14, 2.2) + "</span></div>";
  }
  let html = '<div class="home-title"><span>Midas</span></div>';
  if (entry === "E1") {
    html += '<div class="corner initial' + tapClass(tapEntry) + '"' + go + ">B</div>";
  }
  if (entry === "E4") {
    html += '<div class="corner' + tapClass(tapEntry) + '"' + go + ">" + icon("gear", 22, 1.7) + "</div>";
  }
  return html;
}

function homeScreen(theme, options) {
  const without = options.without || [];
  const sidekicks = shownSidekicks(without);
  let html = statusBar(false) + homeTop(options.entry, options.tapEntry, options.entryGo);
  let lastTop = GRID_TOP;
  for (let index = 0; index < sidekicks.length; index++) {
    const sidekick = sidekicks[index];
    const position = cellPosition(index);
    lastTop = position.top;
    const tapped = options.tapTile === sidekick.id;
    const go = tapped ? goAttr(options.tileGo) : "";
    html += '<div class="cell" style="left:' + position.left + "px;top:" + position.top + 'px"' + go + ">";
    html += '<div class="' + tapClass(tapped).trim() + '">' + tileHtml(sidekick, 60, theme) + "</div>";
    html += '<span class="label">' + sidekick.name + "</span></div>";
  }
  if (options.entry === "E3") {
    const rowTop = lastTop + ROW_STEP + 8;
    html += '<div class="me-row" style="top:' + rowTop + 'px"><span class="' + tapClass(options.tapEntry).trim() + '"' + goAttr(options.entryGo) + '><span class="initial">B</span>' + PERSON + icon("chevron", 14, 2) + "</span></div>";
  }
  return html;
}

// iOS context menu over the home grid for the target tile
function contextMenu(theme, goDelete) {
  const index = SIDEKICKS.indexOf(findSidekick(TARGET));
  const position = cellPosition(index);
  const tileLeft = position.left + 12;
  const menuLeft = Math.min(tileLeft, 402 - 16 - 250);
  let html = '<div class="blur"></div>';
  html += '<div class="lifted" style="left:' + tileLeft + "px;top:" + position.top + 'px">' + tileHtml(findSidekick(TARGET), 60, theme) + "</div>";
  html += '<div class="cmenu" style="left:' + menuLeft + "px;top:" + (position.top + 78) + 'px">';
  html += "<div>Edit" + icon("pencil", 20) + "</div>";
  html += '<div class="danger' + tapClass(true) + '"' + goAttr(goDelete) + ">Delete " + findSidekick(TARGET).name + icon("trash", 20) + "</div>";
  return html + "</div>";
}

// ---------- Settings ----------

function sidekickRow(theme, sidekick, options) {
  const isTarget = sidekick.id === TARGET;
  const mode = options.mode || "plain";
  let rowClass = "r";
  if ((mode === "swipe" || mode === "editOpen") && isTarget) {
    rowClass += " swiped";
  }
  let inner = "";
  if (mode === "edit" || mode === "editOpen") {
    if (sidekick.builtIn) {
      inner += '<span class="minus-gap"></span>';
    } else {
      const open = mode === "editOpen" && isTarget ? " open" : "";
      inner += '<span class="minus' + open + tapClass(mode === "edit" && isTarget) + '"' + (mode === "edit" && isTarget ? goAttr(options.rowGo) : "") + "></span>";
    }
  }
  inner += tileHtml(sidekick, 30, theme) + '<span class="nm">' + sidekick.name + "</span>";
  if (options.route === "R4" && !sidekick.builtIn) {
    const tapDots = options.tapDots && isTarget;
    inner += '<span class="trail' + tapClass(tapDots) + '"' + (tapDots ? goAttr(options.rowGo) : "") + ' style="color:var(--ink-2)">' + icon("dots", 22, 3) + "</span>";
  }
  const tapRow = options.tapRow && isTarget;
  let html = '<div class="' + rowClass + (options.edgeClass || "") + '">';
  if ((mode === "swipe" || mode === "editOpen") && isTarget) {
    html += '<div class="swipe-del' + tapClass(true) + '"' + goAttr(options.deleteGo) + ">Delete</div>";
  }
  html += '<div class="r-in' + tapClass(tapRow) + '"' + (tapRow ? goAttr(options.rowGo) : "") + ">" + inner + "</div>";
  return html + "</div>";
}

// The row's ⋯ menu sits outside the row, which clips its own swipe
function rowMenu(sidekicks, options) {
  const index = sidekicks.indexOf(findSidekick(TARGET));
  let html = '<div class="row-menu" style="top:' + (index * 52 + 44) + 'px"><div>Edit' + icon("pencil", 18) + "</div>";
  html += '<div class="danger' + tapClass(true) + '"' + goAttr(options.deleteGo) + ">Delete " + findSidekick(TARGET).name + icon("trash", 18) + "</div></div>";
  return html;
}

function sidekickRows(theme, options) {
  const sidekicks = shownSidekicks(options.without || []);
  let html = '<div class="rows-wrap">';
  for (let index = 0; index < sidekicks.length; index++) {
    let edgeClass = "";
    if (index === 0) {
      edgeClass += " first";
    }
    if (index === sidekicks.length - 1) {
      edgeClass += " last";
    }
    const rowOptions = Object.assign({}, options, { edgeClass: edgeClass });
    html += sidekickRow(theme, sidekicks[index], rowOptions);
  }
  if (options.mode === "menu") {
    html += rowMenu(sidekicks, options);
  }
  return html + "</div>";
}

function sectionLabel(options, plain) {
  let right = "";
  if (options.route === "R3") {
    const editing = options.mode === "edit" || options.mode === "editOpen";
    const word = editing ? "Done" : "Edit";
    const tapped = options.tapEdit && !editing;
    right = '<b class="' + tapClass(tapped).trim() + '"' + (tapped ? goAttr(options.rowGo) : "") + ">" + word + "</b>";
  }
  return '<div class="sec-label' + (plain ? " plain" : "") + '"><span>Sidekicks</span>' + right + "</div>";
}

function deleteAccountAttrs(options) {
  return tapClass(options.tapDelete) + '"' + (options.tapDelete ? goAttr(options.deleteAccountGo) : "");
}

function settingsS1(theme, options) {
  let html = '<div class="sheet-back"></div><div class="sheet-peek"></div>';
  html += '<div class="sheet-page" style="background:var(--group)">';
  html += '<div class="nav-done">Done</div>';
  html += '<div class="profile" style="padding-top:56px"><div class="avatar" style="width:72px;height:72px;font-size:30px;background:var(--card)">B</div><div class="who-name">' + PERSON + "</div></div>";
  html += '<div style="height:26px"></div>' + sectionLabel(options, false);
  html += '<div class="group visible">' + sidekickRows(theme, options) + "</div>";
  html += '<div class="group" style="margin-top:28px"><div class="act">Sign Out</div></div>';
  html += '<div class="group" style="margin-top:16px"><div class="act danger' + deleteAccountAttrs(options) + ">Delete Account</div></div>";
  return html + "</div>" + statusBar(true);
}

function settingsS2(theme, options) {
  let html = '<div class="push-page">';
  html += '<div class="nav-back">' + icon("back", 24, 2.2) + "</div>";
  html += '<div style="position:absolute;top:104px;left:20px;display:flex;align-items:center;gap:12px"><div class="avatar" style="width:44px;height:44px;font-size:19px">B</div><div class="big-name">' + PERSON + "</div></div>";
  html += '<div style="position:absolute;top:184px;left:0;right:0">' + sectionLabel(options, true);
  html += '<div class="plain-list" style="--row-bg:var(--paper);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)">' + sidekickRows(theme, options) + "</div>";
  html += '<div style="height:34px"></div><div style="border-top:1px solid var(--rule)"><div class="act" style="padding-left:20px">Sign Out</div></div>';
  html += '<div style="border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)"><div class="act danger' + deleteAccountAttrs(options) + ' style="padding-left:20px">Delete Account</div></div>';
  html += "</div></div>";
  return html + statusBar(false);
}

function settingsS3(theme, options) {
  let html = '<div class="sheet-back"></div><div class="sheet-peek"></div><div class="sheet-page" style="background:var(--sheet)">';
  html += '<div style="display:flex;align-items:center;gap:12px;padding:30px 20px 0"><div class="avatar" style="width:52px;height:52px;font-size:22px">B</div><div class="who-name" style="flex:1">' + PERSON + '</div><span class="chip-btn">Sign Out</span></div>';
  html += '<div style="height:30px"></div>' + sectionLabel(options, true);
  html += '<div class="plain-list" style="--row-bg:var(--sheet)">' + sidekickRows(theme, options) + "</div>";
  html += '<div class="text-link" style="bottom:56px;color:var(--red)"><span class="' + deleteAccountAttrs(options) + ">Delete Account</span></div>";
  return html + "</div>" + statusBar(true);
}

function settingsScreen(theme, options) {
  const layout = options.layout || picks.layout;
  if (layout === "S2") {
    return settingsS2(theme, options);
  }
  if (layout === "S3") {
    return settingsS3(theme, options);
  }
  return settingsS1(theme, options);
}

// ---------- Confirmations ----------

function actionSheet(title, line, destructive, goDelete, goCancel) {
  let html = '<div class="dim"></div><div class="asheet"><div class="blk"><div class="head"><div class="t">' + title + "</div>";
  if (line) {
    html += '<div class="m">' + line + "</div>";
  }
  html += '</div><div class="b danger' + tapClass(true) + '"' + goAttr(goDelete) + ">" + destructive + "</div></div>";
  html += '<div class="blk"><div class="b first cancel"' + goAttr(goCancel) + ">Cancel</div></div></div>";
  return html;
}

function alertCard(title, line, destructive, stacked, goDelete, goCancel) {
  let html = '<div class="dim"></div><div class="alert"><div class="head"><div class="t">' + title + "</div>";
  if (line) {
    html += '<div class="m">' + line + "</div>";
  }
  const deleteButton = '<div class="danger' + tapClass(true) + '"' + goAttr(goDelete) + ">" + destructive + "</div>";
  const cancelButton = "<div" + goAttr(goCancel) + ">Cancel</div>";
  if (stacked) {
    html += '</div><div class="btns stack">' + deleteButton + cancelButton + "</div></div>";
  } else {
    html += '</div><div class="btns">' + cancelButton + deleteButton + "</div></div>";
  }
  return html;
}

function midasSheet(theme, top, title, line, buttonHtml, goCancel) {
  let html = '<div class="dim"></div><div class="msheet"><div class="grab"></div>' + top;
  html += '<div class="t">' + title + "</div>";
  if (line) {
    html += '<div class="m">' + line + "</div>";
  }
  html += '<div style="height:12px"></div>' + buttonHtml + '<div class="pill ghost"' + goAttr(goCancel) + ">Cancel</div></div>";
  return html;
}

function sidekickConfirm(theme, variant, goDelete, goCancel) {
  const name = findSidekick(TARGET).name;
  const title = "Delete " + name + "?";
  const line = "Its data goes too.";
  if (variant === "C2") {
    return alertCard(title, line, "Delete", false, goDelete, goCancel);
  }
  if (variant === "C3") {
    const button = '<div class="pill red' + tapClass(true) + '"' + goAttr(goDelete) + ">Delete</div>";
    return midasSheet(theme, tileHtml(findSidekick(TARGET), 60, theme), title, line, button, goCancel);
  }
  return actionSheet(title, line, "Delete", goDelete, goCancel);
}

function undoToast() {
  return '<div class="toast">Deleted ' + findSidekick(TARGET).name + "<b>Undo</b></div>";
}

// ---------- Delete Account pieces ----------

const ACCOUNT_TITLE = "Delete Account?";
const ACCOUNT_LINE = "All Sidekicks and data go too.";
const AFTER_LINE = "Your account will be deleted within 7 days.";

function keyboard() {
  const letterRows = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];
  let html = '<div class="kb">';
  for (const letters of letterRows) {
    html += '<div class="krow">';
    for (const letter of letters) {
      html += '<span class="k">' + letter + "</span>";
    }
    html += "</div>";
  }
  return html + '<div class="krow"><span class="k wide">space</span></div></div>';
}

function typeSheet(theme, filled, goDelete, goCancel) {
  const value = filled ? PERSON : typed[theme];
  const matches = value.trim().toLowerCase() === PERSON.toLowerCase();
  let html = '<div class="dim"></div><div class="msheet" style="bottom:290px;border-radius:30px;left:8px;right:8px;padding-bottom:20px"><div class="grab"></div>';
  html += '<div class="t">' + ACCOUNT_TITLE + '</div><div class="m">Type ' + PERSON + " to delete.</div>";
  html += '<input class="field type-field" data-theme="' + theme + '" placeholder="' + PERSON + '" value="' + value + '" autocomplete="off" spellcheck="false">';
  html += '<div class="pill red type-go' + (matches ? tapClass(filled) : " off") + '"' + goAttr(goDelete) + ">Delete Account</div>";
  html += '<div class="pill ghost"' + goAttr(goCancel) + ">Cancel</div></div>";

function holdSheet(theme, fraction, goCancel) {
  const full = fraction >= 1 ? " full" : "";
  const button = '<div class="pill hold' + full + '" data-hold="' + theme + '"><span class="fill" style="width:' + Math.round(fraction * 100) + '%"><span class="lbl-on">Hold to Delete</span></span><span class="lbl">Hold to Delete</span></div>';
  return midasSheet(theme, "", ACCOUNT_TITLE, ACCOUNT_LINE, button, goCancel);
}

function faceIdOverlay() {
  return '<div class="faceid">' + icon("faceid", 64, 1.5) + "<span>Face ID</span></div>";
}

function welcomeScreen(theme, withLine) {
  let html = statusBar(false);
  if (withLine) {
    html += '<div class="banner">' + AFTER_LINE + "</div>";
  }
  html += '<div class="welcome-mark">' + written("Midas", 120, themeInk(theme)) + "</div>";
  html += '<div class="bottom-btn"><div class="pill ink">Get Started</div></div>';

}

function afterScreen(theme, goNext) {
  let html = statusBar(false) + '<div class="center-line">' + AFTER_LINE + "</div>";

// ---------- Steps per part ----------

function stepsPart1() {
  function drawHome(theme) {
    return homeScreen(theme, { entry: picks.entry, tapEntry: true, entryGo: 1 }) + homeBar(false);
  }
  function drawSettings(theme) {
    return settingsScreen(theme, { layout: picks.layout }) + homeBar(false);
  }
  return [{ label: "Home", draw: drawHome }, { label: "Settings", draw: drawSettings }];
}

function stepsPart2() {
  function drawSettings(theme) {
    return settingsScreen(theme, {}) + homeBar(false);
  }
  return [{ label: "Settings", draw: drawSettings }];
}

// Where the delete starts (home or Settings), shown under the confirmation
function routeBase(theme, stage, confirmStep) {
  const route = picks.route;
  if (route === "R1") {
    if (stage === "start") {
      return homeScreen(theme, { entry: picks.entry, tapTile: TARGET, tileGo: 1 }) + homeBar(false);
    }
    if (stage === "open") {
      return homeScreen(theme, { entry: picks.entry }) + contextMenu(theme, confirmStep) + homeBar(false);
    }
    if (stage === "gone") {
      return homeScreen(theme, { entry: picks.entry, without: [TARGET] }) + homeBar(false);
    }
    return homeScreen(theme, { entry: picks.entry }) + homeBar(false);
  }
  const options = { route: route, rowGo: 1, deleteGo: confirmStep };
  if (stage === "start") {
    if (route === "R2") {
      options.tapRow = true;
    }
    if (route === "R3") {
      options.tapEdit = true;
    }
    if (route === "R4") {
      options.tapDots = true;
    }
  }
  if (stage === "open") {
    const openModes = { R2: "swipe", R3: "editOpen", R4: "menu" };
    options.mode = openModes[route];
  }
  if (stage === "gone") {
    options.without = [TARGET];
  }
  return settingsScreen(theme, options) + homeBar(false);
}

function stepsPart3() {
  const openLabels = { R1: "Menu", R2: "Swipe", R3: "Edit", R4: "Menu" };
  const usesUndo = picks.confirm === "C4";
  const confirmStep = usesUndo ? 2 : 2;
  function drawStart(theme) {
    return routeBase(theme, "start", confirmStep);
  }
  function drawOpen(theme) {
    return routeBase(theme, "open", confirmStep);
  }
  function drawConfirm(theme) {
    return routeBase(theme, "base", confirmStep) + sidekickConfirm(theme, picks.confirm, 3, 0);
  }
  function drawGone(theme) {
    return routeBase(theme, "gone", confirmStep);
  }
  function drawGoneWithUndo(theme) {
    return routeBase(theme, "gone", confirmStep) + undoToast();
  }
  const list = [{ label: "Start", draw: drawStart }, { label: openLabels[picks.route], draw: drawOpen }];
  if (usesUndo) {
    list.push({ label: "Deleted", draw: drawGoneWithUndo });
  } else {
    list.push({ label: "Confirm", draw: drawConfirm });
    list.push({ label: "Deleted", draw: drawGone });
  }
  return list;
}

function stepsPart4() {
  const variant = picks.account;
  function settingsBase(theme, tapped, goStep) {
    return settingsScreen(theme, { tapDelete: tapped, deleteAccountGo: goStep }) + homeBar(false);
  }
  const list = [];
  function drawStart(theme) {
    return settingsBase(theme, true, 1);
  }
  list.push({ label: "Settings", draw: drawStart });
  // Steps after the confirmation are counted from here
  const confirmIndex = 1;
  const extraSteps = variant === "A1" ? 0 : 1;
  const afterIndex = confirmIndex + 1 + extraSteps;
  function drawConfirm(theme) {
    if (variant === "A2") {
      return settingsBase(theme, false) + typeSheet(theme, false, afterIndex, 0);
    }
    if (variant === "A3") {
      return settingsBase(theme, false) + actionSheet(ACCOUNT_TITLE, ACCOUNT_LINE, "Delete Account", 2, 0);
    }
    if (variant === "A4") {
      return settingsBase(theme, false) + holdSheet(theme, 0, 0);
    }
    return settingsBase(theme, false) + alertCard(ACCOUNT_TITLE, ACCOUNT_LINE, "Delete Account", true, afterIndex, 0);
  }
  list.push({ label: "Confirm", draw: drawConfirm });
  function drawExtra(theme) {
    if (variant === "A2") {
      return settingsBase(theme, false) + typeSheet(theme, true, afterIndex, 0);
    }
    if (variant === "A3") {
      return settingsBase(theme, false) + '<div class="dim"></div>' + faceIdOverlay();
    }
    return settingsBase(theme, false) + holdSheet(theme, 0.6, 0);
  }
  const extraLabels = { A2: "Typed", A3: "Face ID", A4: "Holding" };
  if (extraSteps) {
    list.push({ label: extraLabels[variant], draw: drawExtra });
  }
  function drawAfter(theme) {
    return afterScreen(theme, afterIndex + 1) + homeBar(false);
  }
  function drawWelcome(theme) {
    return welcomeScreen(theme, picks.after === "X2") + homeBar(false);
  }
  if (picks.after === "X1") {
    list.push({ label: "After", draw: drawAfter });
  }
  list.push({ label: "Signed Out", draw: drawWelcome });
  return list;
}

const STEP_BUILDERS = { p1: stepsPart1, p2: stepsPart2, p3: stepsPart3, p4: stepsPart4 };

// ---------- Page ----------

function pickRowsHtml(part) {
  let html = '<div class="rows">';
  for (const group of part.groups) {
    if (group.label) {
      html += "<h3>" + group.label + "</h3>";
    }
    for (const row of group.rows) {
      const pressed = picks[group.key] === row.id ? "true" : "false";
      html += '<button class="pick-row" type="button" aria-pressed="' + pressed + '" data-group="' + group.key + '" data-pick="' + row.id + '" data-part="' + part.key + '">';
      html += '<span class="pick-id">' + row.id + '</span><span><div class="pick-name">' + row.name + '</div><div class="pick-words">' + row.words + "</div></span></button>";
    }
  }
  return html + "</div>";
}

function phoneHtml(theme, innerHtml) {
  return '<div class="frame"><div class="frame-inner"><div class="phone theme-' + theme + '"><div class="screen">' + innerHtml + "</div></div></div></div>";
}

function stageHtml(part) {
  const list = STEP_BUILDERS[part.key]();
  if (steps[part.key] >= list.length) {
    steps[part.key] = list.length - 1;
  }
  const current = list[steps[part.key]];
  let html = '<div class="stage">';
  if (list.length > 1) {
    html += '<div class="steps">';
    for (let index = 0; index < list.length; index++) {
      const pressed = index === steps[part.key] ? "true" : "false";
      html += '<button class="step-btn" type="button" aria-pressed="' + pressed + '" data-step="' + index + '" data-part="' + part.key + '">' + (index + 1) + " " + list[index].label + "</button>";
    }
    html += "</div>";
  }
  html += '<div class="phones" data-part="' + part.key + '">' + phoneHtml("light", current.draw("light")) + phoneHtml("dark", current.draw("dark")) + "</div>";
  return html + "</div>";
}

function partHtml(part) {
  let html = '<section id="' + part.key + '"><div><h2><small>' + part.num + "</small>" + part.title + "</h2>" + pickRowsHtml(part) + "</div>";
  return html + '<div id="stage-' + part.key + '">' + stageHtml(part) + "</div></section>";
}

function renderPicksBar() {
  const order = ["entry", "layout", "route", "confirm", "account", "after"];
  let html = "<b>Picks</b>";
  for (const key of order) {
    html += '<span class="pick-chip">' + picks[key] + "</span>";
  }
  document.getElementById("picks").innerHTML = html;
}

function renderAll() {
  let html = "";
  for (const part of PARTS) {
    html += partHtml(part);
  }
  document.getElementById("parts").innerHTML = html;
  renderPicksBar();
}

// ---------- Interaction ----------

function handlePageClick(event) {
  const pickButton = event.target.closest("[data-pick]");
  if (pickButton) {
    picks[pickButton.dataset.group] = pickButton.dataset.pick;
    steps[pickButton.dataset.part] = 0;
    typed = { light: "", dark: "" };
    savePicks();
    renderAll();
    return;
  }
  const stepButton = event.target.closest("[data-step]");
  if (stepButton) {
    steps[stepButton.dataset.part] = Number(stepButton.dataset.step);
    renderAll();
    return;
  }
  const goTarget = event.target.closest("[data-go]");
  if (goTarget && !goTarget.classList.contains("off")) {
    const phones = goTarget.closest(".phones");
    steps[phones.dataset.part] = Number(goTarget.dataset.go);
    renderAll();
  }
}

// Typing the name turns the button on without redrawing (keeps the caret in the field)
function handleTyping(event) {
  const field = event.target;
  if (!field.classList.contains("type-field")) {
    return;
  }
  const theme = field.dataset.theme;
  typed[theme] = field.value;
  const sheet = field.closest(".msheet");
  const button = sheet.querySelector(".type-go");
  const matches = field.value.trim().toLowerCase() === PERSON.toLowerCase();
  button.classList.toggle("off", !matches);
}

const HOLD_MS = 1500;
let holdState = null;

function holdFrame(now) {
  if (!holdState) {
    return;
  }
  const fraction = Math.min(1, (now - holdState.start) / HOLD_MS);
  holdState.fill.style.width = Math.round(fraction * 100) + "%";
  if (fraction >= 1) {
    holdState.button.classList.add("full");
    const part = holdState.part;
    const lastIndex = STEP_BUILDERS[part]().length - (picks.after === "X1" ? 2 : 1);
    holdState = null;
    steps[part] = lastIndex;
    window.setTimeout(renderAll, 250);
    return;
  }
  holdState.frame = requestAnimationFrame(holdFrame);
}

function handleHoldStart(event) {
  const button = event.target.closest("[data-hold]");
  if (!button) {
    return;
  }
  event.preventDefault();
  const phones = button.closest(".phones");
  holdState = { button: button, fill: button.querySelector(".fill"), part: phones.dataset.part, start: performance.now() };
  holdState.frame = requestAnimationFrame(holdFrame);
}

function handleHoldEnd() {
  if (!holdState) {
    return;
  }
  cancelAnimationFrame(holdState.frame);
  holdState.fill.style.width = "0%";
  holdState = null;
}

loadPicks();
renderAll();
document.addEventListener("click", handlePageClick);
document.addEventListener("input", handleTyping);
document.addEventListener("pointerdown", handleHoldStart);
document.addEventListener("pointerup", handleHoldEnd);
document.addEventListener("pointercancel", handleHoldEnd);
</script>
