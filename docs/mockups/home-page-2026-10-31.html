<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Page Prototypes</title>
<style>
/* Mockup chrome: light, like the other docs/mockups pages. Each frame carries its own theme. */
:root {
  --page: #FAFAFA;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", sans-serif;
  --phone-scale: 0.6;
  --desk-scale: 0.42;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: #111111; font-family: var(--font); -webkit-font-smoothing: antialiased; }
.page { max-width: 1680px; margin: 0 auto; padding: 0 24px 96px; }
h1 { font-size: 28px; margin: 28px 0 0; letter-spacing: -0.4px; }
.date { color: #6B6B6B; font-size: 14px; margin: 4px 0 0; }

.picks { position: sticky; top: 0; z-index: 40; background: rgba(250, 250, 250, 0.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid rgba(17, 17, 17, 0.12); margin: 0 -24px; padding: 10px 24px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 15px; }
.picks b { margin-right: 4px; }
.pick-chip { font-size: 13px; font-weight: 700; border: 1.5px solid #111111; border-radius: 999px; padding: 3px 10px; }
.pick-chip.empty { border-color: rgba(17, 17, 17, 0.2); color: #6B6B6B; font-weight: 600; }

.rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; margin-top: 18px; }
.pick-row { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; background: #FFFFFF; border: 1.5px solid rgba(17, 17, 17, 0.12); border-radius: 16px; padding: 10px 14px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.pick-row:hover { border-color: #6B6B6B; }
.pick-row[aria-pressed="true"] { border-color: #111111; box-shadow: 0 0 0 1.5px #111111; }
.pick-id { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.pick-name { font-size: 15px; font-weight: 600; }
.pick-words { font-size: 12.5px; color: #6B6B6B; margin-top: 2px; line-height: 17px; }

section.proto { margin-top: 56px; scroll-margin-top: 64px; }
.proto-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.proto-head h2 { font-size: 22px; margin: 0; letter-spacing: -0.3px; }
.proto-head h2 small { color: #6B6B6B; font-weight: 700; margin-right: 8px; }
.proto-note { color: #6B6B6B; font-size: 14px; margin: 6px 0 0; max-width: 760px; }
.proto-actions { margin-left: auto; display: flex; gap: 8px; }
.btn { font: inherit; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #111111; border: 1px solid rgba(17, 17, 17, 0.14); border-radius: 999px; padding: 6px 12px; cursor: pointer; text-decoration: none; }
.btn.on { background: #111111; color: #FFFFFF; border-color: #111111; }

.frames { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; margin-top: 16px; }
.frame-label { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: #6B6B6B; text-transform: uppercase; margin-bottom: 8px; }

/* Phone: iPhone 16 Pro, 402 x 874 pt */
.phone-box { width: calc(402px * var(--phone-scale) + 16px); height: calc(874px * var(--phone-scale) + 16px); position: relative; }
.phone { position: absolute; left: 8px; top: 8px; width: 402px; height: 874px; transform: scale(var(--phone-scale)); transform-origin: top left; border-radius: 56px; overflow: hidden; background: #000000; box-shadow: 0 0 0 10px #111111, 0 20px 50px rgba(0, 0, 0, 0.18); }
.phone iframe { position: absolute; left: 0; top: 54px; width: 402px; height: 820px; border: 0; }
.phone .bar { position: absolute; left: 0; right: 0; top: 0; height: 54px; }
.phone .island { position: absolute; top: 11px; left: 50%; width: 126px; height: 37px; margin-left: -63px; background: #000000; border-radius: 19px; }

/* Desktop: a 1440 x 900 browser window */
.desk-box { width: calc(1440px * var(--desk-scale)); height: calc(940px * var(--desk-scale)); position: relative; }
.desk { position: absolute; left: 0; top: 0; width: 1440px; height: 940px; transform: scale(var(--desk-scale)); transform-origin: top left; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 2px rgba(17, 17, 17, 0.14), 0 20px 50px rgba(0, 0, 0, 0.14); background: #FFFFFF; }
.desk .chrome { height: 40px; background: #ECECEC; display: flex; align-items: center; gap: 10px; padding: 0 16px; }
.desk .chrome i { width: 13px; height: 13px; border-radius: 50%; background: #C8C8C8; display: block; }
.desk .chrome .url { margin-left: 80px; flex: 0 1 520px; height: 26px; border-radius: 8px; background: #FFFFFF; color: #6B6B6B; font-size: 14px; display: flex; align-items: center; padding: 0 12px; }
.desk.dark-chrome { background: #111111; }
.desk.dark-chrome .chrome { background: #2A2A2A; }
.desk.dark-chrome .chrome i { background: #555555; }
.desk.dark-chrome .chrome .url { background: #1C1C1C; color: #A3A3A3; }
.desk iframe { width: 1440px; height: 900px; border: 0; display: block; }
.placeholder-frame { background: repeating-linear-gradient(45deg, rgba(17,17,17,0.04) 0 10px, transparent 10px 20px); }

@media (max-width: 700px) {
  :root { --phone-scale: 0.5; --desk-scale: 0.22; }
}
</style>
</head>
<body>
<div class="page">
  <h1>Home Page</h1>
  <p class="date">2026-10-31 · midas website · six prototypes, phone and desktop, light and dark · tap inside a frame to try it</p>

  <div class="picks" id="picks"><b>Picked</b><span class="pick-chip empty" id="pickedChip">none</span></div>

  <div class="rows" id="rows"></div>
  <div id="protos"></div>
</div>

<script>
// The eight tile colours (docs/DESIGN.md 2.3) on eight example Sidekicks; mark = ink or paper per tile.
const SIDEKICKS = [
  { name: "Reminders", colour: "#FF6347", mark: "#FFFFFF", glyph: "bell" },
  { name: "Water", colour: "#30D5C8", mark: "#111111", glyph: "drop" },
  { name: "Habits", colour: "#FFE600", mark: "#111111", glyph: "ring" },
  { name: "Money", colour: "#C9F24D", mark: "#111111", glyph: "card" },
  { name: "To-Do", colour: "#9CAF88", mark: "#111111", glyph: "check" },
  { name: "Study", colour: "#FFBF00", mark: "#111111", glyph: "book" },
  { name: "Meds", colour: "#C41E3A", mark: "#FFFFFF", glyph: "pill" },
  { name: "Sleep", colour: "#2E2E2E", mark: "#FFFFFF", glyph: "moon" },
];

const GLYPHS = {
  bell: '<path d="M12 3.5a5 5 0 0 0-5 5v3.8L5.2 15.5h13.6L17 12.3V8.5a5 5 0 0 0-5-5z"/><path d="M10 18.5a2 2 0 0 0 4 0"/>',
  drop: '<path d="M12 3.5C9.2 8 6.5 11 6.5 14.5a5.5 5.5 0 0 0 11 0C17.5 11 14.8 8 12 3.5z"/>',
  ring: '<circle cx="12" cy="12" r="7"/>',
  card: '<rect x="3.5" y="6" width="17" height="12" rx="2.2"/><path d="M3.5 10h17"/>',
  check: '<path d="M5.5 12.5l4.2 4.2L18.5 7.5"/>',
  book: '<path d="M4 5.5h5.5A2.5 2.5 0 0 1 12 8v11a2 2 0 0 0-2-2H4z"/><path d="M20 5.5h-5.5A2.5 2.5 0 0 0 12 8v11a2 2 0 0 1 2-2h6z"/>',
  pill: '<rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-40 12 12)"/><path d="M9.6 9.1l4.8 5.8"/>',
  moon: '<path d="M18.5 14.5A7.5 7.5 0 0 1 9.5 5.5a7 7 0 1 0 9 9z"/>',
};

// The hand, drawn once for Midas: an index finger pointing right, tip at (0, 0), arm to the left.
const HAND_PATHS = [
  "M -640 -96 C -500 -104, -380 -88, -300 -66 C -250 -52, -200 -46, -160 -42 C -120 -38, -90 -26, -70 -20 C -50 -14, -30 -10, -14 -8 C -2 -7, 4 -2, 3 4 C 2 10, -6 12, -16 11 C -36 10, -56 10, -76 12",
  "M -76 12 C -66 20, -60 34, -62 48 C -63 58, -72 62, -80 58 C -88 52, -94 38, -100 26",
  "M -100 26 C -96 42, -94 58, -98 70 C -101 79, -111 80, -116 74 C -122 64, -126 50, -128 38",
  "M -128 38 C -126 52, -126 66, -130 74 C -134 82, -144 81, -147 74 C -150 64, -152 54, -156 46",
  "M -156 46 C -170 54, -190 58, -215 56 C -245 54, -270 46, -300 40 C -400 26, -500 34, -640 50",
  "M -204 -6 C -184 0, -162 5, -140 8 C -122 10, -114 15, -118 21 C -122 27, -134 27, -150 25 C -172 22, -192 20, -210 21",
];
const HAND_DETAILS = [
  "M -112 -34 q 8 -4 16 0",
  "M -12 -5 C -6 -4, -3 -1, -3 3",
];
// Longer arm, for hands that reach in from far off the page.
const ARM_EXTENSION = [
  "M -640 -96 C -820 -88, -1500 -60, -2800 -20",
  "M -640 50 C -820 68, -1500 110, -2800 160",
];

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// Transform that puts the fingertip at (x, y), pointing at `angle` degrees.
// `flip` mirrors the hand so the curled fingers fall on the other side of the finger.
function handTransform(x, y, angle, scale, flip) {
  const flipScale = flip ? -scale : scale;
  return `translate(${x} ${y}) rotate(${angle}) scale(${scale} ${flipScale})`;
}

// SVG markup for one hand. `fixedStroke` keeps the ink line the same width at any size.
function handMarkup(options) {
  const fixed = options.fixedStroke === false ? "" : ' vector-effect="non-scaling-stroke"';
  const measured = options.measured ? ' pathLength="1"' : "";
  const mainPaths = options.longArm ? HAND_PATHS.concat(ARM_EXTENSION) : HAND_PATHS;
  let markup = `<g class="ink" transform="${options.transform}">`;
  for (const pathData of mainPaths) {
    markup += `<path d="${pathData}"${fixed}${measured}/>`;
  }
  for (const pathData of HAND_DETAILS) {
    markup += `<path d="${pathData}"${fixed}${measured} style="stroke-width: calc(var(--line) * 0.6)"/>`;
  }
  return markup + "</g>";
}

function glyphMarkup(sidekick) {
  return `<svg viewBox="0 0 24 24" style="stroke:${sidekick.mark}">${GLYPHS[sidekick.glyph]}</svg>`;
}

function tileMarkup(sidekick) {
  return `<div class="tile" style="background:${sidekick.colour}">${glyphMarkup(sidekick)}</div>`;
}

// Where a point in an SVG's own coordinates lands on the page.
function svgPointToClient(svg, x, y) {
  const matrix = svg.getScreenCTM();
  const point = new DOMPoint(x, y);
  return point.matrixTransform(matrix);
}

function isNarrow() {
  return window.innerWidth < 700;
}
</script>

  { id: "H6", name: "One line", note: "The hands draw themselves in one ink line; a Sidekick tile sits in the gap, changing colour." },
];
const PICK_KEY = "midas-home-page-pick-2026-10-31";

// The full page for one prototype. theme: "light", "dark" or "auto" (follows the device).
function buildSiteDocument(prototypeId, theme) {
  const common = document.getElementById("site-common").innerHTML;
  const body = document.getElementById("site-" + prototypeId).innerHTML;
  const themeAttribute = theme === "auto" ? "" : ` data-theme="${theme}"`;
  return `<!doctype html><html lang="en"${themeAttribute}><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Midas</title></head><body>${common}${body}</body></html>`;
}

// "#site=H3" shows that prototype alone, full size, theme from the device.
function siteFromHash() {
  const match = location.hash.match(/^#site=(H[1-6])$/);
  return match ? match[1] : "";
}

// Replace the whole document once this one has loaded (a write while parsing would append).
function replaceWithSite() {
  const html = buildSiteDocument(siteFromHash(), "auto");
  document.open();
  document.write(html);
  document.close();
}

function readPick() {
  try {
    return localStorage.getItem(PICK_KEY) || "";
  } catch (error) {
    return "";
  }
}

function savePick(prototypeId) {
  try {
    localStorage.setItem(PICK_KEY, prototypeId);
  } catch (error) {
    // Private window: the pick lasts only for this visit
  }
}

function showPick(prototypeId) {
  const chip = document.getElementById("pickedChip");
  chip.textContent = prototypeId || "none";
  chip.classList.toggle("empty", !prototypeId);
  const rows = document.querySelectorAll(".pick-row");
  for (const row of rows) {
    row.setAttribute("aria-pressed", String(row.dataset.id === prototypeId));
  }
}

function handlePickClick(event) {
  const row = event.currentTarget;
  savePick(row.dataset.id);
  showPick(row.dataset.id);
  const section = document.getElementById("proto-" + row.dataset.id);
  section.scrollIntoView({ behavior: "smooth", block: "start" });
}

function buildRows() {
  const rows = document.getElementById("rows");
  for (const prototype of PROTOTYPES) {
    const row = document.createElement("button");
    row.className = "pick-row";
    row.dataset.id = prototype.id;
    row.innerHTML = `<span class="pick-id">${prototype.id}</span><span><div class="pick-name">${prototype.name}</div><div class="pick-words">${prototype.note}</div></span>`;
    row.addEventListener("click", handlePickClick);
    rows.appendChild(row);
  }
}

function phoneFrame(prototypeId, theme) {
  const background = theme === "dark" ? "#111111" : "#FFFFFF";
  return `<div><div class="frame-label">Phone · ${theme}</div><div class="phone-box"><div class="phone" style="background:${background}"><div class="bar"><div class="island"></div></div><iframe class="placeholder-frame" data-proto="${prototypeId}" data-theme="${theme}" title="${prototypeId} phone ${theme}"></iframe></div></div></div>`;
}

function desktopFrame(prototypeId, theme) {
  const chromeClass = theme === "dark" ? " dark-chrome" : "";
  return `<div><div class="frame-label">Desktop · ${theme}</div><div class="desk-box"><div class="desk${chromeClass}"><div class="chrome"><i></i><i></i><i></i><div class="url">midas</div></div><iframe class="placeholder-frame" data-proto="${prototypeId}" data-theme="${theme}" title="${prototypeId} desktop ${theme}"></iframe></div></div></div>`;
}

function buildSections() {
  const holder = document.getElementById("protos");
  for (const prototype of PROTOTYPES) {
    const section = document.createElement("section");
    section.className = "proto";
    section.id = "proto-" + prototype.id;
    const head = `<div class="proto-head"><h2><small>${prototype.id}</small>${prototype.name}</h2><div class="proto-actions"><a class="btn" href="#site=${prototype.id}" target="_blank">Full Size</a></div></div><p class="proto-note">${prototype.note}</p>`;
    const frames = phoneFrame(prototype.id, "light") + phoneFrame(prototype.id, "dark") + desktopFrame(prototype.id, "light") + desktopFrame(prototype.id, "dark");
    section.innerHTML = head + `<div class="frames">${frames}</div>`;
    holder.appendChild(section);
  }
}

// Frames load when they come near the screen, so 24 running pages don't start at once.
function loadFrame(frame) {
  if (frame.dataset.loaded) {
    return;
  }
  frame.dataset.loaded = "1";
  frame.classList.remove("placeholder-frame");
  frame.srcdoc = buildSiteDocument(frame.dataset.proto, frame.dataset.theme);
}

function handleFramesVisible(entries) {
  for (const entry of entries) {
    if (entry.isIntersecting) {
      loadFrame(entry.target);
    }
  }
}

function watchFrames() {
  const frames = document.querySelectorAll("iframe[data-proto]");
  if (!("IntersectionObserver" in window)) {
    for (const frame of frames) {
      loadFrame(frame);
    }
    return;
  }
  const observer = new IntersectionObserver(handleFramesVisible, { rootMargin: "400px" });
  for (const frame of frames) {
    observer.observe(frame);
  }
}

function reloadOnSiteHash() {
  if (location.hash.startsWith("#site=")) {
    location.reload();
  }
}

if (siteFromHash()) {
  document.body.style.visibility = "hidden";
  window.addEventListener("load", replaceWithSite);
} else {
  buildRows();
  buildSections();
  showPick(readPick());
  watchFrames();
  window.addEventListener("hashchange", reloadOnSiteHash);
}
</script>
</body>
</html>
