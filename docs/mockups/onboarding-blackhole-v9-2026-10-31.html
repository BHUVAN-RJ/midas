/* Midas tokens, docs/DESIGN.md 2.1 and 2.4. Page chrome is light; the phone carries the theme picked. */
:root {
  --page: #FAFAFA;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", sans-serif;
  --scale: 0.8;
}
.theme-light {
  --paper: #FFFFFF; --ink: #111111; --ink-2: #6B6B6B;
  --glass: rgba(255, 255, 255, 0.58); --glass-edge: rgba(255, 255, 255, 0.85); --glass-line: rgba(17, 17, 17, 0.08);
  --glass-shadow: 0 18px 50px rgba(0, 0, 0, 0.16);
}
.theme-dark {
  --paper: #111111; --ink: #FFFFFF; --ink-2: #A3A3A3;
  --glass: rgba(40, 40, 42, 0.55); --glass-edge: rgba(255, 255, 255, 0.22); --glass-line: rgba(255, 255, 255, 0.10);
  --glass-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: #111111; font-family: var(--font); -webkit-font-smoothing: antialiased; }
.page { max-width: 1320px; margin: 0 auto; padding: 0 24px 64px; display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 36px; align-items: start; }
@media (max-width: 900px) { .page { grid-template-columns: minmax(0, 1fr); } }
body.bare { background: transparent; }
body.bare .side { display: none; }
body.bare .page { display: block; padding: 0; max-width: none; }
body.bare .stage { padding-top: 0; justify-content: center; }
h1 { font-size: 26px; margin: 28px 0 0; letter-spacing: -0.4px; }
.date { color: #6B6B6B; font-size: 14px; margin: 4px 0 18px; }
.side { position: sticky; top: 0; padding-bottom: 24px; }
.group { margin-top: 16px; }
.lbl { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: #6B6B6B; text-transform: uppercase; margin-bottom: 6px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn { font: inherit; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #111111; border: 1px solid rgba(17, 17, 17, 0.14); border-radius: 999px; padding: 7px 13px; cursor: pointer; }
.btn[aria-pressed="true"], .btn.primary { background: #111111; color: #FFFFFF; border-color: #111111; }
.pick-chip { font-size: 12.5px; font-weight: 700; border: 1.5px solid #111111; border-radius: 14px; padding: 7px 10px; line-height: 18px; font-variant-numeric: tabular-nums; background: #FFFFFF; }
.readout { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: #111111; }
details { margin-top: 16px; }
summary { cursor: pointer; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: #6B6B6B; text-transform: uppercase; }
.slider { display: grid; grid-template-columns: 62px minmax(0, 1fr) 46px; gap: 8px; align-items: center; font-size: 12.5px; margin-top: 6px; }
.slider span { color: #6B6B6B; font-weight: 600; }
.slider input { width: 100%; accent-color: #111111; }
.slider output { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.haptic { display: flex; align-items: center; gap: 10px; }
.haptic-bar { width: 180px; height: 10px; border-radius: 5px; background: rgba(17, 17, 17, 0.08); overflow: hidden; }
.haptic-fill { height: 100%; width: 0; background: #111111; border-radius: 5px; }
.haptic-tap { font-size: 12px; font-weight: 700; opacity: 0; }

/* The phone: iPhone 16 Pro, 402 x 874 pt */
.stage { padding-top: 28px; display: flex; justify-content: center; }
.frame { width: calc(402px * var(--scale) + 20px); height: calc(874px * var(--scale) + 20px); position: relative; flex-shrink: 0; }
.frame-inner { position: absolute; left: 10px; top: 10px; transform: scale(var(--scale)); transform-origin: top left; }
.phone { width: 402px; height: 874px; position: relative; overflow: hidden; border-radius: 56px; background: #000000; box-shadow: 0 0 0 10px #111111, 0 20px 50px rgba(0, 0, 0, 0.18); user-select: none; -webkit-user-select: none; touch-action: none; cursor: pointer; }
.phone canvas { position: absolute; left: 0; top: 0; width: 402px; height: 874px; border-radius: 56px; }

/* The Midas glass popup: the glass is drawn by the shader, the words sit on it (SF Pro, the hand for "Midas") */
.card { position: absolute; display: flex; flex-direction: column; align-items: center; padding: 34px 22px 22px; color: var(--ink); text-align: center; opacity: 0; pointer-events: none; transform-origin: 50% 50%; }
.card .word { font-family: "MidasHand"; font-weight: 700; font-size: 76px; line-height: 84px; }
.card .line { font-size: 17px; font-weight: 400; line-height: 22px; letter-spacing: -0.43px; color: var(--ink-2); margin-top: 4px; }
.card .go { margin-top: auto; align-self: stretch; height: 52px; border-radius: 26px; background: var(--ink); color: var(--paper); font-size: 17px; font-weight: 600; letter-spacing: -0.43px; display: flex; align-items: center; justify-content: center; opacity: 0; transform: translateY(6px); transition: opacity 0.9s ease-in-out, transform 0.9s ease-in-out; cursor: pointer; }
.card .go.on { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<script>
"use strict";

// ---------- Constants ----------

const SCREEN_W = 402;
const SCREEN_H = 874;
// The shell's home grid (SidekickHomeLayout): 60 pt icons, 4 columns, 20 pt sides, 22 pt rows.
const ICON_SIZE = 60;
const TAU = Math.PI * 2;
const STEP = 1 / 120;

// docs/DESIGN.md 2.1 and 2.4
const THEMES = {
  Light: { paper: "#FFFFFF", ink: "#111111", ink2: "#6B6B6B", paperRgb: [1, 1, 1], inkRgb: [0.067, 0.067, 0.067] },
  Dark: { paper: "#111111", ink: "#FFFFFF", ink2: "#A3A3A3", paperRgb: [0.067, 0.067, 0.067], inkRgb: [1, 1, 1] },
};

// The fixed eight tile colours (docs/DESIGN.md 2.3) and the mark colour on each.
const TILE = {
  tomato: { hex: "#FF6347", mark: "#FFFFFF" },
  amber: { hex: "#FFBF00", mark: "#111111" },
  lemon: { hex: "#FFE600", mark: "#111111" },
  chartreuse: { hex: "#C9F24D", mark: "#111111" },
  turquoise: { hex: "#30D5C8", mark: "#111111" },
  sage: { hex: "#9CAF88", mark: "#111111" },
  cherry: { hex: "#C41E3A", mark: "#FFFFFF" },
  charcoal: { hex: "#2E2E2E", mark: "#FFFFFF" },
};

// Eight apps, one per tile colour. `mass` makes heavy ones slower to pull and to throw.
const SIDEKICKS = [
  { name: "Reminders", tile: "tomato", glyph: "bell", mass: 1.2 },
  { name: "Water", tile: "turquoise", glyph: "drop", mass: 0.85 },
  { name: "Habits", tile: "lemon", glyph: "ring", mass: 1.0 },
  { name: "Money", tile: "chartreuse", glyph: "card", mass: 1.35 },
  { name: "To-Do", tile: "sage", glyph: "check", mass: 0.9 },
  { name: "Study", tile: "amber", glyph: "book", mass: 1.25 },
  { name: "Meds", tile: "cherry", glyph: "pill", mass: 0.8 },
  { name: "Sleep", tile: "charcoal", glyph: "moon", mass: 1.1 },
];

// Seconds per phase; each preset adds up to its name.
const PRESETS = [
  // The popup (sheet) is slow and calm in every preset (founder, final): it is not part of the count.
  { label: "2 s", values: { charge: 0.85, full: 0.12, burst: 0.22, pause: 0, settle: 0.4, sheet: 1.2 } },
  { label: "3 s", values: { charge: 1.4, full: 0.18, burst: 0.28, pause: 0, settle: 0.5, sheet: 1.4 } },
  { label: "4 s", values: { charge: 2.0, full: 0.22, burst: 0.32, pause: 0, settle: 0.6, sheet: 1.6 } },
  { label: "5 s", values: { charge: 2.6, full: 0.25, burst: 0.36, pause: 0, settle: 0.7, sheet: 1.8 } },
];

const SLIDERS = [
  { key: "charge", label: "Pull in", min: 0.4, max: 4, step: 0.05, unit: " s" },
  { key: "full", label: "Hold full", min: 0, max: 1, step: 0.02, unit: " s" },
  { key: "burst", label: "Burst", min: 0.1, max: 1.2, step: 0.05, unit: " s" },
  { key: "pause", label: "Jumble", min: 0, max: 1, step: 0.05, unit: " s" },
  { key: "settle", label: "Line up", min: 0.3, max: 2, step: 0.05, unit: " s" },
  { key: "cardWait", label: "Popup wait", min: 0, max: 2, step: 0.05, unit: " s" },
  { key: "sheet", label: "Popup", min: 0.2, max: 3, step: 0.05, unit: " s" },
  { key: "goDelay", label: "Button", min: 0, max: 2, step: 0.1, unit: " s" },
  { key: "shake", label: "Shake", min: 0, max: 10, step: 0.5, unit: " pt" },
  { key: "swirl", label: "Swirl", min: 0, max: 2, step: 0.1, unit: "" },
  { key: "lens", label: "Bending", min: 0, max: 3, step: 0.1, unit: "" },
  { key: "tilt", label: "Disc tilt", min: 2, max: 90, step: 1, unit: "°" },
  { key: "whirl", label: "Whirlpool", min: 0, max: 2.5, step: 0.1, unit: "" },
  { key: "dark", label: "Darkening", min: 0, max: 1, step: 0.05, unit: "" },
  { key: "hole", label: "Hole size", min: 8, max: 60, step: 1, unit: " pt" },
];

// ---------- Variant and bare mode (round 10: the variants page shows this file 8 times) ----------

const URL_PARAMS = new URLSearchParams(window.location.search);
// Silk (founder, round 10)
const VARIANT = Number(URL_PARAMS.get("v") || 1);
const BARE = URL_PARAMS.get("bare") === "1";

// ---------- State ----------

const settings = {
  params: Object.assign({ goDelay: 1.4, shake: 3, swirl: 1, lens: 1.2, tilt: 90, dark: 1, hole: 16, cardWait: 0.9, wobble: 0, whirl: 1 }, PRESETS[1].values),
  presetLabel: "3 s",
  speed: 1,
  theme: "Light",
  colour: "Eight",
  colourIn: "On landing",
};

const sim = {
  mode: "idle",
  modeTime: 0,
  holdTime: 0,
  clock: 0,
  pressClock: 0,
  finger: { x: 201, y: 500, down: false },
  hole: { x: 201, y: 500, radius: 0 },
  bodies: [],
  dust: [],
  wave: { radius: 0, amp: 0 },
  dim: 0,
  seed: 3.1,
  flash: 0,
  card: 0,
  shake: { x: 0, y: 0 },
  haptic: 0,
  hapticTap: 0,
  labelsAlpha: 0,
  demo: null,
  paused: false,
};

// ---------- Small maths ----------

function clamp01(value) {
  return Math.max(0, Math.min(1, value));
}

function lerp(from, to, amount) {
  return from + (to - from) * amount;
}

// Slow in, slow out: the popup arrives without a push
function easeInOutSine(value) {
  return 0.5 - 0.5 * Math.cos(Math.PI * value);
}

function easeOutCubic(value) {
  const inverse = 1 - value;
  return 1 - inverse * inverse * inverse;
}

function makeSeededRandom(seed) {
  let current = seed >>> 0;
  function nextRandom() {
    current = (current + 0x6D2B79F5) >>> 0;
    let mixed = current;
    mixed = Math.imul(mixed ^ (mixed >>> 15), mixed | 1);
    mixed ^= mixed + Math.imul(mixed ^ (mixed >>> 7), mixed | 61);
    return ((mixed ^ (mixed >>> 14)) >>> 0) / 4294967296;
  }
  return nextRandom;
}

let random = makeSeededRandom(11);

function gridSlot(index) {
  const column = index % 4;
  const row = Math.floor(index / 4);
  const columnWidth = (SCREEN_W - 40 - 3 * 8) / 4;
  return { x: 20 + columnWidth / 2 + column * (columnWidth + 8), y: 190 + row * 103 };
}

// ---------- Icon images: "before" (grey, flat) and "after" (Midas colour, glass layers) ----------

function fontStack() {
  return getComputedStyle(document.body).fontFamily;
}

// Before: the apps as they are today. No colour, chunky clip-art glyphs, a plain rounded square.
function drawPlainGlyph(ctx, glyph, unit, markColour, tileColour) {
  ctx.fillStyle = markColour;
  ctx.strokeStyle = markColour;
  ctx.lineWidth = unit * 0.075;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  if (glyph === "bell") {
    ctx.moveTo(-0.25 * unit, 0.14 * unit);
    ctx.quadraticCurveTo(-0.19 * unit, 0.08 * unit, -0.19 * unit, -0.03 * unit);
    ctx.arc(0, -0.03 * unit, 0.19 * unit, Math.PI, 0);
    ctx.quadraticCurveTo(0.19 * unit, 0.08 * unit, 0.25 * unit, 0.14 * unit);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 0.2 * unit, 0.055 * unit, 0, TAU);
    ctx.fill();
  } else if (glyph === "drop") {
    ctx.moveTo(0, -0.28 * unit);
    ctx.bezierCurveTo(0.08 * unit, -0.15 * unit, 0.2 * unit, -0.04 * unit, 0.2 * unit, 0.07 * unit);
    ctx.arc(0, 0.07 * unit, 0.2 * unit, 0, Math.PI);
    ctx.bezierCurveTo(-0.2 * unit, -0.04 * unit, -0.08 * unit, -0.15 * unit, 0, -0.28 * unit);
    ctx.fill();
  } else if (glyph === "ring") {
    ctx.arc(0, 0, 0.21 * unit, 0, TAU);
    ctx.lineWidth = unit * 0.1;
    ctx.stroke();
  } else if (glyph === "card") {
    ctx.font = "800 " + Math.round(0.42 * unit) + "px " + fontStack();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("$", 0, 0.02 * unit);
  } else if (glyph === "check") {
    ctx.roundRect(-0.22 * unit, -0.22 * unit, 0.44 * unit, 0.44 * unit, 0.09 * unit);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-0.1 * unit, 0.0);
    ctx.lineTo(-0.02 * unit, 0.08 * unit);
    ctx.lineTo(0.12 * unit, -0.08 * unit);
    ctx.stroke();
  } else if (glyph === "book") {
    ctx.roundRect(-0.2 * unit, -0.24 * unit, 0.4 * unit, 0.48 * unit, 0.04 * unit);
    ctx.fill();
  } else if (glyph === "pill") {
    ctx.save();
    ctx.rotate(-Math.PI / 4);
    ctx.roundRect(-0.27 * unit, -0.11 * unit, 0.54 * unit, 0.22 * unit, 0.11 * unit);
    ctx.fill();
    ctx.restore();
  } else if (glyph === "moon") {
    ctx.arc(0, 0, 0.24 * unit, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = tileColour;
    ctx.arc(0.11 * unit, -0.09 * unit, 0.2 * unit, 0, TAU);
    ctx.fill();
  }
}

// The grey of "before", per theme: one dull tile, one dull mark, for every app.
const PLAIN_GREY = {
  Light: { tile: "#E4E4E4", mark: "#9A9A9A" },
  Dark: { tile: "#2A2A2A", mark: "#6A6A6A" },
};

function buildPlainIcon(sidekick, pixelSize, themeName) {
  const canvas = document.createElement("canvas");
  canvas.width = pixelSize;
  canvas.height = pixelSize;
  const ctx = canvas.getContext("2d");
  const grey = PLAIN_GREY[themeName];
  ctx.beginPath();
  ctx.roundRect(0, 0, pixelSize, pixelSize, pixelSize * 0.16);
  ctx.fillStyle = grey.tile;
  ctx.fill();
  ctx.translate(pixelSize / 2, pixelSize / 2);
  drawPlainGlyph(ctx, sidekick.glyph, pixelSize, grey.mark, grey.tile);
  return canvas;
}

// iOS continuous-corner tile (the shell's RoundedRectangle(style: .continuous), corner 22.5%):
// a superellipse with exponent 5 matches it closely.
function superellipsePath(ctx, centreX, centreY, half) {
  const exponent = 5;
  const segments = 120;
  ctx.beginPath();
  for (let segment = 0; segment <= segments; segment += 1) {
    const angle = (segment / segments) * TAU;
    const cosine = Math.cos(angle);
    const sine = Math.sin(angle);
    const pointX = centreX + half * Math.sign(cosine) * Math.pow(Math.abs(cosine), 2 / exponent);
    const pointY = centreY + half * Math.sign(sine) * Math.pow(Math.abs(sine), 2 / exponent);
    if (segment === 0) {
      ctx.moveTo(pointX, pointY);
    } else {
      ctx.lineTo(pointX, pointY);
    }
  }
  ctx.closePath();
}

// After, following Apple's icon guidance for iOS 26 (WWDC25 "Say hello to the new look of app
// icons", HIG App icons): one colour background, foreground in layers, bold rounded shapes, no thin
// lines, no sharp corners. Each glyph has a main layer (`solid`) and a second layer (`glass`) that
// is the same mark colour at lower opacity, so the system's glass reads as depth.
const GLASS_ALPHA = 0.42;

// "One colour on every icon" (founder, round 4). Eight = each app its own Midas tile colour:
// the founder's pick (round 5).
const ONE_COLOUR = {
  Volt: { hex: "#CEFF00", mark: "#111111" },
  Ink: { hex: "#111111", mark: "#FFFFFF" },
  Paper: { hex: "#FFFFFF", mark: "#111111" },
};

function tileFor(sidekick) {
  const shared = ONE_COLOUR[settings.colour];
  if (shared) {
    return shared;
  }
  return TILE[sidekick.tile];
}

function polishedLayers(glyph, unit) {
  const solid = new Path2D();
  const glass = new Path2D();
  if (glyph === "bell") {
    // Bell, with the notification badge as the glass layer
    solid.moveTo(-0.21 * unit, 0.13 * unit);
    solid.quadraticCurveTo(-0.16 * unit, 0.08 * unit, -0.16 * unit, -0.02 * unit);
    solid.arc(0, -0.03 * unit, 0.16 * unit, Math.PI, 0);
    solid.quadraticCurveTo(0.16 * unit, 0.08 * unit, 0.21 * unit, 0.13 * unit);
    solid.quadraticCurveTo(0.225 * unit, 0.17 * unit, 0.18 * unit, 0.17 * unit);
    solid.lineTo(-0.18 * unit, 0.17 * unit);
    solid.quadraticCurveTo(-0.225 * unit, 0.17 * unit, -0.21 * unit, 0.13 * unit);
    solid.closePath();
    solid.moveTo(0.06 * unit, 0.205 * unit);
    solid.arc(0, 0.205 * unit, 0.06 * unit, 0, Math.PI);
    solid.closePath();
    glass.arc(0.17 * unit, -0.17 * unit, 0.085 * unit, 0, TAU);
  } else if (glyph === "drop") {
    // A drop of glass with water standing in its lower half
    glass.moveTo(0, -0.27 * unit);
    glass.bezierCurveTo(0.09 * unit, -0.15 * unit, 0.21 * unit, -0.03 * unit, 0.21 * unit, 0.07 * unit);
    glass.arc(0, 0.07 * unit, 0.21 * unit, 0, Math.PI);
    glass.bezierCurveTo(-0.21 * unit, -0.03 * unit, -0.09 * unit, -0.15 * unit, 0, -0.27 * unit);
    glass.closePath();
    solid.moveTo(-0.205 * unit, 0.05 * unit);
    solid.bezierCurveTo(-0.1 * unit, 0.0, 0.1 * unit, 0.1 * unit, 0.205 * unit, 0.03 * unit);
    solid.lineTo(0.21 * unit, 0.07 * unit);
    solid.arc(0, 0.07 * unit, 0.21 * unit, 0, Math.PI);
    solid.closePath();
  } else if (glyph === "ring") {
    // A streak ring: the track in glass, three quarters of it done
    glass.arc(0, 0, 0.23 * unit, 0, TAU);
    glass.arc(0, 0, 0.13 * unit, TAU, 0, true);
    solid.arc(0, 0, 0.23 * unit, -Math.PI / 2, Math.PI);
    solid.arc(-0.18 * unit, 0, 0.05 * unit, Math.PI, 0, false);
    solid.arc(0, 0, 0.13 * unit, Math.PI, -Math.PI / 2, true);
    solid.arc(0, -0.18 * unit, 0.05 * unit, Math.PI / 2, -Math.PI / 2, false);
    solid.closePath();
  } else if (glyph === "card") {
    // Two cards: the back one tilted, in glass
    const back = new DOMMatrix().rotate(-14);
    const backCard = new Path2D();
    backCard.roundRect(-0.22 * unit, -0.2 * unit, 0.42 * unit, 0.27 * unit, 0.06 * unit);
    glass.addPath(backCard, back);
    solid.roundRect(-0.21 * unit, -0.06 * unit, 0.44 * unit, 0.28 * unit, 0.06 * unit);
  } else if (glyph === "check") {
    // A checkbox in glass with a bold tick on it
    glass.roundRect(-0.21 * unit, -0.21 * unit, 0.42 * unit, 0.42 * unit, 0.11 * unit);
  } else if (glyph === "book") {
    // An open book: the left page solid, the right page glass
    solid.moveTo(-0.02 * unit, -0.14 * unit);
    solid.quadraticCurveTo(-0.12 * unit, -0.21 * unit, -0.24 * unit, -0.18 * unit);
    solid.quadraticCurveTo(-0.26 * unit, -0.175 * unit, -0.26 * unit, -0.15 * unit);
    solid.lineTo(-0.26 * unit, 0.15 * unit);
    solid.quadraticCurveTo(-0.13 * unit, 0.13 * unit, -0.02 * unit, 0.2 * unit);
    solid.closePath();
    glass.moveTo(0.02 * unit, -0.14 * unit);
    glass.quadraticCurveTo(0.12 * unit, -0.21 * unit, 0.24 * unit, -0.18 * unit);
    glass.quadraticCurveTo(0.26 * unit, -0.175 * unit, 0.26 * unit, -0.15 * unit);
    glass.lineTo(0.26 * unit, 0.15 * unit);
    glass.quadraticCurveTo(0.13 * unit, 0.13 * unit, 0.02 * unit, 0.2 * unit);
    glass.closePath();
  } else if (glyph === "pill") {
    // A capsule: one half solid, the other glass
    const tilt = new DOMMatrix().rotate(-45);
    const left = new Path2D();
    left.moveTo(0, -0.105 * unit);
    left.lineTo(-0.17 * unit, -0.105 * unit);
    left.arc(-0.17 * unit, 0, 0.105 * unit, -Math.PI / 2, Math.PI / 2, true);
    left.lineTo(0, 0.105 * unit);
    left.closePath();
    const right = new Path2D();
    right.moveTo(0.01 * unit, -0.105 * unit);
    right.lineTo(0.17 * unit, -0.105 * unit);
    right.arc(0.17 * unit, 0, 0.105 * unit, -Math.PI / 2, Math.PI / 2);
    right.lineTo(0.01 * unit, 0.105 * unit);
    right.closePath();
    solid.addPath(left, tilt);
    glass.addPath(right, tilt);
  } else if (glyph === "moon") {
    // A crescent, two small stars in glass
    solid.arc(-0.03 * unit, 0.02 * unit, 0.21 * unit, 0, TAU);
    glass.arc(0.17 * unit, -0.16 * unit, 0.035 * unit, 0, TAU);
    glass.arc(0.215 * unit, 0.03 * unit, 0.025 * unit, 0, TAU);
  }
  return { solid: solid, glass: glass };
}

// The parts that are strokes, not fills: the tick, cut-outs.
function drawPolishedExtras(ctx, glyph, unit, markColour) {
  ctx.save();
  if (glyph === "check") {
    ctx.strokeStyle = markColour;
    ctx.lineWidth = unit * 0.075;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(-0.1 * unit, 0.0);
    ctx.lineTo(-0.025 * unit, 0.075 * unit);
    ctx.lineTo(0.12 * unit, -0.085 * unit);
    ctx.stroke();
  } else if (glyph === "moon") {
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath();
    ctx.arc(0.07 * unit, -0.07 * unit, 0.17 * unit, 0, TAU);
    ctx.fill();
    // The cut also bit the stars: put them back.
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = GLASS_ALPHA;
    ctx.fillStyle = markColour;
    ctx.fill(polishedLayers("moon", unit).glass);
  } else if (glyph === "card") {
    // The magnetic stripe, cut out of the front card
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillRect(-0.21 * unit, 0.0, 0.44 * unit, 0.055 * unit);
  }
  ctx.restore();
}

function buildGlyphLayer(sidekick, pixelSize, tileOverride) {
  const layer = document.createElement("canvas");
  layer.width = pixelSize;
  layer.height = pixelSize;
  const ctx = layer.getContext("2d");
  const tile = tileOverride || tileFor(sidekick);
  const unit = pixelSize;
  ctx.translate(pixelSize / 2, pixelSize / 2);
  const layers = polishedLayers(sidekick.glyph, unit);
  ctx.fillStyle = tile.mark;
  ctx.globalAlpha = GLASS_ALPHA;
  ctx.fill(layers.glass);
  ctx.globalAlpha = 1;
  ctx.fill(layers.solid);
  drawPolishedExtras(ctx, sidekick.glyph, unit, tile.mark);

  // Glass light on the foreground: a sheen across the top of every shape, lit from above.
  ctx.globalCompositeOperation = "source-atop";
  const sheen = ctx.createLinearGradient(0, -0.3 * unit, 0, 0.1 * unit);
  sheen.addColorStop(0, "rgba(255,255,255,0.38)");
  sheen.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = sheen;
  ctx.fillRect(-unit / 2, -unit / 2, unit, unit);
  ctx.globalCompositeOperation = "source-over";
  return layer;
}

// The tile's glass edge: light caught at the top-left and, weaker, at the bottom-right.
function strokeGlassEdge(ctx, centre, half, pixelSize, pad) {
  ctx.save();
  superellipsePath(ctx, centre, centre, half);
  ctx.clip();
  const edge = ctx.createLinearGradient(pad, pad, pad + pixelSize, pad + pixelSize);
  edge.addColorStop(0, "rgba(255,255,255,0.85)");
  edge.addColorStop(0.32, "rgba(255,255,255,0.10)");
  edge.addColorStop(0.68, "rgba(255,255,255,0.0)");
  edge.addColorStop(1, "rgba(255,255,255,0.45)");
  ctx.strokeStyle = edge;
  ctx.lineWidth = pixelSize * 0.022;
  superellipsePath(ctx, centre, centre, half - pixelSize * 0.006);
  ctx.stroke();
  ctx.restore();
}

function buildPolishedIcon(sidekick, pixelSize, tileOverride) {
  const pad = Math.round(pixelSize * 0.25);
  const canvas = document.createElement("canvas");
  canvas.width = pixelSize + pad * 2;
  canvas.height = pixelSize + pad * 2;
  const ctx = canvas.getContext("2d");
  const tile = tileOverride || tileFor(sidekick);
  const centre = pad + pixelSize / 2;
  const half = pixelSize / 2;

  // Background layer: the Midas tile colour, flat (DESIGN.md rejects gradients), a soft shadow under it.
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.20)";
  ctx.shadowBlur = pixelSize * 0.12;
  ctx.shadowOffsetY = pixelSize * 0.04;
  superellipsePath(ctx, centre, centre, half);
  ctx.fillStyle = tile.hex;
  ctx.fill();
  ctx.restore();

  // Foreground layer floats a little above the background: it casts a small shadow onto it.
  const glyphLayer = buildGlyphLayer(sidekick, pixelSize, tileOverride);
  ctx.save();
  superellipsePath(ctx, centre, centre, half);
  ctx.clip();
  ctx.shadowColor = "rgba(0,0,0,0.22)";
  ctx.shadowBlur = pixelSize * 0.05;
  ctx.shadowOffsetY = pixelSize * 0.022;
  ctx.drawImage(glyphLayer, pad, pad);
  ctx.restore();

  strokeGlassEdge(ctx, centre, half, pixelSize, pad);
  if (tile.hex === "#FFFFFF") {
    // A hairline so a white tile still has a shape on white (SidekickIconView does the same)
    superellipsePath(ctx, centre, centre, half - pixelSize * 0.002);
    ctx.strokeStyle = "rgba(0,0,0,0.10)";
    ctx.lineWidth = pixelSize * 0.008;
    ctx.stroke();
  }
  return canvas;
}

const PLAIN_IMAGES = [];
const POLISHED_IMAGES = [];
const POLISHED_SPAN = 1.5;

function buildPlainIcons() {
  PLAIN_IMAGES.length = 0;
  for (const sidekick of SIDEKICKS) {
    PLAIN_IMAGES.push(buildPlainIcon(sidekick, ICON_SIZE * 4, settings.theme));
  }
}

// Out of the hole the icons are already glass, still grey; colour fills in as each one lands.
const POLISHED_GREY_IMAGES = [];

function buildPolishedIcons() {
  POLISHED_IMAGES.length = 0;
  POLISHED_GREY_IMAGES.length = 0;
  const grey = PLAIN_GREY[settings.theme];
  for (const sidekick of SIDEKICKS) {
    POLISHED_GREY_IMAGES.push(buildPolishedIcon(sidekick, ICON_SIZE * 4, { hex: grey.tile, mark: grey.mark }));
    POLISHED_IMAGES.push(buildPolishedIcon(sidekick, ICON_SIZE * 4));
  }
}

function buildAllIcons() {
  buildPlainIcons();
  buildPolishedIcons();
}

// ---------- Bodies ----------

const START_POINTS = [
  { x: 92, y: 168 }, { x: 300, y: 132 }, { x: 214, y: 272 }, { x: 74, y: 352 },
  { x: 318, y: 360 }, { x: 116, y: 620 }, { x: 300, y: 650 }, { x: 206, y: 760 },
];

function makeBodies() {
  random = makeSeededRandom(11);
  const bodies = [];
  for (let index = 0; index < SIDEKICKS.length; index += 1) {
    const start = START_POINTS[index];
    bodies.push({
      index: index,
      mass: SIDEKICKS[index].mass,
      x: start.x,
      y: start.y,
      vx: (random() - 0.5) * 20,
      vy: (random() - 0.5) * 20,
      rot: (random() - 0.5) * 0.4,
      spin: (random() - 0.5) * 0.3,
      phase: random() * TAU,
      scale: 0.86 + random() * 0.16,
      look: "plain",
      colourIn: 0,
      inside: false,
      grow: 1,
      orderDelay: 0,
      drawScale: 1,
      stretch: 1,
      stretchAngle: 0,
    });
  }
  return bodies;
}

function resetSim() {
  sim.mode = "idle";
  sim.modeTime = 0;
  sim.holdTime = 0;
  sim.bodies = makeBodies();
  sim.dust = [];
  sim.hole.radius = 0;
  sim.wave.amp = 0;
  sim.finger.down = false;
  sim.labelsAlpha = 0;
  sim.demo = null;
  sim.haptic = 0;
  sim.hapticTap = 0;
  sim.dim = 0;
  sim.flash = 0;
  sim.card = 0;
}

function setMode(mode) {
  sim.mode = mode;
  sim.modeTime = 0;
}

// ---------- Forces ----------

function keepInside(body, bounce) {
  const margin = 34;
  const top = 76;
  const bottom = SCREEN_H - 40;
  if (bounce) {
    // Walls are hard during the burst: icons bounce back in.
    if (body.x < margin) { body.x = margin; body.vx = Math.abs(body.vx) * 0.5; }
    if (body.x > SCREEN_W - margin) { body.x = SCREEN_W - margin; body.vx = -Math.abs(body.vx) * 0.5; }
    if (body.y < top) { body.y = top; body.vy = Math.abs(body.vy) * 0.5; }
    if (body.y > bottom) { body.y = bottom; body.vy = -Math.abs(body.vy) * 0.5; }
    return;
  }
  // Soft walls while floating.
  const push = 60;
  if (body.x < margin + 10) { body.vx += push * STEP * (margin + 10 - body.x) * 0.2; }
  if (body.x > SCREEN_W - margin - 10) { body.vx -= push * STEP * (body.x - (SCREEN_W - margin - 10)) * 0.2; }
  if (body.y < top + 10) { body.vy += push * STEP * (top + 10 - body.y) * 0.2; }
  if (body.y > bottom - 10) { body.vy -= push * STEP * (body.y - (bottom - 10)) * 0.2; }
}

// Icons are solid: overlapping ones push apart, heavier ones move less.
function separateBodies() {
  const bodies = sim.bodies;
  for (let first = 0; first < bodies.length; first += 1) {
    const a = bodies[first];
    if (a.inside) { continue; }
    for (let second = first + 1; second < bodies.length; second += 1) {
      const b = bodies[second];
      if (b.inside) { continue; }
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const distance = Math.hypot(dx, dy) || 0.001;
      const minimum = 28 * (a.drawScale + b.drawScale);
      if (distance >= minimum) { continue; }
      const overlap = (minimum - distance) * 0.5;
      const normalX = dx / distance;
      const normalY = dy / distance;
      const shareA = b.mass / (a.mass + b.mass);
      const shareB = a.mass / (a.mass + b.mass);
      a.x -= normalX * overlap * shareA;
      a.y -= normalY * overlap * shareA;
      b.x += normalX * overlap * shareB;
      b.y += normalY * overlap * shareB;
      const relative = (b.vx - a.vx) * normalX + (b.vy - a.vy) * normalY;
      if (relative < 0) {
        const impulse = -relative * 0.8;
        a.vx -= normalX * impulse * shareA;
        a.vy -= normalY * impulse * shareA;
        b.vx += normalX * impulse * shareB;
        b.vy += normalY * impulse * shareB;
      }
    }
  }
}

function integrate(body, drag) {
  const damping = Math.exp(-drag * STEP);
  body.vx *= damping;
  body.vy *= damping;
  const speed = Math.hypot(body.vx, body.vy);
  const maxSpeed = 1600;
  if (speed > maxSpeed) {
    body.vx *= maxSpeed / speed;
    body.vy *= maxSpeed / speed;
  }
  body.x += body.vx * STEP;
  body.y += body.vy * STEP;
  body.rot += body.spin * STEP;
}

function floatForce(body) {
  const time = sim.clock;
  body.vx += Math.sin(time * 0.7 + body.phase) * 16 * STEP;
  body.vy += Math.cos(time * 0.55 + body.phase * 1.3) * 16 * STEP;
  body.spin += (Math.sin(time * 0.4 + body.phase) * 0.15 - body.spin) * STEP;
}

// Gravity toward the hole. Strength rises with the charge; heavier icons accelerate less.
function gravityAccel(x, y, mass, charge) {
  const dx = sim.hole.x - x;
  const dy = sim.hole.y - y;
  const distance = Math.hypot(dx, dy) || 0.001;
  const strength = 2200 * (0.25 + 3 * charge * charge);
  const magnitude = (strength / mass) * (100 / (distance + 30));
  const swirl = settings.params.swirl * 0.42 * magnitude;
  return {
    ax: (dx / distance) * magnitude + (-dy / distance) * swirl,
    ay: (dy / distance) * magnitude + (dx / distance) * swirl,
    distance: distance,
  };
}

// ---------- Dust: ink motes that stream into the hole while it charges ----------

function spawnDust(charge) {
  const angle = random() * TAU;
  const distance = 90 + random() * 220;
  const x = sim.hole.x + Math.cos(angle) * distance;
  const y = sim.hole.y + Math.sin(angle) * distance;
  const orbit = 90 + random() * 90;
  sim.dust.push({
    x: x, y: y,
    vx: -Math.sin(angle) * orbit * settings.params.swirl,
    vy: Math.cos(angle) * orbit * settings.params.swirl,
    life: 0,
    size: 0.7 + random() * 0.9 + charge * 0.4,
  });
}

function stepDust(charge) {
  const kept = [];
  for (const mote of sim.dust) {
    mote.life += STEP;
    if (sim.mode === "charging" || sim.mode === "full") {
      const pull = gravityAccel(mote.x, mote.y, 0.5, Math.max(charge, 0.5));
      mote.vx += pull.ax * STEP;
      mote.vy += pull.ay * STEP;
      if (pull.distance < sim.hole.radius * 1.05) {
        continue;
      }
    } else {
      mote.life += STEP * 3;
    }
    const damping = Math.exp(-1.2 * STEP);
    mote.vx *= damping;
    mote.vy *= damping;
    mote.x += mote.vx * STEP;
    mote.y += mote.vy * STEP;
    if (mote.life < 3) {
      kept.push(mote);
    }
  }
  sim.dust = kept;
}

// ---------- One fixed physics step ----------

function stepIdle() {
  for (const body of sim.bodies) {
    floatForce(body);
    keepInside(body, false);
    integrate(body, 0.9);
  }
  separateBodies();
}

function stepCharging() {
  const params = settings.params;
  sim.holdTime += STEP;
  const charge = clamp01(sim.holdTime / params.charge);
  sim.hole.radius = lerp(6, params.hole, easeOutCubic(charge));

  let remaining = 0;
  for (const body of sim.bodies) {
    if (body.inside) { continue; }
    const pull = gravityAccel(body.x, body.y, body.mass, charge);
    body.vx += pull.ax * STEP;
    body.vy += pull.ay * STEP;
    // Torque: closer means faster tumbling.
    body.spin += (pull.distance < 160 ? 6 : 1) * STEP * (body.index % 2 === 0 ? 1 : -1);
    // Late in the charge the hole wins outright, so the timing always holds.
    if (charge > 0.6) {
      const lateness = Math.pow((charge - 0.6) / 0.4, 2);
      body.x = lerp(body.x, sim.hole.x, lateness * 0.06);
      body.y = lerp(body.y, sim.hole.y, lateness * 0.06);
    }
    integrate(body, 1 + 2.4 * charge);
    if (pull.distance < sim.hole.radius * 1.1 || charge >= 1) {
      body.inside = true;
    } else {
      remaining += 1;
    }
  }
  separateBodies();

  const dustRate = 30 + 150 * charge;
  const dustCount = Math.floor(dustRate * STEP + random());
  for (let mote = 0; mote < dustCount; mote += 1) {
    spawnDust(charge);
  }
  sim.haptic = 0.15 + 0.85 * Math.pow(charge, 1.6);
  sim.dim = Math.pow(charge, 0.9);

  if (!sim.finger.down) {
    startCollapse();
    return;
  }
  if (charge >= 1 && remaining === 0) {
    setMode("full");
  }
}

function startCollapse() {
  // Let go early: the hole fades and spits everything back out as it was.
  setMode("collapse");
  for (const body of sim.bodies) {
    if (body.inside) {
      const angle = random() * TAU;
      body.inside = false;
      body.x = sim.hole.x + Math.cos(angle) * sim.hole.radius;
      body.y = sim.hole.y + Math.sin(angle) * sim.hole.radius;
      body.vx = Math.cos(angle) * 320;
      body.vy = Math.sin(angle) * 320;
    }
  }
  sim.haptic = 0;
}

function stepCollapse() {
  sim.hole.radius *= Math.exp(-9 * STEP);
  for (const body of sim.bodies) {
    keepInside(body, true);
    integrate(body, 2.5);
    body.spin *= Math.exp(-2 * STEP);
  }
  separateBodies();
  if (sim.modeTime > 0.6) {
    sim.hole.radius = 0;
    sim.holdTime = 0;
    setMode("idle");
  }
}

function stepFull() {
  // Everything is in: the hole tightens and trembles, then lets go.
  const params = settings.params;
  sim.hole.radius = params.hole * (1 - 0.12 * clamp01(sim.modeTime / Math.max(params.full, 0.01)));
  sim.haptic = 1;
  sim.dim = 1;
  for (let mote = 0; mote < 4; mote += 1) {
    spawnDust(1);
  }
  if (sim.modeTime >= params.full) {
    startBurst();
  }
}

function startBurst() {
  setMode("burst");
  sim.wave.radius = sim.hole.radius;
  sim.wave.amp = 34;
  sim.hapticTap = 1;
  sim.haptic = 0;
  sim.flash = 0.9;
  const offset = random() * TAU;
  const count = sim.bodies.length;
  for (const body of sim.bodies) {
    const angle = offset + (body.index / count) * TAU + (random() - 0.5) * 0.5;
    const speed = (820 + random() * 420) / Math.sqrt(body.mass) * (0.35 / Math.max(settings.params.burst, 0.15)) * 0.9;
    body.inside = false;
    body.look = "polished";
    body.colourIn = settings.colourIn === "At burst" ? 1 : 0;
    body.x = sim.hole.x + Math.cos(angle) * 8;
    body.y = sim.hole.y + Math.sin(angle) * 8;
    body.vx = Math.cos(angle) * speed;
    body.vy = Math.sin(angle) * speed;
    body.spin = (random() - 0.5) * 14;
    body.grow = 0;
  }
  sim.dust = [];
}

function stepBurst() {
  sim.hole.radius *= Math.exp(-22 * STEP);
  sim.wave.radius += 1500 * STEP;
  sim.wave.amp *= Math.exp(-3.2 * STEP);
  const drag = 3.2 * (0.35 / Math.max(settings.params.burst, 0.15));
  for (const body of sim.bodies) {
    body.grow = Math.min(1, body.grow + STEP / 0.22);
    keepInside(body, true);
    integrate(body, drag);
    body.spin *= Math.exp(-3 * STEP);
  }
  separateBodies();
  if (sim.modeTime >= settings.params.burst) {
    sim.hole.radius = 0;
    setMode("jumble");
  }
}

function stepJumble() {
  sim.wave.radius += 1500 * STEP;
  sim.wave.amp *= Math.exp(-3.2 * STEP);
  for (const body of sim.bodies) {
    body.grow = Math.min(1, body.grow + STEP / 0.22);
    keepInside(body, true);
    integrate(body, 4);
    body.spin *= Math.exp(-3 * STEP);
  }
  separateBodies();
  if (sim.modeTime >= settings.params.pause) {
    setMode("order");
  }
}

// Line up: a critically damped spring to each home slot (no bounce, docs/DESIGN.md 5).
// An icon takes its colour once it is nearly in its slot, over a quarter second, and keeps it.
function fillColourOnLanding(body, slot) {
  const away = Math.hypot(slot.x - body.x, slot.y - body.y);
  if (away < 10 || body.colourIn > 0) {
    body.colourIn = Math.min(1, body.colourIn + STEP / 0.25);
  }
}

function stepOrder() {
  const params = settings.params;
  sim.wave.amp *= Math.exp(-3.2 * STEP);
  const stagger = 0.02;
  const springTime = Math.max(0.2, params.settle - stagger * (sim.bodies.length - 1));
  const omega = 6 / springTime;
  for (const body of sim.bodies) {
    body.grow = Math.min(1, body.grow + STEP / 0.22);
    const slot = gridSlot(body.index);
    if (sim.modeTime < body.index * stagger) {
      integrate(body, 4);
      continue;
    }
    body.vx += (omega * omega * (slot.x - body.x) - 2 * omega * body.vx) * STEP;
    body.vy += (omega * omega * (slot.y - body.y) - 2 * omega * body.vy) * STEP;
    body.x += body.vx * STEP;
    body.y += body.vy * STEP;
    // Upright again, and every icon to the same size.
    const wrapped = Math.atan2(Math.sin(body.rot), Math.cos(body.rot));
    body.spin += (omega * omega * (0 - wrapped) - 2 * omega * body.spin) * STEP;
    body.rot = wrapped + body.spin * STEP;
    body.scale = lerp(body.scale, 1, 1 - Math.exp(-omega * STEP));
    fillColourOnLanding(body, slot);
  }
  if (sim.modeTime >= params.settle) {
    for (const body of sim.bodies) {
      const slot = gridSlot(body.index);
      body.x = slot.x;
      body.y = slot.y;
      body.vx = 0;
      body.vy = 0;
      body.rot = 0;
      body.spin = 0;
      body.scale = 1;
    }
    setMode("home");
  }
}

function stepHome() {
  for (const body of sim.bodies) {
    fillColourOnLanding(body, gridSlot(body.index));
  }
  sim.labelsAlpha = Math.min(1, sim.labelsAlpha + STEP / 0.3);
  // The popup waits a beat after the icons land, then rises
  if (sim.modeTime >= settings.params.cardWait) {
    sim.card = Math.min(1, sim.card + STEP / Math.max(settings.params.sheet, 0.05));
  }
}

function stepDemoFinger() {
  const demo = sim.demo;
  if (!demo) { return; }
  demo.time += STEP;
  if (demo.time < demo.wait) { return; }
  const held = demo.time - demo.wait;
  // The demo finger drifts a little while it holds, to show the hole following it.
  sim.finger.x = demo.x + Math.sin(held * 1.7) * 46;
  sim.finger.y = demo.y - Math.sin(held * 1.1) * 34;
  if (!demo.pressed) {
    demo.pressed = true;
    pressAt(sim.finger.x, sim.finger.y);
  }
  const done = sim.mode === "burst" || sim.mode === "jumble" || sim.mode === "order" || sim.mode === "home";
  if (done && sim.finger.down) {
    sim.finger.down = false;
    sim.demo = null;
  }
}

function stepWorld() {
  sim.clock += STEP;
  sim.modeTime += STEP;
  stepDemoFinger();
  // The hole trails the finger slightly, like it has weight.
  const follow = 1 - Math.exp(-16 * STEP);
  sim.hole.x = lerp(sim.hole.x, sim.finger.x, follow);
  sim.hole.y = lerp(sim.hole.y, sim.finger.y, follow);
  const charge = clamp01(sim.holdTime / settings.params.charge);

  if (sim.mode === "idle") { stepIdle(); }
  else if (sim.mode === "charging") { stepCharging(); }
  else if (sim.mode === "full") { stepFull(); }
  else if (sim.mode === "collapse") { stepCollapse(); }
  else if (sim.mode === "burst") { stepBurst(); }
  else if (sim.mode === "jumble") { stepJumble(); }
  else if (sim.mode === "order") { stepOrder(); }
  else if (sim.mode === "home") { stepHome(); }
  stepDust(charge);

  sim.hapticTap *= Math.exp(-8 * STEP);
  sim.flash *= Math.exp(-9 * STEP);
  // Light comes back after the burst, or when the finger lets go early
  if (sim.mode !== "charging" && sim.mode !== "full") {
    sim.dim *= Math.exp(-7 * STEP);
  }
  if (sim.mode !== "charging" && sim.mode !== "full") {
    sim.haptic *= Math.exp(-14 * STEP);
  }
  updateShake(charge);
}

function updateShake(charge) {
  const params = settings.params;
  let amplitude = 0;
  if (sim.mode === "charging") {
    amplitude = params.shake * charge * charge;
  } else if (sim.mode === "full") {
    amplitude = params.shake * 1.4;
  } else if (sim.mode === "burst") {
    const kick = clamp01(sim.modeTime / 0.35);
    amplitude = params.shake * 2.2 * (1 - kick) * (1 - kick);
  }
  const time = sim.clock;
  sim.shake.x = amplitude * (Math.sin(time * 71.3) * 0.6 + Math.sin(time * 43.1 + 1.7) * 0.4);
  sim.shake.y = amplitude * (Math.sin(time * 67.9 + 0.4) * 0.6 + Math.sin(time * 39.7 + 2.2) * 0.4);
}

// ---------- Touch ----------

function pressAt(x, y) {
  if (sim.mode !== "idle") {
    return;
  }
  sim.finger.x = x;
  sim.finger.y = y;
  sim.finger.down = true;
  sim.hole.x = x;
  sim.hole.y = y;
  sim.holdTime = 0;
  sim.pressClock = sim.clock;
  sim.seed = Math.random() * 40;
  // Each icon gets a sideways nudge so it falls in on an orbit, not a straight line.
  for (const body of sim.bodies) {
    const dx = body.x - x;
    const dy = body.y - y;
    const distance = Math.hypot(dx, dy) || 1;
    const orbit = 70 * settings.params.swirl / Math.sqrt(body.mass);
    body.vx += (-dy / distance) * orbit;
    body.vy += (dx / distance) * orbit;
  }
  setMode("charging");
}

function pointToScreen(event) {
  const bounds = document.getElementById("phone").getBoundingClientRect();
  const scale = bounds.width / SCREEN_W;
  return { x: (event.clientX - bounds.left) / scale, y: (event.clientY - bounds.top) / scale };
}

function onPhonePointerDown(event) {
  if (event.target.id === "go") {
    resetSim();
    return;
  }
  sim.demo = null;
  event.currentTarget.setPointerCapture(event.pointerId);
  const point = pointToScreen(event);
  pressAt(point.x, point.y);
  sim.finger.down = true;
  sim.finger.x = point.x;
  sim.finger.y = point.y;
}

function onPhonePointerMove(event) {
  if (!sim.finger.down || sim.demo) {
    return;
  }
  const point = pointToScreen(event);
  sim.finger.x = point.x;
  sim.finger.y = point.y;
}

function onPhonePointerUp() {
  if (sim.demo) {
    return;
  }
  sim.finger.down = false;
}

// ---------- Drawing the scene (2D), then the lens (WebGL) ----------

const sceneCanvas = document.createElement("canvas");
const sceneCtx = sceneCanvas.getContext("2d");
let pixelRatio = 2;

function drawStatusBar(ctx, theme) {
  ctx.fillStyle = theme.ink;
  ctx.font = "600 17px " + fontStack();
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillText("9:41", 50, 34);
  ctx.beginPath();
  ctx.moveTo(296, 33);
  ctx.lineTo(314, 33);
  ctx.lineTo(314, 21);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = theme.ink;
  ctx.beginPath();
  ctx.roundRect(330, 21.5, 26, 12, 4);
  ctx.stroke();
  ctx.beginPath();
  ctx.roundRect(332.5, 24, 18, 7, 1.5);
  ctx.fill();
  ctx.fillStyle = "#000000";
  ctx.beginPath();
  ctx.roundRect(138, 11, 126, 37, 18.5);
  ctx.fill();
}

// How an icon looks near the hole: smaller and stretched toward it (tidal pull).
function updateBodyLook(body) {
  body.drawScale = body.scale * (body.look === "polished" ? lerp(0.25, 1, easeOutCubic(body.grow)) : 1);
  body.stretch = 1;
  const holeLive = sim.hole.radius > 0.5 && (sim.mode === "charging" || sim.mode === "full");
  if (!holeLive) {
    return;
  }
  const dx = body.x - sim.hole.x;
  const dy = body.y - sim.hole.y;
  const distance = Math.hypot(dx, dy);
  const near = clamp01(1 - (distance - sim.hole.radius) / 130);
  body.drawScale *= lerp(1, 0.3, near * near);
  body.stretch = 1 + 1.4 * near * near;
  body.stretchAngle = Math.atan2(dy, dx);
}

function drawBody(ctx, body) {
  if (body.inside) {
    return;
  }
  updateBodyLook(body);
  ctx.save();
  ctx.translate(body.x, body.y);
  if (body.stretch !== 1) {
    ctx.rotate(body.stretchAngle);
    ctx.scale(body.stretch, 1 / Math.sqrt(body.stretch));
    ctx.rotate(-body.stretchAngle);
  }
  ctx.rotate(body.rot);
  const size = ICON_SIZE * body.drawScale;
  if (body.look === "polished") {
    const span = size * POLISHED_SPAN;
    if (body.colourIn < 1) {
      ctx.drawImage(POLISHED_GREY_IMAGES[body.index], -span / 2, -span / 2, span, span);
    }
    if (body.colourIn > 0) {
      ctx.globalAlpha = body.colourIn;
      ctx.drawImage(POLISHED_IMAGES[body.index], -span / 2, -span / 2, span, span);
      ctx.globalAlpha = 1;
    }
  } else {
    ctx.drawImage(PLAIN_IMAGES[body.index], -size / 2, -size / 2, size, size);
  }
  ctx.restore();
}

function drawDust(ctx, theme) {
  ctx.save();
  ctx.strokeStyle = theme.ink;
  ctx.lineCap = "round";
  for (const mote of sim.dust) {
    const fadeIn = clamp01(mote.life / 0.25);
    const fadeOut = sim.mode === "charging" || sim.mode === "full" ? 1 : clamp01(1 - mote.life / 3);
    ctx.globalAlpha = 0.4 * fadeIn * fadeOut;
    ctx.lineWidth = mote.size;
    // Short tail along the motion, never longer than 7 pt.
    const speed = Math.hypot(mote.vx, mote.vy) || 1;
    const tail = Math.min(7, speed * 0.012);
    ctx.beginPath();
    ctx.moveTo(mote.x, mote.y);
    ctx.lineTo(mote.x - (mote.vx / speed) * tail, mote.y - (mote.vy / speed) * tail);
    ctx.stroke();
  }
  ctx.restore();
}

function drawWords(ctx, theme) {
  // "Touch anywhere" breathes while waiting and leaves when the finger lands.
  if (sim.mode === "idle" || sim.mode === "collapse") {
    const breathe = 0.7 + 0.3 * Math.sin(sim.clock * 2.2);
    const back = sim.mode === "collapse" ? clamp01(sim.modeTime / 0.6) : 1;
    ctx.save();
    ctx.globalAlpha = breathe * back;
    ctx.fillStyle = theme.ink2;
    // SF Pro 17 semibold, Title Case (WRITING.md 11); the gesture is a hold, so it says so
    ctx.font = "600 17px " + fontStack();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("Touch and Hold", SCREEN_W / 2, SCREEN_H / 2);
    ctx.restore();
  }
  if (sim.labelsAlpha > 0) {
    ctx.save();
    ctx.globalAlpha = sim.labelsAlpha;
    ctx.fillStyle = theme.ink;
    // The shell's tile label: .caption, 12 pt regular
    ctx.font = "400 12px " + fontStack();
    ctx.textAlign = "center";
    for (let index = 0; index < SIDEKICKS.length; index += 1) {
      const slot = gridSlot(index);
      ctx.fillText(SIDEKICKS[index].name, slot.x, slot.y + 30 + 6 + 11);
    }
    ctx.restore();
  }
}

function drawScene(theme) {
  const ctx = sceneCtx;
  ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  ctx.fillStyle = theme.paper;
  ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  for (const body of sim.bodies) {
    drawBody(ctx, body);
  }
  drawWords(ctx, theme);
  drawStatusBar(ctx, theme);
}

// The lens. Two things the 2D scene can't do:
// 1. The black hole, ray traced. Every pixel near the hole sends a light ray past it and bends it
//    with the hole's gravity (the photon orbit equation, in units of the horizon radius rs). Rays
//    that fall in are black: that is the shadow. Rays that cross the disc of hot gas pick up its
//    light, Doppler-brightened on the side spinning toward us. Rays that escape read the scene
//    behind, bent: icons near the hole smear into rings. The disc seen nearly edge-on is lensed over
//    the top and under the bottom of the shadow, as it would be in reality.
// 2. The Midas glass popup: an iOS 26 style glass slab that bends the screen at its rim, frosts it
//    inside and catches the light on its edge.
const FRAGMENT_SHADER = `
precision highp float;
uniform sampler2D uScene;
uniform vec2 uSize;
uniform float uPx;
uniform vec2 uHole;
uniform float uScale;
uniform float uCharge;
uniform float uTime;
uniform float uDark;
uniform float uSourceDist;
uniform float uTilt;
uniform float uDim;
uniform float uDimRadius;
uniform float uFlash;
uniform vec2 uShake;
uniform float uWaveR;
uniform float uWaveAmp;
uniform vec3 uPaper;
uniform vec3 uInk;
uniform vec4 uCardRect;
uniform float uCardRadius;
uniform float uCard;
uniform float uWobble;
uniform float uSeed;
uniform float uWhirl;
uniform float uVariant;

const float DISC_IN = 3.0;
// Swirl A, tight (founder, round 7): a small, crisp disc
const float DISC_OUT = 7.0;
const float MARCH_RADIUS = 20.0;
const float TAIL_OUT = 17.0;

float hash(vec2 cell) {
  return fract(sin(dot(cell, vec2(12.9898, 78.233))) * 43758.5453);
}

float valueNoise(vec2 point) {
  vec2 cell = floor(point);
  vec2 local = fract(point);
  vec2 blend = local * local * (3.0 - 2.0 * local);
  float a = hash(cell);
  float b = hash(cell + vec2(1.0, 0.0));
  float c = hash(cell + vec2(0.0, 1.0));
  float d = hash(cell + vec2(1.0, 1.0));
  return mix(mix(a, b, blend.x), mix(c, d, blend.x), blend.y);
}

float turbulence(vec2 point) {
  float total = 0.0;
  float weight = 0.5;
  for (int octave = 0; octave < 4; octave++) {
    total += weight * valueNoise(point);
    point = point * 2.03 + vec2(1.7, 9.2);
    weight *= 0.5;
  }
  return total;
}

// The screen round the hole turns with it, most near the hole, as the charge builds: a whirlpool.
vec2 whirlpool(vec2 point) {
  vec2 relative = point - uHole;
  float reach = length(relative);
  float twist = uWhirl * uCharge * 1.2 * exp(-reach / 120.0);
  float c = cos(twist);
  float s = sin(twist);
  return uHole + vec2(c * relative.x - s * relative.y, s * relative.x + c * relative.y);
}

vec3 sceneAt(vec2 rawPoint) {
  vec2 point = uScale > 0.05 ? whirlpool(rawPoint) : rawPoint;
  vec2 uv = point / uSize;
  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
    return uPaper;
  }
  return texture2D(uScene, vec2(uv.x, 1.0 - uv.y)).rgb;
}

float gasStreaks(float radius, float turn) {
  vec2 swirl = vec2(log(radius) * 7.0, turn * 3.0 / 3.14159);
  return turbulence(vec2(swirl.x * 2.4 + swirl.y * 1.1, swirl.y * 2.6));
}

float gasClumps(float radius, float turn) {
  vec2 swirl = vec2(log(radius) * 5.5, turn * 3.0 / 3.14159);
  return turbulence(swirl * vec2(3.0, 5.0) + 4.0);
}

// Round 10: eight takes on today's hole (uVariant 0..7). 0 is today's, unchanged.
float variantDensity(float today, float radius, float angle, float spin, float streaks, float lanes, float edgeOut) {
  float turn = angle + spin;
  float wrap = (angle + 3.14159) / 6.28318;
  if (uVariant < 0.5) {
    return today;
  }
  if (uVariant < 1.5) {
    // 1 Silk: twice as many threads, hairline thin, nothing else
    vec2 here = vec2(log(radius) * 14.0 + turn * 2.2, turn * 5.2);
    vec2 back = vec2(log(radius) * 14.0 + (turn - 6.28318) * 2.2, (turn - 6.28318) * 5.2);
    float fine = mix(turbulence(here + uSeed), turbulence(back + uSeed), wrap);
    float edgeIn = smoothstep(DISC_IN - 0.04, DISC_IN + 0.1, radius);
    return edgeIn * edgeOut * (0.04 + 1.2 * smoothstep(0.5, 0.56, fine));
  }
  if (uVariant < 2.5) {
    // 2 Bold: few thick bands, hard edges, black between
    float bands = smoothstep(0.47, 0.5, streaks);
    float edgeIn = smoothstep(DISC_IN - 0.04, DISC_IN + 0.1, radius);
    return edgeIn * edgeOut * (0.02 + 1.3 * bands);
  }
  if (uVariant < 3.5) {
    // 3 Photon ring: the disc goes quiet; a thin bright ring at the core does the work (in world())
    return today * 0.35;
  }
  if (uVariant < 5.5) {
    // 4 Glow and 5 Ink use today's gas; the change is in world()
    return today;
  }
  if (uVariant < 6.5) {
    // 6 Gap: a black gap between core and gas, so the disc floats
    float edgeIn = smoothstep(4.1, 4.3, radius);
    return today * edgeIn;
  }
  // 7 Tails: today's gas plus two short trailing arms that thin out
  float logR = log(radius);
  float pattern = uTime * 0.5 + uSeed;
  float across = abs(fract((2.0 * (angle + pattern) + logR * 5.0) / 6.28318) - 0.5) * 2.0;
  float width = mix(0.2, 0.05, smoothstep(DISC_OUT, TAIL_OUT, radius));
  float arm = 1.0 - smoothstep(0.0, width, 1.0 - across);
  float fade = 1.0 - smoothstep(DISC_OUT, TAIL_OUT * 0.9, radius);
  float beyond = smoothstep(DISC_OUT * 0.7, DISC_OUT * 1.05, radius);
  return today + beyond * arm * fade * fade * 1.1;
}

// Hot gas at a point on the disc, in rs units. Returns light (rgb) and how opaque it is (a).
vec4 discLight(vec3 hit, vec3 normal, vec3 rayDir) {
  float radius = length(hit);
  vec3 axisA = vec3(1.0, 0.0, 0.0);
  vec3 axisB = normalize(cross(normal, axisA));
  float angle = atan(dot(hit, axisB), dot(hit, axisA));
  // Keplerian spin: inner gas laps the outer gas
  float spin = uTime * (0.6 + 1.6 * uCharge) * 9.0 * pow(radius, -1.5) + uSeed;
  // atan jumps at -pi/pi; blending the gas with its copy one turn back hides the seam
  float wrap = (angle + 3.14159) / 6.28318;
  float streaks = mix(gasStreaks(radius, angle + spin), gasStreaks(radius, angle - 6.28318 + spin), wrap);
  float clumps = mix(gasClumps(radius, angle + spin), gasClumps(radius, angle - 6.28318 + spin), wrap);
  // Thin-disc temperature: hottest just outside the inner edge
  float temperature = pow(DISC_IN / radius, 0.75) * pow(max(1.0 - sqrt(DISC_IN / radius), 0.0), 0.25);
  // Peak temperature is about 0.49; scale so the inner disc burns white and the outer disc still glows
  float brightness = 3.2 * pow(temperature / 0.49, 2.0);
  if (uVariant > 6.5) {
    brightness = max(brightness, 0.55);
  }
  // Doppler beaming: gas moving toward the eye is brighter
  vec3 orbit = normalize(cross(normal, hit));
  float speed = sqrt(0.5 / radius);
  float toward = dot(orbit, -rayDir) * speed;
  float doppler = pow(1.0 / max(1.0 - toward, 0.2), 3.0);
  // Gravitational redshift dims the innermost gas
  float redshift = sqrt(max(1.0 - 1.0 / radius, 0.0));
  // Crisp: hard inner and outer circles, and the gas cut into sharp filaments instead of a haze
  float edgeIn = smoothstep(DISC_IN - 0.04, DISC_IN + 0.12, radius);
  float edgeOut = 1.0 - smoothstep(DISC_OUT * 0.9, DISC_OUT, radius);
  float filaments = smoothstep(0.44, 0.62, streaks);
  float specks = smoothstep(0.55, 0.62, clumps);
  // Light whirlpool (founder, round 8): three soft lanes wound by the spin, under the threads
  float lanes = smoothstep(0.35, 1.0, 0.5 + 0.5 * sin(3.0 * (angle + spin) - log(radius) * 4.5));
  float density = edgeIn * edgeOut * (0.08 + 1.15 * filaments + 0.3 * specks + 0.4 * uWhirl * lanes);
  density = variantDensity(density, radius, angle, spin, streaks, lanes, edgeOut);
  // Flicker: a little, so it lives without going soft
  float flicker = 0.88 + 0.24 * valueNoise(vec2(radius * 1.3 + uSeed, uTime * 2.6));
  float light = brightness * doppler * redshift * density * flicker * (0.35 + 0.65 * uCharge);
  // White-hot, a touch cooler on the dim side; no colour of its own (DESIGN.md: no gold)
  vec3 tint = mix(vec3(0.86, 0.88, 0.92), vec3(1.0), clamp(light * 0.8, 0.0, 1.0));
  return vec4(tint * light, clamp(density * 0.95, 0.0, 0.95));
}

// The black hole for one pixel. q: the pixel relative to the hole, in rs, y up.
vec3 blackHole(vec2 q, vec3 background, out bool lensed, out vec2 sourcePoint) {
  lensed = false;
  sourcePoint = vec2(0.0);
  vec3 normal = normalize(vec3(0.0, cos(uTilt), -sin(uTilt)));
  vec3 position = vec3(q, -MARCH_RADIUS);
  vec3 direction = vec3(0.0, 0.0, 1.0);
  vec3 angular = cross(position, direction);
  float h2 = dot(angular, angular);
  vec3 light = vec3(0.0);
  float cover = 0.0;
  bool captured = false;
  for (int stepIndex = 0; stepIndex < 220; stepIndex++) {
    float radius = length(position);
    float dt = clamp(0.09 * radius, 0.03, 1.2);
    vec3 before = position;
    // Photon bending: a = -3/2 h^2 r / |r|^5
    direction += -1.5 * h2 * position / pow(radius, 5.0) * dt;
    direction = normalize(direction);
    position += direction * dt;
    float sideA = dot(before, normal);
    float sideB = dot(position, normal);
    if (sideA * sideB < 0.0) {
      vec3 hit = mix(before, position, sideA / (sideA - sideB));
      float hitRadius = length(hit);
      if (hitRadius > DISC_IN - 0.3 && hitRadius < (uVariant > 6.5 ? TAIL_OUT : DISC_OUT)) {
        vec4 gas = discLight(hit, normal, direction);
        light += (1.0 - cover) * gas.rgb * gas.a;
        cover += (1.0 - cover) * gas.a;
      }
    }
    if (length(position) < 1.0) {
      captured = true;
      break;
    }
    if (position.z > MARCH_RADIUS && length(position) > MARCH_RADIUS) {
      break;
    }
  }
  vec3 behind = vec3(0.0);
  if (!captured && direction.z > 0.08) {
    // Follow the ray's outgoing line back to the plane the scene sits on.
    lensed = true;
    sourcePoint = position.xy + direction.xy * (uSourceDist - position.z) / direction.z;
  }
  return light + (1.0 - cover) * behind;
}

float roundedBox(vec2 point, vec2 halfSize, float radius) {
  vec2 corner = abs(point) - halfSize + radius;
  return length(max(corner, 0.0)) + min(max(corner.x, corner.y), 0.0) - radius;
}

vec2 cardCentre() {
  return uCardRect.xy + uCardRect.zw * 0.5;
}

float cardField(vec2 point) {
  float grow = mix(0.985, 1.0, uCard);
  vec2 local = (point - cardCentre()) / grow;
  return roundedBox(local, uCardRect.zw * 0.5, uCardRadius) * grow;
}

// The whole screen as it would look with no popup: scene, shockwave, hole, darkening.
vec3 world(vec2 point) {
  vec2 offset = point - uHole;
  float dist = max(length(offset), 0.0001);
  vec2 dir = offset / dist;
  vec2 source = point;

  // Shockwave: a travelling ripple that refracts the screen
  float front = dist - uWaveR;
  float bump = exp(-front * front / 900.0);
  source -= dir * bump * uWaveAmp;

  vec3 colour;
  vec3 holeLight = vec3(0.0);
  float shadow = 0.0;
  if (uScale > 0.05) {
    vec2 q = offset / uScale;
    q.y = -q.y;
    // An unstable disc: the gas around the hole breathes and ripples. The black core itself stays a
    // perfect circle (founder, round 5): the ripple starts past the disc's inner edge (3 rs), so the core's rim stays round.
    // Sums of sines in the angle stay seamless all the way round; uSeed makes every press differ.
    float around = atan(q.y, q.x);
    float jitter = valueNoise(vec2(uTime * 1.7 + uSeed, uSeed));
    float ripple = 0.07 * sin(3.0 * around + uTime * 2.3 + uSeed)
      + 0.05 * sin(5.0 * around - uTime * 3.7 + uSeed * 1.9)
      + 0.03 * sin(8.0 * around + uTime * 5.3 + uSeed * 0.7)
      + 0.04 * (jitter - 0.5);
    float nearCore = smoothstep(4.2, 5.6, length(q)) * (1.0 - smoothstep(5.6, 10.0, length(q)));
    q *= 1.0 + uWobble * ripple * nearCore * (0.6 + 0.6 * uCharge);
    float impact = length(q);
    if (impact < MARCH_RADIUS) {
      bool lensed;
      vec2 sourceQ;
      holeLight = blackHole(q, vec3(0.0), lensed, sourceQ);
      if (lensed) {
        vec2 sourcePoint = uHole + vec2(sourceQ.x, -sourceQ.y) * uScale;
        colour = sceneAt(sourcePoint + (source - point));
      } else {
        colour = vec3(0.0);
        shadow = 1.0;
      }
    } else {
      // Far out the bending is weak: deflection 2 rs / b, seen across the source distance
      vec2 bentQ = q - (q / impact) * (2.0 / impact) * uSourceDist;
      vec2 sourcePoint = uHole + vec2(bentQ.x, -bentQ.y) * uScale;
      colour = sceneAt(sourcePoint + (source - point));
    }
  } else {
    colour = sceneAt(source);
  }

  // The hole eats light: the screen darkens around it as it charges
  float dimFalloff = exp(-pow(dist / max(uDimRadius, 1.0), 2.0));
  float dimAmount = uDim * dimFalloff * (1.0 - shadow);
  bool inkHole = uVariant > 4.5 && uVariant < 5.5 && uDark < 0.5;
  if (inkHole) {
    // 5 Ink: on white the screen stays white and the gas is drawn in ink
    colour = mix(colour, uInk, clamp(dot(holeLight, vec3(0.33)), 0.0, 1.0));
  } else {
    colour = mix(colour, vec3(0.008), clamp(dimAmount, 0.0, 0.985));
    colour += holeLight;
  }
  if (uScale > 0.05) {
    float impactNow = dist / uScale;
    if (uVariant > 2.5 && uVariant < 3.5) {
      // 3 Photon ring: hairline of light just outside the core
      colour += vec3(1.0) * exp(-pow((impactNow - 2.68) / 0.09, 2.0)) * (0.5 + 0.8 * uCharge);
    }
    if (uVariant > 3.5 && uVariant < 4.5) {
      // 4 Glow: a soft bloom round the disc
      colour += vec3(0.9, 0.92, 0.96) * 0.32 * uCharge * exp(-max(impactNow - 3.0, 0.0) / 3.2) * (1.0 - shadow);
    }
  }
  colour = mix(colour, uInk, bump * clamp(uWaveAmp / 34.0, 0.0, 1.0) * 0.18);
  // The burst: a white flash from the centre
  colour += vec3(1.0) * uFlash * exp(-dist / 140.0);
  return colour;
}

// iOS 26 glass over the world.
vec3 glass(vec2 point, vec3 below) {
  float field = cardField(point);
  float eps = 1.0;
  vec2 normal = normalize(vec2(
    cardField(point + vec2(eps, 0.0)) - cardField(point - vec2(eps, 0.0)),
    cardField(point + vec2(0.0, eps)) - cardField(point - vec2(0.0, eps))
  ) + 1e-5);
  if (field > 0.0) {
    // Soft shadow under the slab
    float shade = exp(-field / 22.0) * (uDark > 0.5 ? 0.5 : 0.14);
    return below * (1.0 - shade * uCard);
  }
  float depth = -field;
  // The rim acts as a lens: near the edge the slab shows what is just outside it.
  float rim = 1.0 - clamp(depth / 26.0, 0.0, 1.0);
  float bend = rim * rim * rim * 30.0;
  vec3 seen;
  seen.r = world(point + normal * bend * 1.06).r;
  seen.g = world(point + normal * bend).g;
  seen.b = world(point + normal * bend * 0.94).b;
  // Frost: a small blur, then a wash of paper so text reads
  vec3 frost = vec3(0.0);
  for (int tap = 0; tap < 12; tap++) {
    float turn = float(tap) * 2.39996;
    float reach = 3.0 + 9.0 * sqrt(float(tap) / 12.0);
    frost += world(point + normal * bend + vec2(cos(turn), sin(turn)) * reach);
  }
  frost /= 12.0;
  vec3 body = mix(seen, frost, 0.8);
  float grey = dot(body, vec3(0.299, 0.587, 0.114));
  body = mix(vec3(grey), body, 1.5);
  vec3 wash = uDark > 0.5 ? vec3(0.11, 0.11, 0.12) : vec3(1.0);
  body = mix(body, wash, uDark > 0.5 ? 0.74 : 0.72);
  // Edge light: a bright hairline, strongest where the rim faces the light (top-left)
  vec2 lightDir = normalize(vec2(-0.6, -1.0));
  float facing = max(dot(normal, lightDir), 0.0);
  float across = max(dot(normal, -lightDir), 0.0);
  float hairline = exp(-depth / 0.9);
  float innerGlow = exp(-depth / 7.0);
  float specular = hairline * (0.25 + 0.75 * pow(facing, 1.5)) + hairline * 0.45 * pow(across, 2.0);
  vec3 edgeLight = vec3(1.0) * (specular * (uDark > 0.5 ? 0.7 : 1.0) + innerGlow * 0.12);
  // A faint dark keyline outside the light, so the slab has an edge on white
  vec3 slab0 = body + edgeLight;
  slab0 = mix(slab0, uInk, exp(-depth / 0.6) * (uDark > 0.5 ? 0.0 : 0.10));
  return mix(below, slab0, uCard);
}

void main() {
  vec2 point = vec2(gl_FragCoord.x, uSize.y * uPx - gl_FragCoord.y) / uPx + uShake;
  vec3 colour = world(point);
  if (uCard > 0.001) {
    colour = glass(point, colour);
  }
  gl_FragColor = vec4(colour, 1.0);
}
`;

const VERTEX_SHADER = `
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const lens = { gl: null, flat: null, program: null, texture: null, uniforms: {} };

function compileShader(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(shader));
  }
  return shader;
}

function setupLens() {
  const canvas = document.getElementById("gl");
  const gl = canvas.getContext("webgl", { antialias: false, preserveDrawingBuffer: true });
  lens.gl = gl;
  if (!gl) {
    // No WebGL: draw the scene flat, without the lens.
    lens.flat = canvas.getContext("2d");
    return;
  }
  const program = gl.createProgram();
  gl.attachShader(program, compileShader(gl, gl.VERTEX_SHADER, VERTEX_SHADER));
  gl.attachShader(program, compileShader(gl, gl.FRAGMENT_SHADER, FRAGMENT_SHADER));
  gl.linkProgram(program);
  gl.useProgram(program);
  lens.program = program;

  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, "aPos");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

  lens.texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, lens.texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

  const names = ["uScene", "uSize", "uPx", "uHole", "uScale", "uCharge", "uTime", "uDark", "uSourceDist", "uTilt", "uDim", "uDimRadius", "uFlash", "uShake", "uWaveR", "uWaveAmp", "uPaper", "uInk", "uCardRect", "uCardRadius", "uCard", "uWobble", "uSeed", "uWhirl", "uVariant"];
  for (const name of names) {
    lens.uniforms[name] = gl.getUniformLocation(program, name);
  }
}

function sizeCanvases() {
  const scale = phoneScale();
  document.documentElement.style.setProperty("--scale", scale);
  pixelRatio = Math.min(3, scale * (window.devicePixelRatio || 1) * 1.15);
  sceneCanvas.width = Math.round(SCREEN_W * pixelRatio);
  sceneCanvas.height = Math.round(SCREEN_H * pixelRatio);
  const glCanvas = document.getElementById("gl");
  glCanvas.width = sceneCanvas.width;
  glCanvas.height = sceneCanvas.height;
}

function phoneScale() {
  if (BARE) {
    // Fill the frame the variants page gives us
    const byWidth = (window.innerWidth - 20) / (SCREEN_W + 20);
    const byFrameHeight = (window.innerHeight - 20) / (SCREEN_H + 20);
    return Math.min(byWidth, byFrameHeight);
  }
  const byHeight = (window.innerHeight - 56) / (SCREEN_H + 20);
  return Math.max(0.3, Math.min(1, byHeight));
}

function renderLens(theme) {
  const gl = lens.gl;
  if (!gl) {
    lens.flat.setTransform(1, 0, 0, 1, 0, 0);
    lens.flat.drawImage(sceneCanvas, 0, 0);
    return;
  }
  const uniforms = lens.uniforms;
  gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
  gl.bindTexture(gl.TEXTURE_2D, lens.texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, sceneCanvas);
  const charge = sim.mode === "full" ? 1 : clamp01(sim.holdTime / settings.params.charge);
  const pulse = sim.mode === "full" ? 1 + 0.05 * Math.sin(sim.clock * 46) : 1;
  const params = settings.params;
  gl.uniform1i(uniforms.uScene, 0);
  gl.uniform2f(uniforms.uSize, SCREEN_W, SCREEN_H);
  gl.uniform1f(uniforms.uPx, pixelRatio);
  gl.uniform2f(uniforms.uHole, sim.hole.x, sim.hole.y);
  // The shadow of a black hole is about 2.6 horizon radii across: hole size sets the scale.
  gl.uniform1f(uniforms.uScale, (sim.hole.radius * pulse) / 2.6);
  gl.uniform1f(uniforms.uCharge, charge);
  gl.uniform1f(uniforms.uTime, sim.clock);
  gl.uniform1f(uniforms.uDark, settings.theme === "Dark" ? 1 : 0);
  gl.uniform1f(uniforms.uSourceDist, params.lens * 5);
  gl.uniform1f(uniforms.uTilt, params.tilt * Math.PI / 180);
  gl.uniform1f(uniforms.uDim, sim.dim * params.dark);
  gl.uniform1f(uniforms.uDimRadius, lerp(120, 560, charge));
  gl.uniform1f(uniforms.uFlash, sim.flash);
  gl.uniform2f(uniforms.uShake, sim.shake.x, sim.shake.y);
  gl.uniform1f(uniforms.uWaveR, sim.wave.radius);
  gl.uniform1f(uniforms.uWaveAmp, sim.wave.amp);
  gl.uniform3fv(uniforms.uPaper, theme.paperRgb);
  gl.uniform3fv(uniforms.uInk, theme.inkRgb);
  gl.uniform4f(uniforms.uCardRect, CARD.x, CARD.y, CARD.w, CARD.h);
  gl.uniform1f(uniforms.uCardRadius, CARD.radius);
  gl.uniform1f(uniforms.uCard, easeInOutSine(sim.card));
  gl.uniform1f(uniforms.uWobble, params.wobble);
  gl.uniform1f(uniforms.uSeed, sim.seed);
  gl.uniform1f(uniforms.uWhirl, params.whirl);
  gl.uniform1f(uniforms.uVariant, VARIANT);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ---------- The Midas glass popup ----------

// Centred on the screen; its top edge lies over the second row of icons so the glass bends them.
const CARD = { x: 24, y: 297, w: 354, h: 252, radius: 44 };

function placeCard() {
  const card = document.getElementById("card");
  card.style.left = CARD.x + "px";
  card.style.top = CARD.y + "px";
  card.style.width = CARD.w + "px";
  card.style.height = CARD.h + "px";
}

// The glass itself is drawn by the shader; the words sit on top of it and follow sim.card.
// The glass settles first, then "Midas" writes in, then the line under it: one after another, slowly.
function wordShare(start, length) {
  return easeInOutSine(clamp01((sim.card - start) / length));
}

function updateCardWords() {
  const card = document.getElementById("card");
  const shown = easeInOutSine(sim.card);
  card.style.opacity = "1";
  card.style.transform = "scale(" + lerp(0.985, 1, shown) + ")";
  const word = card.querySelector(".word");
  const line = card.querySelector(".line");
  word.style.opacity = String(wordShare(0.3, 0.6));
  word.style.transform = "translateY(" + lerp(6, 0, wordShare(0.3, 0.6)) + "px)";
  line.style.opacity = String(wordShare(0.55, 0.45));
  card.style.pointerEvents = sim.card > 0.99 ? "auto" : "none";
  const go = document.getElementById("go");
  const buttonShown = sim.mode === "home" && sim.modeTime >= settings.params.cardWait + settings.params.sheet + settings.params.goDelay;
  go.classList.toggle("on", buttonShown);
}

// ---------- Loop ----------

let lastStamp = null;
let carry = 0;
let stepOnce = false;

function updateReadout() {
  const readout = document.getElementById("readout");
  if (sim.mode === "idle") {
    readout.textContent = "waiting for touch";
    return;
  }
  const since = sim.clock - sim.pressClock;
  readout.textContent = sim.mode + " · " + since.toFixed(2) + " s since touch";
}

function updateHaptic() {
  document.getElementById("hapticFill").style.width = Math.round(sim.haptic * 100) + "%";
  document.getElementById("hapticTap").style.opacity = String(sim.hapticTap);
}

function onAnimationFrame(stamp) {
  if (lastStamp === null) {
    lastStamp = stamp;
  }
  const delta = Math.min(0.05, (stamp - lastStamp) / 1000);
  lastStamp = stamp;
  if (!sim.paused) {
    carry += delta * settings.speed;
  } else if (stepOnce) {
    carry += 1 / 60;
    stepOnce = false;
  }
  while (carry >= STEP) {
    stepWorld();
    carry -= STEP;
  }
  const theme = THEMES[settings.theme];
  drawScene(theme);
  renderLens(theme);
  updateCardWords();
  updateReadout();
  updateHaptic();
  requestAnimationFrame(onAnimationFrame);
}

// ---------- Controls ----------

const sliderInputs = {};

function summaryText() {
  const params = settings.params;
  const parts = [
    settings.presetLabel,
    "pull in " + params.charge.toFixed(2),
    "hold full " + params.full.toFixed(2),
    "burst " + params.burst.toFixed(2),
    "jumble " + params.pause.toFixed(2),
    "line up " + params.settle.toFixed(2),
    "popup wait " + params.cardWait.toFixed(2),
    "popup " + params.sheet.toFixed(2),
    "button +" + params.goDelay.toFixed(1),
    "shake " + params.shake,
    "swirl " + params.swirl,
    "bend " + params.lens,
    "tilt " + params.tilt,
    "dark " + params.dark,
    "whirlpool " + params.whirl,
    "colour " + settings.colour + " " + settings.colourIn.toLowerCase(),
    "hole " + params.hole,
  ];
  return parts.join(" · ");
}

function makeChoiceButtons(containerId, options, getValue, setValue) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  function onChoiceClick(event) {
    setValue(event.currentTarget.dataset.value);
    saveSettings();
    refreshControls();
  }
  for (const option of options) {
    const button = document.createElement("button");
    button.className = "btn";
    button.dataset.value = option;
    button.textContent = option;
    button.setAttribute("aria-pressed", String(getValue() === option));
    button.addEventListener("click", onChoiceClick);
    container.appendChild(button);
  }
}

function presetLabels() {
  const labels = [];
  for (const preset of PRESETS) {
    labels.push(preset.label);
  }
  if (settings.presetLabel === "custom") {
    labels.push("custom");
  }
  return labels;
}

function getPreset() { return settings.presetLabel; }
function setPreset(label) {
  for (const preset of PRESETS) {
    if (preset.label === label) {
      Object.assign(settings.params, preset.values);
      settings.presetLabel = label;
    }
  }
}
function getSpeed() { return settings.speed + "×"; }
function setSpeed(label) { settings.speed = parseFloat(label); }
function getTheme() { return settings.theme; }
function setTheme(value) {
  settings.theme = value;
  // "Before" icons are grey in the theme's own greys
  if (POLISHED_IMAGES.length > 0) {
    buildPlainIcons();
    buildPolishedIcons();
  }
  const phone = document.getElementById("phone");
  phone.className = "phone " + (value === "Dark" ? "theme-dark" : "theme-light");
}

function getColourIn() { return settings.colourIn; }
function setColourIn(value) { settings.colourIn = value; }
function getColour() { return settings.colour; }
function setColour(value) {
  settings.colour = value;
  buildPolishedIcons();
}

function refreshControls() {
  makeChoiceButtons("presetRow", presetLabels(), getPreset, setPreset);
  makeChoiceButtons("speedRow", ["0.25×", "0.5×", "1×"], getSpeed, setSpeed);
  makeChoiceButtons("themeRow", ["Light", "Dark"], getTheme, setTheme);
  makeChoiceButtons("colourRow", ["Volt", "Ink", "Paper", "Eight"], getColour, setColour);
  makeChoiceButtons("colourInRow", ["On landing", "At burst"], getColourIn, setColourIn);
  for (const slider of SLIDERS) {
    const entry = sliderInputs[slider.key];
    entry.input.value = String(settings.params[slider.key]);
    entry.output.textContent = settings.params[slider.key] + slider.unit;
  }
  document.getElementById("pickChip").textContent = summaryText();
}

const TIMING_KEYS = ["charge", "full", "burst", "pause", "settle", "sheet"];

function onSliderInput(event) {
  const key = event.target.dataset.key;
  settings.params[key] = Number(event.target.value);
  if (TIMING_KEYS.includes(key)) {
    settings.presetLabel = "custom";
  }
  saveSettings();
  refreshControls();
}

function buildSliders() {
  const container = document.getElementById("sliders");
  for (const slider of SLIDERS) {
    const label = document.createElement("label");
    label.className = "slider";
    const name = document.createElement("span");
    name.textContent = slider.label;
    const input = document.createElement("input");
    input.type = "range";
    input.min = String(slider.min);
    input.max = String(slider.max);
    input.step = String(slider.step);
    input.dataset.key = slider.key;
    input.addEventListener("input", onSliderInput);
    const output = document.createElement("output");
    label.appendChild(name);
    label.appendChild(input);
    label.appendChild(output);
    container.appendChild(label);
    sliderInputs[slider.key] = { input: input, output: output };
  }
}

// Remembered per browser only; the page works without it.
const STORAGE_KEY = "midas-onboarding-blackhole-v9";

function saveSettings() {
  if (BARE) {
    return;
  }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
  } catch (error) {
    // Private window or blocked storage: keep going without it.
  }
}

function loadSettings() {
  if (BARE) {
    settings.theme = URL_PARAMS.get("theme") || "Light";
    settings.params.hole = Number(URL_PARAMS.get("hole") || settings.params.hole);
    return;
  }
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) { return; }
    const saved = JSON.parse(raw);
    Object.assign(settings.params, saved.params);
    settings.presetLabel = saved.presetLabel || settings.presetLabel;
    settings.speed = saved.speed || settings.speed;
    settings.theme = saved.theme || settings.theme;
    settings.colour = saved.colour || settings.colour;
    settings.colourIn = saved.colourIn || settings.colourIn;
  } catch (error) {
    // Ignore unreadable storage.
  }
}

function onDemoClick() {
  resetSim();
  sim.demo = { time: 0, wait: 0.7, x: 201, y: 520, pressed: false };
}

function onResetClick() {
  resetSim();
}

function onPauseClick() {
  sim.paused = !sim.paused;
  document.getElementById("pauseBtn").textContent = sim.paused ? "Resume" : "Pause";
}

function onStepClick() {
  if (!sim.paused) {
    onPauseClick();
  }
  stepOnce = true;
}

function onKeyDown(event) {
  if (event.target.tagName === "INPUT") { return; }
  if (event.code === "Space") {
    event.preventDefault();
    onPauseClick();
  } else if (event.code === "KeyR") {
    onDemoClick();
  }
}

// The variants page drives every phone at once.
function onParentMessage(event) {
  const message = event.data || {};
  if (message.cmd === "demo") {
    onDemoClick();
  } else if (message.cmd === "reset") {
    onResetClick();
  } else if (message.cmd === "theme") {
    setTheme(message.value);
  } else if (message.cmd === "hole") {
    settings.params.hole = Number(message.value);
  }
}

function applyBareLayout() {
  document.body.classList.add("bare");
}

function start() {
  loadSettings();
  if (BARE) {
    applyBareLayout();
    window.addEventListener("message", onParentMessage);
  }
  setTheme(settings.theme);
  buildAllIcons();
  buildSliders();
  refreshControls();
  sizeCanvases();
  setupLens();
  placeCard();
  resetSim();
  const phone = document.getElementById("phone");
  phone.addEventListener("pointerdown", onPhonePointerDown);
  phone.addEventListener("pointermove", onPhonePointerMove);
  phone.addEventListener("pointerup", onPhonePointerUp);
  phone.addEventListener("pointercancel", onPhonePointerUp);
  document.getElementById("demoBtn").addEventListener("click", onDemoClick);
  document.getElementById("resetBtn").addEventListener("click", onResetClick);
  document.getElementById("pauseBtn").addEventListener("click", onPauseClick);
  document.getElementById("stepBtn").addEventListener("click", onStepClick);
  window.addEventListener("resize", sizeCanvases);
  window.addEventListener("keydown", onKeyDown);
  requestAnimationFrame(onAnimationFrame);
}

// Wait for the hand font so "Midas" never draws in a fallback face.
function onFontsReady() {
  start();
}

document.fonts.load('700 64px "MidasHand"').then(onFontsReady, onFontsReady);
</script>
