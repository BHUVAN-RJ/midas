<title>Privacy and Support Pages</title>
<style>
/* Mockup chrome: light, like the other docs/mockups pages. Each frame carries its own theme. */
:root {
  --page: #FAFAFA;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", sans-serif;
  --phone-scale: 0.6;
  --desk-scale: 0.42;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: #111111; font-family: var(--font); -webkit-font-smoothing: antialiased; }
.page { max-width: 1680px; margin: 0 auto; padding: 0 24px 96px; }
h1 { font-size: 28px; margin: 28px 0 0; letter-spacing: -0.4px; }
.date { color: #6B6B6B; font-size: 14px; margin: 4px 0 0; }
.date a { color: inherit; }

.picks { position: sticky; top: 0; z-index: 40; background: rgba(250, 250, 250, 0.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid rgba(17, 17, 17, 0.12); margin: 0 -24px; padding: 10px 24px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 15px; }
.pick-chip { font-size: 13px; font-weight: 700; border: 1.5px solid #111111; border-radius: 999px; padding: 3px 10px; }

.rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; margin-top: 18px; max-width: 760px; }
.pick-row { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; background: #FFFFFF; border: 1.5px solid rgba(17, 17, 17, 0.12); border-radius: 16px; padding: 10px 14px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.pick-row:hover { border-color: #6B6B6B; }
.pick-row[aria-pressed="true"] { border-color: #111111; box-shadow: 0 0 0 1.5px #111111; }
.pick-id { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.pick-name { font-size: 15px; font-weight: 600; }
.pick-words { font-size: 12.5px; color: #6B6B6B; margin-top: 2px; line-height: 17px; }

section.proto { margin-top: 56px; }
.proto-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.proto-head h2 { font-size: 22px; margin: 0; letter-spacing: -0.3px; }
.proto-actions { margin-left: auto; display: flex; gap: 8px; }
.btn { font: inherit; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #111111; border: 1px solid rgba(17, 17, 17, 0.14); border-radius: 999px; padding: 6px 12px; cursor: pointer; text-decoration: none; }

.frames { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; margin-top: 16px; }
.frame-label { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: #6B6B6B; text-transform: uppercase; margin-bottom: 8px; }
.phone-box { width: calc(402px * var(--phone-scale) + 16px); height: calc(874px * var(--phone-scale) + 16px); position: relative; }
.phone { position: absolute; left: 8px; top: 8px; width: 402px; height: 874px; transform: scale(var(--phone-scale)); transform-origin: top left; border-radius: 56px; overflow: hidden; background: #000000; box-shadow: 0 0 0 10px #111111, 0 20px 50px rgba(0, 0, 0, 0.18); }
.phone iframe { position: absolute; left: 0; top: 54px; width: 402px; height: 820px; border: 0; }
.phone .island { position: absolute; top: 11px; left: 50%; width: 126px; height: 37px; margin-left: -63px; background: #000000; border-radius: 19px; }
.desk-box { width: calc(1440px * var(--desk-scale)); height: calc(940px * var(--desk-scale)); position: relative; }
.desk { position: absolute; left: 0; top: 0; width: 1440px; height: 940px; transform: scale(var(--desk-scale)); transform-origin: top left; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 2px rgba(17, 17, 17, 0.14), 0 20px 50px rgba(0, 0, 0, 0.14); background: #FFFFFF; }
.desk .chrome { height: 40px; background: #ECECEC; display: flex; align-items: center; gap: 10px; padding: 0 16px; }
.desk .chrome i { width: 13px; height: 13px; border-radius: 50%; background: #C8C8C8; display: block; }
.desk .chrome .url { margin-left: 80px; flex: 0 1 520px; height: 26px; border-radius: 8px; background: #FFFFFF; color: #6B6B6B; font-size: 14px; display: flex; align-items: center; padding: 0 12px; }
.desk.dark-chrome { background: #111111; }
.desk.dark-chrome .chrome { background: #2A2A2A; }
.desk.dark-chrome .chrome i { background: #555555; }
.desk.dark-chrome .chrome .url { background: #1C1C1C; color: #A3A3A3; }
.desk iframe { width: 1440px; height: 900px; border: 0; display: block; }
@media (max-width: 700px) { :root { --phone-scale: 0.5; --desk-scale: 0.22; } }
</style>

  const ornament = variantId === "P2" ? tipsMarkup() : "";
  const header = `<header class="top"><a class="mark" href="home-page-2026-10-31.html" target="_top">Midas</a>${ornament}</header>`;
  const footer = `<footer class="foot">${footerLink("privacy", "Privacy", pageKey)}${footerLink("support", "Support", pageKey)}<span class="copy-note">© 2026 Midas</span></footer>`;
  return `<!doctype html><html lang="en"${themeAttribute}><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${escapeHtml(page.title)}</title></head><body>${style}${header}<main class="doc"><h1>${escapeHtml(page.title)}</h1>${subtitle}${sections}</main>${footer}</body></html>`;
}

function readPick() {
  try {
    return localStorage.getItem(PICK_KEY) || "P1";
  } catch (error) {
    return "P1";
  }
}

function savePick(variantId) {
  try {
    localStorage.setItem(PICK_KEY, variantId);
  } catch (error) {
    // Private window: the pick lasts only for this visit
  }
}

function pageFromHash() {
  const match = location.hash.match(/^#site=(privacy|support)$/);
  return match ? match[1] : "";
}

function replaceWithPage() {
  const html = buildPageDocument(pageFromHash(), "auto", readPick());
  document.open();
  document.write(html);
  document.close();
}

function phoneFrame(pageKey, theme) {
  const background = theme === "dark" ? "#111111" : "#FFFFFF";
  return `<div><div class="frame-label">Phone · ${theme}</div><div class="phone-box"><div class="phone" style="background:${background}"><div class="island"></div><iframe data-page="${pageKey}" data-theme="${theme}" title="${pageKey} phone ${theme}"></iframe></div></div></div>`;
}

function desktopFrame(pageKey, theme) {
  const chromeClass = theme === "dark" ? " dark-chrome" : "";
  return `<div><div class="frame-label">Desktop · ${theme}</div><div class="desk-box"><div class="desk${chromeClass}"><div class="chrome"><i></i><i></i><i></i><div class="url">midas/${pageKey}</div></div><iframe data-page="${pageKey}" data-theme="${theme}" title="${pageKey} desktop ${theme}"></iframe></div></div></div>`;
}

function fillFrames(variantId) {
  const frames = document.querySelectorAll("iframe[data-page]");
  for (const frame of frames) {
    frame.srcdoc = buildPageDocument(frame.dataset.page, frame.dataset.theme, variantId);
  }
}

function showPick(variantId) {
  document.getElementById("pickedChip").textContent = variantId;
  const rows = document.querySelectorAll(".pick-row");
  for (const row of rows) {
    row.setAttribute("aria-pressed", String(row.dataset.id === variantId));
  }
  fillFrames(variantId);
}

function handlePickClick(event) {
  const variantId = event.currentTarget.dataset.id;
  savePick(variantId);
  showPick(variantId);
}

function buildRows() {
  const rows = document.getElementById("rows");
  for (const variant of VARIANTS) {
    const row = document.createElement("button");
    row.className = "pick-row";
    row.dataset.id = variant.id;
    row.innerHTML = `<span class="pick-id">${variant.id}</span><span><div class="pick-name">${variant.name}</div><div class="pick-words">${variant.note}</div></span>`;
    row.addEventListener("click", handlePickClick);
    rows.appendChild(row);
  }
}

function buildSections() {
  const holder = document.getElementById("pages");
  const titles = { privacy: "Privacy", support: "Support" };
  for (const pageKey of ["privacy", "support"]) {
    const section = document.createElement("section");
    section.className = "proto";
    const head = `<div class="proto-head"><h2>${titles[pageKey]}</h2><div class="proto-actions"><a class="btn" href="#site=${pageKey}" target="_blank">Full Size</a></div></div>`;
    const frames = phoneFrame(pageKey, "light") + phoneFrame(pageKey, "dark") + desktopFrame(pageKey, "light") + desktopFrame(pageKey, "dark");
    section.innerHTML = head + `<div class="frames">${frames}</div>`;
    holder.appendChild(section);
  }
}

function reloadOnSiteHash() {
  if (location.hash.startsWith("#site=")) {
    location.reload();
  }
}

if (pageFromHash()) {
  document.body.style.visibility = "hidden";
  window.addEventListener("load", replaceWithPage);
} else {
  buildRows();
  buildSections();
  showPick(readPick());
  window.addEventListener("hashchange", reloadOnSiteHash);
}
</script>
</body>
</html>
