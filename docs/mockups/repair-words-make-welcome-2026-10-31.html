/* Midas tokens, docs/DESIGN.md 2.1, 2.2, 2.4. Page chrome is light; each phone carries its own theme. */
:root {
  --page: #FAFAFA;
  --volt: #CEFF00;
  --turq: #30D5C8;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", sans-serif;
  --hand: "MidasHand", "Caveat", cursive;
}
.theme-light {
  --paper: #FFFFFF; --ink: #111111; --ink-2: #6B6B6B; --ink-3: #BDBDBD;
  --rule: rgba(17, 17, 17, 0.12); --paper-2: #F3F2EF; --shadow: rgba(0, 0, 0, 0.14);
  --frost: rgba(255, 255, 255, 0.8); --frost-edge: rgba(17, 17, 17, 0.12);
  --sheet: #FFFFFF; --dim: rgba(0, 0, 0, 0.32);
}
.theme-dark {
  --paper: #111111; --ink: #FFFFFF; --ink-2: #A3A3A3; --ink-3: #5C5C5C;
  --rule: rgba(255, 255, 255, 0.14); --paper-2: #1C1C1C; --shadow: rgba(0, 0, 0, 0.55);
  --frost: rgba(44, 44, 46, 0.78); --frost-edge: rgba(255, 255, 255, 0.18);
  --sheet: #1C1C1C; --dim: rgba(0, 0, 0, 0.55);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: #111111; font-family: var(--font); }
h1 { font-size: 28px; margin: 0; letter-spacing: -0.4px; }
h2 { font-size: 22px; margin: 0; letter-spacing: -0.3px; }
.page { max-width: 1180px; margin: 0 auto; padding: 24px 16px 96px; display: flex; flex-direction: column; gap: 64px; }

/* Picks, sticky */
.picks { position: sticky; top: 0; z-index: 40; background: rgba(250, 250, 250, 0.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid rgba(17, 17, 17, 0.12); margin: -24px -16px 0; padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.picks b { font-size: 15px; margin-right: 8px; }
.pick-chip { font-size: 14px; font-weight: 600; border: 1.5px solid #111111; border-radius: 999px; padding: 3px 11px; min-width: 48px; text-align: center; }

/* Pick rows */
.rows { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; max-width: 760px; }
.pick-row { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; align-items: center; background: #FFFFFF; border: 1.5px solid rgba(17, 17, 17, 0.12); border-radius: 16px; padding: 12px 16px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.pick-row:hover { border-color: #6B6B6B; }
.pick-row[aria-pressed="true"] { border-color: #111111; box-shadow: 0 0 0 1.5px #111111; }
.pick-id { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.pick-words { font-size: 17px; font-weight: 600; line-height: 22px; }
.pick-where { display: block; font-size: 13px; font-weight: 500; color: #6B6B6B; margin-top: 2px; }

/* Preview */
.preview { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 20px; align-items: flex-start; }
.preview-col { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.phone-tag { font-size: 12px; font-weight: 600; letter-spacing: 0.6px; color: #6B6B6B; text-transform: uppercase; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
.btn { font: inherit; font-size: 14px; background: #FFFFFF; color: #111111; border: 1px solid rgba(17, 17, 17, 0.12); border-radius: 999px; padding: 7px 14px; min-height: 34px; cursor: pointer; }
.btn[aria-pressed="true"] { background: #111111; color: #FFFFFF; border-color: #111111; }
.scrub { width: 220px; accent-color: #111111; }
.time-out { font-size: 13px; color: #6B6B6B; font-variant-numeric: tabular-nums; min-width: 44px; }
.caption { font-size: 13px; color: #6B6B6B; }

/* The phone: iPhone 16 Pro, 402 x 874 pt */
.phone { width: 402px; height: 874px; position: relative; overflow: hidden; border-radius: 56px; background: #000000; box-shadow: 0 0 0 10px #111111, 0 20px 50px rgba(0, 0, 0, 0.18); margin: 10px; user-select: none; -webkit-user-select: none; flex-shrink: 0; }
.screen { position: absolute; inset: 0; background: var(--paper); color: var(--ink); border-radius: 56px; overflow: hidden; }
.island { position: absolute; top: 11px; left: 50%; width: 126px; height: 37px; margin-left: -63px; background: #000000; border-radius: 19px; z-index: 60; }
.status { position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 59; color: var(--ink); font-size: 17px; font-weight: 600; }
.status .time { position: absolute; left: 50px; top: 17px; }
.status .icons { position: absolute; right: 34px; top: 21px; display: flex; gap: 6px; align-items: center; }
.status .bars { width: 18px; height: 12px; background: linear-gradient(90deg, var(--ink) 0 3px, transparent 3px 5px, var(--ink) 5px 8px, transparent 8px 10px, var(--ink) 10px 13px, transparent 13px 15px, var(--ink) 15px 18px); clip-path: polygon(0 100%, 100% 0, 100% 100%); }
.status .battery { width: 26px; height: 12px; border: 1.5px solid var(--ink); border-radius: 4px; position: relative; opacity: 0.9; }
.status .battery::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: var(--ink); border-radius: 1.5px; }
.home-bar { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); z-index: 61; }
.fit { position: relative; flex-shrink: 0; }
.fit-inner { position: absolute; left: 0; top: 0; transform-origin: top left; }

/* A Sidekick page (Water), behind the Edit layer */
.sk { position: absolute; inset: 0; background: var(--paper); color: var(--ink); transform-origin: center; }
.sk .sk-title { position: absolute; left: 20px; top: 122px; font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
.sk .sk-help { position: absolute; right: 20px; top: 128px; width: 30px; height: 30px; border-radius: 50%; background: var(--paper-2); color: var(--ink-2); font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.sk .sk-big { position: absolute; left: 0; right: 0; top: 230px; text-align: center; font-size: 72px; font-weight: 700; letter-spacing: -1.5px; }
.sk .sk-of { position: absolute; left: 0; right: 0; top: 320px; text-align: center; font-size: 17px; color: var(--ink-2); }
.sk .sk-bar { position: absolute; left: 40px; right: 40px; top: 370px; height: 12px; border-radius: 6px; background: var(--paper-2); overflow: hidden; }
.sk .sk-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 62%; background: var(--turq); border-radius: 6px; }
.sk .sk-buttons { position: absolute; left: 40px; right: 40px; top: 430px; display: flex; gap: 12px; }
.sk .sk-btn { flex: 1; height: 52px; border-radius: 26px; background: var(--ink); color: var(--paper); font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.sk .sk-btn.second { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }
.sk .sk-log { position: absolute; left: 20px; right: 20px; top: 530px; font-size: 15px; }
.sk .sk-log div { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.sk .sk-log span { color: var(--ink-2); }
.sk svg.strokes { position: absolute; inset: 0; pointer-events: none; }

/* The Edit layer: V1 rim (silent), tag, Cancel, Undo / Clear, pill (docs/DESIGN.md 2.2, RepairCanvasView) */
.rim { position: absolute; inset: 0; border-radius: 56px; pointer-events: none; z-index: 40; }
.theme-light .rim { box-shadow: inset 0 0 0 4px var(--volt), inset 0 0 0 8px #111111, inset 0 0 18px 8px rgba(206, 255, 0, 0.85); }

.x-btn { position: absolute; left: 16px; top: 70px; width: 40px; height: 40px; border-radius: 50%; background: var(--paper); border: 1px solid var(--rule); box-shadow: 0 2px 5px var(--shadow); display: flex; align-items: center; justify-content: center; z-index: 45; }
.frost { background: var(--frost); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: inset 0 0 0 1px var(--frost-edge), 0 4px 14px var(--shadow); }
.minis { position: absolute; right: 12px; top: 728px; display: flex; gap: 8px; z-index: 45; }
.mini-pill { height: 36px; padding: 0 14px; border-radius: 18px; font-size: 15px; font-weight: 600; display: flex; align-items: center; color: var(--ink); }
.mini-pill.off { opacity: 0.6; }
.theme-dark .mini-pill.off { opacity: 0.5; }
.pillbar { position: absolute; left: 12px; right: 12px; top: 772px; height: 60px; border-radius: 30px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--rule), 0 6px 18px var(--shadow); display: flex; align-items: center; padding: 0 7px; gap: 10px; z-index: 45; }

.toast { position: absolute; left: 50%; top: 784px; height: 36px; padding: 0 16px; border-radius: 18px; font-size: 15px; font-weight: 600; display: flex; align-items: center; color: var(--ink); z-index: 46; transform: translateX(-50%); opacity: 0; white-space: nowrap; }

/* The orb, small (jess's orb, docs/DESIGN.md 5a; idle and thinking) */
.orb { position: relative; border-radius: 50%; }
.orb .o-body { position: absolute; inset: 0; border-radius: 50%; background: #FFFFFF; border: 1.5px solid #111111; box-shadow: 0 0 6px rgba(0, 0, 0, 0.18); }
.theme-dark .orb .o-body { background: #000000; border-color: #2A2A2A; box-shadow: 0 0 6px rgba(255, 255, 255, 0.22); }
.orb .o-core { position: absolute; left: 50%; top: 50%; width: 30%; height: 30%; transform: translate(-50%, -50%); border-radius: 50%; background: #111111; }
.theme-dark .orb .o-core { background: #FFFFFF; }
.orb svg.o-arc { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Part 2: the hint */
.hint { position: absolute; z-index: 46; color: var(--ink); font-size: 13px; font-weight: 500; line-height: 17px; }
.hint.cap { border-radius: 15px; padding: 7px 12px; white-space: nowrap; }
.hint.box { border-radius: 14px; padding: 8px 12px; }
.hint.fadeaway { animation: fadeaway 3.6s ease forwards; }
@keyframes fadeaway { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
.opens { display: flex; gap: 6px; align-items: center; }
.opens .btn { min-width: 38px; padding: 7px 0; }

/* Part 3: Make home and the welcome */
.mk-title { position: absolute; left: 20px; top: 60px; font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
.mk-empty { position: absolute; left: 0; right: 0; top: 400px; text-align: center; font-size: 17px; font-weight: 600; color: var(--ink-2); }
.dim { position: absolute; inset: 0; background: var(--dim); z-index: 50; }

.grabber { position: absolute; top: 7px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--ink-3); }
.card { position: absolute; left: 28px; right: 28px; background: var(--sheet); border-radius: 28px; z-index: 52; box-shadow: 0 16px 40px var(--shadow); padding: 30px 24px 22px; }
.w-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }

.hl { background: linear-gradient(transparent 58%, var(--volt) 58%, var(--volt) 92%, transparent 92%); padding: 0 2px; }
.theme-dark .hl { background: linear-gradient(transparent 58%, rgba(206, 255, 0, 0.55) 58%, rgba(206, 255, 0, 0.55) 92%, transparent 92%); }
.note { position: absolute; left: 34px; right: 34px; top: 190px; background: #FFFFFF; color: #111111; border-radius: 6px; z-index: 52; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28); padding: 34px 28px 30px; transform: rotate(-1.6deg); font-family: var(--hand); font-weight: 700; font-size: 34px; line-height: 40px; }
.theme-dark .note { background: #F3F2EF; }
.note .hl { background: linear-gradient(transparent 55%, var(--volt) 55%, var(--volt) 90%, transparent 90%); }
.note .n-sign { margin-top: 18px; text-align: right; font-size: 38px; }
.full { position: absolute; inset: 0; background: var(--paper); z-index: 52; }
.top-card { position: absolute; left: 10px; right: 10px; top: 58px; background: var(--sheet); border-radius: 26px; z-index: 52; box-shadow: 0 12px 34px var(--shadow); padding: 18px 18px 18px 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.cta.small { height: 36px; font-size: 15px; padding: 0 18px; width: auto; }

/* Final: the hint as a cloud out of the Edit tag, after Send */
.theme-light { --cloud: #FFFFFF; }
.theme-dark { --cloud: #2C2C2E; }
.final-box { border: 1.5px solid #111111; border-radius: 22px; padding: 18px 18px 8px; background: #FFFFFF; }
.cloud { position: absolute; left: 50%; z-index: 54; opacity: 0; transform-origin: 50% -14px; pointer-events: none; }
.cloud .c-text { position: relative; z-index: 1; font-size: 13px; font-weight: 500; line-height: 17px; color: var(--ink); white-space: nowrap; }
.cloud .c-tail { position: absolute; left: 50%; top: -9px; width: 18px; height: 10px; margin-left: -9px; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.cloud-bubble { top: 92px; filter: drop-shadow(0 4px 10px var(--shadow)); }
.cloud-bubble .c-text { background: var(--cloud); padding: 9px 14px; border-radius: 18px; }
.cloud-bubble .c-tail { background: var(--cloud); }
.cloud-puffy { top: 116px; filter: drop-shadow(0 4px 10px var(--shadow)); }
.cloud-puffy .c-text { background: var(--cloud); padding: 10px 16px; border-radius: 20px; }
.cloud-puffy .puff { position: absolute; z-index: 0; background: var(--cloud); border-radius: 50%; }
.cloud-frosted { top: 92px; }
.cloud-frosted .c-text { padding: 9px 14px; border-radius: 18px; }
.cloud-frosted .c-tail { background: var(--frost); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); }

<script>
"use strict";

// ---------- Variations ----------

// Part 1: the line after Send. "first" replaces "Edit" in the tag; "then" follows it (null = stays).
const SEND_VARIANTS = [
  { id: "A1", first: "Consider it done", then: "Editing", toast: null, where: "Tag, then Editing" },
  { id: "A2", first: "On it", then: "Editing", toast: null, where: "Tag, then Editing" },
  { id: "A3", first: "On it. Consider it done", then: "Editing", toast: null, where: "Tag, then Editing" },
  { id: "A4", first: "Consider it done", then: null, toast: null, where: "Tag, stays" },
  { id: "A5", first: "Editing", then: null, toast: "Consider it done", where: "Bottom, tag says Editing" }
];

// Part 2: the hint, first 5 opens of the Edit layer.
const HINT_VARIANTS = [
  { id: "B1", lines: ["You can close this.", "It updates in the background."], spot: "left-of-minis", where: "Beside Undo / Clear" },
  { id: "B2", lines: ["Close anytime. Edits keep going."], spot: "under-tag", where: "Under the tag" },
  { id: "B3", lines: ["Close anytime. It updates on its own."], spot: "by-x", where: "Beside ✕" },
  { id: "B4", lines: ["Send, then close. It updates on its own."], spot: "above-pill", where: "Above the pill" },
  { id: "B5", lines: ["Close anytime. Edits finish on their own."], spot: "under-tag-fade", where: "Under the tag, fades after 3 s" }
];

// Part 3: Make's first-open welcome.
const WELCOME_VARIANTS = [
  { id: "C1", layout: "sheet", title: "Built by Hand", line: "I build your first version myself, so it arrives near perfect.", sign: "Bhuvan", button: "Continue", where: "Sheet" },
  { id: "C2", layout: "card", title: null, line: "I build every first version by hand, so it arrives right.", sign: "Bhuvan", button: "OK", where: "Centred card" },
  { id: "C3", layout: "note", title: null, line: "I hand-build your first version, so it comes to you near perfect.", sign: "Bhuvan", button: "Start", where: "Handwritten note" },
  { id: "C4", layout: "full", title: "Hi, I'm Bhuvan.", line: "I build your first version by hand.", sign: null, button: "Get Started", where: "Full screen" },
  { id: "C5", layout: "top", title: null, line: "First versions are built by me, by hand.", sign: "Bhuvan", button: "OK", where: "Card from the top" }
];

const picked = { 1: "A1", 2: "B1", 3: "C1" };

// ---------- Small helpers ----------

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) {
    node.className = className;
  }
  if (text !== undefined && text !== null) {
    node.textContent = text;
  }
  return node;
}

function clamp01(value) {
  return Math.max(0, Math.min(1, value));
}

function lerp(from, to, mix) {
  return from + (to - from) * mix;
}

function easeIn(value) {
  const clamped = clamp01(value);
  return clamped * clamped * clamped;
}

function easeInOut(value) {
  const clamped = clamp01(value);
  return clamped < 0.5 ? 4 * clamped * clamped * clamped : 1 - Math.pow(-2 * clamped + 2, 3) / 2;
}

// Critically damped spring progress 0 → 1 (RepairSendMotion: travel response 0.6 s, damping 1).
function criticalSpring(seconds, response) {
  if (seconds <= 0) {
    return 0;
  }
  const omega = 2 * Math.PI / response;
  return 1 - (1 + omega * seconds) * Math.exp(-omega * seconds);
}

// Under-damped kick 0 → peak → 0 (the tag's swell: response 0.3 s, damping 0.65).
function swellKick(seconds) {
  if (seconds <= 0) {
    return 0;
  }
  const omega = 2 * Math.PI / 0.3;
  const damping = 0.65;
  const omegaDamped = omega * Math.sqrt(1 - damping * damping);
  return Math.exp(-damping * omega * seconds) * Math.sin(omegaDamped * seconds) * 1.6;
}

const measureCanvas = document.createElement("canvas");
const measureContext = measureCanvas.getContext("2d");

function textWidth(text, fontSpec) {
  measureContext.font = fontSpec;
  const metrics = measureContext.measureText(text);
  return metrics.width;
}

const TAG_FONT = "600 13px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif";

// Tag width: 12 pt each side; with the orb, 4 + 20 + 6 on the left.
function tagWidthFor(label, withOrb) {
  const words = Math.ceil(textWidth(label, TAG_FONT));
  return withOrb ? 4 + 20 + 6 + words + 12 : 12 + words + 12;
}

// ---------- Phone chrome ----------

function buildPhone(theme) {
  const phone = element("div", "phone theme-" + theme);
  const screen = element("div", "screen");
  const island = element("div", "island");
  const status = element("div", "status");
  const time = element("span", "time", "9:41");
  const icons = element("span", "icons");
  icons.append(element("span", "bars"), element("span", "battery"));
  status.append(time, icons);
  const homeBar = element("div", "home-bar");
  screen.append(status, island, homeBar);
  phone.append(screen);
  return { phone: phone, screen: screen };
}

// Scales a phone to fit narrow windows without changing its 402 x 874 layout.
function fitPhone(phone) {
  const holder = element("div", "fit");
  const inner = element("div", "fit-inner");
  inner.append(phone);
  holder.append(inner);
  return { holder: holder, inner: inner };
}

function applyFit(fitted) {
  const available = Math.min(window.innerWidth - 32, 422);
  const scale = Math.min(1, available / 422);
  fitted.inner.style.transform = "scale(" + scale + ")";
  fitted.holder.style.width = Math.round(422 * scale) + "px";
  fitted.holder.style.height = Math.round(894 * scale) + "px";
}

function buildColumn(label, theme) {
  const column = element("div", "preview-col");
  const built = buildPhone(theme);
  const fitted = fitPhone(built.phone);
  column.append(element("div", "phone-tag", label), fitted.holder);
  allFits.push(fitted);
  return { column: column, screen: built.screen };
}

const allFits = [];

function refitAll() {
  allFits.forEach(applyFit);
}

// ---------- Shared pieces ----------

function buildOrb(size) {
  const orb = element("div", "orb");
  orb.style.width = size + "px";
  orb.style.height = size + "px";
  const body = element("div", "o-body");
  const core = element("div", "o-core");
  orb.append(body, core);
  return orb;
}

// The thinking arc: a quarter of the rim, rotated by the caller.
function addThinkingArc(orb) {
  const namespace = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(namespace, "svg");
  svg.setAttribute("class", "o-arc");
  svg.setAttribute("viewBox", "0 0 20 20");
  const arc = document.createElementNS(namespace, "circle");
  arc.setAttribute("cx", "10");
  arc.setAttribute("cy", "10");
  arc.setAttribute("r", "8.6");
  arc.setAttribute("fill", "none");
  arc.setAttribute("stroke", "currentColor");
  arc.setAttribute("stroke-width", "2");
  arc.setAttribute("stroke-linecap", "round");
  arc.setAttribute("stroke-dasharray", "13.5 60");
  svg.append(arc);
  orb.append(svg);
  return svg;
}

function buildSidekick(withStrokes, theme) {
  const page = element("div", "sk");
  const title = element("div", "sk-title", "Water");
  const help = element("div", "sk-help", "?");
  const big = element("div", "sk-big", "1.25 L");
  const of = element("div", "sk-of", "of 2 L");
  const bar = element("div", "sk-bar");
  bar.append(element("i"));
  const buttons = element("div", "sk-buttons");
  buttons.append(element("div", "sk-btn", "+250 ml"), element("div", "sk-btn second", "+500 ml"));
  const log = element("div", "sk-log");
  const entries = [["250 ml", "8:10"], ["500 ml", "8:42"], ["500 ml", "9:20"]];
  entries.forEach(function addLogRow(entry) {
    const row = element("div");
    row.append(element("b", null, entry[0]), element("span", null, entry[1]));
    log.append(row);
  });
  page.append(title, help, big, of, bar, buttons, log);
  if (withStrokes) {
    page.append(buildStrokes(theme));
  }
  return page;
}

// The person's mark: a loose circle around "+250 ml" and an arrow outward (Volt, ink line under it in light).
function buildStrokes(theme) {
  const namespace = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(namespace, "svg");
  svg.setAttribute("class", "strokes");
  svg.setAttribute("viewBox", "0 0 402 874");
  const pathData = [
    "M 46 448 C 40 420, 110 412, 160 418 C 214 424, 222 470, 196 492 C 168 512, 70 510, 50 488 C 40 476, 44 460, 60 452",
    "M 120 520 L 120 590 M 104 574 L 120 592 L 136 574"
  ];
  pathData.forEach(function addStroke(data) {
    if (theme === "light") {
      const keyline = document.createElementNS(namespace, "path");
      keyline.setAttribute("d", data);
      keyline.setAttribute("fill", "none");
      keyline.setAttribute("stroke", "#111111");
      keyline.setAttribute("stroke-width", "8");
      keyline.setAttribute("stroke-linecap", "round");
      keyline.setAttribute("stroke-linejoin", "round");
      svg.append(keyline);
    }
    const pen = document.createElementNS(namespace, "path");
    pen.setAttribute("d", data);
    pen.setAttribute("fill", "none");
    pen.setAttribute("stroke", "#CEFF00");
    pen.setAttribute("stroke-width", "5");
    pen.setAttribute("stroke-linecap", "round");
    pen.setAttribute("stroke-linejoin", "round");
    svg.append(pen);
  });
  return svg;
}

const X_ICON = '<svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2 L12 12 M12 2 L2 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
const ARROW_UP = '<svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 15 V3 M3.5 8.5 L9 3 L14.5 8.5" stroke="var(--paper)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function buildEditControls(pillWords, hasStrokes) {
  const cancel = element("div", "x-btn");
  cancel.innerHTML = X_ICON;
  const minis = element("div", "minis");
  const offClass = hasStrokes ? "" : " off";
  minis.append(element("div", "mini-pill frost" + offClass, "Undo"), element("div", "mini-pill frost" + offClass, "Clear"));
  const pill = element("div", "pillbar");
  const orb = buildOrb(44);
  orb.classList.add("p-orb");
  const words = element("div", pillWords ? "p-text" : "p-text ph", pillWords || "What to fix");
  const send = element("div", pillWords ? "p-send" : "p-send off");
  send.innerHTML = ARROW_UP;
  pill.append(orb, words, send);
  return { cancel: cancel, minis: minis, pill: pill };
}

function buildStaticTag(label) {
  const tag = element("div", "tag");
  const width = tagWidthFor(label, false);
  tag.style.width = width + "px";
  tag.style.marginLeft = (-width / 2) + "px";
  const words = element("div", "t-words");
  words.style.left = "12px";
  words.append(element("span", null, label));
  tag.append(words);
  return tag;
}

// ---------- Part 1: after Send ----------

// Timeline, seconds. Send is tapped at SEND_AT; the shot flies (T1c "Quick and quiet").
const SEND_AT = 0.9;
const CONTACT_AFTER = 0.5;
const FIRST_AFTER = 0.72;
const LABEL_FADE = 0.2;
const THEN_AFTER = 3.1;
const LOOP_SECONDS = 6.0;

const sendState = { time: 0, playing: true, speed: 1, last: null, phones: [] };

function buildSendPhone(theme) {
  const built = buildColumn(theme === "light" ? "Light" : "Dark", theme);
  const screen = built.screen;
  const live = buildSidekick(false, theme);
  const shot = buildSidekick(true, theme);
  shot.style.zIndex = "20";
  shot.style.overflow = "hidden";
  const rim = element("div", "rim");
  const controls = buildEditControls("Make this button bigger", true);
  const tap = element("div", "tap");
  tap.style.left = (402 - 12 - 7 - 44) + "px";
  tap.style.top = (772 + 8) + "px";
  const tag = element("div", "tag");
  const tagOrb = buildOrb(20);
  tagOrb.classList.add("t-orb");
  const arc = addThinkingArc(tagOrb);
  arc.style.color = theme === "light" ? "#111111" : "#FFFFFF";
  const words = element("div", "t-words");
  const wordsA = element("span");
  const wordsB = element("span");
  words.append(wordsA, wordsB);
  tag.append(tagOrb, words);
  const toast = element("div", "toast frost");
  screen.append(live, shot, rim, controls.cancel, controls.minis, controls.pill, tap, tag, toast);
  return {
    column: built.column, shot: shot, rim: rim, controls: controls, tap: tap,
    tag: tag, tagOrb: tagOrb, arc: arc, words: words, wordsA: wordsA, wordsB: wordsB, toast: toast
  };
}

function currentSendVariant() {
  return SEND_VARIANTS.find(function matchesPick(variant) {
    return variant.id === picked[1];
  });
}

// Which two labels are crossfading at this moment, and how far.
function tagLabelsAt(variant, sinceSend) {
  const firstStart = FIRST_AFTER;
  const thenStart = THEN_AFTER;
  if (sinceSend < firstStart) {
    return { from: "Edit", to: variant.first, mix: 0, fromOrb: false, toOrb: true };
  }
  if (!variant.then || sinceSend < thenStart) {
    const mix = clamp01((sinceSend - firstStart) / LABEL_FADE);
    return { from: "Edit", to: variant.first, mix: mix, fromOrb: false, toOrb: true };
  }
  const mixThen = clamp01((sinceSend - thenStart) / LABEL_FADE);
  return { from: variant.first, to: variant.then, mix: mixThen, fromOrb: true, toOrb: true };
}

function renderSendPhone(phone, variant, time) {
  const sinceSend = time - SEND_AT;
  const sent = sinceSend >= 0;

  // The shot: shrinks ahead of its travel, rounds to a capsule, slips in under the tag.
  const travel = sent ? criticalSpring(sinceSend, 0.6) : 0;
  const shrink = sent ? criticalSpring(sinceSend, 0.36) : 0;
  const scale = lerp(1, 0.045, shrink);
  const centreY = lerp(437, 40, travel);
  const radius = lerp(56, 200, shrink);
  phone.shot.style.transform = "translateY(" + (centreY - 437).toFixed(2) + "px) scale(" + scale.toFixed(4) + ")";
  phone.shot.style.borderRadius = radius.toFixed(1) + "px";
  phone.shot.style.opacity = sinceSend > 0.85 ? "0" : "1";
  phone.shot.style.boxShadow = sent && sinceSend < 0.85 ? "0 10px 30px rgba(0,0,0,0.25)" : "none";

  // Rim drains, controls leave (pill drops after 200 ms, 320 ms ease-in).
  phone.rim.style.opacity = (1 - clamp01(sinceSend / 0.3)).toFixed(3);
  const drop = easeIn((sinceSend - 0.2) / 0.32);
  phone.controls.pill.style.transform = "translateY(" + (drop * 110).toFixed(1) + "px)";
  phone.controls.pill.style.opacity = (1 - clamp01((sinceSend - 0.3) / 0.22)).toFixed(3);
  const controlsAlpha = (1 - clamp01(sinceSend / 0.2)).toFixed(3);
  phone.controls.cancel.style.opacity = controlsAlpha;
  phone.controls.minis.style.opacity = controlsAlpha;

  // The tap on Send.
  const tapAge = time - (SEND_AT - 0.18);
  const tapAlpha = tapAge > 0 && tapAge < 0.3 ? 1 - tapAge / 0.3 : 0;
  phone.tap.style.opacity = tapAlpha.toFixed(3);
  phone.tap.style.transform = "scale(" + (1 + clamp01(tapAge / 0.3) * 0.3).toFixed(3) + ")";

  // The tag: swells on contact, crossfades its words, widens.
  const labels = tagLabelsAt(variant, Math.max(sinceSend, -1));
  const swell = swellKick(sinceSend - CONTACT_AFTER);
  const widthFrom = tagWidthFor(labels.from, labels.fromOrb);
  const widthTo = tagWidthFor(labels.to, labels.toOrb);
  const width = lerp(widthFrom, widthTo, easeInOut(labels.mix));
  phone.tag.style.width = width.toFixed(1) + "px";
  phone.tag.style.marginLeft = (-width / 2).toFixed(1) + "px";
  phone.tag.style.transform = "scale(" + (1 + 0.08 * swell).toFixed(4) + "," + (1 + 0.05 * swell).toFixed(4) + ")";
  const orbAlpha = labels.fromOrb ? 1 : labels.mix;
  phone.tagOrb.style.opacity = orbAlpha.toFixed(3);
  phone.arc.style.transform = "rotate(" + ((time * 360 / 1.1) % 360).toFixed(1) + "deg)";
  const wordsLeft = lerp(labels.fromOrb ? 30 : 12, labels.toOrb ? 30 : 12, easeInOut(labels.mix));
  phone.words.style.left = wordsLeft.toFixed(1) + "px";
  phone.wordsA.textContent = labels.from;
  phone.wordsB.textContent = labels.to;
  phone.wordsA.style.opacity = (1 - labels.mix).toFixed(3);
  phone.wordsB.style.opacity = labels.mix.toFixed(3);

  // A5: the line sits where the pill was, the tag says Editing.
  if (variant.toast) {
    const shown = sinceSend - (CONTACT_AFTER + 0.1);
    const toastIn = clamp01(shown / 0.2);
    const toastOut = clamp01((shown - 2.3) / 0.35);
    phone.toast.textContent = variant.toast;
    phone.toast.style.opacity = (toastIn * (1 - toastOut)).toFixed(3);
    phone.toast.style.transform = "translateX(-50%) translateY(" + ((1 - toastIn) * 8).toFixed(1) + "px)";
  } else {
    phone.toast.style.opacity = "0";
  }
}

function renderSendAll() {
  const variant = currentSendVariant();
  sendState.phones.forEach(function renderOne(phone) {
    renderSendPhone(phone, variant, sendState.time);
  });
  const scrub = document.getElementById("scrub-1");
  scrub.value = String(Math.round(sendState.time * 1000));

function sendTick(now) {
  if (sendState.last === null) {
    sendState.last = now;
  }
  const delta = (now - sendState.last) / 1000;
  sendState.last = now;
  if (sendState.playing) {
    sendState.time = sendState.time + delta * sendState.speed;
    // Hold 0.6 s at the end, then loop.
    if (sendState.time > LOOP_SECONDS + 0.6) {
      sendState.time = 0;
    }
    renderSendAll();

  requestAnimationFrame(sendTick);
}

// "by hand" / "hand-build" / "myself" get the Volt highlight in the note and the sheet.
function lineWithHighlight(line, phrase) {
  const holder = document.createDocumentFragment();
  const at = line.indexOf(phrase);
  if (!phrase || at < 0) {
    holder.append(document.createTextNode(line));
    return holder;
  }
  holder.append(document.createTextNode(line.slice(0, at)));
  holder.append(element("span", "hl", phrase));
  holder.append(document.createTextNode(line.slice(at + phrase.length)));
  return holder;
}

  { x: 0.06, bottom: -13, size: 34 }, { x: 0.18, bottom: -13, size: 34 }, { x: 0.30, bottom: -13, size: 34 }, { x: 0.42, bottom: -13, size: 34 }, { x: 0.54, bottom: -13, size: 34 }, { x: 0.66, bottom: -13, size: 34 }, { x: 0.78, bottom: -13, size: 34 },

];

function buildPuff(spec) {
  const puff = element("i", "puff");
  puff.style.width = spec.size + "px";
  puff.style.height = spec.size + "px";
  if (spec.x !== undefined) {
    puff.style.left = "calc(" + (spec.x * 100).toFixed(1) + "% - " + (spec.size / 4) + "px)";
  } else {
    puff.style.left = "calc(50% - " + (spec.size / 2) + "px)";
  }
  if (spec.top !== undefined) {
    puff.style.top = spec.top + "px";
  }
  if (spec.bottom !== undefined) {
    puff.style.bottom = spec.bottom + "px";
  }
  return puff;
}

function buildCloud(style) {
  const cloud = element("div", "cloud cloud-" + style);
  const text = element("div", style === "frosted" ? "c-text frost" : "c-text", CLOUD_TEXT);
  if (style === "puffy") {
    PUFFS.forEach(function addPuff(spec) {
      cloud.append(buildPuff(spec));
    });
    TRAIL.forEach(function addTrail(spec) {
      cloud.append(buildPuff(spec));
    });
  } else {
    cloud.append(element("i", "c-tail"));
  }
  cloud.append(text);
  return cloud;
}

function currentShape() {
  return CLOUD_SHAPES.find(function matchesShape(shape) {

function renderCloud(phone, time) {
  const sinceCloud = time - SEND_AT - CLOUD_AFTER;
  const showsThisSend = finalState.sends <= 5;
  if (!showsThisSend || sinceCloud < 0 || sinceCloud > CLOUD_SECONDS) {
    phone.cloud.style.opacity = "0";
    return;
  }
  // Grows from the tag: small and tucked up, then full size under it.
  const grow = criticalSpring(sinceCloud, 0.38);
  const scale = lerp(0.12, 1, grow);
  const rise = lerp(-16, 0, grow);
  const fadeIn = clamp01(sinceCloud / 0.12);
  const fadeOut = clamp01((sinceCloud - (CLOUD_SECONDS - CLOUD_FADE)) / CLOUD_FADE);
  phone.cloud.style.opacity = (fadeIn * (1 - fadeOut)).toFixed(3);
  phone.cloud.style.transform = "translateX(-50%) translateY(" + rise.toFixed(2) + "px) scale(" + scale.toFixed(4) + ")";

function wordsOf(part, variant) {
  if (part === 1) {
    return variant.toast ? variant.toast : variant.first;
  }
  if (part === 2) {
    return variant.lines.join(" ");
  }
  const title = variant.title ? variant.title + " · " : "";
  return title + variant.line + " · [" + variant.button + "]";
}

function rerenderPart(part) {
  if (part === 1) {
    onReplayClick();
  } else if (part === 2) {
    renderHints();
  } else {
    renderWelcomes();
  }
}

function buildRows(part, variants) {
  const rows = document.getElementById("rows-" + part);
  variants.forEach(function addRow(variant) {
    const row = element("button", "pick-row");
    row.dataset.id = variant.id;
    row.setAttribute("aria-pressed", picked[part] === variant.id ? "true" : "false");
    const id = element("div", "pick-id", variant.id);
    const words = element("div", "pick-words", wordsOf(part, variant));
    words.append(element("span", "pick-where", variant.where));
    row.append(id, words);
    row.addEventListener("click", function onRowClick() {
      picked[part] = variant.id;
      const allRows = rows.querySelectorAll(".pick-row");
      allRows.forEach(function markRow(other) {
        other.setAttribute("aria-pressed", other.dataset.id === variant.id ? "true" : "false");
      });
      document.getElementById("chip-" + part).textContent = variant.id;
      rerenderPart(part);
    });
    rows.append(row);
  });
}

buildRows(1, SEND_VARIANTS);
buildRows(2, HINT_VARIANTS);
buildRows(3, WELCOME_VARIANTS);
setupPartOne();
setupPartTwo();
setupPartThree();
setupFinal();
refitAll();
window.addEventListener("resize", refitAll);
</script>
</body>
