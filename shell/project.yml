# Generate Midas.xcodeproj with: xcodegen generate (from shell/). The .xcodeproj is not committed.
name: Midas
options:
  bundleIdPrefix: com.bhuvanrj
  # The oldest iOS the app installs on. Sat under configs: until 2026-10-26, where xcodegen ignores
  # it, so every build needed the iOS of the SDK it was built with (iOS 27 with Xcode 27).
  deploymentTarget:
    iOS: "17.0"
# Test (founder, 2026-10-14): a second app, "Midas Test", installed next to the everyday Midas on
# the same phone, for trying updates quickly. Own bundle ID, App Group and name; staging server.
# Run it with the "Midas Test" scheme. Debug and Release are unchanged.
configs:
  Debug: debug
  Test: debug
  Release: release
settings:
  base:
    # Applies to both targets (Midas, MidasTests). Paid team, bhuvanrj83.
    DEVELOPMENT_TEAM: ZQ2JPFYL98
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "38"
    # AlarmKit is iOS 26; weak so the app still launches on iOS 17 to 25 (alarm reminders are then
    # Time Sensitive notifications, founder 2026-10-24).
    OTHER_LDFLAGS: "$(inherited) -weak_framework AlarmKit"
    # App Group shared by an app and its widget; read at runtime from Info.plist (MidasAppGroup).
    MIDAS_APP_GROUP: group.com.bhuvanrj.midas
    MIDAS_DISPLAY_NAME: Midas
    # Midas keyboard dictation (TEST BUILD, founder 2026-11-14, docs/briefs/dictation-keyboard-test.md;
    # branch agent/dictation-test, never merged). Info.plist lists cannot differ per config, so the
    # app's second URL scheme and second background mode repeat the first ones in Debug and Release
    # and are the keyboard's in Test: midastest:// (Start Dictation) and background audio (the
    # microphone stays on after the person swipes back).
    MIDAS_KEYBOARD_URL_SCHEME: midas
    MIDAS_KEYBOARD_BACKGROUND_MODE: fetch
  configs:
    Test:
      MIDAS_APP_GROUP: group.com.bhuvanrj.midas.test
      MIDAS_DISPLAY_NAME: Midas Test
      MIDAS_KEYBOARD_URL_SCHEME: midastest
      MIDAS_KEYBOARD_BACKGROUND_MODE: audio
      # TestFlight uploads of Midas Test need dSYMs for readable crash reports (2026-10-21).
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      # Metal shader source stays out of uploads (App Store Connect warning, 2026-11-02:
      # default.metallib contained shader source; the Test config is debug-based).
      MTL_ENABLE_DEBUG_INFO: "NO"
targets:
  Midas:
    type: application
    platform: iOS
    # Shared/ is also compiled into the widget extension: Sidekick entry, icon, widget contract.
    # sdk/ ships as resources: the record validator and shell types the app runs in
    # JavaScriptCore, the same files the Worker imports (unified data, 2026-10-15).
    sources:
      - Midas
      - Shared
      # The keyboard's contract and logic, compiled in Test only (`#if MIDAS_TEST_BUILD`).
      - DictationKeyboardShared
      - path: sdk
        buildPhase: resources
        excludes: ["*.d.ts"]
    dependencies:
      # The Folder widget (shell/MidasWidgets/), embedded in the app.
      - target: MidasWidgets
      # The Midas keyboard (TEST BUILD, 2026-11-14). XcodeGen cannot embed a target in one
      # config only, so on this branch (never merged, never shipped) it is embedded in all three;
      # its dictation needs the Test app's session code (MIDAS_TEST_BUILD) and only works there.
      - target: MidasKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhuvanrj.midas
        TARGETED_DEVICE_FAMILY: "1"
        # Passkey domains for every build (production mode, served by Apple's CDN since 2026-10-11).
        CODE_SIGN_ENTITLEMENTS: Midas/Midas.entitlements
      # Which server the app talks to (2026-10-10): pressing Run in Xcode (Debug) gives the
      # staging server, TestFlight (Release) the live one. Each has its own accounts and records.
      configs:
        Debug:
          MIDAS_PLATFORM_HOST: midas-api-staging.midas-backend.workers.dev
        Test:
          MIDAS_PLATFORM_HOST: midas-api-staging.midas-backend.workers.dev
          PRODUCT_BUNDLE_IDENTIFIER: com.bhuvanrj.midas.test
          CODE_SIGN_ENTITLEMENTS: Midas/Midas-Test.entitlements
          # Dictation test screen (founder, 2026-11-13; TEST BUILD, branch agent/dictation-test,
          # never merged): compiled only here, `#if MIDAS_TEST_BUILD`. FoundationModels is iOS 26;
          # weak so Midas Test still launches on iOS 17 to 25.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MIDAS_TEST_BUILD"
          OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
        Release:
          MIDAS_PLATFORM_HOST: midas-api.midas-backend.workers.dev
    info:
      path: Midas/Info.plist
      properties:
        CFBundleDisplayName: $(MIDAS_DISPLAY_NAME)
        MidasAppGroup: $(MIDAS_APP_GROUP)
        # Version and build come from MARKETING_VERSION and CURRENT_PROJECT_VERSION above.
        # Every TestFlight upload needs a higher CURRENT_PROJECT_VERSION.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The hand (Caveat Bold, SIL Open Font Licence, shell/icon-source/), for the founder's
        # signature on Make's first-open sheet (founder, 2026-10-31).
        UIAppFonts: [Caveat-Bold.ttf]
        # midas://open/<id> and midas://home, sent by the widget (shell/Shared/WidgetShared.swift).
        CFBundleURLTypes:
          - CFBundleURLName: com.bhuvanrj.midas
            CFBundleURLSchemes: [midas]
          # midastest://dictation in Midas Test (keyboard Start Dictation); `midas` again elsewhere.
          - CFBundleURLName: com.bhuvanrj.midas.keyboard
            CFBundleURLSchemes: [$(MIDAS_KEYBOARD_URL_SCHEME)]
        # Background refresh tops up booked reminders when Midas is not opened (notification engine).
        # The second is `audio` in Midas Test only (keyboard dictation), `fetch` again elsewhere.
        UIBackgroundModes: [fetch, $(MIDAS_KEYBOARD_BACKGROUND_MODE)]
        BGTaskSchedulerPermittedIdentifiers: [com.bhuvanrj.midas.reminders-refresh]
        # Only standard HTTPS, which is exempt; answers export compliance on upload.
        ITSAppUsesNonExemptEncryption: false
        # Read by PlatformConfig.
        MidasPlatformHost: $(MIDAS_PLATFORM_HOST)
        # The line under iOS's fixed "Would Like Full Access to Your Reminders" title (founder,
        # 2026-10-10). Asked only when a Sidekick imports Apple Reminders.
        NSRemindersFullAccessUsageDescription: "Midas imports your Apple Reminders lists and reminders into your Reminders Sidekick."
        # Asked the first time a voice feature is used (jess and the Edit layer). Was "Midas uses
        # the microphone for voice features." (founder, 2026-10-13); too vague for App Review
        # 5.1.1(ii), changed for build 22 (docs/briefs/build-22-2026-10-31.md, lead brief
        # 2026-11-01; docs/WRITING.md rule 10).
        NSMicrophoneUsageDescription: "Midas listens when you speak a request or an edit."
        NSSpeechRecognitionUsageDescription: "Midas turns your voice into text on this iPhone."
        # jess's camera (founder, 2026-11-02, docs/mockups/jess-camera-2026-11-02.html): asked the
        # first time the camera button on the jess screen is tapped (docs/WRITING.md rule 10).
        NSCameraUsageDescription: "Midas uses the camera when you take a photo for jess, like a flyer to add as a reminder."
        # Asked the first time an Alarm reminder needs booking (founder, 2026-10-24; docs/WRITING.md
        # rule 10). The countdown after Snooze is a Live Activity (shell/MidasWidgets/).
        NSAlarmKitUsageDescription: "Midas rings your alarm reminders even when your iPhone is on silent or in Focus."
        NSSupportsLiveActivities: true
        # The App Shortcuts platter in Spotlight and Siri suggestions: ink with a white sound wave
        # (founder, 2026-10-23; colours in Assets.xcassets, names in Shared/JessSymbols.swift).
        CFBundleIcons:
          CFBundlePrimaryIcon:
            NSAppIconComplementingColorNames: [ShortcutsPlatter]
            NSAppIconActionTintColorName: ShortcutsTint
    # Passkeys: each backend serves /.well-known/apple-app-site-association for its domain.
    # The App ID needs the Associated Domains capability in the developer portal.
    # Entitlements are a plain file (CODE_SIGN_ENTITLEMENTS above), not an xcodegen entitlements
    # block, which would rewrite the file on every generate.
  MidasWidgets:
    # The Folder widget (Sidekick tiles, founder plan 2026-10-11) and the Sidekick widget.
    type: app-extension
    platform: iOS
    sources:
      - MidasWidgets
      - Shared
      # The filler and what it needs, so the widget can show a tap that is waiting for the app
      # (founder, 2026-10-26; shell/Midas/SidekickWidgetTapPreview.swift), reminder ticks
      # included (ReminderChange: the Done patch the app writes).
      - Midas/SidekickWidgetTapPreview.swift
      - Midas/ReminderChange.swift
      - Midas/SidekickWidgetFiller.swift
      - Midas/SidekickWidgetDescription.swift
      - Midas/JSONValue.swift
      - Midas/JSONMergePatch.swift
      - Midas/LocalRecord.swift
      - Midas/ReminderRecord.swift
      - Midas/ReminderSchedule.swift
      - Midas/ReminderExpansion.swift
      - Midas/TodayReminderPlanner.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhuvanrj.midas.widgets
        TARGETED_DEVICE_FAMILY: "1"
        # App Group shared with the app: the Sidekick list the widget reads.
        CODE_SIGN_ENTITLEMENTS: MidasWidgets/MidasWidgets.entitlements
      configs:
        Test:
          PRODUCT_BUNDLE_IDENTIFIER: com.bhuvanrj.midas.test.widgets
          CODE_SIGN_ENTITLEMENTS: MidasWidgets/MidasWidgets-Test.entitlements
    info:
      path: MidasWidgets/Info.plist
      properties:
        CFBundleDisplayName: $(MIDAS_DISPLAY_NAME)
        MidasAppGroup: $(MIDAS_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  MidasKeyboard:
    # The Midas keyboard (TEST BUILD, founder 2026-11-14; docs/briefs/dictation-keyboard-test.md;
    # branch agent/dictation-test, never merged). Types without Full Access; with it, dictation
    # through the Midas Test app's microphone (shell/Midas/DictationKeyboardSession.swift).
    type: app-extension
    platform: iOS
    sources:
      - MidasKeyboard
      - DictationKeyboardShared
      # jess's orb on the listening panel and the ● key
      - Midas/JessOrb.swift
      # Build 34, mic inside the keyboard (founder 2026-11-19): the keyboard tries to record
      # itself with the app's own transcriber and gate (DictationKeyboardShared/DictationKeyboardMic.swift).
      - Midas/VoiceTranscriber.swift
      - Midas/VoicePermissions.swift
      - Midas/RepairSpeechTranscriber.swift
      - Midas/DictationGate.swift
      - Midas/JSONValue.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhuvanrj.midas.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: MidasKeyboard/MidasKeyboard.entitlements
        # The shared keyboard code is test-build code in every config of this target
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MIDAS_TEST_BUILD"
      configs:
        Test:
          PRODUCT_BUNDLE_IDENTIFIER: com.bhuvanrj.midas.test.keyboard
          CODE_SIGN_ENTITLEMENTS: MidasKeyboard/MidasKeyboard-Test.entitlements
    info:
      path: MidasKeyboard/Info.plist
      properties:
        CFBundleDisplayName: $(MIDAS_DISPLAY_NAME)
        MidasAppGroup: $(MIDAS_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Full Access: the App Group (the handoff with Midas Test). Without it, letters only.
            RequestsOpenAccess: true
        # Build 34: the keyboard tries the microphone itself (docs/briefs/dictation-keyboard-test.md,
        # "Build 34"); the same lines as the app's.
        NSMicrophoneUsageDescription: "Midas listens when you speak a request or an edit."
        NSSpeechRecognitionUsageDescription: "Midas turns your voice into text on this iPhone."
  MidasTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MidasTests]
    dependencies:
      - target: Midas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhuvanrj.midas.tests
        GENERATE_INFOPLIST_FILE: YES
      configs:
        # The dictation test checks compile only against a Test build of the app.
        Test:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MIDAS_TEST_BUILD"
schemes:
  Midas:
    build:
      targets:
        Midas: all
    test:
      targets: [MidasTests]
  Midas Test:
    build:
      targets:
        Midas: all
    run:
      config: Test
    # Runs the whole unit suite against the Test build, which is the only build that contains
    # the dictation test screen and its checks (TEST BUILD, 2026-11-13).
    test:
      config: Test
      targets: [MidasTests]
    profile:
      config: Test
    analyze:
      config: Test
    archive:
      config: Test
