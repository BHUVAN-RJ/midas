# Generate Midas.xcodeproj with: xcodegen generate (from shell/). The .xcodeproj is not committed.
name: Midas
options:
  bundleIdPrefix: com.bhuvanrj
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # Applies to both targets (Midas, MidasTests). Paid team, bhuvanrj83.
    DEVELOPMENT_TEAM: ZQ2JPFYL98
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Midas:
    type: application
    platform: iOS
    # Shared/ is also compiled into the widget extension: Sidekick entry, icon, widget contract.
    sources: [Midas, Shared]
    dependencies:
      # The Folder widget (shell/MidasWidgets/), embedded in the app.
      - target: MidasWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhuvanrj.midas
        TARGETED_DEVICE_FAMILY: "1"
        # Passkey domains for every build (production mode, served by Apple's CDN since 2026-10-11).
        CODE_SIGN_ENTITLEMENTS: Midas/Midas.entitlements
      # Which server the app talks to (2026-10-10): pressing Run in Xcode (Debug) gives the
      # staging server, TestFlight (Release) the live one. Each has its own accounts and records.
      configs:
        Debug:
          MIDAS_PLATFORM_HOST: midas-api-staging.midas-backend.workers.dev
        Release:
          MIDAS_PLATFORM_HOST: midas-api.midas-backend.workers.dev
    info:
      path: Midas/Info.plist
      properties:
        CFBundleDisplayName: Midas
        # Version and build come from MARKETING_VERSION and CURRENT_PROJECT_VERSION above.
        # Every TestFlight upload needs a higher CURRENT_PROJECT_VERSION.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # midas://open/<id> and midas://home, sent by the widget (shell/Shared/WidgetShared.swift).
        CFBundleURLTypes:
          - CFBundleURLName: com.bhuvanrj.midas
            CFBundleURLSchemes: [midas]
        # Background refresh tops up booked reminders when Midas is not opened (notification engine).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.bhuvanrj.midas.reminders-refresh]
        # Only standard HTTPS, which is exempt; answers export compliance on upload.
        ITSAppUsesNonExemptEncryption: false
        # Read by PlatformConfig.
        MidasPlatformHost: $(MIDAS_PLATFORM_HOST)
        # The line under iOS's fixed "Would Like Full Access to Your Reminders" title (founder,
        # 2026-10-10). Asked only when a Sidekick imports Apple Reminders.
        NSRemindersFullAccessUsageDescription: "Midas imports your Apple Reminders lists and reminders into your Reminders Sidekick."
    # Passkeys: each backend serves /.well-known/apple-app-site-association for its domain.
    # The App ID needs the Associated Domains capability in the developer portal.
    # Entitlements are a plain file (CODE_SIGN_ENTITLEMENTS above), not an xcodegen entitlements
    # block, which would rewrite the file on every generate.
  MidasWidgets:
    # The Folder widget: Sidekick tiles on the Home Screen (founder plan, 2026-10-11).
    type: app-extension
    platform: iOS
    sources: [MidasWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhuvanrj.midas.widgets
        TARGETED_DEVICE_FAMILY: "1"
        # App Group shared with the app: the Sidekick list the widget reads.
        CODE_SIGN_ENTITLEMENTS: MidasWidgets/MidasWidgets.entitlements
    info:
      path: MidasWidgets/Info.plist
      properties:
        CFBundleDisplayName: Midas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  MidasTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MidasTests]
    dependencies:
      - target: Midas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhuvanrj.midas.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Midas:
    build:
      targets:
        Midas: all
    test:
      targets: [MidasTests]
