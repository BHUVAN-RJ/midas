# Generate Midas.xcodeproj with: xcodegen generate (from shell/). The .xcodeproj is not committed.
name: Midas
options:
  bundleIdPrefix: com.bhuvanrj
  # The oldest iOS the app installs on. Sat under configs: until 2026-10-26, where xcodegen ignores
  # it, so every build needed the iOS of the SDK it was built with (iOS 27 with Xcode 27).
  deploymentTarget:
    iOS: "17.0"
# Test (founder, 2026-10-14): a second app, "Midas Test", installed next to the everyday Midas on
# the same phone, for trying updates quickly. Own bundle ID, App Group and name; staging server.
# Run it with the "Midas Test" scheme. Debug and Release are unchanged.
configs:
  Debug: debug
  Test: debug
  Release: release
settings:
  base:
    # Applies to both targets (Midas, MidasTests). Paid team, bhuvanrj83.
    DEVELOPMENT_TEAM: ZQ2JPFYL98
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "20"
    # AlarmKit is iOS 26; weak so the app still launches on iOS 17 to 25 (alarm reminders are then
    # Time Sensitive notifications, founder 2026-10-24).
    OTHER_LDFLAGS: "$(inherited) -weak_framework AlarmKit"
    # App Group shared by an app and its widget; read at runtime from Info.plist (MidasAppGroup).
    MIDAS_APP_GROUP: group.com.bhuvanrj.midas
    MIDAS_DISPLAY_NAME: Midas
  configs:
    Test:
      MIDAS_APP_GROUP: group.com.bhuvanrj.midas.test
      MIDAS_DISPLAY_NAME: Midas Test
      # TestFlight uploads of Midas Test need dSYMs for readable crash reports (2026-10-21).
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
targets:
  Midas:
    type: application
    platform: iOS
    # Shared/ is also compiled into the widget extension: Sidekick entry, icon, widget contract.
    # sdk/ ships as resources: the record validator and shell types the app runs in
    # JavaScriptCore, the same files the Worker imports (unified data, 2026-10-15).
    sources:
      - Midas
      - Shared
      - path: sdk
        buildPhase: resources
        excludes: ["*.d.ts"]
    dependencies:
      # The Folder widget (shell/MidasWidgets/), embedded in the app.
      - target: MidasWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhuvanrj.midas
        TARGETED_DEVICE_FAMILY: "1"
        # Passkey domains for every build (production mode, served by Apple's CDN since 2026-10-11).
        CODE_SIGN_ENTITLEMENTS: Midas/Midas.entitlements
      # Which server the app talks to (2026-10-10): pressing Run in Xcode (Debug) gives the
      # staging server, TestFlight (Release) the live one. Each has its own accounts and records.
      configs:
        Debug:
          MIDAS_PLATFORM_HOST: midas-api-staging.midas-backend.workers.dev
        Test:
          MIDAS_PLATFORM_HOST: midas-api-staging.midas-backend.workers.dev
          PRODUCT_BUNDLE_IDENTIFIER: com.bhuvanrj.midas.test
          CODE_SIGN_ENTITLEMENTS: Midas/Midas-Test.entitlements
        Release:
          MIDAS_PLATFORM_HOST: midas-api.midas-backend.workers.dev
    info:
      path: Midas/Info.plist
      properties:
        CFBundleDisplayName: $(MIDAS_DISPLAY_NAME)
        MidasAppGroup: $(MIDAS_APP_GROUP)
        # Version and build come from MARKETING_VERSION and CURRENT_PROJECT_VERSION above.
        # Every TestFlight upload needs a higher CURRENT_PROJECT_VERSION.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # midas://open/<id> and midas://home, sent by the widget (shell/Shared/WidgetShared.swift).
        CFBundleURLTypes:
          - CFBundleURLName: com.bhuvanrj.midas
            CFBundleURLSchemes: [midas]
        # Background refresh tops up booked reminders when Midas is not opened (notification engine).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.bhuvanrj.midas.reminders-refresh]
        # Only standard HTTPS, which is exempt; answers export compliance on upload.
        ITSAppUsesNonExemptEncryption: false
        # Read by PlatformConfig.
        MidasPlatformHost: $(MIDAS_PLATFORM_HOST)
        # The line under iOS's fixed "Would Like Full Access to Your Reminders" title (founder,
        # 2026-10-10). Asked only when a Sidekick imports Apple Reminders.
        NSRemindersFullAccessUsageDescription: "Midas imports your Apple Reminders lists and reminders into your Reminders Sidekick."
        # App-wide and generic (founder, 2026-10-13): asked the first time a voice feature is
        # used (the repair layer now, the voice assistant later).
        NSMicrophoneUsageDescription: "Midas uses the microphone for voice features."
        NSSpeechRecognitionUsageDescription: "Midas turns your voice into text on this iPhone."
        # Asked the first time an Alarm reminder needs booking (founder, 2026-10-24; docs/WRITING.md
        # rule 10). The countdown after Snooze is a Live Activity (shell/MidasWidgets/).
        NSAlarmKitUsageDescription: "Midas rings your alarm reminders even when your iPhone is on silent or in Focus."
        NSSupportsLiveActivities: true
        # The App Shortcuts platter in Spotlight and Siri suggestions: ink with a white sound wave
        # (founder, 2026-10-23; colours in Assets.xcassets, names in Shared/JessSymbols.swift).
        CFBundleIcons:
          CFBundlePrimaryIcon:
            NSAppIconComplementingColorNames: [ShortcutsPlatter]
            NSAppIconActionTintColorName: ShortcutsTint
    # Passkeys: each backend serves /.well-known/apple-app-site-association for its domain.
    # The App ID needs the Associated Domains capability in the developer portal.
    # Entitlements are a plain file (CODE_SIGN_ENTITLEMENTS above), not an xcodegen entitlements
    # block, which would rewrite the file on every generate.
  MidasWidgets:
    # The Folder widget (Sidekick tiles, founder plan 2026-10-11) and the Sidekick widget.
    type: app-extension
    platform: iOS
    sources:
      - MidasWidgets
      - Shared
      # The filler and what it needs, so the widget can show a tap that is waiting for the app
      # (founder, 2026-10-26; shell/Midas/SidekickWidgetTapPreview.swift), reminder ticks
      # included (ReminderChange: the Done patch the app writes).
      - Midas/SidekickWidgetTapPreview.swift
      - Midas/ReminderChange.swift
      - Midas/SidekickWidgetFiller.swift
      - Midas/SidekickWidgetDescription.swift
      - Midas/JSONValue.swift
      - Midas/JSONMergePatch.swift
      - Midas/LocalRecord.swift
      - Midas/ReminderRecord.swift
      - Midas/ReminderSchedule.swift
      - Midas/ReminderExpansion.swift
      - Midas/TodayReminderPlanner.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhuvanrj.midas.widgets
        TARGETED_DEVICE_FAMILY: "1"
        # App Group shared with the app: the Sidekick list the widget reads.
        CODE_SIGN_ENTITLEMENTS: MidasWidgets/MidasWidgets.entitlements
      configs:
        Test:
          PRODUCT_BUNDLE_IDENTIFIER: com.bhuvanrj.midas.test.widgets
          CODE_SIGN_ENTITLEMENTS: MidasWidgets/MidasWidgets-Test.entitlements
    info:
      path: MidasWidgets/Info.plist
      properties:
        CFBundleDisplayName: $(MIDAS_DISPLAY_NAME)
        MidasAppGroup: $(MIDAS_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  MidasTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MidasTests]
    dependencies:
      - target: Midas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhuvanrj.midas.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Midas:
    build:
      targets:
        Midas: all
    test:
      targets: [MidasTests]
  Midas Test:
    build:
      targets:
        Midas: all
    run:
      config: Test
    profile:
      config: Test
    analyze:
      config: Test
    archive:
      config: Test
