<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sounds</title>
<style>
/* Sounds Sidekick. Look: variant A of docs/mockups/soundboard-2026-11-07.html (founder,
   2026-11-07): 3 across, the GIF square with the name under it, a speaker chip on the GIF's bottom
   right, volt edge and chip while a sound plays. Black and white, light and dark follow the phone.
   Never purple. */
:root {
  color-scheme: light;
  --bg: #FFFFFF; --fg: #111111; --fg2: #6B6B6B; --chip: #F2F2F2; --line: rgba(0, 0, 0, .08);
  --tile: #F4F4F4; --playing: #CEFF00; --playing-fg: #111111; --speaker: rgba(0, 0, 0, .6);
  --scrim: rgba(0, 0, 0, .35); --danger: #FF3B30; --shadow: rgba(0, 0, 0, .18);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0B0B0B; --fg: #FFFFFF; --fg2: #9A9A9A; --chip: #1C1C1C; --line: rgba(255, 255, 255, .10);
    --tile: #1A1A1A; --speaker: rgba(0, 0, 0, .66); --scrim: rgba(0, 0, 0, .6); --danger: #FF453A;
    --shadow: rgba(0, 0, 0, .5);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg); min-height: 100%;
  font-family: -apple-system, system-ui, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
[hidden] { display: none !important; }

#main { min-height: 100vh; min-height: 100dvh; padding: calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 96px); }

/* ---------- Top row: title, "+" and the quiet "?" ---------- */
.top { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px 4px; position: relative; }
.top h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
.actions { display: flex; gap: 8px; position: relative; }
.iconbtn { width: 34px; height: 34px; border-radius: 50%; background: var(--chip); color: var(--fg);
  font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.iconbtn.help { font-size: 15px; color: var(--fg2); }
.catch { position: fixed; inset: 0; z-index: 4; }
.help-menu { position: absolute; right: 0; top: 42px; z-index: 5; min-width: 220px; background: var(--bg); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: 0 10px 30px var(--shadow); overflow: hidden; }
.help-menu button { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px;
  font-size: 15px; text-align: left; }
.help-menu button + button { border-top: 1px solid var(--line); }
.help-menu svg { width: 16px; height: 16px; color: var(--fg2); }

/* ---------- Search ---------- */
.search { margin: 8px 0 12px; position: relative; }
.search input { width: 100%; height: 38px; border-radius: 12px; border: 0; background: var(--chip); color: var(--fg);
  padding: 0 36px 0 34px; font-size: 16px; outline: none; -webkit-appearance: none; appearance: none; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.search .glass { position: absolute; left: 11px; top: 11px; width: 16px; height: 16px; opacity: .5; pointer-events: none; }
.search .clear { position: absolute; right: 8px; top: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--fg2);
  color: var(--bg); display: flex; align-items: center; justify-content: center; }
.search .clear svg { width: 10px; height: 10px; }

/* ---------- The board: 3 across ---------- */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { position: relative; display: block; width: 100%; text-align: left; background: var(--tile); border-radius: 18px; overflow: hidden;
  transition: transform 120ms ease; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.tile:active { transform: scale(0.95); }
.tile.playing { box-shadow: 0 0 0 3px var(--playing); }
.gif { position: relative; width: 100%; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; overflow: hidden;
  background: var(--chip); }
.gif img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none; }
.gif .letter { font-size: 40px; font-weight: 700; color: var(--fg2); }
.name { font-size: 13px; font-weight: 600; padding: 7px 9px 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.speaker { position: absolute; right: 7px; bottom: 38px; width: 26px; height: 26px; border-radius: 50%; background: var(--speaker); color: #FFFFFF;
  display: flex; align-items: center; justify-content: center; pointer-events: none; }
.speaker svg { width: 15px; height: 15px; }
.tile.playing .speaker { background: var(--playing); color: var(--playing-fg); }
.tile.playing .speaker .wave { animation: wave .5s ease-in-out infinite alternate; }
@keyframes wave { from { opacity: .3; } to { opacity: 1; } }
.empty { text-align: center; color: var(--fg2); margin-top: 110px; font-size: 17px; font-weight: 600; display: flex; flex-direction: column;
  align-items: center; gap: 14px; }
.primary { padding: 12px 22px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 16px; font-weight: 600; }

/* ---------- Stop, toast ---------- */
.stop { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%); z-index: 3;
  padding: 11px 22px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 16px; font-weight: 600;
  box-shadow: 0 6px 20px var(--shadow); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 80px); transform: translateX(-50%); z-index: 6;
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
  display: flex; gap: 14px; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; }
.toast span { overflow: hidden; text-overflow: ellipsis; }
.toast button { text-decoration: underline; font-weight: 700; }

/* ---------- Touch and hold: Edit / Delete ---------- */
.menu { position: fixed; z-index: 5; background: var(--bg); border-radius: 14px; box-shadow: 0 10px 30px var(--shadow); min-width: 180px;
  overflow: hidden; border: 1px solid var(--line); }
.menu button { display: block; width: 100%; text-align: left; padding: 12px 16px; font-size: 16px; }
.menu button + button { border-top: 1px solid var(--line); }
.menu .danger { color: var(--danger); }

/* ---------- Sheets: Add Sound, Edit Sound, How Sounds Works ---------- */
.layer { position: fixed; inset: 0; z-index: 7; display: flex; flex-direction: column; justify-content: flex-end; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: relative; background: var(--bg); border-radius: 22px 22px 0 0; padding: 10px 20px calc(env(safe-area-inset-bottom) + 30px); }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.sheet-nav b { font-size: 17px; }
.sheet-nav button { font-size: 17px; padding: 4px 2px; }
.sheet-nav .save { font-weight: 600; }
.sheet-nav .save[disabled] { color: var(--fg2); }
.pickrow { display: flex; gap: 12px; margin-bottom: 14px; }
.pick { flex: 1; min-width: 0; height: 110px; border-radius: 16px; border: 1.5px dashed var(--line); background: var(--chip); font-size: 15px;
  font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
  overflow: hidden; position: relative; padding: 0 8px; text-align: center; }
.pick.chosen { border-style: solid; border-color: var(--fg); }
.pick.bad { border-color: var(--danger); color: var(--danger); }
.pick small { font-size: 12px; font-weight: 500; color: var(--fg2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pick input { display: none; }
.field { width: 100%; height: 44px; border-radius: 12px; border: 1.5px solid transparent; background: var(--chip); color: var(--fg);
  padding: 0 12px; font-size: 16px; margin-bottom: 10px; outline: none; }
.field.bad { border-color: var(--danger); }
.how-line { font-size: 16px; line-height: 1.35; padding: 12px 0; }
.how-line + .how-line { border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div id="main"></div>
<script>
// Midas local store for Sidekicks. Paste this into the Sidekick bundle's inline script (its
// hash goes into the deploy like any other script). It talks to the Midas shell on the phone
// through plain fetch to the Sidekick's own origin: no bridge, works without a connection.
//
//   await store.set('reminder:42', { at: new Date(2026, 9, 9, 9, 0).toISOString(),
//                                    title: 'Call mom', repeat: { every: 'week' },
//                                    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone });
//   const reminder = await store.get('reminder:42');     // null if absent
//   const all = await store.query('reminder:');          // [{ key, value }], sorted by key
//   await store.update('reminder:42', { done: true, snoozedUntil: null });  // merge, RFC 7396
//   await store.delete('reminder:42');
//   var ref = await store.putFile(blob);                 // "file:<id>", put it in a record
//   img.src = await store.fileUrl(ref);                  // a blob: URL for the file's bytes
//
// Every record has a type: the Sidekick's manifest.json declares one JSON Schema per key prefix
// under "types", and the shell stamps "$type" and checks the value on every set and update. A
// record that does not fit is rejected at write time: the promise rejects with the reason and
// nothing is written. `update` merges a patch into the stored record: a field set to null is
// removed, an object field is merged, every other field is replaced.
//
// A record holds at most 64 KB. Images and other files go through `putFile` (up to 20 MB): the
// shell keeps the file, sends it to the server before the record that points to it, and gives it
// back with `fileUrl`. A record over the limit because of a `data:` URL is fixed the same way.
//
// Opened from a jess work log card (founder, 2026-10-31), the page is told which record jess
// changed: give every record's element `data-key="<its key>"` and the change is found, centred
// and marked in Volt by itself. A page that shows records in lists, months or days also opens the
// one holding the key, and a page with its own scroller scrolls to it itself (the SDK only scrolls
// a container that really scrolls); an edit's old value and a deleted record's row (with Undo)
// are the page's:
//
//   var focus = await store.focus();   // { key, op: 'new'|'edit'|'delete', before } or null
//   store.markChange(element);         // centre and mark an element again (after a re-render)
var store = (function createMidasStore() {
  var storeURL = window.location.origin + '/_midas/store';
  var filesURL = window.location.origin + '/_midas/files';

  async function sendToShell(request) {
    var requestOptions = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(request),
    };
    var response = await fetch(storeURL, requestOptions);
    var reply = await response.json();
    if (!reply.ok) {
      throw new Error(reply.error);
    }
    return reply;
  }

  async function setRecord(key, value) {
    await sendToShell({ op: 'set', key: key, value: value });
  }

  async function getRecord(key) {
    var reply = await sendToShell({ op: 'get', key: key });
    return reply.value;
  }

  async function updateRecord(key, patch) {
    var reply = await sendToShell({ op: 'update', key: key, patch: patch });
    return reply.value;
  }

  async function deleteRecord(key) {
    await sendToShell({ op: 'delete', key: key });
  }

  async function queryRecords(prefix) {
    var reply = await sendToShell({ op: 'query', prefix: prefix || '' });
    return reply.records;
  }

  async function putFile(blob) {
    // The bytes themselves, not the Blob: the shell's scheme handler gets a plain body that way.
    var bytes = await new Response(blob).arrayBuffer();
    var requestOptions = {
      method: 'POST',
      headers: { 'Content-Type': blob.type || 'application/octet-stream' },
      body: bytes,
    };
    var response = await fetch(filesURL, requestOptions);
    var reply = await response.json();
    if (!reply.ok) {
      throw new Error(reply.error);
    }
    return reply.ref;
  }

  async function fileUrl(reference) {
    var fileId = String(reference).replace(/^file:/, '');
    var response = await fetch(filesURL + '/' + encodeURIComponent(fileId));
    if (!response.ok) {
      throw new Error('no such file');
    }
    var blob = await response.blob();
    return URL.createObjectURL(blob);
  }

  // The change a jess card opened this page at; asked once, kept for the page's later calls
  var focusRequest = null;

  async function askFocus() {
    try {
      var reply = await sendToShell({ op: 'focus' });
      return reply.focus || null;
    } catch (error) {
      // An older shell does not know the op: the page opens as usual
      return null;
    }
  }

  function readFocus() {
    if (!focusRequest) {
      focusRequest = askFocus();
    }
    return focusRequest;
  }

  // The mark (docs/mockups/jess-worklog-links-2026-10-31.html): Volt in 180 ms, held 1.2 s,
  // faded over 1.2 s, with a 3 pt ink edge on the left (Volt alone is 1.2:1 on white)
  var markInMs = 180;
  var markHoldMs = 1200;
  var markFadeMs = 1200;

  // The nearest container that really scrolls; null when the page scrolls itself (a custom
  // scroller), so the SDK never moves a container the page keeps still
  function scrollingAncestor(element) {
    var current = element.parentElement;
    while (current && current !== document.body && current !== document.documentElement) {
      var overflowY = window.getComputedStyle(current).overflowY;
      if ((overflowY === 'auto' || overflowY === 'scroll') && current.scrollHeight > current.clientHeight) {
        return current;
      }
      current = current.parentElement;
    }
    var page = document.scrollingElement || document.documentElement;
    var pageOverflow = window.getComputedStyle(document.body).overflowY;
    if (pageOverflow !== 'hidden' && page.scrollHeight > window.innerHeight) {
      return page;
    }
    return null;
  }

  function centre(element) {
    var container = scrollingAncestor(element);
    if (!container) {
      return;
    }
    var box = element.getBoundingClientRect();
    var isPage = container === document.scrollingElement || container === document.documentElement;
    var containerTop = isPage ? 0 : container.getBoundingClientRect().top;
    var visibleHeight = isPage ? window.innerHeight : container.clientHeight;
    var target = container.scrollTop + (box.top - containerTop) - (visibleHeight - box.height) / 2;
    container.scrollTop = Math.max(0, target);
  }

  function markChange(element) {
    if (!element) {
      return;
    }
    centre(element);
    var ownBackground = window.getComputedStyle(element).backgroundColor;
    var total = markInMs + markHoldMs + markFadeMs;
    var lit = { backgroundColor: '#CEFF00', boxShadow: 'inset 3px 0 0 #111111' };
    var keyframes = [
      { backgroundColor: ownBackground, boxShadow: 'inset 3px 0 0 rgba(17, 17, 17, 0)', offset: 0 },
      { backgroundColor: lit.backgroundColor, boxShadow: lit.boxShadow, offset: markInMs / total },
      { backgroundColor: lit.backgroundColor, boxShadow: lit.boxShadow, offset: (markInMs + markHoldMs) / total },
      { backgroundColor: ownBackground, boxShadow: 'inset 3px 0 0 rgba(17, 17, 17, 0)', offset: 1 },
    ];
    element.animate(keyframes, { duration: total, easing: 'ease-out' });
  }

  function elementForKey(key) {
    var all = document.querySelectorAll('[data-key]');
    for (var index = 0; index < all.length; index += 1) {
      if (all[index].getAttribute('data-key') === key) {
        return all[index];
      }
    }
    return null;
  }

  // Waits up to 3 s for the page to draw the record, then marks it once
  var markWaitMs = 3000;

  async function markFocusWhenDrawn() {
    var focus = await readFocus();
    if (!focus) {
      return;
    }
    var found = elementForKey(focus.key);
    if (found) {
      markChange(found);
      return;
    }
    var observer = new MutationObserver(checkForElement);
    function checkForElement() {
      var drawn = elementForKey(focus.key);
      if (!drawn) {
        return;
      }
      observer.disconnect();
      markChange(drawn);
    }
    function stopWaiting() {
      observer.disconnect();
    }
    observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['data-key'] });
    window.setTimeout(stopWaiting, markWaitMs);
  }

  markFocusWhenDrawn();

  return { set: setRecord, get: getRecord, update: updateRecord, delete: deleteRecord, query: queryRecords, putFile: putFile, fileUrl: fileUrl, focus: readFocus, markChange: markChange };
})();

/* ======================================================================
   SoundsLogic: names, tags, order, search, starters, settings and the widget. No screen, no
   store: the tools (tools.js) carry this block character for character, so a sound renamed by
   voice is written exactly as the page writes it.
   ====================================================================== */
var SoundsLogic = (function createSoundsLogic() {
  'use strict';

  const SOUND_PREFIX = 'sound:';
  const SETTINGS_KEY = 'settings:self';
  const NAME_MAX = 60;
  const TAG_MAX = 30;
  const TAGS_MAX = 20;
  const SEEDED_MAX = 200;
  const STARTER_KEY_MAX = 40;
  const FILE_REF_PATTERN = /^file:[A-Za-z0-9_-]{1,64}$/;
  // The Home Screen widget (docs/WIDGETS.md, "Every Sidekick ships a widget"): the count and the
  // first names, on the home grid's Lemon by day and the page's own night black in dark mode
  // (founder, 2026-10-27: every widget gives light and dark). A widget cannot draw a GIF or play
  // a sound, so a tap opens Sounds.
  const WIDGET_KEY = 'widget:sounds';
  const WIDGET_NAME = 'Sounds';
  const WIDGET_VERSION = 1;
  const WIDGET_SYMBOL = 'speaker.wave.2.fill';
  const WIDGET_BACKGROUND = { light: '#FFE600', dark: '#1A1A1A' };
  const WIDGET_INK = { light: '#111111', dark: '#FFFFFF' };
  const WIDGET_INK_SECONDARY = { light: '#3D3A00', dark: '#C8C8C8' };
  const WIDGET_MARK = { light: '#111111', dark: '#FFE600' };
  // The widget's list reads at most 50 records (the shell's limit), so "+N more" stays right up to 50
  const WIDGET_SOURCE_LIMIT = 50;
  const WIDGET_ROWS = { small: 3, medium: 4 };

  /* ---------- Small helpers ---------- */

  function copyJson(value) {
    if (value === null || value === undefined) {
      return null;
    }
    return JSON.parse(JSON.stringify(value));
  }

  function isPlainObject(value) {
    return value !== null && typeof value === 'object' && !Array.isArray(value);
  }

  // JSON with object keys sorted, so two descriptions compare equal whatever order the shell
  // stored their keys in
  function stableJson(value) {
    if (Array.isArray(value)) {
      const parts = [];
      for (const element of value) {
        parts.push(stableJson(element));
      }
      return '[' + parts.join(',') + ']';
    }
    if (isPlainObject(value)) {
      const names = Object.keys(value);
      names.sort();
      const parts = [];
      for (const name of names) {
        parts.push(JSON.stringify(name) + ':' + stableJson(value[name]));
      }
      return '{' + parts.join(',') + '}';
    }
    return JSON.stringify(value);
  }

  // Runs of spaces become one; ends trimmed
  function squeezeSpaces(text) {
    const words = String(text === null || text === undefined ? '' : text).split(/\s+/);
    const kept = [];
    for (const word of words) {
      if (word !== '') {
        kept.push(word);
      }
    }
    return kept.join(' ');
  }

  function isFileRef(value) {
    return typeof value === 'string' && FILE_REF_PATTERN.test(value);
  }

  /* ---------- Names and tags ---------- */

  // A name as stored: spaces squeezed, at most 60 characters; '' when nothing is left
  function cleanName(text) {
    const squeezed = squeezeSpaces(text);
    const cut = squeezed.slice(0, NAME_MAX);
    return cut.trim();
  }

  function withCapitalFirst(text) {
    const first = text.charAt(0);
    return first.toUpperCase() + text.slice(1);
  }

  // The Name field's first guess from a picked file: "vine_boom-2.mp3" → "Vine boom 2"
  function nameFromFileName(fileName) {
    const text = String(fileName || '');
    const dot = text.lastIndexOf('.');
    const withoutExtension = dot > 0 ? text.slice(0, dot) : text;
    const spaced = withoutExtension.replace(/[_-]+/g, ' ');
    const cleaned = cleanName(spaced);
    if (cleaned === '') {
      return '';
    }
    return withCapitalFirst(cleaned);
  }

  function cleanTag(text) {
    const squeezed = squeezeSpaces(text);
    const lowered = squeezed.toLowerCase();
    const cut = lowered.slice(0, TAG_MAX);
    return cut.trim();
  }

  // Tags as stored: lower case, no empties, no repeats, at most 20
  function cleanTags(list) {
    const tags = [];
    for (const item of Array.isArray(list) ? list : []) {
      const tag = cleanTag(item);
      if (tag !== '' && tags.indexOf(tag) === -1 && tags.length < TAGS_MAX) {
        tags.push(tag);
      }
    }
    return tags;
  }

  // The Tags field: tags between commas ("fail, sad trombone")
  function parseTags(text) {
    const parts = String(text === null || text === undefined ? '' : text).split(',');
    return cleanTags(parts);
  }

  function tagsText(tags) {
    return cleanTags(tags).join(', ');
  }

  /* ---------- Sounds ---------- */

  // A stored sound, read with defaults
  function soundFrom(value) {
    const source = isPlainObject(value) ? value : {};
    return {
      name: typeof source.name === 'string' ? source.name : '',
      tags: cleanTags(source.tags),
      audio: isFileRef(source.audio) ? source.audio : null,
      image: isFileRef(source.image) ? source.image : null,
      order: Number.isFinite(source.order) ? source.order : null,
      starter: typeof source.starter === 'string' ? source.starter : null,
      createdAt: typeof source.createdAt === 'string' ? source.createdAt : ''
    };
  }

  // Board order: by order (sounds without one last), then when added, then key
  function compareEntries(first, second) {
    const firstOrder = first.sound.order === null ? Infinity : first.sound.order;
    const secondOrder = second.sound.order === null ? Infinity : second.sound.order;
    if (firstOrder !== secondOrder) {
      return firstOrder < secondOrder ? -1 : 1;
    }
    if (first.sound.createdAt !== second.sound.createdAt) {
      return first.sound.createdAt < second.sound.createdAt ? -1 : 1;
    }
    if (first.key === second.key) {
      return 0;
    }
    return first.key < second.key ? -1 : 1;
  }

  // The board: [{ key, sound }] in order, from [{ key, value }] records
  function soundsInOrder(records) {
    const entries = [];
    for (const record of Array.isArray(records) ? records : []) {
      if (typeof record.key === 'string' && record.key.indexOf(SOUND_PREFIX) === 0) {
        entries.push({ key: record.key, sound: soundFrom(record.value) });
      }
    }
    entries.sort(compareEntries);
    return entries;
  }

  function searchTextOf(sound) {
    const words = [sound.name].concat(sound.tags);
    return words.join(' ').toLowerCase();
  }

  // Every word of the query is somewhere in the name or the tags, any case; an empty query matches
  function matchesQuery(sound, query) {
    const queryText = String(query === null || query === undefined ? '' : query);
    const lowered = queryText.toLowerCase();
    const words = squeezeSpaces(lowered).split(' ');
    const haystack = searchTextOf(sound);
    for (const word of words) {

  function decodedBufferFor(ref) {
    if (decodedAudio[ref] === undefined) {
      const decoding = fetchAndDecode(ref);
      decodedAudio[ref] = decoding;
      decoding.catch(function forgetFailedDecode() {
        delete decodedAudio[ref];
      });
    }
    return decodedAudio[ref];
  }

  function markPlaying(key, change) {
    const count = (state.playingCounts[key] || 0) + change;
    if (count > 0) {
      state.playingCounts[key] = count;
    } else {
      delete state.playingCounts[key];
    }
  }

  function finishPlay(play) {
    const index = activePlays.indexOf(play);
    if (index === -1) {
      return;
    }
    activePlays.splice(index, 1);
    markPlaying(play.key, -1);
    renderPlaying();
  }

  function stopAll() {
    const stopping = activePlays.slice();
    for (const play of stopping) {
      try {
        play.source.stop();
      } catch (error) {
        // already over
      }
      finishPlay(play);
    }
  }

  // Must start inside the tap: iOS lets an AudioContext run only after a person's gesture
  function wakeAudio() {
    const context = getAudioContext();
    if (context.state === 'suspended') {
      context.resume();
    }
    return context;
  }

  async function playSound(key) {
    const entry = entryByKey(key);
    if (entry === null || entry.sound.audio === null) {
      return null;
    }
    const context = wakeAudio();
    if (!state.settings.overlap) {
      stopAll();
    }
    const buffer = await decodedBufferFor(entry.sound.audio);
    const source = context.createBufferSource();
    source.buffer = buffer;
    source.connect(context.destination);
    const play = { key: key, source: source };
    source.onended = finishPlay.bind(null, play);
    activePlays.push(play);
    markPlaying(key, 1);
    source.start();
    renderPlaying();
    return { duration: buffer.duration };
  }

  function playFromScreen(key) {
    const playing = playSound(key);
    playing.catch(function reportPlayFailure(error) {
      console.warn('Sounds: play failed', error);
      const entry = entryByKey(key);
      showToast({ label: 'Can’t Play ' + (entry ? entry.sound.name : ''), undo: null });
    });
  }

  // Starts fetching and decoding as the finger lands, so the sound is ready when it lifts
  function prepareSound(key) {
    const entry = entryByKey(key);
    if (entry === null || entry.sound.audio === null) {
      return;
    }
    const preparing = decodedBufferFor(entry.sound.audio);
    preparing.catch(ignorePrepareFailure);
  }

  function ignorePrepareFailure() {
    // the tap itself reports it
  }

  /* ---------- Reading ---------- */

  async function readAll() {
    const settingsValue = await store.get(Logic.SETTINGS_KEY);
    const soundRecords = await store.query(Logic.SOUND_PREFIX);
    state.settings = Logic.settingsFrom(settingsValue);
    state.entries = Logic.soundsInOrder(soundRecords);
  }

  // The starter-sounds block at the end of the page (backend/scripts/soundboard-starter.mjs)
  function readStarters() {
    const block = document.getElementById('starter-sounds');
    if (block === null) {
      return [];
    }
    const text = block.content ? block.content.textContent : block.textContent;
    try {
      const starters = JSON.parse(text);
      return Array.isArray(starters) ? starters : [];
    } catch (error) {
      console.warn('Sounds: starter block unreadable', error);
      return [];
    }
  }

  function blobFromBase64(base64, contentType) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let index = 0; index < binary.length; index += 1) {
      bytes[index] = binary.charCodeAt(index);
    }
    return new Blob([bytes], { type: contentType });
  }

  // Every starter not yet copied in: its clip and GIF into the store, its sound record, its key
  // into seeded (after each one, so a stop halfway keeps what was done). A failure stops the
  // copying until the next open.
  async function seedStarters() {
    const waiting = Logic.unseededStarters(readStarters(), state.settings);
    for (const starter of waiting) {
      const key = Logic.starterSoundKey(starter);
      // Another phone of the same person may have copied it in already (synced, seeded not yet)
      const existing = await store.get(key);
      if (existing === null) {
        await copyStarterIn(starter, key);
      }
      const settings = { seeded: state.settings.seeded.concat([starter.key]), overlap: state.settings.overlap };
      await saveSettings(settings);
      await readAll();
    }
  }

  async function copyStarterIn(starter, key) {
    const nowIso = new Date().toISOString();
    const audioBlob = blobFromBase64(starter.audioBase64, starter.audioType || 'audio/mpeg');
    const audioRef = await store.putFile(audioBlob);
    let imageRef = null;
    if (typeof starter.imageBase64 === 'string' && starter.imageBase64 !== '') {
      const imageBlob = blobFromBase64(starter.imageBase64, starter.imageType || 'image/gif');
      imageRef = await store.putFile(imageBlob);
    }
    const order = Logic.nextOrder(state.entries);
    const value = Logic.starterSoundRecord(starter, audioRef, imageRef, order, nowIso);
    await store.set(key, value);
  }

  async function saveSettings(settings) {
    const existing = await store.get(Logic.SETTINGS_KEY);
    const value = Logic.settingsRecord(settings, existing, new Date().toISOString());
    await store.set(Logic.SETTINGS_KEY, value);
    state.settings = Logic.settingsFrom(value);
  }

  async function seedStartersQuietly() {
    try {
      await seedStarters();
    } catch (error) {
      console.warn('Sounds: starters not copied in yet', error);
    }
  }

  async function firstLoad() {
    await readAll();
    await seedStartersQuietly();
    state.homeScreen = await shellShowsHomeScreenSteps();
    await publishWidgets();
    state.loaded = true;
    renderAll();
  }

  async function refresh() {
    await readAll();
    renderAll();
  }

  /* ---------- Add to Home Screen ---------- */

  // Asks the shell what it can do. A build older than the Add to Home Screen sheet answers
  // "unknown op shell", and Add Widget stays hidden there.
  async function shellShowsHomeScreenSteps() {
    try {
      const requestOptions = {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ op: 'shell' })
      };
      const response = await fetch(window.location.origin + '/_midas/store', requestOptions);
      const reply = await response.json();
      const kinds = reply.ok && Array.isArray(reply.requests) ? reply.requests : [];
      return kinds.indexOf(HOME_SCREEN_REQUEST_KIND) !== -1;
    } catch (error) {
      return false;
    }
  }

  // The shell shows the steps for this Sidekick's widget and marks the request done at once;
  // the record has done its job then, so it goes
  async function requestHomeScreenTask() {
    const keyOfSound = Logic.newSoundKey(Date.now(), Math.random());
    const requestKey = 'request:h' + keyOfSound.slice(Logic.SOUND_PREFIX.length);
    await store.set(requestKey, { kind: HOME_SCREEN_REQUEST_KIND, widget: 'sidekick', status: 'pending', createdAt: new Date().toISOString() });
    const request = await store.get(requestKey);
    if (request && request.status !== 'pending') {
      await store.delete(requestKey);
    }
  }

  /* ---------- Writing ---------- */

  // Writes the widget when its description changed. One the shell refuses (an app build without
  // light and dark everywhere, or without backgrounds) is replaced by the next one down.
  async function publishWidgets() {
    for (const widget of Logic.widgetRecords()) {
      const existing = await store.get(widget.key);
      const choices = [widget.value, widget.fallback, widget.plain];
      for (const choice of choices) {
        if (Logic.sameWidget(existing, choice)) {
          break;
        }
        try {
          await store.set(widget.key, choice);
          break;
        } catch (error) {
          console.warn('Sounds: widget refused, trying the next one', widget.key, error);
        }
      }
    }
  }

  // Saves the Add / Edit sheet: the picked files first, then the record
  async function saveSoundTask(form) {
    const nowIso = new Date().toISOString();
    const existing = form.key === null ? null : await store.get(form.key);
    const changes = { name: form.name, tags: Logic.parseTags(form.tags) };
    if (form.audioFile) {
      changes.audio = await store.putFile(form.audioFile);
    }
    if (form.imageFile) {
      changes.image = await store.putFile(form.imageFile);
    }
    let key = form.key;
    if (key === null) {
      key = Logic.newSoundKey(Date.now(), Math.random());
      changes.order = Logic.nextOrder(state.entries);
    }
    const value = Logic.soundRecord(changes, existing, nowIso);
    await store.set(key, value);
    await readAll();
    return key;
  }

  async function deleteSoundTask(key) {
    const existing = await store.get(key);
    if (existing === null) {
      return null;
    }
    await store.delete(key);
    await readAll();
    const value = Logic.copyJson(existing);
    delete value.$type;
    return { key: key, value: value };
  }

  async function undoDeleteTask(undo) {
    await store.set(undo.key, undo.value);
    await readAll();
  }

  async function setOverlapTask(overlap) {
    const settings = { seeded: state.settings.seeded, overlap: overlap };
    await saveSettings(settings);
  }

  /* ---------- From the screen ---------- */

  // Keeps what was typed before the sheet is drawn again
  function readSheetFields() {
    if (state.sheet === null) {
      return;
    }
    const nameField = document.getElementById('sound-name');
    const tagsField = document.getElementById('sound-tags');
    if (nameField) {
      state.sheet.name = nameField.value;
    }
    if (tagsField) {
      state.sheet.tags = tagsField.value;
    }
  }

  function openSheet(key) {
    const entry = key === null ? null : entryByKey(key);
    state.menu = null;
    state.helpOpen = false;
    state.sheet = {
      key: entry ? entry.key : null,
      name: entry ? entry.sound.name : '',
      tags: entry ? Logic.tagsText(entry.sound.tags) : '',
      audioFile: null,
      audioLabel: '',
      imageFile: null,
      imagePreview: null,
      problems: [],
      saving: false
    };
    renderActions();
    renderOverlay();
    if (entry && entry.sound.image !== null) {
      const loading = imageUrlFor(entry.sound.image);
      loading.then(showSheetImage.bind(null, entry.key), ignoreImageFailure);
    }
  }

  function showSheetImage(key, url) {
    if (state.sheet === null || state.sheet.key !== key || state.sheet.imageFile !== null) {
      return;
    }
    readSheetFields();
    state.sheet.imagePreview = url;
    renderOverlay();
  }

  function closeSheet() {
    state.sheet = null;
    renderOverlay();
  }

  function pickAudio(input) {
    const file = input.files && input.files[0];
    if (!file || state.sheet === null) {
      return;
    }
    readSheetFields();
    state.sheet.audioFile = file;
    state.sheet.audioLabel = file.name || 'Sound';
    state.sheet.problems = [];
    if (Logic.cleanName(state.sheet.name) === '') {
      state.sheet.name = Logic.nameFromFileName(file.name);
    }
    renderOverlay();
  }

  function pickImage(input) {
    const file = input.files && input.files[0];
    if (!file || state.sheet === null) {
      return;
    }
    readSheetFields();
    state.sheet.imageFile = file;
    state.sheet.imagePreview = URL.createObjectURL(file);
    renderOverlay();
  }

  function saveFromScreen() {
    if (state.sheet === null || state.sheet.saving) {
      return;
    }
    readSheetFields();
    const sheet = state.sheet;
    const audio = sheet.audioFile !== null ? 'picked' : (sheet.key !== null ? entryAudio(sheet.key) : null);
    const problems = Logic.sheetProblems(sheet.name, audio);
    if (problems.length > 0) {
      sheet.problems = problems;
      renderOverlay();
      return;
    }
    sheet.saving = true;
    renderOverlay();
    const form = { key: sheet.key, name: sheet.name, tags: sheet.tags, audioFile: sheet.audioFile, imageFile: sheet.imageFile };
    const adding = sheet.key === null;
    function saveAndClose() {
      return saveSoundTask(form).then(closeAfterSave.bind(null, adding));
    }
    const run = queueTask(saveAndClose);
    run.catch(reopenAfterFailedSave);
  }

  function entryAudio(key) {
    const entry = entryByKey(key);
    return entry === null ? null : entry.sound.audio;
  }

  function closeAfterSave(adding, key) {
    state.sheet = null;
    renderAll();
    if (adding) {
      const entry = entryByKey(key);
      showToast({ label: 'Added ' + (entry ? entry.sound.name : ''), undo: null });
    }
  }

  function reopenAfterFailedSave() {
    if (state.sheet !== null) {
      state.sheet.saving = false;
      renderOverlay();
    }
  }

  // Touch and hold: Edit and Delete, under the tile
  function openSoundMenu(tile) {
    const box = tile.getBoundingClientRect();
    const left = Math.max(8, Math.min(box.left, window.innerWidth - MENU_WIDTH_PX - 8));
    const top = Math.min(box.bottom + 6, window.innerHeight - 120);
    state.menu = { key: tile.dataset.key, top: Math.round(top), left: Math.round(left) };
    state.helpOpen = false;
    renderActions();
    renderOverlay();
  }

  function deleteFromScreen(key) {
    state.menu = null;
    renderOverlay();
    function deleteAndOfferUndo() {
      return deleteSoundTask(key).then(showDeleted);
    }
    queueFromScreen(deleteAndOfferUndo);
  }

  function showDeleted(undo) {
    renderAll();
    if (undo !== null) {
      showToast({ label: 'Deleted ' + (undo.value.name || ''), undo: undo });
    }
  }

  function undoDeleteFromScreen() {
    const undo = state.toast ? state.toast.undo : null;
    if (!undo) {
      return;
    }
    hideToast();
    function undoAndRender() {
      return undoDeleteTask(undo).then(renderAll);
    }
    queueFromScreen(undoAndRender);
  }

  function toggleOverlapFromScreen() {
    const overlap = !state.settings.overlap;
    function saveAndRender() {
      return setOverlapTask(overlap).then(renderActions);
    }
    queueFromScreen(saveAndRender);
  }

  function setQuery(query) {
    state.query = query;
    renderBoard();
  }

  function clearSearch() {
    const field = document.getElementById('search');
    field.value = '';
    setQuery('');
  }

  function handleClick(event) {
    const target = event.target.closest('[data-action]');
    if (!target || target.tagName === 'INPUT') {
      return;
    }
    if (Date.now() < ignoreClicksUntil) {
      return;
    }
    const action = target.dataset.action;
    if (action === 'play') {
      playFromScreen(target.dataset.key);
    } else if (action === 'stop-all') {
      stopAll();
    } else if (action === 'open-add') {
      openSheet(null);
    } else if (action === 'close-sheet') {
      closeSheet();
    } else if (action === 'save-sound') {
      saveFromScreen();
    } else if (action === 'edit-sound') {
      openSheet(state.menu ? state.menu.key : null);
    } else if (action === 'delete-sound') {
      deleteFromScreen(state.menu ? state.menu.key : null);
    } else if (action === 'close-menu') {
      state.menu = null;
      renderOverlay();
    } else if (action === 'undo-delete') {
      undoDeleteFromScreen();
    } else if (action === 'clear-search') {
      clearSearch();
    } else if (action === 'toggle-help') {
      state.helpOpen = !state.helpOpen;
      renderActions();
    } else if (action === 'close-help') {
      state.helpOpen = false;
      renderActions();
    } else if (action === 'add-home-screen') {
      state.helpOpen = false;
      renderActions();
      queueFromScreen(requestHomeScreenTask);
    } else if (action === 'toggle-overlap') {
      toggleOverlapFromScreen();
    } else if (action === 'show-how') {
      state.helpOpen = false;
      state.how = true;
      renderActions();
      renderOverlay();
    } else if (action === 'close-how') {
      state.how = false;
      renderOverlay();
    }
  }

  function handleInput(event) {
    if (event.target.dataset && event.target.dataset.action === 'search') {
      setQuery(event.target.value);
    }
  }

  function handleChange(event) {
    const action = event.target.dataset ? event.target.dataset.action : null;
    if (action === 'pick-audio') {
      pickAudio(event.target);
    } else if (action === 'pick-image') {
      pickImage(event.target);
    }
  }

  function handleKeyDown(event) {
    if (event.key === 'Enter' && (event.target.id === 'sound-name' || event.target.id === 'sound-tags')) {
      saveFromScreen();
    }
    if (event.key === 'Escape' && state.loaded && !state.failed) {
      state.sheet = null;
      state.menu = null;
      state.how = false;
      renderOverlay();
    }
  }

  function cancelPress() {
    if (pressTimer !== null) {
      clearTimeout(pressTimer);
      pressTimer = null;
    }
    pressStart = null;
  }

  function handlePointerUp() {
    if (longPressed) {
      longPressed = false;
      ignoreClicksUntil = Date.now() + 400;
    }
    cancelPress();
  }

  function handleLongPress(tile) {
    pressTimer = null;
    longPressed = true;
    openSoundMenu(tile);
  }

  function handlePointerDown(event) {
    const tile = event.target.closest('.tile');
    if (!tile) {
      return;
    }
    longPressed = false;
    cancelPress();
    pressStart = { x: event.clientX, y: event.clientY };
    pressTimer = setTimeout(handleLongPress, LONG_PRESS_MS, tile);
    prepareSound(tile.dataset.key);
  }

  function handlePointerMove(event) {
    if (pressStart === null) {
      return;
    }
    const movedX = Math.abs(event.clientX - pressStart.x);
    const movedY = Math.abs(event.clientY - pressStart.y);
    if (movedX > LONG_PRESS_SLOP_PX || movedY > LONG_PRESS_SLOP_PX) {
      cancelPress();
    }
  }

  // The phone's own touch-and-hold menu would cover the page's
  function handleContextMenu(event) {
    if (event.target.closest('.tile')) {
      event.preventDefault();
    }
  }

  // Back on screen: jess may have renamed, tagged or deleted a sound
  function handleVisibilityChange() {
    if (document.hidden || !state.loaded || state.failed) {
      return;
    }
    queueFromScreen(refresh);
  }

  function showLoadFailure(error) {
    console.warn('Sounds: load failed', error);
    state.loaded = true;
    state.failed = true;
    renderAll();
  }

  function start() {
    document.addEventListener('click', handleClick);
    document.addEventListener('input', handleInput);
    document.addEventListener('change', handleChange);
    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('pointerdown', handlePointerDown);
    document.addEventListener('pointermove', handlePointerMove);
    document.addEventListener('pointerup', handlePointerUp);
    document.addEventListener('pointercancel', cancelPress);
    document.addEventListener('contextmenu', handleContextMenu);
    document.addEventListener('visibilitychange', handleVisibilityChange);
    readyPromise = queueTask(firstLoad);
    readyPromise.catch(showLoadFailure);
  }

  // The starter block sits after this script, at the end of <body>: start once it is parsed
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

  /* ---------- For tests: the same operations the screen uses ---------- */

  function whenReady() {
    return readyPromise;
  }

  function search(query) {
    const field = document.getElementById('search');
    field.value = query;
    setQuery(query);
    return Logic.namesOf(Logic.filterEntries(state.entries, query));
  }

  function play(key) {
    return playSound(key);
  }

  function prepare(key) {
    const entry = entryByKey(key);
    return decodedBufferFor(entry.sound.audio).then(durationOf);
  }

  function durationOf(buffer) {
    return buffer.duration;
  }

  function saveSound(form) {
    const fullForm = { key: form.key || null, name: form.name, tags: form.tags || '', audioFile: form.audioFile || null, imageFile: form.imageFile || null };
    return queueTask(function saveForCaller() {
      return saveSoundTask(fullForm).then(renderAndReturn);
    });
  }

  function renderAndReturn(value) {
    renderAll();
    return value;
  }

  function deleteSound(key) {
    return queueTask(function deleteForCaller() {
      return deleteSoundTask(key).then(showDeleted);
    });
  }

  function undoDelete() {
    const undo = state.toast ? state.toast.undo : null;
    return queueTask(function undoForCaller() {
      return undo ? undoDeleteTask(undo).then(renderAll) : null;
    });
  }

  function setOverlap(overlap) {
    return queueTask(function overlapForCaller() {
      return setOverlapTask(overlap).then(renderActions);
    });
  }

  function refreshNow() {
    return queueTask(refresh);
  }

  function snapshotState() {
    return Logic.copyJson({
      entries: state.entries, settings: state.settings, query: state.query, toast: state.toast,
      playing: Object.keys(state.playingCounts), homeScreen: state.homeScreen
    });
  }

  return {
    whenReady: whenReady, search: search, play: play, prepare: prepare, stopAll: stopAll, saveSound: saveSound,
    deleteSound: deleteSound, undoDelete: undoDelete, setOverlap: setOverlap, refresh: refreshNow, state: snapshotState
  };
})();
</script>
