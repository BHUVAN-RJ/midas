      return colorCss(BUILTIN[viewId].title);
    }
    const list = listOf(viewId);
    return list ? colorCss(list.color) : 'var(--blue)';
  }

  function viewTint(viewId) {
    if (isBuiltin(viewId)) {
      const color = BUILTIN[viewId].title;
      const neutral = color === 'label' || color === 'ink' || color === 'gray';
      return neutral ? 'var(--blue)' : colorCss(color);
    }
    return viewTitleColor(viewId);
  }

  function hasNoData() {
    return state.items.length === 0 && state.history.length === 0 && ownLists().length === 0;
  }

  /* ======================================================================
     The store: read everything, write one record at a time (read before write)
     ====================================================================== */

  let writeChain = Promise.resolve();

  // Writes run one after another, so a read-then-write never races another write
  function enqueueWrite(task) {
    const run = writeChain.then(task);
    writeChain = run.catch(reportWriteFailure);
  }

  function waitForWrites() {
    return writeChain;
  }

  function reportWriteFailure(error) {
    showAlert('Couldn’t Save', messageOf(error));
    // What is on screen may now differ from the store: read it again
    enqueueWrite(reloadRecordsTask);
  }

  async function readStoreRecords() {
    const reminderRecords = await store.query('reminder:');
    const taskRecords = await store.query('task:');
    const listRecords = await store.query('list:');
    const historyRecords = await store.query('history:');
    const sidebar = await store.get('settings:sidebar');
    return { reminderRecords: reminderRecords, taskRecords: taskRecords, listRecords: listRecords, historyRecords: historyRecords, sidebar: sidebar };
  }

  function itemsFromRecords(records) {
    const items = [];
    for (const record of records || []) {
      const item = Logic.itemFromRecord(record.key, record.value);
      item.recordKey = record.key;
      items.push(item);
    }
    return items;
  }

  function historyFromRecords(records) {
    const items = [];
    for (const record of records || []) {
      const packed = Logic.unpackHistory([record]);
      for (const stored of packed) {
        const item = Logic.copyJson(stored);
        item.historyKey = record.key;
        items.push(item);
      }
    }
    return items;
  }

  function listsFromRecords(records) {
    const lists = {};
    for (const record of records || []) {
      const value = record.value || {};
      const id = Logic.idFromKey(record.key);
      lists[id] = {
        id: id, name: String(value.name || 'Untitled List'), color: value.color || '#007AFF', icon: value.icon || 'list',
        source: value.source || null, createdAt: value.createdAt || null
      };
    }
    return lists;
  }

  function compareListsByCreation(first, second) {
    const firstTime = Date.parse(first.createdAt || '') || 0;
    const secondTime = Date.parse(second.createdAt || '') || 0;
    if (firstTime !== secondTime) {
      return firstTime - secondTime;
    }
    return first.name < second.name ? -1 : 1;
  }

  // One order for built-in and own lists; anything the saved order misses goes at the end
  function buildOrder(savedOrder, lists) {
    const order = [];
    for (const id of savedOrder) {
      const known = isBuiltin(id) || Boolean(lists[id]);
      if (known && order.indexOf(id) === -1) {
        order.push(id);
      }
    }
    for (const id of Logic.BUILTIN_IDS) {
      if (order.indexOf(id) === -1) {
        order.push(id);
      }
    }
    const unplaced = [];
    for (const id of Object.keys(lists)) {
      if (order.indexOf(id) === -1) {
        unplaced.push(lists[id]);
      }
    }
    unplaced.sort(compareListsByCreation);
    for (const list of unplaced) {
      order.push(list.id);
    }
    return order;
  }

  function applyStoreRecords(loaded) {
    state.items = itemsFromRecords(loaded.reminderRecords).concat(itemsFromRecords(loaded.taskRecords));
    state.history = historyFromRecords(loaded.historyRecords);
    state.historyKeys = [];
    for (const record of loaded.historyRecords || []) {
      state.historyKeys.push(record.key);
    }
    state.lists = listsFromRecords(loaded.listRecords);
    const savedOrder = loaded.sidebar && Array.isArray(loaded.sidebar.order) ? loaded.sidebar.order : [];
    state.order = buildOrder(savedOrder, state.lists);
    if (!viewExists(state.view)) {
      state.view = 'today';
      state.scope = 0;
    }
    state.loaded = true;
  }

  async function reloadRecordsTask() {
    const loaded = await readStoreRecords();
    if (isBusyForReload()) {
      state.reloadWanted = true;
      return;
    }
    applyStoreRecords(loaded);
    requestRender();
  }

  function isBusyForReload() {
    return Boolean(state.editing || state.sheet || state.addList || rowDrag || (gesture && gesture.claimed) || rowsLeaving > 0 || Object.keys(pendingDone).length);
  }

  function requestReload() {
    if (isBusyForReload()) {
      state.reloadWanted = true;
      return;
    }
    state.reloadWanted = false;
    enqueueWrite(reloadRecordsTask);
  }

  function reloadIfWanted() {
    if (state.reloadWanted) {
      requestReload();
    }
  }

  /* ---------- Writing one item ---------- */

  const LOCAL_FIELDS = ['recordKey', 'historyKey', 'isUnsaved', 'removed'];

  function storableCopy(item) {
    const copy = Logic.copyJson(item);
    for (const field of LOCAL_FIELDS) {
      delete copy[field];
    }
    return copy;
  }

  function adoptStoredItem(item, stored) {
    delete item.isUnsaved;
    item.recordKey = stored.recordKey;
    // Never overwrite a title the person is typing right now
    if (state.editing && state.editing.id === item.id) {
      return;
    }
    Object.assign(item, stored);
  }

  async function writeRecordChange(item, applyChange) {
    const oldKey = item.recordKey || null;
    const existing = oldKey ? await store.get(oldKey) : null;
    let fresh;
    if (existing) {
      fresh = Logic.itemFromRecord(oldKey, existing);
      applyChange(fresh);
    } else {
      fresh = storableCopy(item);
    }
    const newKey = Logic.recordKey(fresh);
    const value = Logic.recordFromItem(fresh, existing);
    await store.set(newKey, value);
    // Dated and undated items live under different keys; the id stays the same
    if (oldKey && oldKey !== newKey) {
      await store.delete(oldKey);
    }
    const stored = Logic.itemFromRecord(newKey, value);
    stored.recordKey = newKey;
    adoptStoredItem(item, stored);
  }

  function indexOfId(items, id) {
    for (let index = 0; index < items.length; index += 1) {
      if (items[index] && items[index].id === id) {
        return index;
      }
    }
    return -1;
  }

  async function writeHistoryItems(historyKey, record, items) {
    if (items.length === 0) {
      await store.delete(historyKey);
      return;
    }
    const value = Object.assign({}, record || {}, { items: items });
    await store.set(historyKey, value);
  }

  function moveHistoryItemToRecords(item, newKey, value) {
    const stored = Logic.itemFromRecord(newKey, value);
    stored.recordKey = newKey;
    const remaining = [];
    for (const historyItem of state.history) {
      if (historyItem !== item) {
        remaining.push(historyItem);
      }
    }
    state.history = remaining;
    delete item.historyKey;
    Object.assign(item, stored);
    state.items.push(item);
  }

  async function writeHistoryChange(item, applyChange) {
    const historyKey = item.historyKey;
    const record = await store.get(historyKey);
    const storedItems = record && Array.isArray(record.items) ? record.items.slice() : [];
    const index = indexOfId(storedItems, item.id);
    if (index === -1) {
      return;
    }
    const fresh = Logic.copyJson(storedItems[index]);
    applyChange(fresh);
    if (fresh.done) {
      storedItems[index] = fresh;
      await writeHistoryItems(historyKey, record, storedItems);
      Object.assign(item, fresh);
      return;
    }
    // Marked not done: it becomes its own record again (written first, so nothing is lost)
    const newKey = Logic.recordKey(fresh);
    const value = Logic.recordFromItem(fresh, null);
    await store.set(newKey, value);
    storedItems.splice(index, 1);
    await writeHistoryItems(historyKey, record, storedItems);
    moveHistoryItemToRecords(item, newKey, value);
  }

  function itemWriteTask(item, applyChange) {
    return async function writeItemChange() {
      if (item.removed) {
        return;
      }
      if (item.historyKey) {
        await writeHistoryChange(item, applyChange);
      } else {
        await writeRecordChange(item, applyChange);
      }
      requestRender();
    };
  }

  // Show the change now, then write it: read the record, apply the same change, write it back
  function persistChange(item, applyChange) {
    applyChange(item);
    enqueueWrite(itemWriteTask(item, applyChange));
  }

  function itemDeletionTask(item) {
    return async function deleteItemRecord() {
      if (item.historyKey) {
        const record = await store.get(item.historyKey);
        const storedItems = record && Array.isArray(record.items) ? record.items.slice() : [];
        const index = indexOfId(storedItems, item.id);
        if (index !== -1) {
          storedItems.splice(index, 1);
          await writeHistoryItems(item.historyKey, record, storedItems);
        }
        return;
      }
      if (item.recordKey) {
        await store.delete(item.recordKey);
      }
    };
  }

  function removeItemLocally(item) {
    item.removed = true;
    const keptItems = [];
    for (const candidate of state.items) {
      if (candidate !== item) {
        keptItems.push(candidate);
      }
    }
    state.items = keptItems;
    const keptHistory = [];
    for (const candidate of state.history) {
      if (candidate !== item) {
        keptHistory.push(candidate);
      }
    }
    state.history = keptHistory;
  }

  function deleteItem(item) {
    const wasSaved = !item.isUnsaved;
    removeItemLocally(item);
    if (wasSaved) {
      enqueueWrite(itemDeletionTask(item));
    }
  }

  /* ---------- Changes ---------- */

  function snapshotFields(item) {
    return {
      title: item.title, notes: item.notes || '', list: item.list || null, date: item.date || null,
      time: item.time || null, repeat: Logic.copyJson(item.repeat)
    };
  }

  function fieldsDiffer(first, second) {
    return JSON.stringify(first) !== JSON.stringify(second);
  }

  function makeUserFieldsChange(fields) {
    return function applyUserFields(target) {
      const timingChanged = (target.date || null) !== fields.date || (target.time || null) !== (fields.date ? fields.time : null);
      target.title = fields.title;
      target.notes = fields.notes;
      target.list = fields.list;
      target.date = fields.date;
      target.time = fields.date ? fields.time : null;
      target.repeat = fields.date && fields.repeat ? Logic.copyJson(fields.repeat) : null;
      // A date or time picked here is meant in the phone's zone
      if (timingChanged) {
        target.timeZone = deviceZone;
      }
    };
  }

  function markDoneChange(occurrenceIso, nowIso) {
    return function applyMarkDone(target) {
      target.snoozedUntil = null;
      if (target.date && target.repeat) {
        // A repeat carries on: this occurrence is done (as the shell's Done does), the next one stays
        target.lastDoneAt = nowIso;
        const occurrenceMs = Date.parse(occurrenceIso || '');
        const doneThroughMs = Date.parse(target.doneThrough || '');
        if (!Number.isNaN(occurrenceMs) && (Number.isNaN(doneThroughMs) || occurrenceMs > doneThroughMs)) {
          target.doneThrough = occurrenceIso;
        }
        return;
      }
      target.done = true;
      target.completedAt = nowIso;
    };
  }

  function markNotDoneChange() {
    return function applyMarkNotDone(target) {
      target.done = false;
      target.completedAt = null;
    };
  }

  function saveSidebarOrderTask() {
    return async function writeSidebarOrder() {
      const existing = await store.get('settings:sidebar');
      const value = Object.assign({}, existing || {}, { order: state.order.slice() });
      await store.set('settings:sidebar', value);
    };
  }

  function saveListTask(list) {
    return async function writeList() {
      const existing = await store.get('list:' + list.id);
      const value = Object.assign({}, existing || {}, { name: list.name, color: list.color, icon: list.icon });
      if (list.createdAt) {
        value.createdAt = list.createdAt;
      }
      if (list.source) {
        value.source = list.source;
      }
      await store.set('list:' + list.id, value);
    };
  }

  /* ======================================================================
     What each view shows
     ====================================================================== */

  function editingItem() {
    return state.editing ? findItem(state.editing.id) : null;
  }

  // An entry for a row whose item is not placed by the rules (the row being typed)
  function plainEntry(item) {
    return { item: item, at: null, pastDue: false, day: item.date || null, time: item.time || null };
  }

  function entriesForView(viewId) {
    const now = Date.now();
    if (viewId === 'completed') {
      const pool = state.items.concat(state.history);
      return Logic.itemsInList(pool, 'completed', now, deviceZone);
    }
    return Logic.itemsInList(state.items, viewId, now, deviceZone);
  }

  function entriesForScope(scope) {
    if (scope === 'today') {
      return entriesForView('today');
    }
    return Logic.itemsInScope(state.items, scope, Date.now(), deviceZone);
  }

  function entriesContain(entries, id) {
    for (const entry of entries) {
      if (entry.item.id === id) {
        return true;
      }
    }
    return false;
  }

  // A new row being typed stays last, as in Apple Reminders
  function editingLast(entries) {
    const item = editingItem();
    if (!item || !item.isUnsaved) {
      return entries;
    }
    const others = [];
    let editingEntry = null;
    for (const entry of entries) {
      if (entry.item.id === item.id) {
        editingEntry = entry;
      } else {
        others.push(entry);
      }
    }
    if (editingEntry) {
      others.push(editingEntry);
    }
    return others;
  }

  // The row being typed stays where it was started, even if its date now points elsewhere
  function withEditingRow(entries) {
    const item = editingItem();
    if (!item || entriesContain(entries, item.id)) {
      return editingLast(entries);
    }
    return entries.concat([plainEntry(item)]);
  }

  function entriesOnDay(entries, dateText) {
    const result = [];
    for (const entry of entries) {
      if (entry.day === dateText) {
        result.push(entry);
      }
    }
    return result;
  }

  function rowsOf(entries, options) {
    const rows = [];
    for (const entry of entries) {
      rows.push({ entry: entry, options: options });
    }
    return rows;
  }

  /* Sections [{ header, headerColor, rows: [{ entry, options }] }] for a view other than Today */
  function collectView(viewId) {
    const sections = [];
    const entries = entriesForView(viewId);
    if (viewId === 'scheduled') {
      let currentDay = null;
      for (const entry of entries) {
        if (entry.day !== currentDay) {
          sections.push({ header: formatDayLabel(entry.day), rows: [] });
          currentDay = entry.day;
        }
        sections[sections.length - 1].rows.push({ entry: entry, options: { mode: 'normal', dateStyle: 'time', showList: true } });
      }
    } else if (viewId === 'all') {
      const groups = ownLists().concat([null]);
      for (const list of groups) {
        const rows = [];
        for (const entry of entries) {
          const itemList = listOf(entry.item.list);
          if (itemList === list) {
            rows.push({ entry: entry, options: { mode: 'normal', dateStyle: 'full', showList: false } });
          }
        }
        if (rows.length) {
          sections.push({ header: list ? list.name : 'No List', headerColor: list ? colorCss(list.color) : null, rows: rows });
        }
      }
    } else if (viewId === 'pastDue') {
      sections.push({ header: '', rows: rowsOf(entries, { mode: 'pastdue', dateStyle: 'full', showList: true }) });
    } else if (viewId === 'completed') {
      const shown = entries.slice(0, state.completedShown);
      sections.push({ header: '', rows: rowsOf(shown, { mode: 'done', dateStyle: 'full', showList: true }), more: entries.length - shown.length });
    } else if (viewId === 'unscheduled') {
      sections.push({ header: '', rows: rowsOf(entries, { mode: 'normal', dateStyle: 'full', showList: true }) });
    } else {
      sections.push({ header: '', rows: rowsOf(entries, { mode: 'normal', dateStyle: 'full', showList: false }) });
    }
    keepEditingRowVisible(sections);
    return sections;
  }

  function keepEditingRowVisible(sections) {
    const item = editingItem();
    if (!item) {
      return;
    }
    for (const section of sections) {
      for (let index = 0; index < section.rows.length; index += 1) {
        const row = section.rows[index];
        if (row.entry.item.id === item.id) {
          if (item.isUnsaved) {
            section.rows.splice(index, 1);
            section.rows.push(row);
          }
          return;
        }
      }
    }
    if (!sections.length) {
      sections.push({ header: '', rows: [] });
    }
    const lastSection = sections[sections.length - 1];
    lastSection.rows.push({ entry: plainEntry(item), options: { mode: 'normal', dateStyle: 'full', showList: false } });
  }

  function viewContains(viewId, id) {
    if (viewId === 'today') {
      return entriesContain(entriesForScope(SCOPE_ORDER[state.scope]), id);
    }
    return entriesContain(entriesForView(viewId), id);
  }

  function countForView(viewId) {
    if (viewId === 'completed') {
      return '';
    }
    return String(entriesForView(viewId).length);
  }

  /* Where an item now lives, for the "Moved to ..." toast */
  function whereLabel(item) {
    const placement = Logic.placeItem(item, Date.now(), deviceZone);
    if (placement.done) {
      return 'Completed';
    }
    if (placement.today) {
      return 'Today';
    }
    if (placement.upcoming) {
      return 'Scheduled, ' + formatDayLabel(placement.upcoming.day);
    }
    if (placement.overdue) {
      return 'Past Due';
    }
    const list = listOf(item.list);
    return list ? list.name : 'Unscheduled';
  }

  /* ======================================================================
     Rendering: rows
     ====================================================================== */

  function lateSpan(text, late) {
    return '<span' + (late ? ' class="late"' : '') + '>' + escapeHtml(text) + '</span>';
  }

  /* The grey line under a title: date and time (red when past due), repeat, list name */
  function dateLineHtml(entry, options) {
    if (options.dateStyle === 'none') {
      return '';
    }
    const item = entry.item;
    const parts = [];
    const day = entry.day || item.date;
    const time = entry.day ? entry.time : item.time;
    const late = options.mode !== 'done' && (options.mode === 'pastdue' || entry.pastDue);
    if (options.dateStyle === 'time') {
      if (time) {
        parts.push(lateSpan(Logic.formatTime12(time), late));
      }
    } else if (day) {
      const timePart = time ? ', ' + Logic.formatTime12(time) : '';
      parts.push(lateSpan(formatDayLabel(day) + timePart, late));
    }
    if (item.date && item.repeat) {
      parts.push(svgIcon('repeat', 13) + '<span>' + escapeHtml(repeatLabel(item.repeat)) + '</span>');
    }
    const list = listOf(item.list);
    if (options.showList && list) {
      if (parts.length) {
        parts.push('<span>·</span>');
      }
      parts.push('<span>' + escapeHtml(list.name) + '</span>');
    }
    if (!parts.length) {
      return '';
    }
    return '<div class="row-date">' + parts.join('') + '</div>';
  }

  function entryAtText(entry) {
    return entry.at ? entry.at.toISOString() : '';
  }

  function rowHtml(entry, options, index) {
    const item = entry.item;
    const id = escapeHtml(item.id);
    const isEditing = Boolean(state.editing && state.editing.id === item.id);
    const isPending = Boolean(pendingDone[item.id]);
    const filled = item.done || isPending;
    const classes = ['row'];
    if (isPending) {
      classes.push('pending');
    }
    if (item.done) {
      classes.push('is-done');
    }
    if (options.animate) {
      classes.push('row-enter');
    }
    const offset = state.swipeOpen && state.swipeOpen.id === item.id ? state.swipeOpen.offset : 0;
    if (offset !== 0) {
      classes.push('revealed');
    }
    let titleHtml;
    if (isEditing) {
      titleHtml = '<input id="edit-input" class="row-input" autocomplete="off" autocapitalize="sentences" enterkeyhint="next" value="' +
        escapeHtml(item.title) + '" aria-label="Reminder title">';
    } else {
      titleHtml = '<div class="row-title">' + escapeHtml(item.title) + '</div>';
    }
    let notesHtml = '';
    if (item.notes && options.dateStyle !== 'none') {
      notesHtml = '<div class="row-notes">' + escapeHtml(item.notes) + '</div>';
    }
    let infoHtml = '';
    if (isEditing) {
      infoHtml = '<button type="button" class="info-btn" data-action="info" data-id="' + id + '" aria-label="Details">' + svgIcon('info', 26) + '</button>';
    }
    return '<div class="' + classes.join(' ') + '" data-row="' + id + '" style="--c:' + itemColor(item) + '; --i:' + (index || 0) + '">' +
      '<div class="row-actions left">' +
        '<button type="button" class="btn-delete" data-action="swipe-delete" data-id="' + id + '">Delete</button>' +
        '<button type="button" class="btn-details" data-action="swipe-details" data-id="' + id + '">Details</button>' +
      '</div>' +
      '<div class="row-actions right">' +
        '<button type="button" class="btn-details" data-action="swipe-details" data-id="' + id + '">Details</button>' +
        '<button type="button" class="btn-delete" data-action="swipe-delete" data-id="' + id + '">Delete</button>' +
      '</div>' +
      '<div class="row-inner" data-swipe="' + id + '" style="transform: translate3d(' + offset + 'px,0,0)">' +
        '<div class="circle-hit" data-action="toggle-done" data-id="' + id + '" data-at="' + entryAtText(entry) + '" role="button" aria-label="' + (filled ? 'Not done' : 'Complete') + '">' +
          '<div class="circle' + (filled ? ' filled' : '') + '"></div>' +
        '</div>' +
        '<div class="row-body" data-action="edit-row" data-id="' + id + '">' +
          '<div class="row-text">' + titleHtml + notesHtml + '<div data-role="date-line">' + dateLineHtml(entry, options) + '</div></div>' + infoHtml +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function rowsHTML(entries, options) {
    let html = '';
    for (let index = 0; index < entries.length; index += 1) {
      const rowOptions = { mode: 'normal', dateStyle: options.dateStyle || 'time', showList: true, animate: Boolean(options.animate) };
      html += rowHtml(entries[index], rowOptions, index + (options.delayOffset || 0));
    }
    if (entries.length === 0 && options.emptyText) {
      html += '<div class="empty-note' + (options.animate ? ' row-enter' : '') + '">' + options.emptyText + '</div>';
    }
    return html;
  }

  function titleBlockHTML(title, subtitle, animateTitle, color) {
    const enterClass = animateTitle ? ' title-enter' : '';
    const subHtml = subtitle ? '<div class="title-sub' + enterClass + '">' + escapeHtml(subtitle) + '</div>' : '';
    return '<header class="title-block" data-role="title-block">' +
      '<h1 class="large-title' + enterClass + '" style="color:' + (color || 'var(--blue)') + '">' + escapeHtml(title) + '</h1>' + subHtml + '</header>';
  }

  /* Past Due: a red "N Past Due" pill under Today's title */
  function pastDuePillHtml() {
    const count = entriesForView('pastDue').length;
    if (count === 0) {
      return '';
    }
    return '<button type="button" class="pd-pill" data-action="go-pastdue">' + svgIcon('smallClock', 16) + count + ' Past Due ' + svgIcon('chevR', 12) + '</button>';
  }

  function emptyStateHtml() {
    return '<div class="empty-state">' +
      '<div class="empty-badge">' + svgIcon('trayDown', 38) + '</div>' +
      '<div class="empty-title">No Reminders</div>' +
      '<div class="empty-text">Bring your lists and reminders over from Apple Reminders, or add a new one below.</div>' +
      '<button type="button" class="import-btn" data-action="bring-in">Import from Apple Reminders</button>' +
      '</div>';
  }

  /* ======================================================================
     Today / This Week / This Month (pages with the dots on the right)
     ====================================================================== */

  function pullHintHTML(nextScope) {
    const words = SCOPE_PULL_WORDS[nextScope];
    return '<div class="pull-hint" data-role="pull-hint" data-idle="Pull up for ' + words + '" data-armed="Release for ' + words + '">' +
      PULL_RING_SVG + '<span class="pull-text">Pull up for ' + words + '</span></div>';
  }

  function scopeRange(scope) {
    const today = todayText();
    if (scope === 'today') {
      return { start: today, end: today };
    }
    if (scope === 'week') {
      return { start: today, end: Logic.weekRange(Date.now(), deviceZone).end };
    }
    return { start: today, end: Logic.monthRange(Date.now(), deviceZone).end };
  }

  function scopeRangeText(scope) {
    const range = scopeRange(scope);
    if (scope === 'today') {
      return formatLongDate(range.start);
    }
    return formatRange(range.start, range.end);
  }

  function peekBelowHTML(scope) {
    const count = entriesForScope(scope).length;
    return '<div class="peek-below"><div class="peek-title">' + SCOPE_TITLES[scope] + '</div><div>' + pluralReminders(count) + ' · ' + scopeRangeText(scope) + '</div></div>';
  }

  function peekAboveHTML(targetLabel) {
    return '<div class="peek-above" data-role="peek-above" data-idle="Pull down for ' + targetLabel + '" data-armed="Release for ' + targetLabel + '">' +
      '<div class="peek-title">Pull down for ' + targetLabel + '</div></div>';
  }

  function endNoteHTML() {
    const lastDay = datePieces(Logic.monthRange(Date.now(), deviceZone).end);
    return '<div class="end-note"><div>Nothing else dated through ' + lastDay.day + ' ' + MONTH_NAMES[lastDay.month - 1] + '.</div>' +
      '<div>Undated reminders are in their lists and in Unscheduled.</div>' +
      '<button class="link-btn" data-action="back-today">Back to Today</button></div>';
  }

  function updatePullHint(container, progress) {
    const hint = container.querySelector('[data-role="pull-hint"]');
    if (!hint) {
      return;
    }
    const limited = clamp(progress, 0, 1);
    const fill = hint.querySelector('.ring-fill');
    fill.style.strokeDashoffset = String(RING_LENGTH * (1 - limited));
    const chevron = hint.querySelector('.pull-chev');
    chevron.style.transform = 'translateY(' + (-3 * limited) + 'px)';
    hint.classList.toggle('pulling', progress > 0.02);
    const armed = progress >= 1;
    if (armed !== hint.classList.contains('armed')) {
      hint.classList.toggle('armed', armed);
      const text = hint.querySelector('.pull-text');
      text.textContent = armed ? hint.dataset.armed : hint.dataset.idle;
    }
  }

  function updatePeekAbove(container, progress) {
    const peek = container.querySelector('[data-role="peek-above"]');
    if (!peek) {
      return;
    }
    const armed = progress >= 1;
    if (armed !== peek.classList.contains('armed')) {
      peek.classList.toggle('armed', armed);
      const title = peek.querySelector('.peek-title');
      title.textContent = armed ? peek.dataset.armed : peek.dataset.idle;
    }
  }

  function hapticTick() {
    if (typeof navigator.vibrate === 'function') {
      try {
        navigator.vibrate(8);
      } catch (error) {
        // Vibration is optional; iOS does not support it.
      }
    }
  }

  function playSnap(element) {
    hapticTick();
    if (!element) {
      return;
    }
    element.classList.remove('snap-pulse');
    // Reading layout restarts the CSS animation on the same element.
    void element.offsetWidth;
    element.classList.add('snap-pulse');
  }

  function dayName(dateText) {
    const offset = Logic.daysBetween(todayText(), dateText);
    if (offset === 0) {
      return 'Today';
    }
    if (offset === 1) {
      return 'Tomorrow';
    }
    return WEEKDAY_NAMES[Logic.weekdayOf(dateText)];
  }

  function weekDayHeaderHTML(name, dateText, animate, delayIndex) {
    const date = datePieces(dateText);
    const dateLabel = date.day + ' ' + SHORT_MONTHS[date.month - 1];
    const enterClass = animate ? ' row-enter' : '';
    return '<div class="day-header' + enterClass + '" style="--i:' + delayIndex + '">' +
      '<span class="day-name">' + name + '</span><span class="day-date">' + dateLabel + '</span></div>';
  }

  function todayPageHtml(mode) {
    const entries = withEditingRow(entriesForScope('today'));
    return titleBlockHTML('Today', scopeRangeText('today'), mode === 'back', 'var(--blue)') + pastDuePillHtml() +
      rowsHTML(entries, { dateStyle: 'time', emptyText: 'No more reminders today' }) +
      '<div class="tail" data-action="tail-tap"></div>' + pullHintHTML('week') + peekBelowHTML('week');
  }

  /* This Week includes today, then one header per remaining day */
  function weekPageHtml(mode) {
    const today = todayText();
    const weekEnd = Logic.weekRange(Date.now(), deviceZone).end;
    const entries = entriesForScope('week');
    const animate = mode === 'enter';
    let html = peekAboveHTML('Today');
    html += titleBlockHTML('This Week', scopeRangeText('week'), mode === 'enter' || mode === 'back', 'var(--blue)');
    html += weekDayHeaderHTML('Today', today, false, 0);
    const editing = editingItem();
    const todayEntries = entriesOnDay(entries, today);
    const editingElsewhere = editing && entriesContain(entries, editing.id);
    html += rowsHTML(editingElsewhere ? editingLast(todayEntries) : withEditingRow(todayEntries), { dateStyle: 'time', emptyText: 'No more reminders today' });
    let dayIndex = 0;
    for (let day = Logic.addDays(today, 1); day <= weekEnd; day = Logic.addDays(day, 1)) {
      html += weekDayHeaderHTML(dayName(day), day, animate, dayIndex * 2 + 1);
      const dayEntries = editingLast(entriesOnDay(entries, day));
      if (dayEntries.length === 0) {
        html += '<div class="empty-day' + (animate ? ' row-enter' : '') + '" style="--i:' + (dayIndex * 2 + 2) + '"></div>';
      } else {
        html += rowsHTML(dayEntries, { dateStyle: 'time', animate: animate, delayOffset: dayIndex * 2 + 2 });
      }
      dayIndex += 1;
    }
    html += '<div class="tail" style="min-height:40px" data-action="tail-tap"></div>';
    html += pullHintHTML('month') + peekBelowHTML('month');
    return html;
  }

  /* ---------- This Month (C): dense agenda, one card per week ---------- */

  // Weeks (Monday first) covering the current month; each day carries its reminders from today on
  function buildMonthModel() {
    const today = todayText();
    const month = Logic.monthRange(Date.now(), deviceZone);
    const entries = entriesForScope('month');
    const sinceMonday = (Logic.weekdayOf(month.start) + 6) % 7;
    const weeks = [];
    let todayWeekIndex = 0;
    let day = Logic.addDays(month.start, -sinceMonday);
    while (day <= month.end) {
      const week = [];
      for (let column = 0; column < 7; column += 1) {
        const inMonth = day >= month.start && day <= month.end;
        if (day === today) {
          todayWeekIndex = weeks.length;
        }
        week.push({
          date: day, column: column, inMonth: inMonth, isPast: day < today, isToday: day === today,
          entries: inMonth ? entriesOnDay(entries, day) : []
        });
        day = Logic.addDays(day, 1);
      }
      weeks.push(week);
    }
    const start = datePieces(month.start);
    return { weeks: weeks, entries: entries, todayWeekIndex: todayWeekIndex, monthName: MONTH_NAMES[start.month - 1], year: start.year };
  }

  function compactRowHTML(entry) {
    const item = entry.item;
    const id = escapeHtml(item.id);
    const pendingClass = pendingDone[item.id] ? ' pending' : '';
    const timeText = entry.time ? Logic.formatTime12(entry.time) : 'all day';
    const timeClass = entry.pastDue ? 'crow-time overdue' : 'crow-time';
    const date = datePieces(entry.day);
    return '<div class="crow' + pendingClass + '" data-crow="' + id + '" data-action="open-details" data-id="' + id + '" style="--row-color: ' + itemColor(item) + '">' +
      '<button class="check" data-check="' + id + '" data-at="' + entryAtText(entry) + '" aria-label="Complete ' + escapeHtml(item.title) + '"><span class="ring"></span></button>' +
      '<span class="crow-day">' + SHORT_DAYS[date.weekday] + ' ' + date.day + '</span>' +
      '<span class="crow-title">' + escapeHtml(item.title) + '</span>' +
      (item.repeat ? '<span class="crow-repeat">' + ICON_REPEAT_SMALL + '</span>' : '') +
      '<span class="' + timeClass + '">' + timeText + '</span></div>';
  }

  function weekCardLabel(weekIndex, model, firstDay) {
    if (weekIndex === model.todayWeekIndex) {
      return 'This week';
    }
    if (weekIndex === model.todayWeekIndex + 1) {
      return 'Next week';
    }
    const date = datePieces(firstDay);
    return 'Week of ' + date.day + ' ' + SHORT_MONTHS[date.month - 1];
  }

  function weekStripHTML(week) {
    let html = '<div class="wk-strip">';
    for (const cell of week) {
      const classes = ['strip-day'];
      if (!cell.inMonth) {
        classes.push('out');
      }
      if (cell.isPast) {
        classes.push('past');
      }
      if (cell.isToday) {
        classes.push('today');
      }
      let dots = '';
      const dotCount = Math.min(3, cell.entries.length);
      for (let index = 0; index < dotCount; index += 1) {
        dots += '<i style="background: ' + itemColor(cell.entries[index].item) + '"></i>';
      }
      html += '<span class="' + classes.join(' ') + '"><b>' + WEEKDAY_LETTERS[cell.column] + '</b><span class="strip-num">' + Number(cell.date.slice(8, 10)) + '</span><span class="strip-dots">' + dots + '</span></span>';
    }
    return html + '</div>';
  }

  function monthPageHtml(mode) {
    const model = buildMonthModel();
    const animate = mode === 'enter';
    const subtitle = model.monthName + ' ' + model.year + ' · ' + pluralReminders(model.entries.length) + ' from today';
    let html = peekAboveHTML('This Week') + titleBlockHTML('This Month', subtitle, animate, 'var(--blue)');
    let cardIndex = 0;
    for (let weekIndex = model.todayWeekIndex; weekIndex < model.weeks.length; weekIndex += 1) {
      const week = model.weeks[weekIndex];
      const visibleDays = [];
      let weekEntries = [];
      for (const cell of week) {
        if (cell.inMonth && !cell.isPast) {
          visibleDays.push(cell.date);
          weekEntries = weekEntries.concat(cell.entries);
        }
      }
      if (visibleDays.length === 0) {
        continue;
      }
      const firstDay = visibleDays[0];
      const range = formatRange(firstDay, visibleDays[visibleDays.length - 1]);
      html += '<section class="wk-card' + (animate ? ' row-enter' : '') + '" style="--i:' + (cardIndex * 2) + '">';
      html += '<div class="wk-head"><span class="wk-name">' + weekCardLabel(weekIndex, model, firstDay) + '</span><span class="wk-range">' + range + '</span><span class="wk-count">' + weekEntries.length + '</span></div>';
      html += weekStripHTML(week);
      if (weekEntries.length === 0) {
        html += '<div class="crow-empty">Nothing scheduled</div>';
      }
      for (const entry of weekEntries) {
        html += compactRowHTML(entry);
      }
      html += '</section>';
      cardIndex += 1;
    }
    return html + endNoteHTML();
  }

  function renderPagedContent(mode) {
    const content = byId('content');
    if (state.scope === 2) {
      content.innerHTML = monthPageHtml(mode);
    } else if (state.scope === 1) {
      content.innerHTML = weekPageHtml(mode);
    } else {
      content.innerHTML = todayPageHtml(mode);
    }
  }

  function removeGhost(ghost) {
    if (ghost.parentNode) {
      ghost.parentNode.removeChild(ghost);
    }
  }

  /* Freeze the outgoing page as a copy so it can animate out over the new one */
  function makeGhost(className) {
    const content = byId('content');
    const ghost = document.createElement('div');
    ghost.className = 'ghost-layer ' + className;
    const copy = content.cloneNode(true);
    copy.removeAttribute('id');
    const inputs = copy.querySelectorAll('input');
    for (const input of inputs) {
      input.removeAttribute('id');
    }
    copy.style.transform = content.style.transform;
    ghost.appendChild(copy);
    byId('view-wrap').appendChild(ghost);
    window.setTimeout(removeGhost, 650, ghost);
    return ghost;
  }

  let dotsLabelTimer = 0;
  let scroller = null;

  function hideDotsLabel() {
    byId('dots-label').classList.remove('shown');
  }

  function goToScope(next) {
    const previous = state.scope;
    if (next === previous || next < 0 || next > 2) {
      return;
    }
    if (state.editing) {
      finishEditing();
    }
    const forward = next > previous;
    // Forward replaces the page in place; going back drops the old page away
    if (!forward) {
      makeGhost('ghost-drop');
    }
    state.scope = next;
    renderPagedContent(forward ? 'enter' : 'back');
    scroller.scrollTo(0, false);
    updateChrome(0);
    renderPageDots();
    playSnap(document.querySelector('.page-dot.active'));
    const label = byId('dots-label');
    label.textContent = SCOPE_TITLES[SCOPE_ORDER[next]];
    label.classList.add('shown');
    window.clearTimeout(dotsLabelTimer);
    dotsLabelTimer = window.setTimeout(hideDotsLabel, 1300);
  }

  function pullToNextScope() {
    goToScope(state.scope + 1);
    return 0;
  }

  function pullToPreviousScope() {
    goToScope(state.scope - 1);
    return 0;
  }

  function canPullToNextScope() {
    return state.view === 'today' && state.scope < 2 && !state.editing && !hasNoData();
  }

  function canPullToPreviousScope() {
    return state.view === 'today' && state.scope > 0;
  }

  function renderPageDots() {
    const dots = byId('page-dots');
    const isToday = state.view === 'today';
    // While a title is being typed the dots would sit on top of the row's "i" button
    dots.hidden = !isToday || Boolean(state.editing) || !state.loaded || hasNoData();
    if (dots.hidden) {
      return;
    }
    let html = '';
    for (let index = 0; index < 3; index += 1) {
      const active = index === state.scope ? ' active' : '';
      html += '<button type="button" class="page-dot' + active + '" data-action="page" data-page="' + index + '" aria-label="' + SCOPE_TITLES[SCOPE_ORDER[index]] + '"><span></span></button>';
    }
    dots.innerHTML = html;
  }

  function currentTitleText() {
    if (state.view === 'today') {
      return SCOPE_TITLES[SCOPE_ORDER[state.scope]];
    }
    return viewName(state.view);
  }

  function updateChrome(offset) {
    const navbar = byId('navbar');
    navbar.classList.toggle('scrolled', offset > 2);
    const title = byId('nav-title');
    if (title) {
      const text = currentTitleText();
      if (title.textContent !== text) {
        title.textContent = text;
      }
      title.classList.toggle('shown', offset > 44);
    }
  }

  function handleContentScroll(offset) {
    updateChrome(offset);
  }

  function showPullProgress(progress) {
    const content = byId('content');
    updatePullHint(content, progress.up);
    updatePeekAbove(content, progress.down);
  }

  /* ======================================================================
     Rendering: other lists, chrome
     ====================================================================== */

  function canAddInView(viewId) {
    return viewId !== 'pastDue' && viewId !== 'completed';
  }

  function renderListContent() {
    const content = byId('content');
    const sections = collectView(state.view);
    const parts = [titleBlockHTML(viewName(state.view), '', false, viewTitleColor(state.view))];
    let rowCount = 0;
    let more = 0;
    for (const section of sections) {
      if (section.header) {
        const headerColor = section.headerColor || 'var(--label)';
        parts.push('<div class="section-head" style="--hc:' + headerColor + '">' + escapeHtml(section.header) + '</div>');
      }
      for (let index = 0; index < section.rows.length; index += 1) {
        const row = section.rows[index];
        parts.push(rowHtml(row.entry, row.options, index));
        rowCount += 1;
      }
      more += section.more || 0;
    }
    if (rowCount === 0) {
      const emptyText = state.view === 'pastDue' ? 'Nothing past due' : 'No Reminders';
      parts.push('<div class="empty-big">' + emptyText + '</div>');
    }
    if (more > 0) {
      parts.push('<button type="button" class="link-btn more-btn" data-action="show-more">Show ' + formatCount(Math.min(more, COMPLETED_PAGE_SIZE)) + ' More</button>');
    }
    if (canAddInView(state.view)) {
      parts.push('<div class="tail" data-action="tail-tap"></div>');
    }
    content.innerHTML = parts.join('');
  }

  function renderEmptyContent() {
    const title = state.view === 'today' ? 'Today' : viewName(state.view);
    byId('content').innerHTML = titleBlockHTML(title, '', false, viewTitleColor(state.view)) + emptyStateHtml();
  }

  function renderContent() {
    const content = byId('content');
    content.classList.toggle('pastdue-view', state.view === 'pastDue');
    if (!state.loaded) {
      content.innerHTML = '';
    } else if (hasNoData() && !state.editing) {
      state.scope = 0;
      renderEmptyContent();
    } else if (state.view === 'today') {
      renderPagedContent(null);
    } else {
      renderListContent();
    }
    renderPageDots();
    scroller.refresh();
    updateChrome(scroller.getOffset());
  }

  function renderNavbar() {
    const navbar = byId('navbar');
    let right;
    if (state.editing) {
      right = '<button type="button" class="glass-btn tinted" style="--c:' + viewTint(state.view) + '" data-action="done-editing" aria-label="Done">' + svgIcon('check', 22) + '</button>';
    } else {
      right = '<button type="button" class="glass-btn" data-action="menu" aria-label="More">' + svgIcon('ellipsis', 22) + '</button>';
    }
    navbar.innerHTML = '<button type="button" class="glass-btn" data-action="open-drawer" aria-label="Lists">' + svgIcon('sidebar', 22) + '</button>' +
      '<div class="nav-title" id="nav-title"></div>' + right;
  }

  function renderBottomBar() {
    const bar = byId('bottom-bar');
    if (canAddInView(state.view) && state.loaded) {
      bar.innerHTML = '<button type="button" class="new-btn" style="--c:' + viewTint(state.view) + '" data-action="new-reminder">' + svgIcon('plusFill', 24) + 'New Reminder</button>';
    } else {
      bar.innerHTML = '<span></span>';
    }
  }

  /* ======================================================================
     The quick toolbar on the keyboard: native date, time and menus
     ====================================================================== */

  let accessoryBuiltFor = null;

  function repeatOptionsHtml(repeat) {
    const current = Logic.optionForRepeat(repeat);
    let html = '';
    for (const option of REPEAT_MENU) {
      const selected = option.key === current ? ' selected' : '';
      html += '<option value="' + option.key + '"' + selected + '>' + option.label + '</option>';
    }
    const customLabel = current === 'custom' ? 'Custom: ' + customRepeatShort(repeat) : 'Custom…';
    html += '<option value="custom"' + (current === 'custom' ? ' selected' : '') + '>' + escapeHtml(customLabel) + '</option>';
    return html;
  }

  function listOptionsHtml(listId) {
    let html = '<option value="none"' + (listOf(listId) ? '' : ' selected') + '>None</option>';
    for (const list of ownLists()) {
      const selected = list.id === listId ? ' selected' : '';
      html += '<option value="' + escapeHtml(list.id) + '"' + selected + '>' + escapeHtml(list.name) + '</option>';
    }
    return html;
  }

  function accessoryButtonHtml(kind, iconName, controlHtml) {
    return '<div class="acc-btn" data-acc="' + kind + '">' + svgIcon(iconName, 16) + '<span data-acc-label="' + kind + '"></span>' + controlHtml + '</div>';
  }

  /* Date, Time, Repeat, List: each button carries the platform's own control */
  function accessoryHtml() {
    return accessoryButtonHtml('date', 'calendar', '<input type="date" class="acc-native" data-native="acc-date" aria-label="Date">') +
      accessoryButtonHtml('time', 'clock', '<input type="time" class="acc-native" data-native="acc-time" aria-label="Time">') +
      accessoryButtonHtml('repeat', 'repeat', '<select class="acc-native" data-native="acc-repeat" aria-label="Repeat"></select>') +
      accessoryButtonHtml('list', 'list', '<select class="acc-native" data-native="acc-list" aria-label="List"></select>');
  }

  /* Refresh labels and values without rebuilding the controls (an open iOS picker would close) */
  function updateAccessory(item) {
    const accessory = byId('accessory');
    if (!accessory || !item) {
      return;
    }
    const list = listOf(item.list);
    accessory.style.setProperty('--c', list ? colorCss(list.color) : 'var(--blue)');
    const labels = {
      date: item.date ? formatDayLabel(item.date) : 'Date',
      time: item.time ? Logic.formatTime12(item.time) : 'Time',
      repeat: item.repeat ? repeatLabel(item.repeat) : 'Repeat',
      list: list ? list.name : 'List'
    };
    const isSet = { date: Boolean(item.date), time: Boolean(item.time), repeat: Boolean(item.repeat), list: Boolean(list) };
    for (const kind of Object.keys(labels)) {
      const label = accessory.querySelector('[data-acc-label="' + kind + '"]');
      const button = accessory.querySelector('[data-acc="' + kind + '"]');
      if (label) {
        label.textContent = labels[kind];
        button.classList.toggle('set', isSet[kind]);
      }
    }
    accessory.querySelector('[data-native="acc-date"]').value = item.date || '';
    accessory.querySelector('[data-native="acc-time"]').value = item.time || '';
    accessory.querySelector('[data-native="acc-repeat"]').innerHTML = repeatOptionsHtml(item.repeat);
    accessory.querySelector('[data-native="acc-list"]').innerHTML = listOptionsHtml(item.list);
  }

  function renderToolbar() {
    const toolbar = byId('kbd');
    const screen = byId('screen');
    const item = editingItem();
    if (!item) {
      toolbar.innerHTML = '';
      accessoryBuiltFor = null;
      screen.classList.remove('kb-open');
      screen.style.setProperty('--kb-h', '0px');
      return;
    }
    if (!byId('accessory')) {
      toolbar.innerHTML = '<div class="accessory" id="accessory"></div>';
    }
    const accessoryKey = item.id + '|' + ownLists().length;
    if (accessoryBuiltFor !== accessoryKey) {
      byId('accessory').innerHTML = accessoryHtml();
      accessoryBuiltFor = accessoryKey;
    }
    updateAccessory(item);
    screen.style.setProperty('--kb-h', ACCESSORY_HEIGHT + 'px');
    screen.classList.add('kb-open');
  }

  // Update the row being typed in place: re-rendering would replace the input and close the keyboard
  function refreshEditingRow() {
    const item = editingItem();
    if (!item) {
      return;
    }
    const row = document.querySelector('#content [data-row="' + cssEscape(item.id) + '"]');
    if (row) {
      row.style.setProperty('--c', itemColor(item));
      const line = row.querySelector('[data-role="date-line"]');
      if (line) {
        line.innerHTML = dateLineHtml(plainEntry(item), { mode: 'normal', dateStyle: 'full', showList: true });
      }
    }
    updateAccessory(item);
  }

  function cssEscape(text) {
    if (window.CSS && typeof window.CSS.escape === 'function') {
      return window.CSS.escape(text);
    }
    return String(text).replace(/["\\]/g, '');
  }

  /* ======================================================================
     Toast, alerts, progress, menus
     ====================================================================== */

  function showToast(text) {
    const toast = byId('toast');
    toast.textContent = text;
    toast.classList.add('on');
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(hideToast, 1900);
  }

  function hideToast() {
    byId('toast').classList.remove('on');
  }

  function announceIfMovedAway(item) {
    if (!item || item.removed || !findItem(item.id)) {
      return;
    }
    if (!viewContains(state.view, item.id)) {
      showToast('Moved to ' + whereLabel(item));
    }
  }

  const alertQueue = [];
  let alertShown = false;
  let progressShown = false;

  function showAlert(title, message) {
    alertQueue.push({ title: title, message: message });
    if (!alertShown && !progressShown) {
      showNextAlert();
    }
  }

  function showNextAlert() {
    const layer = byId('alert-layer');
    const next = alertQueue.shift();
    if (!next) {
      alertShown = false;
      layer.classList.remove('open');
      layer.innerHTML = '';
      return;
    }
    alertShown = true;
    layer.innerHTML = '<div class="alert-card"><div class="alert-text"><div class="alert-title">' + escapeHtml(next.title) + '</div>' +
      (next.message ? '<div class="alert-message">' + escapeHtml(next.message) + '</div>' : '') + '</div>' +
      '<button type="button" class="alert-btn" data-action="alert-ok">OK</button></div>';
    layer.classList.add('open');
  }

  function showProgress(title, done, total) {
    const layer = byId('alert-layer');
    progressShown = true;
    const percent = total > 0 ? Math.round((done / total) * 100) : 0;
    const existing = layer.querySelector('[data-role="progress"]');
    const text = 'Saving ' + formatCount(done) + ' of ' + formatCount(total) + '…';
    if (existing) {
      layer.querySelector('[data-role="progress-text"]').textContent = text;
      layer.querySelector('.progress-fill').style.width = percent + '%';
      return;
    }
    layer.innerHTML = '<div class="alert-card" data-role="progress"><div class="alert-text"><div class="alert-title">' + escapeHtml(title) + '</div>' +
      '<div class="alert-message" data-role="progress-text">' + escapeHtml(text) + '</div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + percent + '%"></div></div></div></div>';
    layer.classList.add('open');
  }

  function hideProgress() {
    progressShown = false;
    const layer = byId('alert-layer');
    layer.classList.remove('open');
    layer.innerHTML = '';
    if (alertQueue.length) {
      showNextAlert();
    }
  }

  function openMenu(anchor) {
    const layer = byId('menu-layer');
    const anchorRect = anchor.getBoundingClientRect();
    const screenRect = byId('screen').getBoundingClientRect();
    const top = anchorRect.bottom - screenRect.top + 6;
    const right = Math.max(8, screenRect.right - anchorRect.right);
    layer.innerHTML = '<div class="pop-menu" style="top:' + top + 'px; right:' + right + 'px">' +
      '<button type="button" data-action="bring-in">Import from Apple Reminders' + svgIcon('trayDown', 20) + '</button></div>';
    layer.classList.add('open');
    state.menuOpen = true;
  }

  function closeMenu() {
    const layer = byId('menu-layer');
    layer.classList.remove('open');
    layer.innerHTML = '';
    state.menuOpen = false;
  }

  /* ======================================================================
     Completing and deleting
     ====================================================================== */

  function toggleDone(id, occurrenceIso) {
    const item = findItem(id);
    if (!item) {
      return;
    }
    if (state.editing) {
      finishEditing();
    }
    if (item.removed) {
      return;
    }
    if (item.done) {
      persistChange(item, markNotDoneChange());
      renderAll();
      return;
    }
    if (pendingDone[id]) {
      // A second tap inside the pause undoes the completion
      window.clearTimeout(pendingDone[id].timer);
      delete pendingDone[id];
      renderAll();
      return;
    }
    const timer = window.setTimeout(completeAfterPause, COMPLETE_DELAY_MS, id);
    pendingDone[id] = { timer: timer, occurrence: occurrenceIso || '' };
    renderAll();
  }

  function completeAfterPause(id) {
    const pending = pendingDone[id];
    delete pendingDone[id];
    const item = findItem(id);
    if (!item || !pending) {
      return;
    }
    const nowIso = new Date().toISOString();
    persistChange(item, markDoneChange(pending.occurrence, nowIso));
    const rowElement = document.querySelector('#content [data-row="' + cssEscape(id) + '"], #content [data-crow="' + cssEscape(id) + '"]');
    if (rowElement && !viewContains(state.view, id)) {
      animateRowOut(rowElement, renderAfterRowLeft);
      return;
    }
    renderAll();
    reloadIfWanted();
  }

  function renderAfterRowLeft() {
    rowsLeaving = Math.max(0, rowsLeaving - 1);
    renderAll();
    reloadIfWanted();
  }

  function animateRowOut(rowElement, afterwards) {
    rowsLeaving += 1;
    rowElement.style.height = rowElement.offsetHeight + 'px';
    // Reading offsetHeight forces layout so the height change below animates
    void rowElement.offsetHeight;
    rowElement.classList.add('leaving');
    rowElement.style.height = '0px';
    window.setTimeout(afterwards, 320);
  }

  function deleteWithAnimation(id) {
    const item = findItem(id);
    if (!item) {
      return;
    }
    const rowElement = document.querySelector('#content [data-row="' + cssEscape(id) + '"]');
    deleteItem(item);
    state.swipeOpen = null;
    if (rowElement) {
      animateRowOut(rowElement, renderAfterRowLeft);
      return;
    }
    renderAll();
  }

  /* ======================================================================
     Quick add and inline editing
     ====================================================================== */

  /* Added from a built-in list a reminder has no list; Today and Scheduled date it today */
  function makeNewItemForView() {
    const listId = isBuiltin(state.view) ? null : state.view;
    let date = null;
    if (state.view === 'today' || state.view === 'scheduled') {
      date = todayText();
    }
    return {
      id: newId(), title: '', notes: '', list: listId, date: date, time: null, repeat: null, timeZone: deviceZone,
      done: false, completedAt: null, snoozedUntil: null, lastDoneAt: null, doneThrough: null,
      createdAt: new Date().toISOString(), source: null, isUnsaved: true
    };
  }

  function startNewReminder() {
    if (state.editing) {
      finishEditing();
    }
    if (state.view === 'today' && state.scope === 2) {
      goToScope(0);
    }
    const item = makeNewItemForView();
    state.items.push(item);
    state.editing = { id: item.id, original: null };
    state.swipeOpen = null;
    renderAll();
    focusEditingInput();
  }

  function startEditing(id) {
    if (state.editing && state.editing.id === id) {
      return;
    }
    if (state.editing) {
      finishEditing();
    }
    const item = findItem(id);
    if (!item || item.removed) {
      return;
    }
    state.editing = { id: id, original: snapshotFields(item) };
    renderAll();
    focusEditingInput();
  }

  // Writes the row being typed, if anything changed; an empty title deletes it (as in Apple Reminders)
  function commitEditedItem(editing) {
    const item = findItem(editing.id);
    if (!item) {
      return null;
    }
    item.title = item.title.trim();
    if (!item.title) {
      deleteItem(item);
      return null;
    }
    const fields = snapshotFields(item);
    if (item.isUnsaved || !editing.original || fieldsDiffer(fields, editing.original)) {
      persistChange(item, makeUserFieldsChange(fields));
    }
    return item;
  }

  function finishEditing() {
    if (!state.editing) {
      return;
    }
    const editing = state.editing;
    state.editing = null;
    const active = document.activeElement;
    if (active && active.blur && active.id === 'edit-input') {
      active.blur();
    }
    const item = commitEditedItem(editing);
    renderAll();
    announceIfMovedAway(item);
    reloadIfWanted();
  }

  function viewContainsIgnoringEditing(id) {
    const saved = state.editing;
    state.editing = null;
    const contained = viewContains(state.view, id);
    state.editing = saved;
    return contained;
  }

  /* Return keeps this row and starts the next one below it; return on an empty row ends adding */
  function handleReturn() {
    const item = editingItem();
    if (!item || !item.title.trim()) {
      finishEditing();
      return;
    }
    const editing = state.editing;
    commitEditedItem(editing);
    const leftView = !viewContainsIgnoringEditing(item.id);
    const nextItem = makeNewItemForView();
    state.items.push(nextItem);
    state.editing = { id: nextItem.id, original: null };
    renderAll();
    focusEditingInput();
    if (leftView) {
      showToast('Moved to ' + whereLabel(item));
    }
  }

  function handleEditInput(event) {
    if (event.target.id !== 'edit-input' || !state.editing) {
      return;
    }
    const item = editingItem();
    if (item) {
      item.title = event.target.value;
    }
  }

  function handleEditKeydown(event) {
    if (event.target.id !== 'edit-input') {
      return;
    }
    if (event.key === 'Enter') {
      event.preventDefault();
      handleReturn();
    } else if (event.key === 'Escape') {
      finishEditing();
    }
  }

  function focusEditingInput() {
    if (!state.editing) {
      return;
    }
    const input = byId('edit-input');
    if (!input) {
      return;
    }
    if (document.activeElement !== input) {
      input.focus({ preventScroll: true });
      const length = input.value.length;
      try {
        input.setSelectionRange(length, length);
      } catch (error) {
        // Some inputs refuse a selection; the caret then stays where it is
      }
    }
    revealRow(input.closest('.row'));
  }

  /* Scroll the custom scroller so a row sits above the keyboard */
  function revealRow(rowElement) {
    if (!rowElement) {
      return;
    }
    const viewport = byId('viewport');
    const offset = scroller.getOffset();
    const rowTop = rowElement.offsetTop;
    const rowBottom = rowTop + rowElement.offsetHeight;
    if (rowBottom > offset + viewport.clientHeight - 12) {
      scroller.scrollTo(rowBottom - viewport.clientHeight + 24);
    } else if (rowTop < offset) {
      scroller.scrollTo(Math.max(0, rowTop - 12));
    }
  }

  function revealEditingRow() {
    const input = byId('edit-input');
    if (input) {
      revealRow(input.closest('.row'));
    }
  }

  /* ======================================================================
     Native controls: the toolbar and the Details sheet
     ====================================================================== */

  function applyRepeatChoice(target, key) {
    const until = target.repeat ? target.repeat.until : null;
    target.repeat = Logic.repeatForOption(key);
    if (target.repeat && until) {
      target.repeat.until = until;
    }
    if (target.repeat && !target.date) {
      target.date = todayText();
    }
  }

  function handleNativeChange(event) {
    const control = event.target;
    if (control.id === 'bring-in-file') {
      handleBringInFileChosen(control);
      return;
    }
    const kind = control.dataset ? control.dataset.native : null;
    if (!kind) {
      return;
    }
    if (kind.indexOf('acc-') === 0) {
      applyAccessoryChange(kind, control);
    } else if (kind.indexOf('det-') === 0) {
      applyDetailsChange(kind, control);
    }
  }

  function applyAccessoryChange(kind, control) {
    const item = editingItem();
    if (!item) {
      return;
    }
    const value = control.value;
    if (kind === 'acc-date') {
      item.date = value || null;
      if (!value) {
        item.time = null;
        item.repeat = null;
      }
    } else if (kind === 'acc-time') {
      item.time = value || null;
      if (value && !item.date) {
        item.date = todayText();
      }
    } else if (kind === 'acc-repeat') {
      if (value === 'custom') {
        control.value = Logic.optionForRepeat(item.repeat);
        openDetails(item.id, 'custom', true);
        return;
      }
      applyRepeatChoice(item, value);
    } else if (kind === 'acc-list') {
      item.list = value === 'none' ? null : value;
    }
    refreshEditingRow();
  }

  /* Desktop browsers open date and time pickers only on request; the iPhone opens them on the tap itself */
  function handleNativeClick(event) {
    const control = event.target.closest('input[type="date"], input[type="time"]');
    if (!control || !window.matchMedia('(pointer: fine)').matches) {
      return;
    }
    if (typeof control.showPicker === 'function') {
      try {
        control.showPicker();
      } catch (error) {
        // Not allowed here (for example inside a headless browser); the field still works by typing
      }
    }
  }

  /* ---------- Details sheet ---------- */

  /* page: 'main' or 'custom'; standalone: the custom repeat sheet opened from the toolbar */
  function openDetails(id, page, standalone) {
    if (state.editing && !standalone) {
      finishEditing();
    }
    const item = findItem(id);
    if (!item || item.removed) {
      return;
    }
    const draft = {
      title: item.title, notes: item.notes || '', list: item.list || null,
      date: item.date || null, time: item.time || null, repeat: Logic.copyJson(item.repeat)
    };
    if (page === 'custom') {
      draft.date = draft.date || todayText();
      draft.repeat = draft.repeat ? draft.repeat : { every: 'week' };
    }
    state.sheet = { id: id, draft: draft, page: page || 'main', standalone: Boolean(standalone) };
    state.swipeOpen = null;
    renderSheet();
    if (!standalone) {
      renderAll();
    }
    presentSheet(byId('sheet'));
  }

  function closeDetails(save) {
    const sheetState = state.sheet;
    if (!sheetState) {
      return;
    }
    let item = null;
    if (save) {
      item = findItem(sheetState.id);
      const draft = sheetState.draft;
      if (item && sheetState.standalone) {
        // The custom repeat for the row being typed: it is written when typing ends
        item.date = draft.date;
        item.time = draft.date ? draft.time : null;
        item.repeat = draft.date && draft.repeat ? Logic.cleanRepeat(draft.repeat) : null;
      } else if (item) {
        const fields = {
          title: draft.title.trim() || item.title, notes: draft.notes.trim(), list: draft.list,
          date: draft.date, time: draft.date ? draft.time : null, repeat: draft.date && draft.repeat ? Logic.cleanRepeat(draft.repeat) : null
        };
        if (fieldsDiffer(fields, snapshotFields(item))) {
          persistChange(item, makeUserFieldsChange(fields));
        }
      }
    }
    const wasStandalone = sheetState.standalone;
    state.sheet = null;
    dismissSheet(byId('sheet'), finishCloseDetails);
    if (wasStandalone) {
      refreshEditingRow();
      focusEditingInput();
      return;
    }
    renderAll();
    if (item && !state.editing) {
      announceIfMovedAway(item);
    }
    reloadIfWanted();
  }

  function finishCloseDetails() {
    if (!state.sheet) {
      byId('sheet').innerHTML = '';
    }
  }

  function iconCell(iconName, iconColor, label, sub, rightHtml, extraClass) {
    const subHtml = sub ? '<div class="cell-sub">' + sub + '</div>' : '';
    return '<div class="cell' + (extraClass || '') + '">' +
      '<div class="cell-icon" style="background:' + iconColor + '">' + svgIcon(iconName, 19) + '</div>' +
      '<div class="cell-main"><div class="cell-label">' + label + '</div>' + subHtml + '</div>' + rightHtml + '</div>';
  }

  function switchHtml(on, action) {
    return '<span class="switch' + (on ? ' on' : '') + '" data-action="' + action + '" role="switch" aria-checked="' + on + '"></span>';
  }

  function nativeRowHtml(controlHtml) {
    return '<div class="cell plain">' + controlHtml + '</div>';
  }

  function endRepeatHtml(draft) {
    const onDate = Boolean(draft.repeat.until);
    const select = '<select class="cell-select" data-native="det-end" aria-label="End Repeat">' +
      '<option value="never"' + (onDate ? '' : ' selected') + '>Never</option>' +
      '<option value="date"' + (onDate ? ' selected' : '') + '>On Date</option></select>';
    let html = iconCell('calendar', 'var(--gray)', 'End Repeat', '', select);
    if (onDate) {
      const untilDate = Logic.localDateOf(draft.repeat.until, deviceZone);
      html += nativeRowHtml('<input type="date" class="pill-input" data-native="det-until" value="' + untilDate + '" aria-label="End date">');
    }
    return html;
  }

  function sheetMainHtml() {
    const draft = state.sheet.draft;
    const list = listOf(draft.list);
    const parts = [];
    parts.push('<div class="group">' +
      '<div class="cell text-cell plain"><input class="sheet-input" data-field="title" placeholder="Title" value="' + escapeHtml(draft.title) + '"></div>' +
      '<div class="cell text-cell plain"><textarea class="sheet-notes" data-field="notes" placeholder="Notes" rows="3">' + escapeHtml(draft.notes) + '</textarea></div></div>');
    let dateGroup = iconCell('calendar', 'var(--red)', 'Date', draft.date ? formatLongKey(draft.date) : '', switchHtml(Boolean(draft.date), 'det-toggle-date'));
    if (draft.date) {
      dateGroup += nativeRowHtml('<input type="date" class="pill-input" data-native="det-date" value="' + draft.date + '" aria-label="Date">');
    }
    dateGroup += iconCell('clock', 'var(--blue)', 'Time', draft.time ? Logic.formatTime12(draft.time) : '', switchHtml(Boolean(draft.time), 'det-toggle-time'));
    if (draft.time) {
      dateGroup += nativeRowHtml('<input type="time" class="pill-input" data-native="det-time" value="' + draft.time + '" aria-label="Time">');
    }
    parts.push('<div class="group">' + dateGroup + '</div>');
    if (draft.date) {
      const repeatSelect = '<select class="cell-select" data-native="det-repeat" aria-label="Repeat">' + repeatOptionsHtml(draft.repeat) + '</select>';
      let repeatGroup = iconCell('repeat', 'var(--gray)', 'Repeat', '', repeatSelect);
      if (draft.repeat) {
        repeatGroup += endRepeatHtml(draft);
      }
      parts.push('<div class="group">' + repeatGroup + '</div>');
    }
    const listSelect = '<select class="cell-select" data-native="det-list" aria-label="List">' + listOptionsHtml(draft.list) + '</select>';
    parts.push('<div class="group">' + iconCell('list', list ? colorCss(list.color) : 'var(--gray)', 'List', '', listSelect) + '</div>');
    return parts.join('');
  }

  /* Custom repeat: native menus for frequency and interval, hand-drawn weekdays (no native control) */
  function sheetCustomHtml() {
    const draft = state.sheet.draft;
    const repeat = draft.repeat;
    const interval = repeat.interval || 1;
    let frequencyOptions = '';
    for (const frequency of FREQUENCIES) {
      const selected = frequency.every === repeat.every ? ' selected' : '';
      frequencyOptions += '<option value="' + frequency.every + '"' + selected + '>' + frequency.label + '</option>';
    }
    let everyOptions = '';
    for (let count = 1; count <= 99; count += 1) {
      const selected = count === interval ? ' selected' : '';
      everyOptions += '<option value="' + count + '"' + selected + '>' + count + ' ' + unitWord(repeat.every, count) + '</option>';
    }
    const parts = [];
    parts.push('<div class="group">' +
      '<div class="cell plain"><div class="cell-main"><div class="cell-label">Frequency</div></div><select class="cell-select" data-native="det-freq" aria-label="Frequency">' + frequencyOptions + '</select></div>' +
      '<div class="cell plain"><div class="cell-main"><div class="cell-label">Every</div></div><select class="cell-select" data-native="det-every" aria-label="Every">' + everyOptions + '</select></div>');
    if (repeat.every === 'week') {
      const chosen = repeat.weekdays && repeat.weekdays.length ? repeat.weekdays : [Logic.weekdayOf(draft.date || todayText())];
      const letters = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      let buttons = '';
      for (let day = 0; day < 7; day += 1) {
        const selected = chosen.indexOf(day) !== -1 ? ' sel' : '';
        buttons += '<button type="button" class="wd' + selected + '" data-action="det-weekday" data-val="' + day + '" aria-label="' + WEEKDAY_NAMES[day] + '">' + letters[day] + '</button>';
      }
      parts.push('<div class="wd-row">' + buttons + '</div>');
    }
    parts.push('</div>');
    parts.push('<div class="group-foot">' + escapeHtml(repeatSentence(repeat, draft.date)) + '</div>');
    parts.push('<div class="group">' + endRepeatHtml(draft) + '</div>');
    if (repeat.every === 'month') {
      parts.push('<div class="group-foot">Repeats on the day of the reminder’s date; months without that day are skipped.</div>');
    }
    return parts.join('');
  }

  function sheetHeaderHtml(title, backAction, confirmAction, cancelAction) {
    let left;
    let right = '';
    if (backAction) {
      left = '<button type="button" class="glass-btn" data-action="' + backAction + '" aria-label="Back">' + svgIcon('chevL', 22) + '</button>';
      right = '<span style="width:44px"></span>';
    } else {
      left = cancelAction ? '<button type="button" class="glass-btn" data-action="' + cancelAction + '" aria-label="Cancel">' + svgIcon('xmark', 20) + '</button>' : '<span style="width:44px"></span>';
      right = '<button type="button" class="glass-btn confirm" data-action="' + confirmAction + '" aria-label="Done">' + svgIcon('check', 22) + '</button>';
    }
    return '<div class="sheet-grab"><div class="grabber"></div><div class="sheet-head">' + left +
      '<div class="sheet-title-text">' + title + '</div>' + right + '</div></div>';
  }

  function renderSheet() {
    const sheet = byId('sheet');
    if (!state.sheet) {
      return;
    }
    const body = sheet.querySelector('.sheet-body');
    const savedScroll = body && sheet.dataset.page === state.sheet.page ? body.scrollTop : 0;
    const isCustom = state.sheet.page === 'custom';
    const backAction = isCustom && !state.sheet.standalone ? 'det-back' : null;
    const title = isCustom ? 'Custom Repeat' : 'Details';
    sheet.innerHTML = sheetHeaderHtml(title, backAction, 'det-save', 'det-cancel') + '<div class="sheet-body">' + (isCustom ? sheetCustomHtml() : sheetMainHtml()) + '</div>';
    sheet.dataset.page = state.sheet.page;
    sheet.querySelector('.sheet-body').scrollTop = savedScroll;
  }

  function applyDetailsChange(kind, control) {
    if (!state.sheet) {
      return;
    }
    const draft = state.sheet.draft;
    const value = control.value;
    if (kind === 'det-date') {
      draft.date = value || null;
      if (!value) {
        draft.time = null;
        draft.repeat = null;
      }
    } else if (kind === 'det-time') {
      draft.time = value || null;
    } else if (kind === 'det-repeat') {
      if (value === 'custom') {
        if (!draft.repeat) {
          draft.repeat = { every: 'week' };
        }
        state.sheet.page = 'custom';
      } else {
        applyRepeatChoice(draft, value);
      }
    } else if (kind === 'det-end') {
      if (value === 'never') {
        delete draft.repeat.until;
      } else if (!draft.repeat.until) {
        const monthLater = Logic.addDays(draft.date || todayText(), 30);
        draft.repeat.until = endOfDayIso(monthLater);
      }
    } else if (kind === 'det-until') {
      if (value) {
        draft.repeat.until = endOfDayIso(value);
      }
    } else if (kind === 'det-list') {
      draft.list = value === 'none' ? null : value;
    } else if (kind === 'det-freq') {
      draft.repeat.every = value;
      if (value !== 'week') {
        delete draft.repeat.weekdays;
      }
    } else if (kind === 'det-every') {
      draft.repeat.interval = Number(value);
    }
    renderSheet();
  }

  function compareNumbers(first, second) {
    return first - second;
  }

  /* Weekly custom repeat: tick or untick a weekday; at least one stays ticked */
  function toggleWeekday(draft, day) {
    const startWeekday = Logic.weekdayOf(draft.date || todayText());
    const current = draft.repeat.weekdays && draft.repeat.weekdays.length ? draft.repeat.weekdays.slice() : [startWeekday];
    const position = current.indexOf(day);
    if (position === -1) {
      current.push(day);
    } else if (current.length > 1) {
      current.splice(position, 1);
    }
    current.sort(compareNumbers);
    draft.repeat.weekdays = current;
  }

  function handleSheetInput(event) {
    const field = event.target.dataset ? event.target.dataset.field : null;
    if (!field || !state.sheet) {
      return;
    }
    state.sheet.draft[field] = event.target.value;
  }

  function handleSheetAction(action, element) {
    const sheetState = state.sheet;
    if (!sheetState) {
      return;
    }
    const draft = sheetState.draft;
    if (action === 'det-cancel') {
      closeDetails(false);
    } else if (action === 'det-save') {
      closeDetails(true);
    } else if (action === 'det-back') {
      sheetState.page = 'main';
      renderSheet();
    } else if (action === 'det-toggle-date') {
      if (draft.date) {
        draft.date = null;
        draft.time = null;
        draft.repeat = null;
      } else {
        draft.date = todayText();
      }
      renderSheet();
    } else if (action === 'det-toggle-time') {
      if (draft.time) {
        draft.time = null;
      } else {
        draft.date = draft.date || todayText();
        draft.time = nextWholeHour();
      }
      renderSheet();
    } else if (action === 'det-weekday') {
      toggleWeekday(draft, Number(element.dataset.val));
      renderSheet();
    }
  }

  /* ======================================================================
     Add List sheet (from the sidebar)
     ====================================================================== */

  function colourHex(name) {
    for (const colour of LIST_COLOURS) {
      if (colour.name === name) {
        return colour.hex;
      }
    }
    return '#007AFF';
  }

  function openAddList() {
    state.addList = { name: '', color: 'blue', icon: 'list' };
    renderAddList();
    presentSheet(byId('addlist'));
    window.setTimeout(focusAddListName, 380);
  }

  function focusAddListName() {
    const input = byId('nl-name');
    if (input && state.addList) {
      input.focus({ preventScroll: true });
    }
  }

  function renderAddList() {
    const sheet = byId('addlist');
    const draft = state.addList;
    if (!draft) {
      return;
    }
    let colours = '';
    for (const colour of LIST_COLOURS) {
      const selected = colour.name === draft.color ? ' selected' : '';
