    }
    let icons = '';
    for (const name of LIST_ICON_PICKS) {
      const selected = name === draft.icon ? ' selected' : '';
      icons += '<button type="button" class="swatch icon-swatch' + selected + '" data-action="al-icon" data-val="' + name + '" aria-label="' + name + '">' + listGlyph(name) + '</button>';
    }
    const header = '<div class="sheet-grab"><div class="grabber"></div><div class="sheet-head">' +
      '<button type="button" class="glass-btn" data-action="al-cancel" aria-label="Cancel">' + svgIcon('xmark', 20) + '</button>' +
      '<div class="sheet-title-text">New List</div>' +
      '<button type="button" class="glass-btn confirm" id="al-done" data-action="al-done" aria-label="Done"' + (draft.name.trim() ? '' : ' disabled') + '>' + svgIcon('check', 22) + '</button></div></div>';
    sheet.innerHTML = header + '<div class="sheet-body">' +
      '<div class="group nl-top"><div class="nl-badge" id="nl-badge" style="background:var(--' + draft.color + ')">' + listGlyph(draft.icon) + '</div>' +
      '<input class="nl-name" id="nl-name" maxlength="40" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="List Name" aria-label="List name" style="color:var(--' + draft.color + ')" value="' + escapeHtml(draft.name) + '"></div>' +
      '<div class="group"><div class="swatch-grid">' + colours + '</div></div>' +
      '<div class="group"><div class="swatch-grid">' + icons + '</div></div></div>';
  }

  function handleAddListInput(event) {
    if (event.target.id !== 'nl-name' || !state.addList) {
      return;
    }
    state.addList.name = event.target.value;
    byId('al-done').disabled = state.addList.name.trim().length === 0;
  }

  function closeAddList(create) {
    const draft = state.addList;
    if (!draft) {
      return;
    }
    if (create) {
      const name = draft.name.trim();
      if (!name) {
        return;
      }
      const list = { id: newId(), name: name, color: colourHex(draft.color), icon: draft.icon, source: null, createdAt: new Date().toISOString() };
      state.lists[list.id] = list;
      state.order.push(list.id);
      enqueueWrite(saveListTask(list));
      enqueueWrite(saveSidebarOrderTask());
    }
    state.addList = null;
    const active = document.activeElement;
    if (active && active.blur) {
      active.blur();
    }
    dismissSheet(byId('addlist'), clearAddList);
    renderDrawer();
    renderAll();
    if (create) {
      const scrollBox = document.querySelector('.nav-scroll');
      if (scrollBox) {
        scrollBox.scrollTop = scrollBox.scrollHeight;
      }
    }
    reloadIfWanted();
  }

  function clearAddList() {
    if (!state.addList) {
      byId('addlist').innerHTML = '';
    }
  }

  function handleAddListAction(action, element) {
    if (action === 'al-cancel') {
      closeAddList(false);
    } else if (action === 'al-done') {
      closeAddList(true);
    } else if (action === 'al-color') {
      state.addList.color = element.dataset.val;
      state.addList.name = byId('nl-name').value;
      renderAddList();
    } else if (action === 'al-icon') {
      state.addList.icon = element.dataset.val;
      state.addList.name = byId('nl-name').value;
      renderAddList();
    }
  }

  /* ======================================================================
     Import from Apple Reminders (a file now; later the shell hands over the same JSON)
     ====================================================================== */

  function chooseBringInFile() {
    closeMenu();
    const input = byId('bring-in-file');
    input.value = '';
    input.click();
  }

  function handleBringInFileChosen(input) {
    const file = input.files && input.files[0];
    if (!file) {
      return;
    }
    const reader = new FileReader();
    reader.addEventListener('load', handleBringInFileRead);
    reader.addEventListener('error', handleBringInFileError);
    reader.readAsText(file);
  }

  function handleBringInFileError() {
    showAlert('Couldn’t Read the File', 'The file could not be opened.');
  }

  function handleBringInFileRead(event) {
    const text = String(event.target.result || '');
    let exported = null;
    try {
      exported = JSON.parse(text);
    } catch (error) {
      showAlert('Not an Apple Reminders Export', 'The file is not valid JSON.');
      return;
    }
    const looksRight = exported && exported.source === BRING_IN_SOURCE && Array.isArray(exported.lists) && Array.isArray(exported.reminders);
    if (!looksRight) {
      showAlert('Not an Apple Reminders Export', 'The file does not look like an export from Apple Reminders.');
      return;
    }
    if (state.editing) {
      finishEditing();
    }
    if (state.drawerOpen) {
      closeDrawer(0);
    }
    showProgress('Importing from Apple Reminders', 0, exported.reminders.length);
    enqueueWrite(bringInTask(exported));
  }

  function nextHistoryNumber() {
    let highest = -1;
    for (const key of state.historyKeys || []) {
      highest = Math.max(highest, Logic.historyNumber(key));
    }
    return highest + 1;
  }

  function bringInTask(exported) {
    return async function bringInAppleExport() {
      const failures = [];
      // Read the store again first, so a second run adds nothing
      applyStoreRecords(await readStoreRecords());
      const existingLists = [];
      for (const id of Object.keys(state.lists)) {
        existingLists.push(state.lists[id]);
      }
      const existingItems = state.items.concat(state.history);
      const result = Logic.mapAppleExport(exported, { items: existingItems, lists: existingLists }, deviceZone);
      const active = [];
      const completed = [];
      for (const item of result.items) {
        if (item.done) {
          completed.push(item);
        } else {
          active.push(item);
        }
      }
      const historyRecords = Logic.packHistory(completed, nextHistoryNumber());
      const total = result.lists.length + active.length + historyRecords.length + (result.lists.length ? 1 : 0);
      let done = 0;
      const startTime = Date.now();
      for (let index = 0; index < result.lists.length; index += 1) {
        const list = result.lists[index];
        list.createdAt = new Date(startTime + index).toISOString();
        await writeBringInRecord('list:' + list.id, { name: list.name, color: list.color, icon: list.icon, source: list.source, createdAt: list.createdAt }, failures, list.name);
        state.lists[list.id] = list;
        state.order.push(list.id);
        done += 1;
        showProgress('Importing from Apple Reminders', done, total);
      }
      if (result.lists.length) {
        await writeBringInRecord('settings:sidebar', { order: state.order.slice() }, failures, 'list order');
        done += 1;
      }
      for (const item of active) {
        await writeBringInRecord(Logic.recordKey(item), Logic.recordFromItem(item, null), failures, item.title);
        done += 1;
        showProgress('Importing from Apple Reminders', done, total);
      }
      for (const record of historyRecords) {
        await writeBringInRecord(record.key, record.value, failures, 'completed reminders');
        done += 1;
        showProgress('Importing from Apple Reminders', done, total);
      }
      applyStoreRecords(await readStoreRecords());
      hideProgress();
      state.view = 'today';
      state.scope = 0;
      renderAll();
      showSummary(result.summary, failures);
      if (failures.length) {
        const first = failures[0];
        showAlert('Some Reminders Weren’t Saved', formatCount(failures.length) + ' could not be saved. The first: “' + first.what + '”: ' + first.reason);
      }
    };
  }

  async function writeBringInRecord(key, value, failures, what) {
    try {
      if (key === 'settings:sidebar') {
        const existing = await store.get(key);
        await store.set(key, Object.assign({}, existing || {}, value));
        return;
      }
      await store.set(key, value);
    } catch (error) {
      failures.push({ what: what, reason: messageOf(error) });
    }
  }

  function summaryCell(label, count) {
    return '<div class="cell plain"><div class="cell-main"><div class="cell-label">' + label + '</div></div><div class="cell-value">' + formatCount(count) + '</div></div>';
  }

  function showSummary(summary, failures) {
    state.summary = { summary: summary, failures: failures };
    const sheet = byId('summary');
    let body = '<div class="group">' +
      summaryCell('Lists', summary.lists) +
      summaryCell('Active reminders', summary.active) +
      summaryCell('Completed reminders', summary.completed) +
      '</div><div class="group">' +
      summaryCell('With a date', summary.dated) +
      summaryCell('All-day', summary.allDay) +
      summaryCell('Repeating', summary.repeating) +
      summaryCell('Repeats not brought across', summary.unsupportedRepeats) +
      '</div>';
    if (summary.unsupportedRepeats > 0) {
      body += '<div class="group-foot">Those came in as one-off reminders, with a note saying so.</div>';
    }
    body += '<div class="group">' + summaryCell('Already here, skipped', summary.skipped);
    if (failures.length) {
      body += summaryCell('Could not be saved', failures.length);
    }
    body += '</div>';
    sheet.innerHTML = sheetHeaderHtml('Imported', null, 'summary-done', null) + '<div class="sheet-body">' + body + '</div>';

  /* ======================================================================
     Everything
     ====================================================================== */

  function renderAll() {

  }

  let renderQueued = false;

  function isBusyForRender() {
    return Boolean(state.editing || rowDrag || (gesture && gesture.claimed) || rowsLeaving > 0);
  }

  function requestRender() {
    if (renderQueued) {
      return;
    }

    window.setTimeout(runQueuedRender, 0);
  }

  function runQueuedRender() {

  /* ======================================================================
     Springs: velocity-aware, like UIKit's spring animations
     (response = period in seconds, damping = damping ratio)
     ====================================================================== */

  const springs = new Map();

  function stopSpring(key) {
    const motion = springs.get(key);
    if (motion) {
      window.cancelAnimationFrame(motion.frame);
      springs.delete(key);
    }
  }

  function runSpring(key, options) {
    stopSpring(key);
    const omega = (2 * Math.PI) / (options.response * 1000);
    const zeta = options.damping;
    const motion = { value: options.from, velocity: options.velocity || 0, frame: 0, last: 0 };
    springs.set(key, motion);

    function stepSpring(time) {
      const elapsed = motion.last ? Math.min(32, time - motion.last) : 16;
      motion.last = time;
      // Integrate in 4 ms substeps so stiff springs stay stable
      let remaining = elapsed;
      while (remaining > 0) {
        const step = Math.min(4, remaining);
        const acceleration = -omega * omega * (motion.value - options.to) - 2 * zeta * omega * motion.velocity;
        motion.velocity += acceleration * step;
        motion.value += motion.velocity * step;
        remaining -= step;
      }
      const settled = Math.abs(motion.value - options.to) < 0.4 && Math.abs(motion.velocity) < 0.02;
      if (settled) {
        springs.delete(key);
        options.onFrame(options.to);
        if (options.onDone) {
          options.onDone();
        }
        return;
      }
      options.onFrame(motion.value);
      motion.frame = window.requestAnimationFrame(stepSpring);
    }
    motion.frame = window.requestAnimationFrame(stepSpring);
  }

  /* UIScrollView-style rubber band for dragging past a limit */
  function rubber(distance, dimension) {
    return (1 - 1 / (distance * 0.55 / dimension + 1)) * dimension;
  }

  function screenWidth() {
    return byId('screen').clientWidth || 402;
  }

  /* ======================================================================
     Pull scroller: a JS scroll view with iOS rubber banding and
     pull-past-the-edge actions at the bottom and the top
     ====================================================================== */

  const RUBBER_COEFFICIENT = 0.55;
  function returnTrue() {
    return true;
  }
  function returnFalse() {
    return false;
  }
  function doNothing() {}

  const wheelGate = { locked: false, timer: 0 };
  function unlockWheel() {
    wheelGate.locked = false;
  }
  function armWheelUnlock() {
    window.clearTimeout(wheelGate.timer);
    wheelGate.timer = window.setTimeout(unlockWheel, 300);
  }
  // After a pull fires from a trackpad, ignore the rest of that fling so one gesture never jumps two pages
  function lockWheelUntilQuiet() {
    wheelGate.locked = true;
    armWheelUnlock();
  }
  function wheelIsLocked() {
    if (wheelGate.locked) {
      armWheelUnlock();
      return true;
    }
    return false;
  }
  function normalizedWheelDelta(event) {
    let delta = event.deltaY;
    if (event.deltaMode === 1) {
      delta *= 16;
    } else if (event.deltaMode === 2) {
      delta *= 600;
    }
    return delta;
  }

  function createPullScroller(viewport, content, userOptions) {
    const options = Object.assign({
      threshold: 70,
      enabled: returnTrue,
      canPullUp: returnFalse,
      canPullDown: returnFalse,
      onPullUp: null,
      onPullDown: null,
      onScroll: doNothing,
      onPullProgress: doNothing
    }, userOptions);
    const motion = { offset: 0, velocity: 0, mode: 'idle', target: 0 };
    let drag = null;
    let wheelRaw = 0;
    let wheelEndTimer = 0;
    let frameId = 0;
    let lastFrameTime = 0;
    let armedEdge = null;
    let suppressClick = false;

    function viewportHeight() {
      return viewport.clientHeight || 1;
    }
    function maxOffset() {
      return Math.max(0, content.offsetHeight - viewport.clientHeight);
    }
    // UIScrollView's rubber band: f(x) = (1 - 1 / (x * c / d + 1)) * d.
    function rubberBand(distance) {
      const height = viewportHeight();
      return (1 - 1 / (distance * RUBBER_COEFFICIENT / height + 1)) * height;
    }
    function inverseRubberBand(shown) {
      const height = viewportHeight();
      const limited = Math.min(shown, height * 0.98);
      return (height / RUBBER_COEFFICIENT) * (limited / (height - limited));
    }
    function rawFromOffset(offset) {
      const max = maxOffset();
      if (offset > max) {
        return max + inverseRubberBand(offset - max);
      }
      if (offset < 0) {
        return -inverseRubberBand(-offset);
      }
      return offset;
    }
    function offsetFromRaw(raw) {
      const max = maxOffset();
      if (raw > max) {
        return max + rubberBand(raw - max);
      }
      if (raw < 0) {
        return -rubberBand(-raw);
      }
      return raw;
    }

    function gestureActive() {
      return motion.mode === 'drag' || motion.mode === 'wheel';
    }

    function reportPullProgress() {
      const bottomOver = Math.max(0, motion.offset - maxOffset());
      const topOver = Math.max(0, -motion.offset);
      const upProgress = options.canPullUp() ? bottomOver / options.threshold : 0;
      const downProgress = options.canPullDown() ? topOver / options.threshold : 0;
      options.onPullProgress({ up: upProgress, down: downProgress });
      let nowArmed = null;
      if (upProgress >= 1) {
        nowArmed = 'up';
      } else if (downProgress >= 1) {
        nowArmed = 'down';
      }
      if (nowArmed && nowArmed !== armedEdge && gestureActive()) {
        hapticTick();
      }
      armedEdge = nowArmed;
    }

    function paint() {
      content.style.transform = 'translate3d(0,' + (-motion.offset) + 'px,0)';
      options.onScroll(motion.offset, maxOffset());
      reportPullProgress();
    }

    function stopLoop() {
      if (frameId) {
        window.cancelAnimationFrame(frameId);
        frameId = 0;
      }
    }
    function startLoop() {
      if (!frameId) {
        lastFrameTime = 0;
        frameId = window.requestAnimationFrame(stepFrame);
      }
    }

    // Critically damped spring, integrated in 4 ms substeps for stability.
    function integrateSpring(elapsed) {
      const omega = 0.022;
      let remaining = elapsed;
      while (remaining > 0) {
        const step = Math.min(4, remaining);
        const acceleration = -omega * omega * (motion.offset - motion.target) - 2 * omega * motion.velocity;
        motion.velocity += acceleration * step;
        motion.offset += motion.velocity * step;
        remaining -= step;
      }
      if (Math.abs(motion.offset - motion.target) < 0.4 && Math.abs(motion.velocity) < 0.02) {
        motion.offset = motion.target;
        motion.velocity = 0;
        motion.mode = 'idle';
      }
    }

    function stepFrame(time) {
      frameId = 0;
      const elapsed = lastFrameTime ? Math.min(32, time - lastFrameTime) : 16;
      lastFrameTime = time;
      if (motion.mode === 'momentum') {
        motion.offset += motion.velocity * elapsed;
        // UIScrollView normal deceleration: velocity keeps 99.8% per millisecond.
        motion.velocity *= Math.pow(0.998, elapsed);
        const max = maxOffset();
        if (motion.offset > max || motion.offset < 0) {
          motion.mode = 'spring';
          motion.target = clamp(motion.offset, 0, max);
        } else if (Math.abs(motion.velocity) < 0.02) {
          motion.mode = 'idle';
        }
      } else if (motion.mode === 'spring') {
        integrateSpring(elapsed);
      }
      paint();
      if (motion.mode === 'momentum' || motion.mode === 'spring') {
        frameId = window.requestAnimationFrame(stepFrame);
      }
    }

    function springTo(target) {
      motion.target = target;
      motion.mode = 'spring';
      startLoop();
    }

    function runPull(handler) {
      motion.velocity = 0;
      motion.mode = 'idle';
      const requested = handler();
      const target = typeof requested === 'number' ? requested : motion.offset;
      springTo(clamp(target, 0, maxOffset()));
    }

    // Decide what a finished drag or wheel gesture does: fire a pull, bounce back, or coast.
    function finishGesture() {
      const max = maxOffset();
      const bottomOver = Math.max(0, motion.offset - max);
      const topOver = Math.max(0, -motion.offset);
      if (bottomOver >= options.threshold && options.canPullUp() && options.onPullUp) {
        runPull(options.onPullUp);
        return true;
      }
      if (topOver >= options.threshold && options.canPullDown() && options.onPullDown) {
        runPull(options.onPullDown);
        return true;
      }
      if (bottomOver > 0 || topOver > 0) {
        motion.velocity = 0;
        springTo(clamp(motion.offset, 0, max));
        return false;
      }
      if (Math.abs(motion.velocity) > 0.05) {
        motion.mode = 'momentum';
        startLoop();
      } else {
        motion.mode = 'idle';
        paint();
      }
      return false;
    }

    function handleScrollerPointerDown(event) {
      if (!options.enabled()) {
        return;
      }
      if (event.pointerType === 'mouse' && event.button !== 0) {
        return;
      }
      if (event.target.closest('input, select, textarea')) {
        return;
      }
      stopLoop();
      drag = {
        startX: event.clientX,
        id: event.pointerId,
        startY: event.clientY,
        lastY: event.clientY,
        moved: false,
        raw: rawFromOffset(motion.offset),
        samples: []
      };
      motion.velocity = 0;
      motion.mode = 'drag';
      window.addEventListener('pointermove', handleScrollerPointerMove);
      window.addEventListener('pointerup', handleScrollerPointerUp);
      window.addEventListener('pointercancel', handleScrollerPointerUp);
    }

    // Give the gesture up (a sideways swipe or another drag took it)
    function abandonDrag() {
      window.removeEventListener('pointermove', handleScrollerPointerMove);
      window.removeEventListener('pointerup', handleScrollerPointerUp);
      window.removeEventListener('pointercancel', handleScrollerPointerUp);
      drag = null;
      finishGesture();
    }

    function handleScrollerPointerMove(event) {
      if (!drag || event.pointerId !== drag.id) {
        return;
      }
      const totalMove = Math.abs(event.clientY - drag.startY);
      const sideMove = Math.abs(event.clientX - drag.startX);
      if (!options.enabled() || (!drag.moved && sideMove > 8 && sideMove > totalMove)) {
        abandonDrag();
        return;
      }
      if (!drag.moved && totalMove > 6) {
        drag.moved = true;
        drag.lastY = event.clientY;
      }
      if (!drag.moved) {
        return;
      }
      event.preventDefault();
      const deltaY = event.clientY - drag.lastY;
      drag.lastY = event.clientY;
      drag.raw -= deltaY;
      motion.offset = offsetFromRaw(drag.raw);
      drag.samples.push({ time: event.timeStamp, raw: drag.raw });
      if (drag.samples.length > 6) {
        drag.samples.shift();
      }
      paint();
    }

    function scrollReleaseVelocity(samples) {
      if (samples.length < 2) {
        return 0;
      }
      const last = samples[samples.length - 1];
      let first = samples[0];
      for (const sample of samples) {
        if (last.time - sample.time <= 100) {
          first = sample;
          break;
        }
      }
      const elapsed = last.time - first.time;
      if (elapsed <= 0) {
        return 0;
      }
      return clamp((last.raw - first.raw) / elapsed, -5, 5);
    }

    function clearScrollerSuppressClick() {
      suppressClick = false;
    }

    function handleScrollerPointerUp(event) {
      if (!drag || event.pointerId !== drag.id) {
        return;
      }
      window.removeEventListener('pointermove', handleScrollerPointerMove);
      window.removeEventListener('pointerup', handleScrollerPointerUp);
      window.removeEventListener('pointercancel', handleScrollerPointerUp);
      const wasMoved = drag.moved;
      motion.velocity = wasMoved ? scrollReleaseVelocity(drag.samples) : 0;
      drag = null;
      if (wasMoved) {
        suppressClick = true;
        window.setTimeout(clearScrollerSuppressClick, 60);
      }
      finishGesture();
    }

    function handleClickCapture(event) {
      if (suppressClick) {
        event.stopPropagation();
        event.preventDefault();
        suppressClick = false;
      }
    }

    function handleWheelEnd() {
      if (motion.mode !== 'wheel') {
        return;
      }
      motion.mode = 'idle';
      motion.velocity = 0;
      const pulled = finishGesture();
      if (pulled) {
        lockWheelUntilQuiet();
      }
    }

    function handleWheel(event) {
      if (!options.enabled()) {
        return;
      }
      event.preventDefault();
      event.stopPropagation();
      if (event.ctrlKey || wheelIsLocked()) {
        return;
      }
      if (motion.mode !== 'wheel') {
        stopLoop();
        motion.mode = 'wheel';
        motion.velocity = 0;
        wheelRaw = rawFromOffset(motion.offset);
      }
      wheelRaw += normalizedWheelDelta(event);
      motion.offset = offsetFromRaw(wheelRaw);
      paint();
      window.clearTimeout(wheelEndTimer);
      wheelEndTimer = window.setTimeout(handleWheelEnd, 140);
    }

    // Focusing an input can scroll an overflow:hidden box natively; undo it.
    function resetNativeScroll() {
      viewport.scrollTop = 0;
    }

    viewport.addEventListener('pointerdown', handleScrollerPointerDown);
    viewport.addEventListener('click', handleClickCapture, true);
    viewport.addEventListener('wheel', handleWheel, { passive: false });
    viewport.addEventListener('scroll', resetNativeScroll);

    function scrollTo(target, animate) {
      const limited = clamp(target, 0, maxOffset());
      if (animate === false) {
        stopLoop();
        motion.offset = limited;
        motion.velocity = 0;
        motion.mode = 'idle';
        paint();
        return;
      }
      springTo(limited);
    }

    function refresh() {
      const max = maxOffset();
      if (motion.mode === 'idle' && (motion.offset > max || motion.offset < 0)) {
        springTo(clamp(motion.offset, 0, max));
        return;
      }
      paint();
    }

    function getOffset() {
      return motion.offset;
    }

    paint();
    return { scrollTo: scrollTo, refresh: refresh, getOffset: getOffset };
  }

  /* ======================================================================
     Row swipe (either direction): Delete and Details on both sides
     ====================================================================== */

  function setRowOffset(element, offset) {
    element.style.transform = 'translate3d(' + offset + 'px,0,0)';
    element.dataset.offset = String(offset);
    // The buttons underneath only show while the row is moved, so no hairline leaks at rest
    element.parentElement.classList.toggle('revealed', Math.abs(offset) > 0.5);
  }

  function rowOffsetOf(element) {
    return Number(element.dataset.offset || 0);
  }

  function dragRowTo(element, rawOffset) {
    let offset = rawOffset;
    // Past the left-side buttons the row resists; to the left it follows the finger (a long swipe deletes)
    if (offset > ACTIONS_WIDTH) {
      offset = ACTIONS_WIDTH + rubber(offset - ACTIONS_WIDTH, 200);
    }
    setRowOffset(element, offset);
    return offset;
  }

  function animateRow(element, id, from, to, velocity, afterwards) {
    function moveRowFrame(value) {
      setRowOffset(element, value);
    }
    runSpring('row' + id, { from: from, to: to, velocity: velocity, response: 0.36, damping: 0.86, onFrame: moveRowFrame, onDone: afterwards });
  }

  /* Decide where a released row goes, projecting its velocity forward like UIKit */
  function endRowSwipe(gestureState, velocity) {
    const element = gestureState.element;
    const id = gestureState.id;
    const offset = rowOffsetOf(element);
    const width = screenWidth();
    const projected = offset + velocity * 180;
    // Only a long drag deletes (past 60% of the width, or 45% with a hard flick), as in UIKit
    if (offset < -width * 0.6 || (offset < -width * 0.45 && velocity < -1.2)) {
      state.swipeOpen = null;
      animateRow(element, id, offset, -width, Math.min(velocity, -1), finishFullSwipe.bind(null, id));
      return;
    }
    let target = 0;
    if (projected < -ACTIONS_WIDTH / 2) {
      target = -ACTIONS_WIDTH;
    } else if (projected > ACTIONS_WIDTH / 2) {
      target = ACTIONS_WIDTH;
    }
    state.swipeOpen = target ? { id: id, offset: target } : null;
    animateRow(element, id, offset, target, velocity, null);
  }

  function finishFullSwipe(id) {
    deleteWithAnimation(id);
  }

  function closeOpenRow() {
    if (!state.swipeOpen) {
      return;
    }
    const id = state.swipeOpen.id;
    state.swipeOpen = null;
    const element = document.querySelector('[data-swipe="' + cssEscape(id) + '"]');
    if (element) {
      animateRow(element, id, rowOffsetOf(element), 0, 0, null);
    }
  }

  /* ======================================================================
     Drawer and sheet positions
     ====================================================================== */

  let drawerX = null;

  function drawerWidth() {
    return byId('nav-panel').offsetWidth || 330;
  }

  function setDrawerX(x) {
    const panel = byId('nav-panel');
    const scrim = byId('nav-scrim');
    const width = drawerWidth();
    drawerX = x;
    panel.style.transform = 'translate3d(' + x + 'px,0,0)';
    const progress = clamp(1 + x / width, 0, 1);
    panel.style.visibility = progress > 0.001 ? 'visible' : 'hidden';
    scrim.style.opacity = String(progress);
    // A closing drawer must not catch taps meant for the screen behind it
    scrim.classList.toggle('on', progress > 0.001 && state.drawerOpen);
  }

  function currentDrawerX() {
    return drawerX === null ? -drawerWidth() : drawerX;
  }

  function openDrawer(velocity) {
    if (state.editing) {
      finishEditing();
    }
    closeOpenRow();
    if (!state.drawerOpen) {
      state.drawerOpen = true;
      renderDrawer();
    }
    byId('nav-panel').style.visibility = 'visible';
    runSpring('drawer', { from: currentDrawerX(), to: 0, velocity: velocity || 0, response: 0.42, damping: 1, onFrame: setDrawerX });
  }

  function closeDrawer(velocity) {
    state.drawerOpen = false;
    cancelRowPress();
    runSpring('drawer', { from: currentDrawerX(), to: -drawerWidth(), velocity: velocity || 0, response: 0.4, damping: 1, onFrame: setDrawerX });
  }

  function sheetHeight(element) {
    return element.offsetHeight || 800;
  }

  function setSheetY(element, y) {
    element.style.transform = 'translate3d(0,' + y + 'px,0)';
    element.dataset.y = String(y);
    updateSheetScrim();
  }

  function updateSheetScrim() {
    let opacity = 0;
    const sheets = [byId('sheet'), byId('addlist'), byId('summary')];
    for (const element of sheets) {
      if (element.dataset.shown === '1') {
        const height = sheetHeight(element);
        const y = Number(element.dataset.y);
        opacity = Math.max(opacity, 1 - y / height);
      }
    }
    const scrim = byId('scrim');
    scrim.style.opacity = String(clamp(opacity, 0, 1));
    scrim.classList.toggle('on', opacity > 0.01 && Boolean(state.sheet || state.addList || state.summary));
  }

  function presentSheet(element) {
    element.style.visibility = 'visible';
    const height = sheetHeight(element);
    const from = element.dataset.shown === '1' ? Number(element.dataset.y) : height;
    element.dataset.shown = '1';
    setSheetY(element, from);
    function moveSheetFrame(value) {
      setSheetY(element, value);
    }
    runSpring(element.id, { from: from, to: 0, velocity: 0, response: 0.45, damping: 1, onFrame: moveSheetFrame });
  }

  let sheetDismissVelocity = 0;

  function dismissSheet(element, afterwards) {
    const height = sheetHeight(element);
    const from = Number(element.dataset.y || 0);
    const velocity = sheetDismissVelocity;
    sheetDismissVelocity = 0;
    function moveSheetFrame(value) {
      setSheetY(element, value);
    }
    function hideSheetElement() {
      element.style.visibility = 'hidden';
      element.dataset.shown = '0';
      updateSheetScrim();
      afterwards();
    }
    runSpring(element.id, { from: from, to: height, velocity: velocity, response: 0.4, damping: 1, onFrame: moveSheetFrame, onDone: hideSheetElement });
  }

  /* ======================================================================
     Sidebar: hold a list to lift it, then drag (fill animation while held)
     ====================================================================== */

  let rowPress = null;
  let rowDrag = null;

  function startRowPress(rowElement, event) {
    rowPress = { rowElement: rowElement, startX: event.clientX, startY: event.clientY, listId: rowElement.dataset.nav, timerId: 0 };
    rowElement.classList.add('pressing');
    rowElement.style.setProperty('--hold-ms', HOLD_MS + 'ms');
    rowElement.classList.add('holding');
    rowPress.timerId = window.setTimeout(liftPressedRow, HOLD_MS);
  }

  function cancelRowPress() {
    if (!rowPress) {
      return;
    }
    window.clearTimeout(rowPress.timerId);
    rowPress.rowElement.classList.remove('pressing');
    rowPress.rowElement.classList.remove('holding');
    rowPress = null;
  }

  function liftPressedRow() {
    if (!rowPress) {
      return;
    }
    const press = rowPress;
    rowPress = null;
    press.rowElement.classList.remove('pressing');
    press.rowElement.classList.remove('holding');
    gesture = null;
    hapticTick();
    startRowDrag(press.rowElement, press.startY);
  }

  function navRowElements() {
    const nodes = document.querySelectorAll('#nav-rows .nav-row');
    return Array.from(nodes);
  }

  function startRowDrag(rowElement, clientY) {
    const rows = navRowElements();
    const startIndex = rows.indexOf(rowElement);
    const offsets = [];
    for (const row of rows) {
      offsets.push(row.offsetTop);
    }
    rowDrag = {
      rowElement: rowElement, rows: rows, startIndex: startIndex, targetIndex: startIndex, startClientY: clientY,
      rowHeight: rowElement.offsetHeight, minDy: offsets[0] - offsets[startIndex], maxDy: offsets[rows.length - 1] - offsets[startIndex]
    };
    byId('screen').classList.add('row-dragging');
    rowElement.classList.add('lifted');
    rowElement.style.transform = 'translateY(0px) scale(1.03)';
  }

  function moveRowDrag(clientY) {
    const drag = rowDrag;
    const rawDy = clientY - drag.startClientY;
    const dy = clamp(rawDy, drag.minDy, drag.maxDy);
    drag.rowElement.style.transform = 'translateY(' + dy + 'px) scale(1.03)';
    drag.targetIndex = clamp(Math.round(drag.startIndex + dy / drag.rowHeight), 0, drag.rows.length - 1);
    // Rows between the start slot and the target slot move one row to make room
    for (let index = 0; index < drag.rows.length; index += 1) {
      if (index === drag.startIndex) {
        continue;
      }
      let shift = 0;
      if (drag.startIndex < drag.targetIndex && index > drag.startIndex && index <= drag.targetIndex) {
        shift = -drag.rowHeight;
      }
      if (drag.targetIndex < drag.startIndex && index >= drag.targetIndex && index < drag.startIndex) {
        shift = drag.rowHeight;
      }
      drag.rows[index].style.transform = shift === 0 ? '' : 'translateY(' + shift + 'px)';
    }
  }

  function endRowDrag() {
    const drag = rowDrag;
    const finalDy = (drag.targetIndex - drag.startIndex) * drag.rowHeight;
    drag.rowElement.classList.add('settling');
    drag.rowElement.style.transform = 'translateY(' + finalDy + 'px)';
    if (drag.startIndex !== drag.targetIndex) {
      // The rows on screen are the order's known entries, in order
      const shownIds = [];
      for (const row of drag.rows) {
        shownIds.push(row.dataset.nav);
      }
      const moved = shownIds.splice(drag.startIndex, 1);
      shownIds.splice(drag.targetIndex, 0, moved[0]);
      state.order = shownIds;
      enqueueWrite(saveSidebarOrderTask());
    }
    window.setTimeout(finishRowDrag, 190);
  }

  function finishRowDrag() {
    rowDrag = null;
    byId('screen').classList.remove('row-dragging');
    renderDrawer();
    renderIfWanted();
    reloadIfWanted();
  }

  /* ======================================================================
     Pointer routing: one gesture at a time, decided by the first 8 points of movement
     ====================================================================== */

  let gesture = null;
  let scrollLocked = false;

  function isScrollEnabled() {
    return !scrollLocked;
  }

  function localPoint(event) {
    const rect = byId('screen').getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
  }

  function newGesture(type, event, extra) {
    const point = localPoint(event);
    const base = {
      type: type, pointerId: event.pointerId, startX: point.x, startY: point.y, claimed: false,
      samples: [{ time: event.timeStamp, x: point.x, y: point.y }]
    };
    return Object.assign(base, extra || {});
  }

  function handlePointerDown(event) {
    if (event.pointerType === 'mouse' && event.button !== 0) {
      return;
    }
    if (rowDrag) {
      return;
    }
    const target = event.target;
    // Native controls own their own touches (the iOS pickers)
    if (target.closest('input, select, textarea')) {
      return;
    }
    if (target.closest('#alert-layer') || target.closest('#menu-layer')) {
      return;
    }
    const grab = target.closest('.sheet-grab');
    if (grab) {
      if (target.closest('button')) {
        return;
      }
      const sheet = grab.closest('.sheet');
      stopSpring(sheet.id);
      gesture = newGesture('sheet', event, { element: sheet, startOffset: Number(sheet.dataset.y || 0) });
      return;
    }
    const navRow = target.closest('.nav-row');
    if (navRow) {
      startRowPress(navRow, event);
      gesture = newGesture('drawer', event, { startOffset: currentDrawerX() });
      return;
    }
    if (target.closest('#nav-panel') || target.closest('#nav-scrim')) {
      gesture = newGesture('drawer', event, { startOffset: currentDrawerX() });
      return;
    }
    if (state.drawerOpen || state.sheet || state.addList || state.summary) {
      return;
    }
    const inner = target.closest('[data-swipe]');
    if (inner) {
      const id = inner.dataset.swipe;
      if (state.editing && state.editing.id === id) {
        return;
      }
      stopSpring('row' + id);
      gesture = newGesture('swipe', event, { element: inner, id: id, startOffset: rowOffsetOf(inner) });
    }
  }

  /* Velocity in points per millisecond from the last 100 ms of samples */
  function releaseVelocity(samples, axis) {
    if (samples.length < 2) {
      return 0;
    }
    const last = samples[samples.length - 1];
    let first = samples[0];
    for (const sample of samples) {
      if (last.time - sample.time <= 100) {
        first = sample;
        break;
      }
    }
    const elapsed = last.time - first.time;
    if (elapsed <= 0) {
      return 0;
    }
    return clamp((last[axis] - first[axis]) / elapsed, -6, 6);
  }

  function claimGesture(currentGesture) {
    currentGesture.claimed = true;
    scrollLocked = true;
    cancelRowPress();
    if (currentGesture.type === 'swipe' && state.swipeOpen && state.swipeOpen.id !== currentGesture.id) {
      closeOpenRow();
    }
    if (currentGesture.type === 'drawer') {
      stopSpring('drawer');
    }
  }

  function handlePointerMove(event) {
    if (rowDrag) {
      if (!rowDrag.rowElement.classList.contains('settling')) {
        moveRowDrag(event.clientY);
      }
      event.preventDefault();
      return;
    }
    if (rowPress) {
      const distance = Math.hypot(event.clientX - rowPress.startX, event.clientY - rowPress.startY);
      if (distance > 8) {
        cancelRowPress();
      }
    }
    if (!gesture || event.pointerId !== gesture.pointerId) {
      return;
    }
    const point = localPoint(event);
    const dx = point.x - gesture.startX;
    const dy = point.y - gesture.startY;
    gesture.samples.push({ time: event.timeStamp, x: point.x, y: point.y });
    if (gesture.samples.length > 8) {
      gesture.samples.shift();
    }
    if (!gesture.claimed) {
      const horizontal = Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.1;
      const vertical = Math.abs(dy) > 8 && Math.abs(dy) >= Math.abs(dx);
      if (gesture.type === 'sheet') {
        if (!(horizontal || vertical)) {
          return;
        }
      } else if (vertical) {
        gesture = null;
        return;
      } else if (!horizontal) {
        return;
      }
      claimGesture(gesture);
    }
    if (event.cancelable) {
      event.preventDefault();
    }
    if (gesture.type === 'swipe') {
      dragRowTo(gesture.element, gesture.startOffset + dx);
    } else if (gesture.type === 'drawer') {
      let x = gesture.startOffset + dx;
      if (x > 0) {
        x = rubber(x, 120);
      }
      setDrawerX(Math.max(-drawerWidth(), x));
    } else if (gesture.type === 'sheet') {
      let y = gesture.startOffset + dy;
      if (y < 0) {
        y = -rubber(-y, 300);
      }
      setSheetY(gesture.element, y);
    }
  }

  function clearSuppressClick() {
    suppressNextClick = false;
  }

  function handlePointerUp(event) {
    if (rowDrag) {
      if (!rowDrag.rowElement.classList.contains('settling')) {
        endRowDrag();
      }
      return;
    }
    if (rowPress) {
      const listId = rowPress.listId;
      cancelRowPress();
      if (event.type === 'pointerup' && (!gesture || !gesture.claimed)) {
        gesture = null;
        scrollLocked = false;
        suppressNextClick = true;
        window.setTimeout(clearSuppressClick, 400);
        selectListFromDrawer(listId);
        return;
      }
    }
    if (!gesture || event.pointerId !== gesture.pointerId) {
      return;
    }
    const finished = gesture;
    gesture = null;
    scrollLocked = false;
    if (!finished.claimed) {
      return;
    }
    suppressNextClick = true;
    window.setTimeout(clearSuppressClick, 80);
    const vx = releaseVelocity(finished.samples, 'x');
    const vy = releaseVelocity(finished.samples, 'y');
    if (finished.type === 'swipe') {
      endRowSwipe(finished, vx);
    } else if (finished.type === 'drawer') {
      const projected = currentDrawerX() + vx * 180;
      if (projected < -drawerWidth() / 2) {
        closeDrawer(vx);
      } else {
        openDrawer(vx);
      }
    } else if (finished.type === 'sheet') {
      finishSheetDrag(finished.element, vy);
    }
    renderIfWanted();
  }

  /* A sheet pulled down far enough, or flicked, closes (Details keeps its changes; New List cancels) */
  function finishSheetDrag(element, velocity) {
    const y = Number(element.dataset.y || 0);
    const projected = y + velocity * 180;
    if (projected > sheetHeight(element) * 0.3) {
      sheetDismissVelocity = velocity;
      if (element.id === 'addlist') {
        closeAddList(false);
      } else if (element.id === 'summary') {
        closeSummary();
      } else {
        closeDetails(true);
      }
      return;
    }
    function moveSheetFrame(value) {
      setSheetY(element, value);
    }
    runSpring(element.id, { from: y, to: 0, velocity: velocity, response: 0.42, damping: 0.9, onFrame: moveSheetFrame });
  }

  /* While something is being dragged, stop iOS from scrolling the page under the finger */
  function preventScrollWhileDragging(event) {
    if (rowDrag || (gesture && gesture.claimed)) {
      event.preventDefault();
    }
  }

  function handleContextMenu(event) {
    if (event.target.closest('input, textarea')) {
      return;
    }
    event.preventDefault();
  }

  /* ======================================================================
     Taps
     ====================================================================== */

  function handleOverlayClick(target, element, action) {
    if (target.closest('#alert-layer')) {
      if (action === 'alert-ok') {
        showNextAlert();
      }
      return true;
    }
    if (target.closest('#menu-layer')) {
      if (action === 'bring-in') {
        chooseBringInFile();
      } else {
        closeMenu();
      }
      return true;
    }
    if (target.closest('#summary')) {
      if (action === 'summary-done') {
        closeSummary();
      }
      return true;
    }
    if (target.closest('#addlist')) {
      if (action) {
        handleAddListAction(action, element);
      }
      return true;
    }
    if (target.closest('#sheet')) {
      if (action) {
        handleSheetAction(action, element);
      }
      return true;
    }
    return target.id === 'scrim';
  }

  function handleScreenClick(event) {
    if (suppressNextClick) {
      suppressNextClick = false;
      event.preventDefault();
      return;
    }
    const target = event.target;
    const element = target.closest('[data-action]');
    const action = element ? element.dataset.action : null;
    if (handleOverlayClick(target, element, action)) {
      return;
    }
    if (target.closest('#nav-scrim')) {
      closeDrawer(0);
      return;
    }
    if (target.closest('#nav-panel')) {
      if (action === 'add-list') {
        openAddList();
      } else if (action === 'drawer-menu') {
        openMenu(element);
      }
      return;
    }
    const check = target.closest('[data-check]');
    if (check) {
      toggleDone(check.dataset.check, check.dataset.at);
      return;
    }
    // Any tap closes a row that was swiped open, unless it is one of its buttons
    if (state.swipeOpen && action !== 'swipe-delete' && action !== 'swipe-details') {
      closeOpenRow();
      return;
    }
    if (!element) {
      if (state.editing && !target.closest('#kbd')) {
        finishEditing();
      }
      return;
    }
    const id = element.dataset.id || null;
    if (action === 'toggle-done') {
      toggleDone(id, element.dataset.at);
    } else if (action === 'edit-row') {
      if (target.closest('#edit-input')) {
        return;
      }
      startEditing(id);
    } else if (action === 'info' || action === 'open-details') {
      openDetails(id, 'main', false);
    } else if (action === 'new-reminder') {
      startNewReminder();
    } else if (action === 'tail-tap') {
      if (state.editing) {
        finishEditing();
      } else {
        startNewReminder();
      }
    } else if (action === 'done-editing') {
      finishEditing();
    } else if (action === 'swipe-delete') {
      deleteWithAnimation(id);
    } else if (action === 'swipe-details') {
      state.swipeOpen = null;
      openDetails(id, 'main', false);
    } else if (action === 'open-drawer') {
      openDrawer(0);
    } else if (action === 'menu') {
      openMenu(element);
    } else if (action === 'bring-in') {
      chooseBringInFile();
    } else if (action === 'page') {
      goToScope(Number(element.dataset.page));
    } else if (action === 'back-today') {
      goToScope(0);
    } else if (action === 'go-pastdue') {
      switchView('pastDue');
    } else if (action === 'show-more') {
      state.completedShown += COMPLETED_PAGE_SIZE;
      renderAll();
    }
  }

  /* ======================================================================
     The real viewport, the clock, coming back to the page
     ====================================================================== */

  function syncVisualViewport() {
    const screen = byId('screen');
    const viewport = window.visualViewport;
    const height = viewport ? viewport.height : window.innerHeight;
    const top = viewport ? viewport.offsetTop : 0;
    // The app follows the visible area, so the toolbar sits just above the iOS keyboard
    screen.style.height = height + 'px';
    screen.style.top = top + 'px';
    if (scroller) {
      scroller.refresh();
    }
    if (state.editing) {
      window.setTimeout(revealEditingRow, 30);
    }
    if (!state.drawerOpen) {
      setDrawerX(-drawerWidth());
    }
  }

  // Past due moves happen on the minute, so the page redraws every minute
  function scheduleMinuteTick() {
    const msToNextMinute = 60000 - (Date.now() % 60000) + 500;
    window.setTimeout(handleMinuteTick, msToNextMinute);
  }

  function handleMinuteTick() {
    scheduleMinuteTick();
    if (!state.loaded) {
      return;
    }
    if (isBusyForRender() || state.sheet) {
      state.renderWanted = true;
      return;
    }
    renderAll();
  }

  // The shell may have changed records (Done, Snooze) while the page was hidden
  function handleVisibilityChange() {
    if (document.visibilityState === 'hidden') {
      if (state.editing) {
        finishEditing();
      }
      return;
    }
    deviceZone = currentDeviceZone();
    requestReload();
  }

  function handlePageShow(event) {
    if (event.persisted) {
      deviceZone = currentDeviceZone();
      requestReload();
    }
  }

  async function firstLoad() {
    try {
      applyStoreRecords(await readStoreRecords());
    } catch (error) {
      state.loaded = true;
      showAlert('Couldn’t Open Your Reminders', messageOf(error));
    }
    renderAll();
  }

  function start() {
    scroller = createPullScroller(byId('viewport'), byId('content'), {
      enabled: isScrollEnabled,
      canPullUp: canPullToNextScope,
      canPullDown: canPullToPreviousScope,
      onPullUp: pullToNextScope,
      onPullDown: pullToPreviousScope,
      onScroll: handleContentScroll,
      onPullProgress: showPullProgress
    });
    const screen = byId('screen');
    screen.addEventListener('click', handleScreenClick);
    screen.addEventListener('pointerdown', handlePointerDown);
    window.addEventListener('pointermove', handlePointerMove, { passive: false });
    window.addEventListener('pointerup', handlePointerUp);
    window.addEventListener('pointercancel', handlePointerUp);
    document.addEventListener('touchmove', preventScrollWhileDragging, { passive: false });
    screen.addEventListener('contextmenu', handleContextMenu);
    screen.addEventListener('change', handleNativeChange);
    screen.addEventListener('click', handleNativeClick);
    screen.addEventListener('input', handleEditInput);
    screen.addEventListener('input', handleSheetInput);
    screen.addEventListener('input', handleAddListInput);
    screen.addEventListener('keydown', handleEditKeydown);
    window.addEventListener('resize', syncVisualViewport);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncVisualViewport);
      window.visualViewport.addEventListener('scroll', syncVisualViewport);
    }
    document.addEventListener('visibilitychange', handleVisibilityChange);
    window.addEventListener('pageshow', handlePageShow);
    syncVisualViewport();
    renderAll();
    setDrawerX(-drawerWidth());
    scheduleMinuteTick();
    firstLoad();
  }

  start();
})();
</script>
</body>
</html>
