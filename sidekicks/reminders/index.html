<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Reminders</title>
<style>
/* ---------- Tokens: Apple system colours, light ---------- */
:root {
  color-scheme: light;
  --bg: #FFFFFF;
  --grouped: #F2F2F7;
  --cell: #FFFFFF;
  --sheet-bg: #F2F2F7;
  --sheet-cell: #FFFFFF;
  --label: #000000;
  --label2: rgba(60, 60, 67, 0.6);
  --label3: rgba(60, 60, 67, 0.3);
  --sep: rgba(60, 60, 67, 0.29);
  --fill: rgba(120, 120, 128, 0.12);
  --fill2: rgba(120, 120, 128, 0.2);
  --red: #FF3B30;
  --orange: #FF9500;
  --yellow: #FFCC00;
  --green: #34C759;
  --mint: #00C7BE;
  --cyan: #32ADE6;
  --blue: #007AFF;
  --indigo: #5856D6;
  --purple: #AF52DE;
  --pink: #FF2D55;
  --brown: #A2845E;
  --gray: #8E8E93;
  --ink: #4A4A4F;
  --glass: rgba(255, 255, 255, 0.74);
  --glass-edge: rgba(0, 0, 0, 0.08);
  --scrim: rgba(0, 0, 0, 0.3);
  --toast: rgba(40, 40, 42, 0.92);
  --menu: rgba(248, 248, 248, 0.94);
  --alert: rgba(242, 242, 242, 0.92);
  --red-tint: rgba(255, 59, 48, 0.12);
  --pill-bg: #FFFFFF;
  --shadow: rgba(0, 0, 0, 0.16);
  --swatch-ring: rgba(120, 120, 128, 0.45);
  --icon-glyph: #5B5B60;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
}
/* ---------- Dark, following the system ---------- */
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #000000;
    --grouped: #000000;
    --cell: #1C1C1E;
    --sheet-bg: #1C1C1E;
    --sheet-cell: #2C2C2E;
    --label: #FFFFFF;
    --label2: rgba(235, 235, 245, 0.6);
    --label3: rgba(235, 235, 245, 0.3);
    --sep: rgba(84, 84, 88, 0.65);
    --fill: rgba(120, 120, 128, 0.24);
    --fill2: rgba(120, 120, 128, 0.36);
    --red: #FF453A;
    --orange: #FF9F0A;
    --yellow: #FFD60A;
    --green: #30D158;
    --mint: #63E6E2;
    --cyan: #64D2FF;
    --blue: #0A84FF;
    --indigo: #5E5CE6;
    --purple: #BF5AF2;
    --pink: #FF375F;
    --brown: #AC8E68;
    --gray: #8E8E93;
    --ink: #7C7C80;
    --glass: rgba(44, 44, 46, 0.74);
    --glass-edge: rgba(255, 255, 255, 0.1);
    --scrim: rgba(0, 0, 0, 0.5);
    --toast: rgba(70, 70, 74, 0.95);
    --menu: rgba(44, 44, 46, 0.94);
    --alert: rgba(44, 44, 46, 0.94);
    --red-tint: rgba(255, 69, 58, 0.2);
    --pill-bg: #2C2C2E;
    --shadow: rgba(0, 0, 0, 0.6);
    --swatch-ring: rgba(200, 200, 210, 0.5);
    --icon-glyph: #D1D1D6;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
body {
  color: var(--label);
  font-family: -apple-system, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ---------- The screen: the real viewport, safe areas included ---------- */
.screen {
  --top-inset: max(env(safe-area-inset-top), 6px);
  --bottom-inset: env(safe-area-inset-bottom);
  --kb-h: 0px;
  position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--label);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.screen.kb-open { --bottom-inset: 0px; }
.ic { display: block; flex: none; }

/* ---------- App frame ---------- */
.app { position: absolute; top: var(--top-inset); left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
.screen.kb-open .app { bottom: var(--kb-h); }
.navbar { position: relative; flex: none; height: 52px; display: flex; justify-content: space-between; align-items: center; padding: 0 14px; z-index: 30; background: var(--bg); }
.navbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 0.5px; background: var(--sep); opacity: 0; transition: opacity 0.2s; }
.navbar.scrolled::after { opacity: 1; }
.glass-btn {
  height: 44px; min-width: 44px; border-radius: 22px; border: 0; background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  box-shadow: 0 0 0 0.5px var(--glass-edge), 0 6px 18px rgba(0, 0, 0, 0.08);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 11px;
  color: var(--label); cursor: pointer; font-size: 17px; font-weight: 600; position: relative; z-index: 1;
}
.glass-btn.tinted { background: var(--c, var(--blue)); color: #fff; }
.glass-btn:active { transform: scale(0.94); }
.nav-title {
  position: absolute; left: 70px; right: 70px; text-align: center; font-size: 17px; font-weight: 600; opacity: 0;
  transform: translateY(4px); transition: opacity 0.18s, transform 0.18s; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nav-title.shown { opacity: 1; transform: none; }
.app-body { position: relative; flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.view-wrap { position: relative; flex: 1; overflow: hidden; }
.viewport { position: absolute; inset: 0; overflow: hidden; touch-action: none; overscroll-behavior: contain; }
.content { position: relative; min-height: 100%; display: flex; flex-direction: column; will-change: transform; padding-bottom: 8px; }
.page-dots { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 0; z-index: 13; }
.page-dot { width: 22px; height: 30px; padding: 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.page-dot span { display: block; width: 7px; height: 7px; border-radius: 4px; background: var(--label3); transition: height 0.3s var(--ease), background 0.3s; }
.page-dot.active span { height: 18px; background: var(--blue); }

/* Title block and the red Past Due pill under Today */
.pd-pill {
  display: inline-flex; align-items: center; gap: 6px; margin: 2px 20px 8px; padding: 0 12px 0 10px; height: 32px; border-radius: 16px;
  background: var(--red-tint); color: var(--red); font-size: 15px; font-weight: 600; border: 0; cursor: pointer; align-self: flex-start;
}
.pd-pill:active { opacity: 0.7; }
.section-head { font-size: 20px; line-height: 25px; font-weight: 700; padding: 18px 20px 2px; color: var(--hc, var(--label)); }
.empty-note { padding: 14px 20px; color: var(--label2); font-size: 15px; }
.empty-big { text-align: center; color: var(--label2); font-size: 17px; padding: 80px 30px; }
.tail { flex: 1; min-height: 160px; }
.more-btn { align-self: center; margin: 16px 0 8px; }

/* First open: nothing yet */
.empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 70px 32px 30px; }
.empty-badge { width: 72px; height: 72px; border-radius: 50%; background: var(--fill); color: var(--blue); display: flex; align-items: center; justify-content: center; }
.empty-badge svg { width: 38px; height: 38px; }
.empty-title { font-size: 22px; line-height: 28px; font-weight: 700; }
.empty-text { font-size: 15px; line-height: 20px; color: var(--label2); max-width: 300px; }
.import-btn { margin-top: 8px; height: 50px; padding: 0 22px; border: 0; border-radius: 25px; background: var(--blue); color: #fff; font-size: 17px; font-weight: 600; cursor: pointer; }
.import-btn:active { opacity: 0.75; }

/* ---------- The reminder row ---------- */
.row { position: relative; overflow: hidden; }
.row.leaving { transition: height 0.3s var(--ease), opacity 0.22s ease; opacity: 0; }
.row-actions { position: absolute; top: 0; bottom: 1px; display: flex; visibility: hidden; }
.row.revealed .row-actions { visibility: visible; }
.row-actions.right { right: 0; }
.row-actions.left { left: 0; }
.row-actions button { width: 76px; border: 0; color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; padding: 0; }
.btn-details { background: #8E8E93; }
.btn-delete { background: var(--red); }
.row-inner { position: relative; display: flex; align-items: flex-start; background: var(--bg); padding-left: 9px; touch-action: pan-y; will-change: transform; }
.circle-hit { flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.circle { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--c); transition: background 0.15s ease, box-shadow 0.15s ease; }
.circle.filled { background: var(--c); box-shadow: inset 0 0 0 2.5px var(--bg); animation: ringFill 0.22s ease-out; }
@keyframes ringFill { from { transform: scale(0.85); } to { transform: scale(1); } }
.row-body { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 8px; padding: 11px 16px 11px 1px; border-bottom: 0.5px solid var(--sep); min-height: 44px; cursor: default; }
.row-text { flex: 1; min-width: 0; }
.row-title { font-size: 17px; line-height: 22px; word-wrap: break-word; min-height: 22px; }
.row-notes { font-size: 15px; line-height: 20px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-date { font-size: 15px; line-height: 20px; color: var(--label2); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.row-date .late, .row-date.late { color: var(--red); }
.row-date .ic { margin: 0 1px 0 2px; }
.row.pending .row-title { color: var(--label2); transition: color 0.4s ease 0.3s; }
.row.is-done .row-title { color: var(--label2); }
.row-input {
  font: inherit; font-size: 17px; line-height: 22px; border: 0; outline: 0; padding: 0; margin: 0; background: transparent;
  color: var(--label); width: 100%; caret-color: var(--c); -webkit-user-select: text; user-select: text;
}
.info-btn { flex: none; width: 44px; height: 44px; margin: -11px -12px -11px -8px; border: 0; background: transparent; padding: 9px; color: var(--c); cursor: pointer; }
.pastdue-view .row-date { color: var(--red); }

/* Bottom bar with "+ New Reminder" */
.bottom-bar { position: relative; flex: none; height: calc(52px + var(--bottom-inset)); padding: 4px 14px var(--bottom-inset) 20px; display: flex; align-items: flex-start; justify-content: space-between; background: var(--bg); z-index: 20; }
.new-btn { border: 0; background: transparent; padding: 0; height: 44px; display: flex; align-items: center; gap: 8px; color: var(--c); font-size: 17px; font-weight: 600; cursor: pointer; }
.new-btn:active { opacity: 0.6; }
.screen.kb-open .bottom-bar { display: none; }

/* ---------- The quick toolbar, sitting on the real keyboard ---------- */
.kbd { position: absolute; left: 0; right: 0; bottom: 0; height: var(--kb-h); z-index: 60; display: none; flex-direction: column; }
.screen.kb-open .kbd { display: flex; }
.accessory { height: 56px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px; }
.acc-btn {
  position: relative; flex: 1 1 0; min-width: 0; height: 44px; border-radius: 22px; border: 0; cursor: pointer;
  background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  box-shadow: 0 0 0 0.5px var(--glass-edge), 0 4px 14px rgba(0, 0, 0, 0.1);
  display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 8px; color: var(--label);
  font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden;
}
.acc-btn span { overflow: hidden; text-overflow: ellipsis; }
.acc-btn.set { color: var(--c); }
/* The native control lies invisibly over the button, so a tap opens the real iOS picker */
.acc-native { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; margin: 0; padding: 0; cursor: pointer; font-size: 16px; -webkit-appearance: none; appearance: none; }

/* ---------- Sheets ---------- */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 70; opacity: 0; pointer-events: none; }
.scrim.on { pointer-events: auto; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; top: calc(var(--top-inset) + 8px); z-index: 71; background: var(--sheet-bg);
  border-radius: 38px 38px 0 0; transform: translateY(110%); display: flex; flex-direction: column; overflow: hidden; will-change: transform;
  visibility: hidden;
}
.sheet.addlist { z-index: 73; }
.sheet.summary { z-index: 74; }
.sheet-grab { flex: none; touch-action: none; cursor: grab; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label3); margin: 7px auto 0; }
.sheet-head { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: relative; }
.sheet-title-text { position: absolute; left: 80px; right: 80px; text-align: center; font-size: 17px; font-weight: 600; pointer-events: none; }
.glass-btn.confirm { background: var(--blue); color: #fff; }
.glass-btn.confirm:disabled { background: var(--fill2); color: var(--label3); }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 16px calc(40px + env(safe-area-inset-bottom)); }
.group { background: var(--sheet-cell); border-radius: 26px; margin-bottom: 20px; overflow: hidden; }
.group-foot { font-size: 13px; color: var(--label2); padding: 0 16px; margin: -12px 0 20px; line-height: 1.35; }
.cell { position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 16px; }
.cell + .cell::before { content: ""; position: absolute; top: 0; right: 0; left: 58px; border-top: 0.5px solid var(--sep); }
.cell.plain + .cell::before, .cell + .cell.plain::before { left: 16px; }
.cell-icon { width: 30px; height: 30px; border-radius: 8px; color: #fff; flex: none; display: flex; align-items: center; justify-content: center; }
.cell-main { flex: 1; min-width: 0; }
.cell-label { font-size: 17px; line-height: 22px; }
.cell-sub { font-size: 15px; line-height: 19px; color: var(--blue); }
.cell-value { font-size: 17px; color: var(--label2); font-variant-numeric: tabular-nums; }
.text-cell { cursor: text; }
.sheet-input, .sheet-notes { width: 100%; border: 0; outline: 0; background: transparent; color: var(--label); font: inherit; font-size: 17px; line-height: 22px; padding: 0; resize: none; -webkit-user-select: text; user-select: text; }
.sheet-notes { min-height: 66px; }
.sheet-input::placeholder, .sheet-notes::placeholder { color: var(--label3); }
.switch { flex: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill2); position: relative; transition: background 0.25s var(--ease); cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16); transition: transform 0.3s cubic-bezier(0.3, 1.3, 0.5, 1); }
.switch.on { background: var(--green); }
.switch.on::after { transform: translateX(20px); }
/* Native date, time and select controls styled like Apple's compact pills */
.pill-input {
  border: 0; border-radius: 9px; background: var(--fill); color: var(--blue); font-size: 17px; height: 36px; padding: 0 10px;
  -webkit-appearance: none; appearance: none; min-width: 0; max-width: 100%; cursor: pointer;
  -webkit-user-select: text; user-select: text;
}
.pill-input::-webkit-date-and-time-value { text-align: left; }
.cell-select {
  border: 0; background: transparent; color: var(--label2); font-size: 17px; text-align: right; text-align-last: right;
  -webkit-appearance: none; appearance: none; padding: 0 22px 0 0; max-width: 60%; cursor: pointer; direction: ltr;
  background-image: linear-gradient(45deg, transparent 50%, var(--label3) 50%), linear-gradient(135deg, var(--label3) 50%, transparent 50%);
  background-position: calc(100% - 9px) 50%, calc(100% - 4px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  height: 40px;
}
.wd-row { display: flex; justify-content: space-between; padding: 10px 14px; }
.wd { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--fill); color: var(--label); font-size: 15px; font-weight: 600; cursor: pointer; padding: 0; }
.wd.sel { background: var(--blue); color: #fff; }

/* ---------- Sidebar: slide-over drawer (locked A) ---------- */
.nav-scrim { position: absolute; inset: 0; z-index: 40; background: rgba(0, 0, 0, 0.3); opacity: 0; pointer-events: none; }
.nav-scrim.on { pointer-events: auto; }
.nav-panel {
  position: absolute; top: 0; bottom: 0; left: 0; width: 82%; max-width: 360px; z-index: 41; background: var(--bg); padding-top: var(--top-inset);
  display: flex; flex-direction: column; transform: translateX(-102%); will-change: transform; box-shadow: 0.5px 0 0 var(--sep), 10px 0 30px rgba(0, 0, 0, 0.18);
  visibility: hidden; touch-action: pan-y;
}
.nav-head { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 8px 14px 10px 20px; }
.nav-title-big { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.37px; }
.nav-scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.nav-rows { position: relative; }
.nav-row { position: relative; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px 0 20px; background: var(--row-bg, var(--bg)); touch-action: pan-y; cursor: pointer; }
.nav-row::after { content: ""; position: absolute; left: 62px; right: 0; bottom: 0; height: 0.5px; background: var(--sep); }
.nav-row:last-child::after, .nav-row.lifted::after { display: none; }
.nav-row.selected { --row-bg: var(--fill); }
.nav-row.pressing:not(.holding) { background: var(--fill); }
/* Hold progress: a faint fill sweeps across the row while the finger is held; the row lifts when it completes */
.nav-row.holding::before { content: ""; position: absolute; inset: 0; background: var(--fill2); transform-origin: left center; transform: scaleX(0); animation: holdSweep var(--hold-ms, 900ms) linear forwards; pointer-events: none; }
.nav-row.holding .nav-icon { transition: transform var(--hold-ms, 900ms) linear; transform: scale(0.9); }
@keyframes holdSweep { to { transform: scaleX(1); } }
.nav-row > * { position: relative; }
.nav-icon { flex: none; width: 30px; height: 30px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; }
.nav-icon svg { width: 17px; height: 17px; }
.nav-name { flex: 1; min-width: 0; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-count { font-size: 17px; color: var(--label2); font-variant-numeric: tabular-nums; }
.nav-alert { color: var(--red); font-weight: 700; }
.nav-row.lifted { z-index: 5; background: var(--cell); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22); border-radius: 10px; }
.row-dragging .nav-row { transition: transform 0.2s var(--ease); }
.row-dragging .nav-row.lifted { transition: none; }
.row-dragging .nav-row.lifted.settling { transition: transform 0.18s var(--ease); }
.nav-hint { font-size: 13px; line-height: 18px; color: var(--label2); padding: 10px 20px 0; }
.nav-footer { flex: none; display: flex; justify-content: flex-end; padding: 6px 20px calc(10px + var(--bottom-inset)); }
.add-list-btn { border: 0; background: none; color: var(--blue); font-size: 17px; padding: 0 4px; height: 44px; cursor: pointer; }

/* ---------- Add List sheet ---------- */
.nl-top { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 22px 16px 16px; }
.nl-badge { width: 98px; height: 98px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16); }
.nl-badge svg { width: 54px; height: 54px; }
.nl-name { width: 100%; height: 56px; border: 0; border-radius: 12px; background: var(--fill); text-align: center; font-size: 22px; font-weight: 700; padding: 0 16px; outline: none; -webkit-user-select: text; user-select: text; }
.nl-name::placeholder { color: var(--label3); }
.swatch-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px 0; justify-items: center; padding: 16px 8px; }
.swatch { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.swatch.icon-swatch { background: var(--fill2); color: var(--icon-glyph); }
.swatch.icon-swatch svg { width: 22px; height: 22px; }
.swatch.selected::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid var(--swatch-ring); }

/* ---------- Pop-up menu (the ••• buttons) ---------- */
.menu-layer { position: absolute; inset: 0; z-index: 80; display: none; }
.menu-layer.open { display: block; }
.pop-menu {
  position: absolute; min-width: 250px; background: var(--menu); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px);
  border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22); transform-origin: top right; animation: menuIn 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}
@keyframes menuIn { from { opacity: 0; transform: scale(0.7); } }
.pop-menu button { display: flex; justify-content: space-between; align-items: center; gap: 16px; width: 100%; height: 46px; padding: 0 16px; border: 0; background: none; color: var(--label); font-size: 17px; border-top: 0.5px solid var(--sep); cursor: pointer; text-align: left; }
.pop-menu button:first-child { border-top: 0; }
.pop-menu button:active { background: var(--fill2); }

/* ---------- Alerts and progress (Apple style) ---------- */
.alert-layer { position: absolute; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center; background: var(--scrim); padding: 0 40px; }
.alert-layer.open { display: flex; }
.alert-card { width: 100%; max-width: 290px; border-radius: 16px; background: var(--alert); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); text-align: center; overflow: hidden; animation: alertIn 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.15); }
@keyframes alertIn { from { opacity: 0; transform: scale(1.15); } }
.alert-text { padding: 19px 16px 18px; }
.alert-title { font-size: 17px; line-height: 22px; font-weight: 600; }
.alert-message { margin-top: 3px; font-size: 13px; line-height: 17px; word-wrap: break-word; }
.alert-btn { display: block; width: 100%; height: 44px; border: 0; border-top: 0.5px solid var(--sep); background: none; color: var(--blue); font-size: 17px; font-weight: 600; cursor: pointer; }
.alert-btn:active { background: var(--fill2); }
.progress-track { margin: 14px 4px 2px; height: 4px; border-radius: 2px; background: var(--fill2); overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: var(--blue); border-radius: 2px; transition: width 0.15s linear; }

/* The file picker for Import: present (iOS opens it only then) but never seen */
.file-picker { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* Toast */
.toast { position: absolute; left: 50%; bottom: calc(var(--bottom-inset) + 70px); transform: translate(-50%, 10px); z-index: 85; background: var(--toast); color: #fff; padding: 10px 18px; border-radius: 22px; font-size: 15px; opacity: 0; transition: opacity 0.25s, transform 0.25s var(--ease); pointer-events: none; max-width: 340px; text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.screen.kb-open .toast { bottom: calc(var(--kb-h) + 12px); }

@media (prefers-reduced-motion: reduce) {
  .row-enter, .title-enter, .pull-hint .pull-ring, .snap-pulse { animation: none !important; }
}

/* ---------- Today, This Week, This Month ---------- */
.title-block { padding: 2px 20px 8px; }
.large-title { margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.37px; color: var(--blue); }
.title-sub { font-size: 15px; line-height: 20px; color: var(--label2); margin-top: 1px; }
.title-enter { animation: titleEnter 0.38s cubic-bezier(0.2, 0.9, 0.3, 1) both; }
@keyframes titleEnter {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}
.row-enter { animation: rowEnter 0.44s cubic-bezier(0.2, 0.9, 0.3, 1) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes rowEnter {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: none; }
}
/* Bottom pull hint with a progress ring that fills as you pull */
.pull-hint { margin-top: auto; padding: 30px 0 22px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--label2); font-size: 13px; font-weight: 500; }
.pull-ring { display: block; width: 30px; height: 30px; }
.pull-ring .ring-track { stroke: var(--fill2); }
.pull-ring .ring-fill { stroke: var(--blue); transition: stroke-dashoffset 0.05s linear; }
.pull-ring .pull-chev { stroke: var(--label2); transition: stroke 0.15s; }
.pull-hint:not(.pulling) .pull-ring { animation: nudge 2.6s ease-in-out infinite; }
@keyframes nudge {
  0%, 70%, 100% { transform: none; }
  80% { transform: translateY(-5px); }
  90% { transform: translateY(1px); }
}
.pull-hint.armed .pull-text { color: var(--blue); }
.pull-hint.armed .pull-chev { stroke: var(--blue); }
.pull-hint.armed .pull-ring { animation: pop 0.26s ease-out; }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.22); } 100% { transform: scale(1); } }
.peek-below, .peek-above { position: absolute; left: 0; right: 0; text-align: center; padding: 16px 20px; color: var(--label2); font-size: 13px; }
.peek-below { top: 100%; }
.peek-above { bottom: 100%; }
.peek-title { font-size: 20px; font-weight: 700; color: var(--blue); margin-bottom: 2px; }
.peek-above .peek-title { font-size: 15px; font-weight: 600; color: var(--label2); }
.peek-above.armed .peek-title { color: var(--blue); }
.end-note { margin-top: auto; padding: 30px 20px 26px; text-align: center; color: var(--label2); font-size: 13px; line-height: 18px; }
.link-btn { margin-top: 8px; border: 0; background: var(--fill); color: var(--blue); font-size: 15px; font-weight: 600; padding: 7px 14px; border-radius: 16px; cursor: pointer; }
.snap-pulse { animation: snapPulse 0.32s cubic-bezier(0.3, 1.6, 0.5, 1); }
@keyframes snapPulse { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
.day-header { display: flex; align-items: baseline; gap: 8px; padding: 20px 20px 2px; }
.day-name { font-size: 20px; line-height: 25px; font-weight: 700; }
.day-date { font-size: 15px; color: var(--label2); }
.empty-day { margin-left: 52px; height: 40px; border-bottom: 0.5px solid var(--sep); }
.dots-label {
  position: absolute; right: 30px; top: 50%; transform: translate(8px, -50%); padding: 5px 10px; border-radius: 12px;
  background: var(--pill-bg); box-shadow: 0 2px 10px var(--shadow); color: var(--blue); font-size: 13px; font-weight: 600;
  white-space: nowrap; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; z-index: 13;
}
.dots-label.shown { opacity: 1; transform: translate(0, -50%); }
.ghost-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 6; background: var(--bg); }
.ghost-layer > .content { position: absolute; left: 0; right: 0; top: 0; }
.ghost-drop { animation: ghostDrop 0.32s ease-in forwards; }
@keyframes ghostDrop { to { opacity: 0; transform: translateY(48px); } }

/* This Month (C): dense agenda, one card per week */
.wk-card { margin: 12px 12px 0; padding: 10px 0 2px; border-radius: 14px; background: var(--fill); }
.wk-head { display: flex; align-items: baseline; gap: 8px; padding: 0 14px 6px; }
.wk-name { font-size: 17px; font-weight: 700; color: var(--blue); }
.wk-range { flex: 1; font-size: 13px; color: var(--label2); }
.wk-count { min-width: 22px; padding: 1px 7px; border-radius: 10px; background: var(--bg); text-align: center; font-size: 12px; font-weight: 700; color: var(--label2); font-variant-numeric: tabular-nums; }
.wk-strip { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 8px 8px; }
.strip-day { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 10px; color: var(--label2); }
.strip-day b { font-weight: 600; }
.strip-num { font-size: 13px; color: var(--label); font-variant-numeric: tabular-nums; }
.strip-day.past .strip-num, .strip-day.out .strip-num { color: var(--label3); }
.strip-day.today .strip-num { color: var(--blue); font-weight: 700; }
.strip-dots { display: flex; gap: 2px; height: 5px; }
.strip-dots i { display: block; width: 5px; height: 5px; border-radius: 50%; }
.crow { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 5px 14px 5px 12px; border-top: 0.5px solid var(--sep); --row-color: var(--blue); cursor: pointer; }
.crow .check { width: 22px; height: 22px; margin: 0; padding: 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.crow .ring { position: relative; display: block; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--row-color); }
.crow.pending .ring::after { content: ""; position: absolute; inset: 2.5px; border-radius: 50%; background: var(--row-color); }
.crow.pending .crow-title { color: var(--label2); }
.crow-day { flex: none; width: 44px; font-size: 12px; font-weight: 600; color: var(--label2); font-variant-numeric: tabular-nums; }
.crow-title { flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crow-repeat { flex: none; color: var(--label2); display: flex; }
.crow-time { flex: none; font-size: 13px; color: var(--label2); font-variant-numeric: tabular-nums; }
.crow-time.overdue { color: var(--red); }
.crow-empty { padding: 9px 14px; border-top: 0.5px solid var(--sep); font-size: 13px; color: var(--label2); }
</style>

<script>
// Midas local store for Sidekicks. Paste this into the Sidekick bundle's inline script (its
// hash goes into the deploy like any other script). It talks to the Midas shell on the phone
// through plain fetch to the Sidekick's own origin: no bridge, works without a connection.
//
//   await store.set('reminder:42', { at: new Date(2026, 9, 9, 9, 0).toISOString(),
//                                    title: 'Call mom', repeat: { every: 'week' },
//                                    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone });
//   const reminder = await store.get('reminder:42');     // null if absent
//   const all = await store.query('reminder:');          // [{ key, value }], sorted by key
//   await store.delete('reminder:42');
//
// `reminder:` records are read by the shell's notification engine. A bad reminder is rejected
// at write time: the promise rejects with the reason.
var store = (function createMidasStore() {
  var storeURL = window.location.origin + '/_midas/store';

  async function sendToShell(request) {
    var requestOptions = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(request),
    };
    var response = await fetch(storeURL, requestOptions);
    var reply = await response.json();
    if (!reply.ok) {
      throw new Error(reply.error);
    }
    return reply;
  }

  async function setRecord(key, value) {
    await sendToShell({ op: 'set', key: key, value: value });
  }

  async function getRecord(key) {
    var reply = await sendToShell({ op: 'get', key: key });
    return reply.value;
  }

  async function deleteRecord(key) {
    await sendToShell({ op: 'delete', key: key });
  }

  async function queryRecords(prefix) {
    var reply = await sendToShell({ op: 'query', prefix: prefix || '' });
    return reply.records;
  }

  return { set: setRecord, get: getRecord, delete: deleteRecord, query: queryRecords };
})();

// The reminders rules, kept pure: no page, no store, no clock. "Now" and the time zone are always
// passed in, so the same code runs in the page and in the tests (Node's vm).
var RemindersLogic = (function createRemindersLogic() {
  'use strict';

  const DAY_MS = 86400000;
  // An all-day reminder is booked at 09:00 local (the engine needs a moment to notify).
  const ALL_DAY_TIME = '09:00';
  const HISTORY_PER_RECORD = 200;
  // Repeats are searched day by day; this bounds the search (about 110 years).
  const SEARCH_LIMIT_DAYS = 40000;
  const BUILTIN_IDS = ['today', 'scheduled', 'unscheduled', 'all', 'pastDue', 'completed'];
  const REPEAT_OPTION_KEYS = ['never', 'daily', 'weekdays', 'weekends', 'weekly', 'monthly'];
  const UNTITLED = 'Untitled';
  const formatterCache = {};

  /* ---------- Small helpers ---------- */

  function pad2(number) {
    return number < 10 ? '0' + number : String(number);
  }

  function pad4(number) {
    const text = String(number);
    return text.length >= 4 ? text : '0000'.slice(text.length) + text;
  }

  function compareNumbers(first, second) {
    return first - second;
  }

  function deviceTimeZone() {
    const options = Intl.DateTimeFormat().resolvedOptions();
    return options.timeZone || 'UTC';
  }

  // A date given as an ISO string, epoch milliseconds or a Date, in milliseconds (NaN if none)
  function instantMs(value) {
    if (value === null || value === undefined || value === '') {
      return NaN;
    }
    if (typeof value === 'number') {
      return value;
    }
    if (value instanceof Date || (typeof value === 'object' && typeof value.getTime === 'function')) {
      return value.getTime();
    }
    return Date.parse(String(value));
  }

  function isoOrNull(value) {
    const milliseconds = instantMs(value);
    if (Number.isNaN(milliseconds)) {
      return null;
    }
    return new Date(milliseconds).toISOString();
  }

  function copyJson(value) {
    if (value === null || value === undefined) {
      return null;
    }
    return JSON.parse(JSON.stringify(value));
  }

  /* ---------- Time zones ---------- */

  function partsFormatter(timeZone) {
    const cached = formatterCache[timeZone];
    if (cached) {
      return cached;
    }
    const formatter = new Intl.DateTimeFormat('en-US', {
      timeZone: timeZone, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric',
      hour: 'numeric', minute: 'numeric', second: 'numeric'
    });
    formatterCache[timeZone] = formatter;
    return formatter;
  }

  function zonedFields(milliseconds, timeZone) {
    const parts = partsFormatter(timeZone).formatToParts(new Date(milliseconds));
    const fields = {};
    for (const part of parts) {
      if (part.type !== 'literal') {
        fields[part.type] = Number(part.value);
      }
    }
    if (fields.hour === 24) {
      fields.hour = 0;
    }
    return fields;
  }

  // How far the zone's wall clock is ahead of UTC at a moment, in milliseconds
  function zoneOffset(milliseconds, timeZone) {
    const fields = zonedFields(milliseconds, timeZone);
    const asUtc = Date.UTC(fields.year, fields.month - 1, fields.day, fields.hour, fields.minute, fields.second);
    const wholeSeconds = Math.floor(milliseconds / 1000) * 1000;
    return asUtc - wholeSeconds;
  }

  function parseDateText(dateText) {
    const pieces = String(dateText).split('-');
    return { year: Number(pieces[0]), month: Number(pieces[1]), day: Number(pieces[2]) };
  }

  function parseTimeText(timeText) {
    const pieces = String(timeText).split(':');
    return { hour: Number(pieces[0]), minute: Number(pieces[1] || 0) };
  }

  // Wall-clock date and time in a zone, as the instant it names. A time skipped by a
  // daylight-saving jump moves past the jump.
  function wallClockToInstant(dateText, timeText, timeZone) {
    const date = parseDateText(dateText);
    const time = parseTimeText(timeText || ALL_DAY_TIME);
    const zone = timeZone || deviceTimeZone();
    const local = Date.UTC(date.year, date.month - 1, date.day, time.hour, time.minute);
    const firstOffset = zoneOffset(local, zone);
    let candidate = local - firstOffset;
    const secondOffset = zoneOffset(candidate, zone);
    if (secondOffset !== firstOffset) {
      candidate = local - secondOffset;
      const thirdOffset = zoneOffset(candidate, zone);
      if (thirdOffset !== secondOffset) {
        candidate = local - Math.min(firstOffset, secondOffset);
      }
    }
    return new Date(candidate);
  }

  function instantToWallClock(instant, timeZone) {
    const milliseconds = instantMs(instant);
    const fields = zonedFields(milliseconds, timeZone || deviceTimeZone());
    const weekday = new Date(Date.UTC(fields.year, fields.month - 1, fields.day)).getUTCDay();
    return {
      date: fields.year + '-' + pad2(fields.month) + '-' + pad2(fields.day),
      time: pad2(fields.hour) + ':' + pad2(fields.minute),
      weekday: weekday
    };
  }

  function localDateOf(instant, timeZone) {
    return instantToWallClock(instant, timeZone).date;
  }

  /* ---------- Calendar days (YYYY-MM-DD) ---------- */

  function dayNumber(dateText) {
    const date = parseDateText(dateText);
    return Math.round(Date.UTC(date.year, date.month - 1, date.day) / DAY_MS);
  }

  function dateOfDayNumber(number) {
    const date = new Date(number * DAY_MS);
    return date.getUTCFullYear() + '-' + pad2(date.getUTCMonth() + 1) + '-' + pad2(date.getUTCDate());
  }

  function addDays(dateText, days) {
    return dateOfDayNumber(dayNumber(dateText) + days);
  }

  function daysBetween(fromText, toText) {
    return dayNumber(toText) - dayNumber(fromText);
  }

  // 0 = Sunday ... 6 = Saturday (1970-01-01 was a Thursday)
  function weekdayOfDayNumber(number) {
    return (((number + 4) % 7) + 7) % 7;
  }

  function weekdayOf(dateText) {
    return weekdayOfDayNumber(dayNumber(dateText));
  }

  /* Weeks start on Monday, months on the 1st */
  function weekRange(now, timeZone) {
    const today = localDateOf(now, timeZone);
    const sinceMonday = (weekdayOf(today) + 6) % 7;
    const start = addDays(today, -sinceMonday);
    return { start: start, end: addDays(start, 6) };
  }

  function monthRange(now, timeZone) {
    const today = parseDateText(localDateOf(now, timeZone));
    const start = today.year + '-' + pad2(today.month) + '-01';
    const nextMonth = today.month === 12 ? (today.year + 1) + '-01-01' : today.year + '-' + pad2(today.month + 1) + '-01';
    return { start: start, end: addDays(nextMonth, -1) };
  }

  /* 12-hour times everywhere, e.g. 6:00 PM */
  function formatTime12(timeText) {
    const time = parseTimeText(timeText);
    const suffix = time.hour < 12 ? 'AM' : 'PM';
    const shown = time.hour % 12 === 0 ? 12 : time.hour % 12;
    return shown + ':' + pad2(time.minute) + ' ' + suffix;
  }

  /* ---------- Repeats (NOTIFICATIONS.md 4.3) ---------- */

  function presetRepeat(optionKey) {
    if (optionKey === 'daily') {
      return { every: 'day' };
    }
    if (optionKey === 'weekdays') {
      return { every: 'week', weekdays: [1, 2, 3, 4, 5] };
    }
    if (optionKey === 'weekends') {
      return { every: 'week', weekdays: [0, 6] };
    }
    if (optionKey === 'weekly') {
      return { every: 'week' };
    }
    if (optionKey === 'monthly') {
      return { every: 'month' };
    }
    return null;
  }

  function repeatForOption(optionKey) {
    return presetRepeat(optionKey);
  }

  // The repeat as the engine wants it: interval only above 1, weekdays sorted and weekly only
  function cleanRepeat(repeat) {
    if (!repeat || !repeat.every) {
      return null;
    }
    const result = { every: repeat.every };
    const interval = Number(repeat.interval || 1);
    if (interval > 1) {
      result.interval = interval;
    }
    if (repeat.every === 'week' && Array.isArray(repeat.weekdays) && repeat.weekdays.length > 0) {
      const sorted = repeat.weekdays.slice();
      sorted.sort(compareNumbers);
      const unique = [];
      for (const day of sorted) {
        if (unique.indexOf(day) === -1) {
          unique.push(day);
        }
      }
      result.weekdays = unique;
    }
    if (repeat.until !== undefined && repeat.until !== null && repeat.until !== '') {
      result.until = repeat.until;
    }
    return result;
  }

  function optionForRepeat(repeat) {
    const cleaned = cleanRepeat(repeat);
    if (!cleaned) {
      return 'never';
    }
    if (cleaned.until !== undefined) {
      return 'custom';
    }
    const cleanedText = JSON.stringify(cleaned);
    for (const key of REPEAT_OPTION_KEYS) {
      const preset = presetRepeat(key);
      if (preset && JSON.stringify(preset) === cleanedText) {
        return key;
      }
    }
    return 'custom';
  }

  function isRepeating(item) {
    return Boolean(item.date && item.repeat && item.repeat.every);
  }

  function zoneOfItem(item) {
    return item.timeZone || deviceTimeZone();
  }

  function repeatMatchesDay(repeat, startDay, day) {
    if (day < startDay) {
      return false;
    }
    const interval = Number(repeat.interval || 1);
    if (repeat.every === 'day') {
      return (day - startDay) % interval === 0;
    }
    if (repeat.every === 'week') {
      const weekday = weekdayOfDayNumber(day);
      const hasWeekdays = Array.isArray(repeat.weekdays) && repeat.weekdays.length > 0;
      const weekdays = hasWeekdays ? repeat.weekdays : [weekdayOfDayNumber(startDay)];
      if (weekdays.indexOf(weekday) === -1) {
        return false;
      }
      // Weeks run Sunday to Saturday, counted from the week of the first date
      const weekStart = day - weekday;
      const firstWeekStart = startDay - weekdayOfDayNumber(startDay);
      const weeks = Math.round((weekStart - firstWeekStart) / 7);
      return weeks % interval === 0;
    }
    const candidate = new Date(day * DAY_MS);
    const start = new Date(startDay * DAY_MS);
    if (repeat.every === 'month') {
      const months = (candidate.getUTCFullYear() - start.getUTCFullYear()) * 12 + candidate.getUTCMonth() - start.getUTCMonth();
      return candidate.getUTCDate() === start.getUTCDate() && months % interval === 0;
    }
    if (repeat.every === 'year') {
      const years = candidate.getUTCFullYear() - start.getUTCFullYear();
      const sameDay = candidate.getUTCMonth() === start.getUTCMonth() && candidate.getUTCDate() === start.getUTCDate();
      return sameDay && years % interval === 0;
    }
    return false;
  }

  function occurrenceMs(item, day) {
    return wallClockToInstant(dateOfDayNumber(day), item.time, zoneOfItem(item)).getTime();
  }

  function untilMsOf(item) {
    const until = instantMs(item.repeat.until);
    return Number.isNaN(until) ? Infinity : until;
  }

  // The latest occurrence at or before a moment, or null
  function latestOccurrenceAtOrBefore(item, limitMs) {
    const zone = zoneOfItem(item);
    const startDay = dayNumber(item.date);
    const untilMs = untilMsOf(item);
    const lastAllowed = Math.min(limitMs, untilMs);
    if (lastAllowed === -Infinity || Number.isNaN(lastAllowed)) {
      return null;
    }
    const lastDay = dayNumber(localDateOf(lastAllowed, zone));
    for (let day = lastDay; day >= startDay && lastDay - day < SEARCH_LIMIT_DAYS; day -= 1) {
      if (!repeatMatchesDay(item.repeat, startDay, day)) {
        continue;
      }
      const moment = occurrenceMs(item, day);
      if (moment <= lastAllowed) {
        return moment;
      }
    }
    return null;
  }

  // The first occurrence strictly after a moment, or null when the repeat has ended
  function firstOccurrenceAfter(item, afterMs) {
    const zone = zoneOfItem(item);
    const startDay = dayNumber(item.date);
    const untilMs = untilMsOf(item);
    const fromDay = Number.isFinite(afterMs) ? Math.max(startDay, dayNumber(localDateOf(afterMs, zone))) : startDay;
    const lastDay = untilMs === Infinity ? Infinity : dayNumber(localDateOf(untilMs, zone));
    for (let day = fromDay; day <= lastDay && day - fromDay < SEARCH_LIMIT_DAYS; day += 1) {
      if (!repeatMatchesDay(item.repeat, startDay, day)) {
        continue;
      }
      const moment = occurrenceMs(item, day);
      if (moment > afterMs && moment <= untilMs) {
        return moment;

      if (moment > untilMs) {

    return moment;

    } else {

    }

    value.done = item.done === true;

    setOrDelete(value, 'completedAt', item.completedAt);
    setOrDelete(value, 'createdAt', item.createdAt);
    setOrDelete(value, 'source', item.source);
    setOrDelete(value, 'lastDoneAt', item.lastDoneAt);

      value.allDay = !item.time;
      const repeat = isRepeating(item) ? cleanRepeat(item.repeat) : null;

      } else {

      }

      delete value.allDay;
      delete value.repeat;
      delete value.snoozedUntil;
      delete value.doneThrough;
    }

    let notes = '';
    if (typeof record.notes === 'string') {
      notes = record.notes;
    } else if (typeof record.body === 'string') {
      notes = record.body;
    }
    const item = {
      id: idFromKey(key),
      title: typeof record.title === 'string' ? record.title : '',
      notes: notes,
      list: record.list || null,
      date: null,
      time: null,
      repeat: null,
      timeZone: zone,
      done: record.done === true,
      completedAt: record.completedAt || null,
      snoozedUntil: record.snoozedUntil || null,
      lastDoneAt: record.lastDoneAt || null,
      doneThrough: record.doneThrough || null,
      createdAt: record.createdAt || null,
      source: record.source || null

  function itemFromAppleReminder(reminder, listIds, exportZone, fallbackZone) {

    const zone = (due && due.timeZone) || exportZone || fallbackZone || deviceTimeZone();

    const title = typeof reminder.title === 'string' ? reminder.title.trim() : '';
    const item = {
      id: stableId('a', 'apple:' + externalId),
      title: title || UNTITLED,
      notes: appleNotes(reminder),
      list: listIds[reminder.listId] || null,
      date: null,
      time: null,
      repeat: null,
      timeZone: zone,
      done: reminder.completed === true,
      completedAt: reminder.completed === true ? isoOrNull(reminder.completionDate) : null,

    const dueMs = due ? instantMs(due.instant) : NaN;
    if (!Number.isNaN(alertMs) && alertMs !== dueMs) {
      const wallClock = instantToWallClock(alertMs, zone);
      item.date = wallClock.date;
      item.time = wallClock.time;

    let unsupportedReason = null;
    const rules = Array.isArray(reminder.recurrence) ? reminder.recurrence : [];
    if (rules.length > 0) {
      if (!item.date) {
        unsupportedReason = 'repeats without a date';
      } else if (rules.length > 1) {
        unsupportedReason = 'repeats by more than one rule';
      } else {

        }
      }
    }

    return entry && entry.source && entry.source.externalId ? String(entry.source.externalId) : null;
  }

  // Apple's export as lists and items. Lists and reminders already brought in (same Apple id) are skipped.
  function mapAppleExport(exported, existing, timeZone) {

    const existingLists = (existing && existing.lists) || [];

      let match = null;

      if (match) {

      }
      const list = {
        id: stableId('l', 'apple-list:' + externalId), name: name, color: appleList.color || '#007AFF', icon: 'list',
        source: { kind: 'apple-reminders', externalId: externalId }
      };
      listIds[externalId] = list.id;
      newLists.push(list);
    }
    const summary = {
      lists: newLists.length, reminders: 0, active: 0, completed: 0, dated: 0, allDay: 0, repeating: 0,
      unsupportedRepeats: 0, skipped: 0
    };
    const items = [];
    const unsupported = [];

      const externalId = String(reminder.externalId || reminder.id);
      if (knownItemSources[externalId]) {

      }
      knownItemSources[externalId] = true;
      const mapped = itemFromAppleReminder(reminder, listIds, exportZone, timeZone);
      const item = mapped.item;
      items.push(item);
      summary.reminders += 1;
      if (item.done) {

      } else {

  }

    BUILTIN_IDS: BUILTIN_IDS,
    ALL_DAY_TIME: ALL_DAY_TIME,
    formatTime12: formatTime12,
    wallClockToInstant: wallClockToInstant,
    instantToWallClock: instantToWallClock,
    localDateOf: localDateOf,
    instantMs: instantMs,
    addDays: addDays,
    daysBetween: daysBetween,
    weekdayOf: weekdayOf,
    weekRange: weekRange,
    monthRange: monthRange,

    optionForRepeat: optionForRepeat,

  /* ======================================================================

  function byId(id) {

  function escapeHtml(text) {
    const value = String(text === null || text === undefined ? '' : text);

    const withLt = withAmp.replace(/</g, '&lt;');
    const withGt = withLt.replace(/>/g, '&gt;');
    return withGt.replace(/"/g, '&quot;');
  }

  function clamp(value, low, high) {

  function listGlyph(name) {

  // A list colour (a name like "blue" or a hex like "#34C759") as CSS; known hexes follow dark mode
  function colorCss(color) {
    if (!color) {
      return 'var(--gray)';
    }
    const text = String(color);
    for (const colour of LIST_COLOURS) {
      if (colour.name === text || colour.hex.toUpperCase() === text.toUpperCase()) {
        return 'var(--' + colour.name + ')';
      }
    }
    if (BUILTIN_COLOUR_NAMES.indexOf(text) !== -1) {
      return 'var(--' + text + ')';
    }
    if (/^#[0-9a-fA-F]{3,8}$/.test(text)) {
      return text;
    }
    return 'var(--gray)';
  }
  const BUILTIN_COLOUR_NAMES = ['ink', 'label', 'gray', 'blue', 'red'];

  function messageOf(error) {
    if (error && error.message) {
      return String(error.message);
    }
    return String(error || 'Unknown error');
  }

  function newId() {
    const alphabet = '0123456789abcdefghijklmnopqrstuvwxyz';
    const bytes = new Uint8Array(12);
    if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
      window.crypto.getRandomValues(bytes);
    } else {
      for (let index = 0; index < bytes.length; index += 1) {
        bytes[index] = Math.floor(Math.random() * 256);
      }
    }
    let id = '';
    for (const byte of bytes) {
      id += alphabet[byte % alphabet.length];
    }
    return id;
  }

  /* ======================================================================
     Dates and times (the phone's own time zone)
     ====================================================================== */

  let deviceZone = currentDeviceZone();

  function currentDeviceZone() {
    const options = Intl.DateTimeFormat().resolvedOptions();
    return options.timeZone || 'UTC';
  }

  function todayText() {
    return Logic.localDateOf(Date.now(), deviceZone);
  }

  function datePieces(dateText) {
    const pieces = dateText.split('-');
    return { year: Number(pieces[0]), month: Number(pieces[1]), day: Number(pieces[2]), weekday: Logic.weekdayOf(dateText) };
  }

  function formatDayLabel(dateText) {
    const offset = Logic.daysBetween(todayText(), dateText);
    if (offset === 0) {
      return 'Today';
    }
    if (offset === 1) {
      return 'Tomorrow';
    }
    if (offset === -1) {
      return 'Yesterday';
    }
    const date = datePieces(dateText);
    if (offset > 1 && offset < 7) {
      return WEEKDAY_NAMES[date.weekday];
    }
    let label = SHORT_DAYS[date.weekday] + ', ' + SHORT_MONTHS[date.month - 1] + ' ' + date.day;
    if (date.year !== datePieces(todayText()).year) {
      label = label + ', ' + date.year;
    }
    return label;
  }

  function formatLongKey(dateText) {
    const date = datePieces(dateText);
    return WEEKDAY_NAMES[date.weekday] + ', ' + MONTH_NAMES[date.month - 1] + ' ' + date.day + ', ' + date.year;
  }

  function formatLongDate(dateText) {
    const date = datePieces(dateText);
    return WEEKDAY_NAMES[date.weekday] + ', ' + MONTH_NAMES[date.month - 1] + ' ' + date.day;
  }

  function formatDayMonth(dateText) {
    const date = datePieces(dateText);
    return SHORT_DAYS[date.weekday] + ' ' + date.day + ' ' + SHORT_MONTHS[date.month - 1];
  }

  function formatRange(startText, endText) {
    if (endText < startText) {
      return '';
    }
    if (startText === endText) {
      return formatDayMonth(startText);
    }
    const start = datePieces(startText);
    const end = datePieces(endText);
    if (start.month === end.month) {
      return SHORT_DAYS[start.weekday] + ' ' + start.day + ' – ' + formatDayMonth(endText);
    }
    return formatDayMonth(startText) + ' – ' + formatDayMonth(endText);
  }

  function nowWallClock() {
    return Logic.instantToWallClock(Date.now(), deviceZone);
  }

  function nextWholeHour() {
    const hour = (Number(nowWallClock().time.slice(0, 2)) + 1) % 24;
    return (hour < 10 ? '0' + hour : String(hour)) + ':00';
  }

  // The last moment of a day, for "End Repeat on"
  function endOfDayIso(dateText) {
    const lastMinute = Logic.wallClockToInstant(dateText, '23:59', deviceZone).getTime();
    return new Date(lastMinute + 59000).toISOString();
  }

  /* ---------- Repeat wording ---------- */

  function unitWord(every, count) {
    const units = { day: 'day', week: 'week', month: 'month', year: 'year' };
    const unit = units[every] || every;
    return count === 1 ? unit : unit + 's';
  }

  function customRepeatShort(repeat) {
    const interval = repeat.interval || 1;
    return 'Every ' + (interval === 1 ? '' : interval + ' ') + unitWord(repeat.every, interval);
  }

  function repeatLabel(repeat) {
    const key = Logic.optionForRepeat(repeat);
    if (key === 'custom') {
      return customRepeatShort(repeat);
    }
    for (const option of REPEAT_MENU) {
      if (option.key === key) {
        return option.label;
      }
    }
    return 'Never';
  }

  function weekdayListText(weekdays) {
    const names = [];
    for (const day of weekdays) {
      names.push(WEEKDAY_NAMES[day]);
    }
    if (names.length <= 1) {
      return names.join('');
    }
    const last = names.pop();
    return names.join(', ') + ' and ' + last;
  }

  function repeatSentence(repeat, dateText) {
    const interval = repeat.interval || 1;
    const baseDate = dateText || todayText();
    let text = 'Reminder will repeat every ' + (interval === 1 ? '' : interval + ' ') + unitWord(repeat.every, interval);
    if (repeat.every === 'week') {
      const cleaned = Logic.cleanRepeat(repeat);
      const days = cleaned.weekdays ? cleaned.weekdays : [Logic.weekdayOf(baseDate)];
      text = text + ' on ' + weekdayListText(days);
    }
    if (repeat.every === 'month') {
      text = text + ' on day ' + datePieces(baseDate).day;
    }
    if (repeat.every === 'year') {
      const date = datePieces(baseDate);
      text = text + ' on ' + MONTH_NAMES[date.month - 1] + ' ' + date.day;
    }
    if (repeat.until) {
      text = text + ', until ' + formatLongKey(Logic.localDateOf(repeat.until, deviceZone));
    }
    return text + '.';
  }

  function isBuiltin(viewId) {

  function findItem(id) {
    for (const item of state.items) {
      if (item.id === id) {
        return item;
      }
    }
    for (const item of state.history) {
      if (item.id === id) {
        return item;
      }
    }
    return null;
  }

  function listOf(listId) {
    if (!listId) {
      return null;
    }
    return state.lists[listId] || null;

  function ownLists() {
    const lists = [];
    for (const id of state.order) {

      if (list) {

    if (isBuiltin(viewId)) {
