<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Dictation</title>
<style>
/* Dictation Sidekick (TEST, staging only; founder 2026-11-13, docs/briefs/dictation-sidekick-test.md).
   The shell's own palette (docs/DESIGN.md 2.1 and 2.4) and jess's orb (5a). */
:root {
  color-scheme: light;
  --paper: #FFFFFF; --ink: #111111; --ink2: #6B6B6B; --ink3: #BDBDBD;
  --rule: rgba(17, 17, 17, 0.12); --paper2: #F3F2EF;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper: #111111; --ink: #FFFFFF; --ink2: #A3A3A3; --ink3: #5C5C5C;
    --rule: rgba(255, 255, 255, 0.14); --paper2: #1C1C1C;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--paper); color: var(--ink); min-height: 100%;
  font-family: -apple-system, system-ui, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
[hidden] { display: none !important; }
#main { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 24px); }

/* Top row: title, TEST tag, the quiet "?" (docs/DESIGN.md 1a) */
.top-row { position: relative; display: flex; align-items: center; gap: 8px; min-height: 36px; }
.title { font-size: 17px; font-weight: 600; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--ink); }
.help { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: var(--paper2); color: var(--ink2);
  font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.help-catch { position: fixed; inset: 0; z-index: 4; }
.help-menu { position: absolute; right: 0; top: 40px; z-index: 5; min-width: 220px; background: var(--paper); border: 1px solid var(--rule);
  border-radius: 14px; box-shadow: 0 8px 28px rgba(0, 0, 0, .16); overflow: hidden; }
.help-menu button { display: block; width: 100%; padding: 12px 14px; font-size: 15px; text-align: left; }
.help-menu button + button { border-top: 1px solid var(--rule); }

/* The orb and the one action */
.stage { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 8px 0 18px; }
.orb { width: 200px; height: 200px; display: block; }
.primary { min-width: 220px; padding: 15px 28px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 17px; font-weight: 600; }
.primary:disabled { opacity: .5; }
.note { font-size: 15px; color: var(--ink2); }

/* Summary and runs */
.stats { display: flex; border: 1px solid var(--rule); border-radius: 16px; }
.stat { flex: 1; padding: 12px 8px; text-align: center; }
.stat + .stat { border-left: 1px solid var(--rule); }
.stat .n { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--ink2); margin-top: 2px; }
.lab { font-size: 13px; font-weight: 700; color: var(--ink2); padding: 20px 4px 8px; text-transform: uppercase; letter-spacing: .05em; }
.card { border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; }
.run { padding: 12px 14px; }
.run + .run { border-top: 1px solid var(--rule); }
.run .cleaned { font-size: 16px; line-height: 1.3; }
.run .raw { font-size: 14px; color: var(--ink2); margin-top: 3px; line-height: 1.3; }
.run .meta { font-size: 13px; color: var(--ink2); margin-top: 6px; font-variant-numeric: tabular-nums; }
.run .meta b { color: var(--ink); font-weight: 600; }
.empty { padding: 22px 16px; text-align: center; font-size: 17px; font-weight: 600; color: var(--ink2); }
.more { display: block; margin: 12px auto 0; font-size: 15px; font-weight: 600; padding: 9px 18px; border-radius: 999px; background: var(--paper2); }
.nav { display: flex; align-items: center; min-height: 40px; margin-bottom: 4px; }
.back { font-size: 15px; font-weight: 600; padding: 8px 14px; border-radius: 999px; background: var(--paper2); }
.h1 { margin: 6px 0 4px; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
.how .row { padding: 13px 16px; font-size: 16px; line-height: 1.35; }
.run .words { font-size: 13px; color: var(--ink2); margin-top: 2px; }
.path { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; font-size: 15px; font-variant-numeric: tabular-nums; }
.path + .path { border-top: 1px solid var(--rule); }
.path b { font-weight: 600; min-width: 64px; }
.path span { color: var(--ink2); }

/* Settings */
.field { display: block; width: 100%; padding: 11px 13px; border: 1px solid var(--rule); border-radius: 12px; background: var(--paper);
  color: var(--ink); font: inherit; font-size: 16px; line-height: 1.35; resize: vertical; }
textarea.field { min-height: 76px; }
textarea.field.long { min-height: 180px; font-size: 14px; }
.trigger { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.trigger + .trigger { border-top: 1px solid var(--rule); }
.trigger-top { display: flex; gap: 8px; align-items: center; }
.trigger-top .field { flex: 1; }
.chip { font-size: 15px; font-weight: 600; padding: 9px 16px; border-radius: 999px; background: var(--paper2); }
.actions { display: flex; gap: 10px; align-items: center; margin-top: 20px; }
.actions .primary { min-width: 0; flex: 1; }
.message { margin-top: 12px; font-size: 15px; font-weight: 600; text-align: center; color: var(--ink2); }
.how .row + .row { border-top: 1px solid var(--rule); }
.phrase { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.phrase + .phrase { border-top: 1px solid var(--rule); }
.phrase-bottom { display: flex; gap: 8px; align-items: center; }
.phrase-bottom .field { flex: 1; min-width: 0; }
select.field { flex: 0 0 auto; width: auto; -webkit-appearance: none; appearance: none; padding-right: 13px; }
select.field.wide { width: 100%; }
.path.wrong span { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<div id="main"></div>
<script>
// Midas local store for Sidekicks (the same block every Sidekick carries): plain fetch to the
// Sidekick's own origin, answered by the shell on the phone.
var store = (function createMidasStore() {
  var storeURL = window.location.origin + '/_midas/store';

  async function sendToShell(request) {
    var requestOptions = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(request),
    };
    var response = await fetch(storeURL, requestOptions);
    var reply = await response.json();
    if (!reply.ok) {
      throw new Error(reply.error);
    }
    return reply;
  }

  async function setRecord(key, value) {
    await sendToShell({ op: 'set', key: key, value: value });
  }

  async function getRecord(key) {
    var reply = await sendToShell({ op: 'get', key: key });
    return reply.value;
  }

  async function deleteRecord(key) {
    await sendToShell({ op: 'delete', key: key });
  }

  async function queryRecords(prefix) {
    var reply = await sendToShell({ op: 'query', prefix: prefix || '' });
    return reply.records;
  }

  return { set: setRecord, get: getRecord, delete: deleteRecord, query: queryRecords };
})();

/* ======================================================================
   DictationLogic: runs, the summary and the widget. No screen, no store: tools.js carries this
   block character for character, so jess reads the runs exactly as the page shows them.
   ====================================================================== */
var DictationLogic = (function createDictationLogic() {
  'use strict';

  const RUN_PREFIX = 'run:';
  const SUMMARY_KEY = 'summary:main';
  // The native Dictation Test screen; only a Midas Test build carries it out
  const TEST_REQUEST_KIND = 'test.dictation';
  const HOME_SCREEN_REQUEST_KIND = 'home-screen.widget';
  const SOURCES = ['phrase', 'spoken', 'run-all', 'keyboard'];
  const SOURCE_LABELS = { 'phrase': 'Phrase', 'spoken': 'Spoken', 'run-all': 'Run All', 'keyboard': 'Keyboard' };
  const DEFAULT_LIMIT = 10;
  const MAX_LIMIT = 50;
  const WIDGET_KEY = 'widget:summary';
  const WIDGET_NAME = 'Dictation';
  const WIDGET_VERSION = 1;

  function isPlainObject(value) {
    return value !== null && typeof value === 'object' && !Array.isArray(value);
  }

  function isWholeMs(value) {
    return typeof value === 'number' && Number.isInteger(value) && value >= 0;
  }

  function copyJson(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function matchedFrom(value) {
    const words = [];
    for (const word of Array.isArray(value) ? value : []) {
      if (typeof word === 'string') {
        words.push(word);
      }
    }
    return words;
  }

  // A stored run as the page and the tools use it; null for a record that is not a run
  function runFrom(key, value) {
    if (!isPlainObject(value) || !isWholeMs(value.cleanupMs) || typeof value.at !== 'string') {
      return null;
    }
    const source = SOURCES.indexOf(value.source) === -1 ? 'phrase' : value.source;
    return {
      key: key,
      at: value.at,
      source: source,
      raw: typeof value.raw === 'string' ? value.raw : '',
      cleaned: typeof value.cleaned === 'string' ? value.cleaned : '',
      cleanupMs: value.cleanupMs,
      releaseToRawMs: isWholeMs(value.releaseToRawMs) ? value.releaseToRawMs : null,
      totalMs: isWholeMs(value.totalMs) ? value.totalMs : null,
      firstCall: value.firstCall === true,
      modelStatus: typeof value.modelStatus === 'string' ? value.modelStatus : '',
      device: typeof value.device === 'string' ? value.device : '',
      ios: typeof value.ios === 'string' ? value.ios : '',
      // The gate's fields; null (or empty) on runs from before the gate
      path: PATHS.indexOf(value.path) === -1 ? null : value.path,
      trigger: typeof value.trigger === 'string' && value.trigger.length > 0 ? value.trigger : null,
      matched: matchedFrom(value.matched),
      gateMs: typeof value.gateMs === 'number' && value.gateMs >= 0 ? value.gateMs : null,
      // The path a test phrase should take (round 2); null on spoken runs and older runs
      expect: PATHS.indexOf(value.expect) === -1 ? null : value.expect,
      // Round 3: whether the model call used a prewarmed session (null without a model call),
      // and the phone's heat (null on older runs)
      prewarmed: typeof value.prewarmed === 'boolean' ? value.prewarmed : null,
      thermal: THERMAL_STATES.indexOf(value.thermal) === -1 ? null : value.thermal,
      // Round 4: the words the model pointer returned on a light run, and whether they ended right
      // before the cue (null without a pointer)
      pointer: typeof value.pointer === 'string' ? value.pointer : null,
      pointerValid: typeof value.pointerValid === 'boolean' ? value.pointerValid : null,
      // Build 35: the microphone of a keyboard run; null on other and older runs
      mic: RUN_MICS.indexOf(value.mic) === -1 ? null : value.mic
    };
  }

  // Newest first: by time, then by key (two runs in the same millisecond keep their order)
  function compareNewestFirst(first, second) {
    const firstMs = Date.parse(first.at);
    const secondMs = Date.parse(second.at);
    if (firstMs !== secondMs) {
      return secondMs - firstMs;
    }
    return first.key < second.key ? 1 : -1;
  }

  // Every run in the records ([{ key, value }]), newest first
  function runsOf(records) {
    const runs = [];
    for (const record of records || []) {
      if (typeof record.key !== 'string' || record.key.indexOf(RUN_PREFIX) !== 0) {
        continue;
      }
      const run = runFrom(record.key, record.value);
      if (run !== null) {
        runs.push(run);
      }
    }
    runs.sort(compareNewestFirst);
    return runs;
  }

  // Over every run: the count, the newest one's cleanup time, the rounded average and the worst.
  // The shell writes the same numbers into summary:main for the widget (DictationRunSummaryRecord).
  function summaryOf(runs) {
    if (runs.length === 0) {
      return { runs: 0, lastCleanupMs: null, averageCleanupMs: null, worstCleanupMs: null, lastAt: null };
    }
    let total = 0;
    let worst = 0;
    for (const run of runs) {
      total += run.cleanupMs;
      worst = Math.max(worst, run.cleanupMs);
    }
    return {
      runs: runs.length,
      lastCleanupMs: runs[0].cleanupMs,
      averageCleanupMs: Math.round(total / runs.length),
      worstCleanupMs: worst,
      lastAt: runs[0].at
    };
  }

  // A limit asked for, kept within 1 to 50; null means the default
  function limitFrom(value) {
    if (typeof value !== 'number' || !Number.isFinite(value)) {
      return DEFAULT_LIMIT;
    }
    return Math.min(MAX_LIMIT, Math.max(1, Math.round(value)));
  }

  function formatMs(milliseconds) {
    if (milliseconds === null || milliseconds === undefined) {
      return '–';
    }
    const formatter = new Intl.NumberFormat('en-US');
    return formatter.format(milliseconds) + ' ms';
  }

  function sourceLabel(source) {
    return SOURCE_LABELS[source] || SOURCE_LABELS.phrase;
  }

  // One run's timings as a line: cleanup first, then what else was measured
  function timingsLine(run) {
    const parts = ['Cleanup ' + formatMs(run.cleanupMs)];
    if (run.releaseToRawMs !== null) {
      parts.push('Raw ' + formatMs(run.releaseToRawMs));
    }
    if (run.totalMs !== null) {
      parts.push('Total ' + formatMs(run.totalMs));
    }
    parts.push(sourceLabel(run.source));
    if (run.mic !== null) {
      parts.push(RUN_MIC_LABELS[run.mic]);
    }
    if (run.path !== null) {
      parts.push(pathLabel(run));
    }
    if (isWrongPath(run)) {
      parts.push('Expected ' + PATH_LABELS[run.expect]);
    }
    if (run.firstCall) {
      parts.push('First Call');
    }
    if (run.prewarmed === true) {
      parts.push('Prewarmed');
    }
    if (run.thermal !== null) {
      parts.push('Heat ' + THERMAL_LABELS[run.thermal]);
    }
    if (run.pointerValid !== null) {
      parts.push(pointerLabel(run));
    }
    return parts.join(' · ');
  }

  // "Pointer: and Jonas", "Pointer: None", "Pointer Invalid: Jonas" (round 4)
  function pointerLabel(run) {
    const words = run.pointer !== null && run.pointer.trim().length > 0 ? run.pointer.trim() : 'None';
    return (run.pointerValid ? 'Pointer: ' : 'Pointer Invalid: ') + words;
  }

  /* ---------- The gate: paths and settings (docs/briefs/dictation-gate-test.md) ---------- */

  const SETTINGS_KEY = 'settings:main';
  // Round 3 (founder 2026-11-14): rule removes fillers or applies a simple correction, no model
  const PATHS = ['skip', 'rule', 'light', 'rewrite'];
  const PATH_LABELS = { 'skip': 'Skip', 'rule': 'Rule', 'light': 'Light', 'rewrite': 'Rewrite' };
  // The phone's heat when a run was measured (ProcessInfo.thermalState in the shell)
  const THERMAL_STATES = ['nominal', 'fair', 'serious', 'critical'];
  const THERMAL_LABELS = { 'nominal': 'Nominal', 'fair': 'Fair', 'serious': 'Serious', 'critical': 'Critical' };
  // The manifest's limits for settings:main (DictationGateSettings in the shell)
  const SETTINGS_LIMITS = { listItems: 50, phrase: 40, triggers: 20, trigger: 30, instruction: 4000 };
  const LIST_FIELDS = ['fillers', 'positionFillers', 'corrections'];
  // Round 2 (founder 2026-11-13): the test phrases and the capitalise list, optional in the record
  // (DictationGateSettings.maxPhrases, maxPhraseTextCharacters, maxNoteCharacters in the shell)
  const PHRASE_LIMITS = { phrases: 60, text: 1000, note: 200 };
  // Round 3: how many times Run All runs each phrase, optional in the record
  // (DictationGateSettings.builtInRepeat and maxRepeat in the shell)
  const REPEAT_LIMITS = { min: 1, max: 20, builtIn: 3 };
  // Build 34 (founder 2026-11-19): where the Midas keyboard records. keyboard tries the microphone
  // in the keyboard and falls back to the app switch; app is the app switch (build 33). Optional in
  // the record; DictationKeyboardMicMode in the shell.
  // Build 35 (founder 2026-11-19): keyboard-only never opens Midas Test and never falls back.
  const KEYBOARD_MIC_MODES = ['keyboard', 'app', 'keyboard-only'];
  const KEYBOARD_MIC_LABELS = { 'keyboard': 'Keyboard', 'app': 'App Switch', 'keyboard-only': 'Keyboard Only' };
  const KEYBOARD_MIC_BUILT_IN = 'keyboard';
  // Build 35: which microphone recorded a keyboard run (mic on the run record; DictationRunMic in
  // the shell), and the keyboard's ring log (log:keyboard, DictationKeyboardLog in the shell)
  const RUN_MICS = ['keyboard', 'app'];
  const RUN_MIC_LABELS = { 'keyboard': 'Keyboard Mic', 'app': 'App Mic' };
  const KEYBOARD_LOG_KEY = 'log:keyboard';

  // Round 4 (founder 2026-11-14): cues rules may act on, cues for the model pointer only (often
  // normal words), and the anchor rule's words. DictationGateSettings.builtInStrongCues,
  // builtInWeakCues and builtInAnchors in the shell.
  const STRONG_CUES = ['scratch that', 'no wait', 'wait no', 'I mean', 'I meant', 'make that', 'no no'];
  const WEAK_CUES = ['actually', 'sorry'];
  const ANCHORS = ['the', 'a', 'an', 'to', 'at', 'on', 'in', 'for', 'with', 'my', 'your', 'our', 'his', 'her', 'their'];

  // The built-in settings, character for character as DictationGateSettings.builtIn in the shell.
  // Round 3 (founder 2026-11-14): rules first; no trigger words (parked), four fillers, Run All ×3.
  // Round 4: strong and weak cues (corrections holds both, for readers from before), anchors, the
  // model pointer's one-line instruction with no examples, twenty phrases.
  function defaultSettings() {
    return {
      fillers: ['um', 'uh', 'erm', 'hmm'],
      positionFillers: [],
      corrections: STRONG_CUES.concat(WEAK_CUES),
      strongCues: STRONG_CUES.slice(),
      weakCues: WEAK_CUES.slice(),
      anchors: ANCHORS.slice(),
      triggers: [],
      lightInstruction: 'The words after the bracketed cue may correct words just before it. Give those replaced words exactly as written, or leave it empty when nothing is replaced.',
      capitalise: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday', 'January', 'February', 'March', 'April', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
      phrases: [
        { text: 'send the deck to Priya by friday', expect: 'skip' },
        { text: 'lunch with Maya on tuesday at 12:30', expect: 'skip' },
        { text: 'I like the new logo a lot', expect: 'skip', note: 'like as a word' },
        { text: 'it was so good to see you yesterday', expect: 'skip', note: 'so as a word' },
        { text: 'call David back before 5 tomorrow', expect: 'skip' },
        { text: 'uh tell mom im on my way', expect: 'rule', note: 'filler' },
        { text: 'um pack the charger the passport and the tickets', expect: 'rule', note: 'filler' },
        { text: 'for the party we need uh cups plates napkins and ice', expect: 'rule', note: 'filler' },
        { text: 'the call is at 2 no wait 3', expect: 'rule', note: 'correction' },
        { text: 'order 3 pizzas make that 4', expect: 'rule', note: 'correction' },
        { text: 'book the table for friday no wait saturday', expect: 'rule', note: 'correction' },
        { text: 'um be there at 5 no wait 6', expect: 'rule', note: 'correction' },
        { text: 'the browser is firefox scratch that chrome', expect: 'rule', note: 'swap' },
        { text: 'send it to Tom I mean Tim', expect: 'rule', note: 'swap' },
        { text: 'meet at the cafe on 5th street scratch that the library', expect: 'rule', note: 'anchor' },
        { text: 'meet at noon scratch that at 1 pm', expect: 'rule', note: 'anchor' },
        { text: 'invite Ana and Jonas scratch that just Ana', expect: 'light', note: 'pointer: Invite just Ana.' },
        { text: 'I actually like the new plan', expect: 'light', note: 'pointer: stays as said' },
        { text: 'the meeting is in room 4 sorry room 5', expect: 'rule', note: 'correction' },
        { text: 'send the file to Sam no wait to Priya', expect: 'rule', note: 'anchor' }
      ],
      repeat: REPEAT_LIMITS.builtIn,
      keyboardMic: KEYBOARD_MIC_BUILT_IN
    };
  }

  // A phrase: trimmed, 1 to max characters, with a letter or a digit; null when it does not fit
  function phraseFrom(value, maxLength) {
    if (typeof value !== 'string') {
      return null;
    }
    const text = value.trim();
    if (text.length === 0 || text.length > maxLength || !/[\p{L}\p{N}]/u.test(text)) {
      return null;
    }
    return text;
  }

  function instructionFrom(value) {
    if (typeof value !== 'string') {
      return null;
    }
    const text = value.trim();
    if (text.length === 0 || text.length > SETTINGS_LIMITS.instruction) {
      return null;
    }
    return text;
  }

  function phraseListFrom(value) {
    if (!Array.isArray(value) || value.length > SETTINGS_LIMITS.listItems) {
      return null;
    }
    const phrases = [];
    for (const item of value) {
      const phrase = phraseFrom(item, SETTINGS_LIMITS.phrase);
      if (phrase === null) {
        return null;
      }
      phrases.push(phrase);
    }
    return phrases;
  }

  function triggerListFrom(value) {
    if (!Array.isArray(value) || value.length > SETTINGS_LIMITS.triggers) {
      return null;
    }
    const triggers = [];
    for (const item of value) {
      if (!isPlainObject(item)) {
        return null;
      }
      const word = phraseFrom(item.word, SETTINGS_LIMITS.trigger);
      const instruction = instructionFrom(item.instruction);
      if (word === null || instruction === null) {
        return null;
      }
      triggers.push({ word: word, instruction: instruction });
    }
    return triggers;
  }

  // One test phrase: text 1 to 1,000 characters, expect a path, an optional note up to 200
  // characters (empty or null is no note); null when it does not fit
  function phraseEntryFrom(value) {
    if (!isPlainObject(value) || typeof value.text !== 'string' || PATHS.indexOf(value.expect) === -1) {
      return null;
    }
    const text = value.text.trim();
    if (text.length === 0 || text.length > PHRASE_LIMITS.text) {
      return null;
    }
    const entry = { text: text, expect: value.expect };
    if (value.note === undefined || value.note === null) {
      return entry;
    }
    if (typeof value.note !== 'string' || value.note.trim().length > PHRASE_LIMITS.note) {
      return null;
    }
    const note = value.note.trim();
    if (note.length > 0) {
      entry.note = note;
    }
    return entry;
  }

  // 1 to 60 phrases, each fitting; null otherwise
  function phraseEntriesFrom(value) {
    if (!Array.isArray(value) || value.length === 0 || value.length > PHRASE_LIMITS.phrases) {
      return null;
    }
    const entries = [];
    for (const item of value) {
      const entry = phraseEntryFrom(item);
      if (entry === null) {
        return null;
      }
      entries.push(entry);
    }
    return entries;
  }

  // The first field of a settings value that does not fit, or null when all fit
  function settingsProblem(value) {
    if (!isPlainObject(value)) {
      return 'settings';
    }
    // Round 4's cue lists and anchors may be missing (a record from before round 4); present, they
    // must fit, and strong and weak together fit the corrections list they are also written into
    if (value.strongCues !== undefined && phraseListFrom(value.strongCues) === null) {
      return 'strongCues';
    }
    if (value.weakCues !== undefined && phraseListFrom(value.weakCues) === null) {
      return 'weakCues';
    }
    const strongCount = Array.isArray(value.strongCues) ? value.strongCues.length : 0;
    const weakCount = Array.isArray(value.weakCues) ? value.weakCues.length : 0;
    if (strongCount + weakCount > SETTINGS_LIMITS.listItems) {
      return 'weakCues';
    }
    if (value.anchors !== undefined && phraseListFrom(value.anchors) === null) {
      return 'anchors';
    }
    for (const field of LIST_FIELDS) {
      if (phraseListFrom(value[field]) === null) {
        return field;
      }
    }
    if (triggerListFrom(value.triggers) === null) {
      return 'triggers';
    }
    if (instructionFrom(value.lightInstruction) === null) {
      return 'lightInstruction';
    }
    // Round 2's fields may be missing (a record saved by the round 1 page); present, they must fit
    if (value.capitalise !== undefined && phraseListFrom(value.capitalise) === null) {
      return 'capitalise';
    }
    if (value.phrases !== undefined && phraseEntriesFrom(value.phrases) === null) {
      return 'phrases';
    }
    // Round 3's repeat may be missing too; present, a whole number from 1 to 20
    if (value.repeat !== undefined && repeatFrom(value.repeat) === null) {
      return 'repeat';
    }
    // Build 34's keyboardMic may be missing too; present, keyboard or app
    if (value.keyboardMic !== undefined && KEYBOARD_MIC_MODES.indexOf(value.keyboardMic) === -1) {
      return 'keyboardMic';

    return null;

  function isBuiltInWeakCue(cue) {
    for (const weak of WEAK_CUES) {

      }

    const lowered = [];
    for (const item of list) {

  function sameCues(first, second) {

  // corrections (round 4 writes both); else its corrections split by the built-in weak list (a
  // record from before round 4, or one whose corrections an older writer changed)
  function cuesFrom(value, corrections) {
    const strong = [];
    const weak = [];
    for (const cue of corrections) {
      if (isBuiltInWeakCue(cue)) {
        weak.push(cue);
      } else {
        strong.push(cue);
      }
    }
    const storedStrong = value.strongCues === undefined ? strong : phraseListFrom(value.strongCues);
    const storedWeak = value.weakCues === undefined ? weak : phraseListFrom(value.weakCues);
    if (sameCues(storedStrong.concat(storedWeak), corrections)) {
      return { strongCues: storedStrong, weakCues: storedWeak };
    }
    return { strongCues: strong, weakCues: weak };

    const cues = cuesFrom(value, storedCorrections);
    return {
      fillers: phraseListFrom(value.fillers),
      positionFillers: phraseListFrom(value.positionFillers),
      // Every cue, for a reader from before round 4
      corrections: storedCorrections,
      strongCues: cues.strongCues,
      weakCues: cues.weakCues,
      anchors: value.anchors === undefined ? ANCHORS.slice() : phraseListFrom(value.anchors),
      triggers: triggerListFrom(value.triggers),
      lightInstruction: instructionFrom(value.lightInstruction),
      capitalise: value.capitalise === undefined ? defaultSettings().capitalise : phraseListFrom(value.capitalise),
      phrases: value.phrases === undefined ? defaultSettings().phrases : phraseEntriesFrom(value.phrases),
      repeat: value.repeat === undefined ? REPEAT_LIMITS.builtIn : repeatFrom(value.repeat),
      keyboardMic: value.keyboardMic === undefined ? KEYBOARD_MIC_BUILT_IN : value.keyboardMic
    };
  }

  // The stored settings, or the built-in ones when missing or not fitting (as the shell does)
  function resolvedSettings(storedValue) {

      return { settings: defaultSettings(), saved: false };
    }
    return { settings: stored, saved: true };
  }

  // A list typed on the page: split at commas and new lines, blanks dropped
  function phrasesFromText(text) {
    const phrases = [];
    for (const piece of String(text || '').split(/[,\n]/)) {
      const trimmed = piece.trim();
      if (trimmed.length > 0) {
        phrases.push(trimmed);
      }
    }
    return phrases;
  }

  function pathLabel(run) {
    const label = PATH_LABELS[run.path] || '';
    if (run.trigger) {
      return label + ': ' + run.trigger;
    }
    return label;
  }

  // A spoken run's total is release to inserted text; a phrase has no speaking, so gate plus cleanup
  function effectiveTotalMs(run) {
    if (run.totalMs !== null) {
      return run.totalMs;
    }
    return run.cleanupMs + (run.gateMs === null ? 0 : run.gateMs);
  }

  // Per path over the runs the gate decided: runs, share in percent, average total ms (null
  // without runs). Null when no run has a path. The shell writes the same into summary:main.
  function pathSummaryOf(runs) {
    const gated = [];
    for (const run of runs) {
      if (run.path !== null) {
        gated.push(run);
      }
    }
    if (gated.length === 0) {
      return null;
    }
    const summary = {};
    for (const path of PATHS) {
      let count = 0;
      let total = 0;
      for (const run of gated) {
        if (run.path === path) {
          count += 1;
          total += effectiveTotalMs(run);
        }
      }
      summary[path] = {
        runs: count,
        sharePercent: Math.round(count * 100 / gated.length),
        averageTotalMs: count === 0 ? null : Math.round(total / count)
      };
    }
    return summary;
  }

  // Per heat state over the runs that logged one: runs and share in percent. Null when no run
  // logged its heat. The shell writes the same into summary:main (round 3).
  function thermalSummaryOf(runs) {

    for (const run of runs) {
      if (run.thermal !== null) {
        logged += 1;
      }
    }
    if (logged === 0) {
      return null;
    }
    const summary = {};
    for (const state of THERMAL_STATES) {
      let count = 0;
      for (const run of runs) {

        }
      }

    }

  }

  // Build 35: keyboard runs per microphone, over the runs that logged one. Null when none did. The
  // shell writes the same into summary:main (mics).
  function micSummaryOf(runs) {

  // Build 35: the keyboard log's lines, newest first ([{ at, event, detail }]); null without one
  function keyboardLogOf(records) {
    for (const record of records || []) {
      if (record.key !== KEYBOARD_LOG_KEY || !isPlainObject(record.value) || !Array.isArray(record.value.entries)) {
        continue;
      }
      const lines = [];
      for (const entry of record.value.entries) {
        if (isPlainObject(entry) && typeof entry.at === 'string' && typeof entry.event === 'string') {
          lines.push({ at: entry.at, event: entry.event, detail: typeof entry.detail === 'string' ? entry.detail : '' });
        }
      }
      lines.reverse();
      return lines;
    }
    return null;
  }

  // Over the light runs whose model pointer was checked (round 4): runs, valid, empty (no words,
  // the text stayed as said) and the valid share in percent. Null when no run logged a pointer.
  // The shell writes the same into summary:main.
  function pointerSummaryOf(runs) {
    let checked = 0;
    let valid = 0;
    let empty = 0;
    for (const run of runs) {
      if (run.pointerValid === null) {
        continue;
      }
      checked += 1;
      if (run.pointerValid) {
        valid += 1;
      }
      if (run.pointer === null || run.pointer.trim().length === 0) {
        empty += 1;
      }
    }
    if (checked === 0) {
      return null;
    }
    return { runs: checked, valid: valid, empty: empty, sharePercent: Math.round(valid * 100 / checked) };
  }

  // A Run All or tapped phrase run whose path was not the one its phrase expects
  function isWrongPath(run) {
    return run.expect !== null && run.path !== null && run.expect !== run.path;
  }

  // Over the runs that carry an expected path: how many, and how many took another path
  function wrongPathOf(runs) {
    let checked = 0;
    let wrong = 0;
    for (const run of runs) {
      if (run.expect === null || run.path === null) {
        continue;
      }
      checked += 1;
      if (isWrongPath(run)) {
        wrong += 1;
      }
    }
    return { checked: checked, wrong: wrong };
  }

  /* ---------- Home Screen widget (docs/WIDGETS.md) ---------- */

  // No background of its own, so the system ink reads in light and dark
  function caption(text, extra) {
    const piece = { text: text, style: 'caption', color: 'secondary' };
    for (const field of Object.keys(extra || {})) {
      piece[field] = extra[field];
    }
    return piece;
  }

  function headerRow() {
    return { spacing: 4, hstack: [
      { symbol: 'waveform', size: 13, color: 'secondary' },
      caption('Cleanup'),
      { spacer: true },
      caption('TEST')
    ] };
  }

  function lastPieces() {
    return [
      { text: '$summary.lastCleanupMs ms', style: 'title', if: '$summary.runs' },
      caption('Last', { if: '$summary.runs' })
    ];
  }

  function averagePieces() {
    return [
      { text: 'Avg $summary.averageCleanupMs ms', style: 'caption', if: '$summary.runs' },
      caption('Worst $summary.worstCleanupMs ms', { if: '$summary.runs' })
    ];
  }

  function emptyPiece() {
    return { text: 'No Runs', style: 'headline', unless: '$summary.runs' };
  }

  function dictationWidget() {
    const smallColumn = [headerRow()].concat(lastPieces(), [emptyPiece(), { spacer: true }], averagePieces());
    const mediumRight = [{ spacer: true }].concat(averagePieces(), [caption('$summary.runs runs', { if: '$summary.runs' })]);
    const mediumRow = { spacing: 12, hstack: [
      { spacing: 2, align: 'leading', vstack: lastPieces().concat([emptyPiece()]) },
      { spacer: true },
      { spacing: 2, align: 'leading', vstack: mediumRight }
    ] };
    return {
      version: WIDGET_VERSION,
      name: WIDGET_NAME,
      sources: { summary: { record: SUMMARY_KEY } },
      small: { spacing: 2, align: 'leading', vstack: smallColumn },
      medium: { spacing: 6, align: 'leading', vstack: [headerRow(), mediumRow] }
    };
  }

  function widgetRecords() {
    return [{ key: WIDGET_KEY, value: dictationWidget() }];
  }

  // A stored widget equals a wanted one when they match apart from the stamped $type
  function sameWidget(stored, wanted) {
    if (!isPlainObject(stored)) {
      return false;
    }
    const withoutType = copyJson(stored);
    delete withoutType.$type;
    return JSON.stringify(withoutType) === JSON.stringify(wanted);
  }

  return {
    RUN_PREFIX: RUN_PREFIX,
    SUMMARY_KEY: SUMMARY_KEY,
    TEST_REQUEST_KIND: TEST_REQUEST_KIND,
    HOME_SCREEN_REQUEST_KIND: HOME_SCREEN_REQUEST_KIND,
    DEFAULT_LIMIT: DEFAULT_LIMIT,
    MAX_LIMIT: MAX_LIMIT,
    runFrom: runFrom,
    runsOf: runsOf,
    summaryOf: summaryOf,
    limitFrom: limitFrom,
    formatMs: formatMs,
    sourceLabel: sourceLabel,
    timingsLine: timingsLine,
    widgetRecords: widgetRecords,
    sameWidget: sameWidget,
    SETTINGS_KEY: SETTINGS_KEY,
    PATHS: PATHS,
    PATH_LABELS: PATH_LABELS,
    SETTINGS_LIMITS: SETTINGS_LIMITS,
    defaultSettings: defaultSettings,
    settingsProblem: settingsProblem,
    settingsFrom: settingsFrom,
    resolvedSettings: resolvedSettings,
    phrasesFromText: phrasesFromText,
    pathLabel: pathLabel,
    effectiveTotalMs: effectiveTotalMs,
    pathSummaryOf: pathSummaryOf,
    PHRASE_LIMITS: PHRASE_LIMITS,
    isWrongPath: isWrongPath,
    wrongPathOf: wrongPathOf,
    THERMAL_STATES: THERMAL_STATES,
    THERMAL_LABELS: THERMAL_LABELS,
    thermalSummaryOf: thermalSummaryOf,
    REPEAT_LIMITS: REPEAT_LIMITS,
    repeatFrom: repeatFrom,
    STRONG_CUES: STRONG_CUES,
    WEAK_CUES: WEAK_CUES,
    ANCHORS: ANCHORS,
    pointerSummaryOf: pointerSummaryOf,
    pointerLabel: pointerLabel,
    KEYBOARD_MIC_MODES: KEYBOARD_MIC_MODES,
    KEYBOARD_MIC_LABELS: KEYBOARD_MIC_LABELS,
    RUN_MICS: RUN_MICS,
    RUN_MIC_LABELS: RUN_MIC_LABELS,
    KEYBOARD_LOG_KEY: KEYBOARD_LOG_KEY,
    micSummaryOf: micSummaryOf,
    keyboardLogOf: keyboardLogOf
  };
})();

  'use strict';

  const Logic = DictationLogic;
  const LATEST_COUNT = 5;

    failed: false,
    runs: [],

  function escapeHtml(text) {

        result += '&amp;';
      } else if (character === '<') {
        result += '&lt;';
      } else if (character === '>') {
        result += '&gt;';
      } else if (character === '"') {

    for (let index = 0; index < 3; index += 1) {

    for (const thermal of Logic.THERMAL_STATES) {
      const entry = heat[thermal];
      const runWord = entry.runs === 1 ? ' run' : ' runs';
      html += '<div class="path" data-heat="' + thermal + '"><b>' + Logic.THERMAL_LABELS[thermal] + '</b><span>' + entry.runs + runWord + ' · '
        + entry.sharePercent + '%</span></div>';
    }
    return html + '</div>';
  }

  // The model pointer's results (round 4): valid share, and how many named no words; nothing until
  // a light run logged a pointer
  function pointerHtml() {
    const pointer = Logic.pointerSummaryOf(state.runs);
    if (pointer === null) {
      return '';
    }
    const runWord = pointer.runs === 1 ? ' run' : ' runs';
    const invalid = pointer.runs - pointer.valid;
    const invalidClass = invalid > 0 ? ' wrong' : '';
    return '<div class="lab">Pointer</div><div class="card"><div class="path" data-pointer="valid"><b>Valid</b><span>' + pointer.valid + ' of '
      + pointer.runs + runWord + ' · ' + pointer.sharePercent + '%</span></div><div class="path' + invalidClass + '" data-pointer="invalid"><b>Invalid</b><span>'
      + invalid + '</span></div><div class="path" data-pointer="empty"><b>No Words</b><span>' + pointer.empty + '</span></div></div>';
  }

  // Build 35: keyboard runs per microphone; nothing until a keyboard run logged its microphone
  function micsHtml() {
    const mics = Logic.micSummaryOf(state.runs);
    if (mics === null) {
      return '';
    }
    let html = '<div class="lab">Keyboard Mic</div><div class="card">';
    for (const mic of Logic.RUN_MICS) {
      const count = mics[mic].runs;
      const runWord = count === 1 ? ' run' : ' runs';
      html += '<div class="path" data-mic="' + mic + '"><b>' + Logic.RUN_MIC_LABELS[mic] + '</b><span>' + count + runWord + '</span></div>';
    }
    return html + '</div>';
  }

  // Build 35: what the Midas keyboard did, newest first (time, event, detail)
  function keyboardLogHtml() {
    let html = navHtml('Keyboard Log');
    const lines = state.keyboardLog;
    if (lines === null || lines.length === 0) {
      return html + '<div class="card"><div class="empty">No Keyboard Log</div></div>';
    }
    html += '<div class="card">';
    for (const line of lines) {
      const time = new Date(line.at);
      const timeText = Number.isNaN(time.getTime()) ? line.at : time.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit' });
      html += '<div class="run" data-log-event="' + escapeHtml(line.event) + '"><div class="cleaned">' + escapeHtml(line.event) + '</div><div class="raw">'
        + escapeHtml(line.detail) + '</div><div class="meta">' + escapeHtml(timeText) + '</div></div>';
    }
    return html + '</div>';
  }

  function runListHtml(runs) {
    if (runs.length === 0) {
      return '<div class="card"><div class="empty">No Runs</div></div>';
    }
    let html = '<div class="card">';
    for (const run of runs) {
      html += runHtml(run);
    }
    return html + '</div>';
  }

  function summaryHtml() {
    const latest = state.runs.slice(0, LATEST_COUNT);
    let html = topRowHtml() + stageHtml() + statsHtml() + micsHtml() + pathsHtml() + pointerHtml() + heatHtml() + '<div class="lab">Latest</div>' + runListHtml(latest);
    if (state.runs.length > LATEST_COUNT) {
      html += '<button class="more" data-action="show-all-runs">Show All</button>';
    }
    return html;
  }

  function navHtml(title) {
    return '<div class="nav"><button class="back" data-action="show-summary">Dictation</button></div><h2 class="h1">' + title + '</h2>';
  }

  function allRunsHtml() {
    return navHtml('Runs') + runListHtml(state.runs.slice(0, Logic.MAX_LIMIT));
  }

  function howHtml() {
    const lines = ['Open Dictation Test and run a phrase or speak.', 'Each cleanup is saved here.'];
    const words = [];
    for (const trigger of state.settings ? state.settings.triggers : []) {
      words.push(trigger.word);
    }
    if (words.length > 0) {
      lines.push('Say ' + words.join(', ') + ' first to rewrite.');
    }
    if (state.homeScreen) {
      lines.push('The widget shows the last and average cleanup time.');
    }
    let html = navHtml('How Dictation Works') + '<div class="card how">';
    for (const line of lines) {
      html += '<div class="row">' + escapeHtml(line) + '</div>';
    }
    return html + '</div>';
  }

  /* ---------- Settings ---------- */

  function draftFrom(settings) {
    const triggers = [];
    for (const trigger of settings.triggers) {
      triggers.push({ word: trigger.word, instruction: trigger.instruction });
    }
    const phrases = [];
    for (const phrase of settings.phrases) {
      phrases.push({ text: phrase.text, expect: phrase.expect, note: phrase.note || '' });
    }
    return {
      fillers: settings.fillers.join(', '),
      positionFillers: settings.positionFillers.join(', '),
      strongCues: settings.strongCues.join(', '),
      weakCues: settings.weakCues.join(', '),
      anchors: settings.anchors.join(', '),
      triggers: triggers,
      lightInstruction: settings.lightInstruction,
      capitalise: settings.capitalise.join(', '),
      phrases: phrases,
      repeat: String(settings.repeat),
      keyboardMic: settings.keyboardMic
    };
  }

  // What is typed in the form now (the draft when the form is not on screen)
  function readForm() {
    const draft = state.draft;
    if (draft === null) {
      return;
    }
    const textIds = { fillers: 'set-fillers', positionFillers: 'set-position', strongCues: 'set-strong', weakCues: 'set-weak',
      anchors: 'set-anchors', lightInstruction: 'set-light', capitalise: 'set-capitalise', repeat: 'set-repeat', keyboardMic: 'set-keyboard-mic' };
    for (const field of Object.keys(textIds)) {
      const element = document.getElementById(textIds[field]);
      if (element && typeof element.value === 'string') {
        draft[field] = element.value;
      }
    }
    for (let index = 0; index < draft.triggers.length; index += 1) {
      const wordElement = document.getElementById('set-word-' + index);
      const instructionElement = document.getElementById('set-instruction-' + index);
      if (wordElement && typeof wordElement.value === 'string') {
        draft.triggers[index].word = wordElement.value;
      }
      if (instructionElement && typeof instructionElement.value === 'string') {
        draft.triggers[index].instruction = instructionElement.value;
      }
    }
    readPhraseFields(draft);
  }

  // The phrase rows typed so far: text, expected path, note
  function readPhraseFields(draft) {
    const fieldIds = { text: 'set-phrase-', expect: 'set-expect-', note: 'set-note-' };
    for (let index = 0; index < draft.phrases.length; index += 1) {
      for (const field of Object.keys(fieldIds)) {
        const element = document.getElementById(fieldIds[field] + index);
        if (element && typeof element.value === 'string') {
          draft.phrases[index][field] = element.value;
        }
      }
    }
  }

  // The settings value the form describes (not yet checked)
  function valueFromDraft(draft) {
    const triggers = [];
    for (const trigger of draft.triggers) {
      triggers.push({ word: String(trigger.word).trim(), instruction: String(trigger.instruction).trim() });
    }
    const phrases = [];
    for (const phrase of draft.phrases) {
      phrases.push({ text: String(phrase.text).trim(), expect: phrase.expect, note: String(phrase.note).trim() });
    }
    const strongCues = Logic.phrasesFromText(draft.strongCues);
    const weakCues = Logic.phrasesFromText(draft.weakCues);
    return {
      fillers: Logic.phrasesFromText(draft.fillers),
      positionFillers: Logic.phrasesFromText(draft.positionFillers),
      // Every cue, for a reader from before round 4
      corrections: strongCues.concat(weakCues),
      strongCues: strongCues,
      weakCues: weakCues,
      anchors: Logic.phrasesFromText(draft.anchors),
      triggers: triggers,
      lightInstruction: String(draft.lightInstruction).trim(),
      capitalise: Logic.phrasesFromText(draft.capitalise),
      phrases: phrases,
      repeat: repeatFromText(draft.repeat),
      keyboardMic: draft.keyboardMic
    };
  }

  // The typed repeat count as a number; anything else stays as typed so the check names it
  function repeatFromText(text) {
    const trimmed = String(text).trim();
    if (!/^[0-9]+$/.test(trimmed)) {
      return trimmed;
    }
    return Number(trimmed);
  }

  const FIELD_LABELS = {
    fillers: 'Fillers', positionFillers: 'Fillers by Position', corrections: 'Corrections', triggers: 'Trigger Words',
    lightInstruction: 'Light Cleanup', capitalise: 'Capitalise', phrases: 'Phrases', repeat: 'Run All Repeats', settings: 'Settings',
    strongCues: 'Strong Cues', weakCues: 'Weak Cues', anchors: 'Anchors', keyboardMic: 'Keyboard Mic'
  };

  function textAreaHtml(id, value, extraClass) {
    return '<textarea class="field' + (extraClass || '') + '" id="' + id + '" autocapitalize="off" spellcheck="false">' + escapeHtml(value) + '</textarea>';
  }

  function triggerHtml(trigger, index) {
    return '<div class="trigger"><div class="trigger-top"><input class="field" id="set-word-' + index + '" value="' + escapeHtml(trigger.word)
      + '" autocapitalize="off" spellcheck="false" aria-label="Word"><button class="chip" data-action="remove-trigger" data-index="' + index
      + '">Remove</button></div>' + textAreaHtml('set-instruction-' + index, trigger.instruction) + '</div>';
  }

  function expectOptionsHtml(selected) {
    let html = '';
    for (const path of Logic.PATHS) {
      const selectedText = path === selected ? ' selected' : '';
      html += '<option value="' + path + '"' + selectedText + '>' + Logic.PATH_LABELS[path] + '</option>';
    }
    return html;
  }

  // One test phrase: the words, the path it should take, a note, Remove
  function phraseRowHtml(phrase, index) {
    return '<div class="phrase">' + textAreaHtml('set-phrase-' + index, phrase.text) + '<div class="phrase-bottom"><select class="field" id="set-expect-'
      + index + '" aria-label="Expected Path">' + expectOptionsHtml(phrase.expect) + '</select><input class="field" id="set-note-' + index
      + '" value="' + escapeHtml(phrase.note) + '" placeholder="Note" autocapitalize="off" spellcheck="false" aria-label="Note">'
      + '<button class="chip" data-action="remove-phrase" data-index="' + index + '">Remove</button></div></div>';
  }

  function phrasesHtml(draft) {
    let html = '<div class="lab">' + FIELD_LABELS.phrases + '</div><div class="card">';
    for (let index = 0; index < draft.phrases.length; index += 1) {
      html += phraseRowHtml(draft.phrases[index], index);
    }
    if (draft.phrases.length === 0) {
      html += '<div class="empty">No Phrases</div>';
    }
    html += '</div>';
    if (draft.phrases.length < Logic.PHRASE_LIMITS.phrases) {
      html += '<button class="more" data-action="add-phrase">Add Phrase</button>';
    }
    return html;
  }

  // Build 34: where the Midas keyboard records
  function keyboardMicHtml(selected) {
    let options = '';
    for (const mode of Logic.KEYBOARD_MIC_MODES) {
      const selectedText = mode === selected ? ' selected' : '';
      options += '<option value="' + mode + '"' + selectedText + '>' + Logic.KEYBOARD_MIC_LABELS[mode] + '</option>';
    }
    return '<div class="lab">' + FIELD_LABELS.keyboardMic + '</div><select class="field wide" id="set-keyboard-mic" aria-label="'
      + FIELD_LABELS.keyboardMic + '">' + options + '</select>';
  }

  function settingsHtml() {
    const draft = state.draft;
    let html = navHtml('Settings');
    html += keyboardMicHtml(draft.keyboardMic);
    html += '<div class="lab">' + FIELD_LABELS.fillers + '</div>' + textAreaHtml('set-fillers', draft.fillers);
    html += '<div class="lab">' + FIELD_LABELS.positionFillers + '</div>' + textAreaHtml('set-position', draft.positionFillers);
    html += '<div class="lab">' + FIELD_LABELS.strongCues + '</div>' + textAreaHtml('set-strong', draft.strongCues);
    html += '<div class="lab">' + FIELD_LABELS.weakCues + '</div>' + textAreaHtml('set-weak', draft.weakCues);
    html += '<div class="lab">' + FIELD_LABELS.anchors + '</div>' + textAreaHtml('set-anchors', draft.anchors);
    html += '<div class="lab">' + FIELD_LABELS.triggers + '</div><div class="card">';
    for (let index = 0; index < draft.triggers.length; index += 1) {
      html += triggerHtml(draft.triggers[index], index);
    }
    if (draft.triggers.length === 0) {
      html += '<div class="empty">No Trigger Words</div>';
    }
    html += '</div>';
    if (draft.triggers.length < Logic.SETTINGS_LIMITS.triggers) {
      html += '<button class="more" data-action="add-trigger">Add Trigger Word</button>';
    }
    html += '<div class="lab">' + FIELD_LABELS.lightInstruction + '</div>' + textAreaHtml('set-light', draft.lightInstruction, ' long');
    html += '<div class="lab">' + FIELD_LABELS.capitalise + '</div>' + textAreaHtml('set-capitalise', draft.capitalise);
    html += phrasesHtml(draft);
    html += '<div class="lab">' + FIELD_LABELS.repeat + '</div><input class="field" id="set-repeat" type="number" inputmode="numeric" min="'
      + Logic.REPEAT_LIMITS.min + '" max="' + Logic.REPEAT_LIMITS.max + '" value="' + escapeHtml(draft.repeat) + '" aria-label="'
      + FIELD_LABELS.repeat + '">';
    html += '<div class="actions"><button class="chip" data-action="reset-settings">Reset</button>'
      + '<button class="primary" data-action="save-settings">Save</button></div>';
    if (state.settingsMessage) {
      html += '<div class="message">' + escapeHtml(state.settingsMessage) + '</div>';
    }
    return html;
  }

  function showSettings() {
    state.draft = draftFrom(state.settings);
    state.settingsMessage = '';
    showView('settings');
  }

  function addTrigger() {
    readForm();
    state.draft.triggers.push({ word: '', instruction: '' });
    state.settingsMessage = '';
    renderAll();
  }

  function removeTrigger(index) {
    readForm();
    if (index >= 0 && index < state.draft.triggers.length) {
      state.draft.triggers.splice(index, 1);
    }
    state.settingsMessage = '';
    renderAll();
  }

  function addPhrase() {
    readForm();
    state.draft.phrases.push({ text: '', expect: 'skip', note: '' });
    state.settingsMessage = '';
    renderAll();
  }

  function removePhrase(index) {
    readForm();
    if (index >= 0 && index < state.draft.phrases.length) {
      state.draft.phrases.splice(index, 1);
    }
    state.settingsMessage = '';
    renderAll();
  }

  // The built-in settings back in the form; Save keeps them
  function resetSettings() {
    state.draft = draftFrom(Logic.defaultSettings());
    state.settingsMessage = '';
    renderAll();
  }

  async function saveSettingsTask() {
    readForm();
    const value = valueFromDraft(state.draft);
    const problem = Logic.settingsProblem(value);
    if (problem !== null) {
      state.settingsMessage = 'Can’t Save ' + FIELD_LABELS[problem];
      renderAll();
      return;
    }
    const settings = Logic.settingsFrom(value);
    await store.set(Logic.SETTINGS_KEY, settings);
    state.settings = settings;
    state.settingsSaved = true;
    state.draft = draftFrom(settings);
    state.settingsMessage = 'Saved';
    renderAll();
  }

  function renderAll() {
    const main = document.getElementById('main');
    let html = '';
    if (!state.loaded) {
      html = '';
    } else if (state.failed) {
      html = '<div class="empty">Can’t Open Dictation</div>';
    } else if (state.view === 'runs') {
      html = allRunsHtml();
    } else if (state.view === 'how') {
      html = howHtml();
    } else if (state.view === 'settings') {
      html = settingsHtml();
    } else if (state.view === 'keyboard-log') {
      html = keyboardLogHtml();
    } else {
      html = summaryHtml();
    }
    main.innerHTML = html;
    if (document.getElementById('orb')) {
      startOrb();
    }
  }

  /* ---------- Reading ---------- */

  async function readAll() {
    const records = await store.query(Logic.RUN_PREFIX);
    state.runs = Logic.runsOf(records);
    // Build 35: the keyboard log Midas Test saved
    const logRecord = await store.get(Logic.KEYBOARD_LOG_KEY);
    state.keyboardLog = Logic.keyboardLogOf(logRecord ? [{ key: Logic.KEYBOARD_LOG_KEY, value: logRecord }] : []);
  }

  async function readSettings() {
    const stored = await store.get(Logic.SETTINGS_KEY);
    const resolved = Logic.resolvedSettings(stored);
    state.settings = resolved.settings;
    state.settingsSaved = resolved.saved;
  }

  // Which request kinds this app build carries out; an older build answers "unknown op shell"
  async function shellRequestKinds() {
    try {
      const requestOptions = {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ op: 'shell' })
      };
      const response = await fetch(window.location.origin + '/_midas/store', requestOptions);
      const reply = await response.json();
      return reply.ok && Array.isArray(reply.requests) ? reply.requests : [];
    } catch (error) {
      return [];
    }
  }

  // Requests left from an earlier open (the app closed while the test screen was up) go
  async function clearOldRequests() {
    const requests = await store.query('request:');
    for (const request of requests) {
      await store.delete(request.key);
    }
  }

  async function publishWidgets() {
    for (const widget of Logic.widgetRecords()) {
      const existing = await store.get(widget.key);
      if (Logic.sameWidget(existing, widget.value)) {
        continue;
      }
      try {
        await store.set(widget.key, widget.value);
      } catch (error) {
        console.warn('Dictation: widget refused', widget.key, error);
      }
    }
  }

  async function firstLoad() {
    const kinds = await shellRequestKinds();
    state.canOpenTest = kinds.indexOf(Logic.TEST_REQUEST_KIND) !== -1;
    state.homeScreen = kinds.indexOf(Logic.HOME_SCREEN_REQUEST_KIND) !== -1;
    await clearOldRequests();
    await readAll();
    await readSettings();
    await publishWidgets();
    state.loaded = true;
    renderAll();
  }

  async function refresh() {
    // Typing in the settings form survives the redraw
    if (state.view === 'settings') {
      readForm();
    }
    await readAll();
    renderAll();
  }

  /* ---------- Asking the shell ---------- */

  function newRequestKey(letter) {
    return 'request:' + letter + Date.now().toString(36) + Math.floor(Math.random() * 1e9).toString(36);
  }

  // The shell opens the Dictation Test screen ("open") and marks the request "done" when it
  // closes; the page waits for that, then reads the new runs
  async function openTestTask() {
    const requestKey = newRequestKey('d');
    await store.set(requestKey, { kind: Logic.TEST_REQUEST_KIND, status: 'pending', createdAt: new Date().toISOString() });
    state.waitingKey = requestKey;
    renderAll();
    schedulePoll();
  }

  function schedulePoll() {
    if (pollTimer !== null) {
      clearTimeout(pollTimer);
    }
    pollTimer = setTimeout(pollFromTimer, POLL_MS);
  }

  function pollFromTimer() {
    pollTimer = null;
    queueFromScreen(pollTask);
  }

  async function pollTask() {
    const requestKey = state.waitingKey;
    if (requestKey === null) {
      return;
    }
    const request = await store.get(requestKey);
    const status = request ? request.status : null;
    if (status === 'pending' || status === 'open') {
      schedulePoll();
      return;
    }
    state.waitingKey = null;
    if (request) {
      await store.delete(requestKey);
    }
    await refresh();
  }

  // The shell shows the Add to Home Screen steps and marks the request done at once
  async function requestHomeScreenTask() {
    const requestKey = newRequestKey('h');
    await store.set(requestKey, { kind: Logic.HOME_SCREEN_REQUEST_KIND, widget: 'sidekick', status: 'pending', createdAt: new Date().toISOString() });
    const request = await store.get(requestKey);
    if (request && request.status !== 'pending') {
      await store.delete(requestKey);
    }
  }

  /* ---------- Events ---------- */

  function showView(view) {
    state.view = view;
    state.helpOpen = false;
    renderAll();
    window.scrollTo(0, 0);
  }

  function handleClick(event) {
    const target = event.target.closest('[data-action]');
    if (!target) {
      return;
    }
    const action = target.dataset.action;
    if (action === 'open-test') {
      queueFromScreen(openTestTask);
    } else if (action === 'show-all-runs') {
      showView('runs');
    } else if (action === 'show-summary') {
      showView('summary');
    } else if (action === 'show-how') {
      showView('how');
    } else if (action === 'show-keyboard-log') {
      showView('keyboard-log');
    } else if (action === 'show-settings') {
      showSettings();
    } else if (action === 'add-trigger') {
      addTrigger();
    } else if (action === 'remove-trigger') {
      removeTrigger(Number(target.dataset.index));
    } else if (action === 'add-phrase') {
      addPhrase();
    } else if (action === 'remove-phrase') {
      removePhrase(Number(target.dataset.index));
    } else if (action === 'reset-settings') {
      resetSettings();
    } else if (action === 'save-settings') {
      queueFromScreen(saveSettingsTask);
    } else if (action === 'toggle-help') {
      state.helpOpen = !state.helpOpen;
      renderAll();
    } else if (action === 'close-help') {
      state.helpOpen = false;
      renderAll();
    } else if (action === 'add-home-screen') {
      state.helpOpen = false;
      renderAll();
      queueFromScreen(requestHomeScreenTask);
    }
  }

  // Back on screen: runs may have been saved while the page was away
  function handleVisibilityChange() {
    if (document.hidden || !state.loaded) {
      return;
    }
    queueFromScreen(refresh);
  }

  function showLoadFailure(error) {
    console.warn('Dictation: load failed', error);
    state.loaded = true;
    state.failed = true;
    renderAll();
  }

  function start() {
    document.addEventListener('click', handleClick);
    document.addEventListener('visibilitychange', handleVisibilityChange);
    readyPromise = queueTask(firstLoad);
    readyPromise.catch(showLoadFailure);
  }

  start();

  /* ---------- For tests: the same operations the screen uses ---------- */

  function whenReady() {
    return readyPromise;
  }

  function openTest() {
    return queueTask(openTestTask);
  }

  function poll() {
    return queueTask(pollTask);
  }

  function snapshotState() {
    return JSON.parse(JSON.stringify({ runs: state.runs, view: state.view, canOpenTest: state.canOpenTest, homeScreen: state.homeScreen,
      waitingKey: state.waitingKey, failed: state.failed, settings: state.settings, settingsSaved: state.settingsSaved, draft: state.draft,
      settingsMessage: state.settingsMessage }));
  }

  function saveSettings() {
    return queueTask(saveSettingsTask);
  }

  return { whenReady: whenReady, openTest: openTest, poll: poll, show: showView, state: snapshotState, saveSettings: saveSettings };
})();
</script>
</body>
</html>
