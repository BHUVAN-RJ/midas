    const value = read.value;
    const item = read.item;
    item.alerts = rulesOf(item);
    const record = Logic.recordFromItem(item, value);
    if (Logic.isRepeating(item)) {
      const through = Logic.effectiveDoneThrough(item);
      const previous = Logic.latestOccurrenceAtOrBefore(item, through - 1);
      item.doneThrough = previous === null ? null : new Date(previous).toISOString();
      if (previous === null) {
        delete record.doneThrough;
      } else {
        record.doneThrough = item.doneThrough;
      }
      // The shell's Done for the same occurrence is undone too
      delete record.lastDoneAt;
      item.lastDoneAt = null;
      // The shell's Done on the other times is undone too
      item.slotsDone = {};
      delete record.slotsDone;
    } else {
      item.done = false;
      item.completedAt = null;
      record.done = false;
      delete record.completedAt;
    }
    await store.set(key, record);
    await loadState();
  }

  /* ---------- Bookings (the engine's 48, NOTIFICATIONS.md 6.2) ---------- */

  // Bookings this Sidekick would hold, with some items left out and others added
  function bookingsWith(skipItemIds, extraItems, listOverride) {
    const now = nowMs();
    let total = 0;
    for (const item of Object.values(state.items)) {
      if (skipItemIds.indexOf(item.id) !== -1) {
        continue;
      }
      let list = state.lists[item.list];
      if (listOverride && listOverride.id === item.list) {
        list = listOverride;
      }
      total += Logic.bookingsOfItem(item, Logic.rulesForItem(item, list), now);
    }
    for (const extra of extraItems) {
      total += Logic.bookingsOfItem(extra.item, extra.rules, now);
    }
    return total;
  }

  function bookingWarning(total) {
    if (total <= Logic.BOOKING_LIMIT) {
      return '';
    }
    return '<div class="warn">' + escapeHtml('Over 48 alerts. Later ones may come late.') + '</div>';
  }

  /* ---------- Undo bar and messages ---------- */

  function offerUndo(label, snapshot) {
    clearTimeout(undoTimer);
    state.undo = { label: label, snapshot: snapshot };
    undoTimer = setTimeout(dismissUndo, UNDO_MS);
    renderBar();
  }

  function dismissUndo() {
    state.undo = null;
    renderBar();
  }

  function showMessage(text) {
    clearTimeout(messageTimer);
    state.message = text;
    messageTimer = setTimeout(clearMessage, 4000);
    renderBar();
  }

  function clearMessage() {
    state.message = null;
    renderBar();
  }

  async function undoLatest() {
    const pending = state.undo;
    if (!pending) {
      return;
    }
    clearTimeout(undoTimer);
    state.undo = null;
    await queueTask(function restoreLatestSnapshot() {
      return restoreTask(pending.snapshot);
    });
    renderAll();
  }

  /* ======================================================================
     Rendering
     ====================================================================== */

  function shownItems(listId) {
    const now = nowMs();
    const zone = deviceZone();
    const today = todayText();
    const entries = [];
    for (const item of Object.values(state.items)) {
      if (listId && item.list !== listId) {
        continue;
      }
      const shown = Logic.displayState(item, now, zone);
      if (shown.state === 'ended') {
        continue;
      }
      // Done reminders stay in view on the day they were done
      if (shown.state === 'done') {
        const doneDay = item.completedAt ? Logic.localDateOf(item.completedAt, zone) : Logic.localDateOf(shown.at, zone);
        if (doneDay !== today && Logic.localDateOf(shown.at, zone) !== today) {
          continue;
        }
      }
      entries.push({ item: item, shown: shown });
    }
    entries.sort(compareEntries);
    return entries;
  }

  function stateRank(stateName) {
    if (stateName === 'overdue') {
      return 0;
    }
    if (stateName === 'upcoming') {
      return 1;
    }
    return 2;
  }

  function compareEntries(first, second) {
    const rankDifference = stateRank(first.shown.state) - stateRank(second.shown.state);
    if (rankDifference !== 0) {
      return rankDifference;
    }
    if (first.shown.at !== second.shown.at) {
      return first.shown.at - second.shown.at;
    }
    return first.item.id < second.item.id ? -1 : 1;
  }

  function whenOf(entry) {
    return Logic.whenText(entry.shown.at, nowMs(), deviceZone());
  }

  function rowMarkup(entry, showListName) {
    const item = entry.item;
    const stateName = entry.shown.state;
    const list = state.lists[item.list];
    let detail = '';
    if (showListName && list) {
      detail += escapeHtml(list.name) + ' · ';
    }
    detail += escapeHtml(whenOf(entry));
    if (Logic.isRepeating(item)) {
      detail += ' ' + icon('repeat');
    }
    let rowClass = 'row';
    let trailing = '<button class="ring" data-action="done" data-id="' + escapeHtml(item.id) + '" aria-label="Done"></button>';
    let pill = '';
    if (stateName === 'overdue') {
      rowClass += ' overdue';
      pill = '<span class="soon">When you can</span>';
    } else if (stateName === 'done') {
      rowClass += ' done';
      trailing = '<button class="tick" data-action="not-done" data-id="' + escapeHtml(item.id) + '" aria-label="Not Done">' + icon('check') + '</button>';
    }
    return '<div class="' + rowClass + '" data-action="edit-reminder" data-id="' + escapeHtml(item.id) + '" role="button">' +
      '<span class="ichip">' + icon(list ? list.icon : 'bell') + '</span>' +
      '<div class="grow"><div class="t">' + escapeHtml(item.title) + '</div><div class="d">' + detail + '</div></div>' +
      pill + trailing + '</div>';
  }

  // The list's most urgent reminder that is not done
  function nextEntryOfList(listId) {
    const entries = shownItems(listId);
    for (const entry of entries) {
      if (entry.shown.state === 'overdue' || entry.shown.state === 'upcoming') {
        return entry;
      }
    }
    return null;
  }

  function sizeRank(size) {
    if (size === 'xl') {
      return 0;
    }
    return size === 'md' ? 1 : 2;
  }

  function compareTiles(first, second) {
    const rankDifference = sizeRank(first.size) - sizeRank(second.size);
    if (rankDifference !== 0) {
      return rankDifference;
    }
    if (first.size !== 'sm' && first.urgency !== second.urgency) {
      return first.urgency - second.urgency;
    }
    return compareListsByOrder(first.list, second.list);
  }

  function whenMarkup(entry) {
    if (entry.shown.state === 'overdue') {
      return '<span class="soon-pill">When you can</span>';
    }
    return escapeHtml(whenOf(entry));
  }

  function tileMarkup(tile) {
    const list = tile.list;
    const entry = tile.entry;
    const open = 'data-action="open-list" data-id="' + escapeHtml(list.id) + '" role="button" style="' + colourStyle(list.color) + '"';
    if (tile.size === 'xl') {
      return '<div class="mt xl" ' + open + '>' +
        '<div class="lname">' + icon(list.icon) + escapeHtml(list.name) + '</div>' +
        '<div class="big">' + icon(list.icon) + '<div style="min-width:0"><div class="what">' + escapeHtml(entry.item.title) + '</div>' +
        '<div class="when">' + whenMarkup(entry) + '</div></div></div>' +
        '<button class="done" data-action="done" data-id="' + escapeHtml(entry.item.id) + '">' + icon('check') + 'Done</button></div>';
    }
    if (tile.size === 'md') {
      return '<div class="mt md" ' + open + '>' +
        '<div class="lname">' + escapeHtml(list.name) + '</div>' + icon(list.icon, 'glyph') +
        '<div style="min-width:0"><div class="what">' + escapeHtml(entry.item.title) + '</div><div class="when">' + whenMarkup(entry) + '</div></div></div>';
    }
    return '<div class="mt sm" ' + open + '>' + icon(list.icon) + '<span>' + escapeHtml(list.name) + '</span></div>';
  }

  function homeTiles() {
    const now = nowMs();
    const tiles = [];
    for (const list of orderedLists()) {
      const entry = nextEntryOfList(list.id);
      let urgency = null;
      if (entry) {
        urgency = entry.shown.state === 'overdue' ? now : entry.shown.at;
      }
      const size = Logic.tileSize(urgency, now);
      tiles.push({ list: list, entry: entry, size: size, urgency: urgency });
    }
    tiles.sort(compareTiles);
    return tiles;
  }

  function todayCount() {
    const today = todayText();
    const zone = deviceZone();
    let count = 0;
    for (const entry of shownItems(null)) {
      const pending = entry.shown.state === 'overdue' || entry.shown.state === 'upcoming';
      if (pending && Logic.localDateOf(entry.shown.at, zone) === today) {
        count += 1;
      }
    }
    return count;
  }

  function renderHome() {
    let tilesHtml = '';
    for (const tile of homeTiles()) {
      tilesHtml += tileMarkup(tile);
    }
    tilesHtml += '<button class="mt sm add" data-action="new-list">' + icon('plus') + '<span>New List</span></button>';
    const today = todayText();
    const zone = deviceZone();
    let rowsHtml = '';
    for (const entry of shownItems(null)) {
      const isToday = Logic.localDateOf(entry.shown.at, zone) === today;
      if (isToday || entry.shown.state === 'overdue') {
        rowsHtml += rowMarkup(entry, true);
      }
    }
    const count = todayCount();
    const countHtml = count > 0 ? '<span class="soft">' + count + ' today</span>' : '';
    let html = '<header class="head"><h1 class="h1">Lists</h1>' + countHtml + '</header>' +
      '<div class="mosaic">' + tilesHtml + '</div>';
    if (rowsHtml) {
      html += '<div class="lab">Today</div><div class="rows">' + rowsHtml + '</div>';
    }
    return html;
  }

  // Pin positions along the ruler: evenly spaced, "At the time" on the right
  function pinPositions(count) {
    if (count <= 1) {
      return [50];
    }
    const positions = [];
    for (let index = 0; index < count; index += 1) {
      positions.push(8 + (index * 84) / (count - 1));
    }
    return positions;
  }

  function rulerMarkup(rules, colourId, eventIcon, pinAction, selectedRuleId) {
    const sorted = Logic.sortedRules(rules);
    const positions = pinPositions(sorted.length + 1);
    let html = '<div class="ruler" style="' + colourStyle(colourId) + '"><div class="base"></div>';
    for (let index = 0; index < sorted.length; index += 1) {
      const rule = sorted[index];
      const pinClass = rule.id === selectedRuleId ? 'pin sel' : 'pin';
      html += '<button class="' + pinClass + '" data-action="' + pinAction + '" data-rule="' + escapeHtml(rule.id) + '" style="left:' + positions[index] + '%">' +
        '<span class="lbl">' + escapeHtml(Logic.ruleLabel(rule)) + '</span><span class="dot">' + icon('bell') + '</span>' +
        '<span class="sub">' + escapeHtml(Logic.ruleSubLabel(rule)) + '</span></button>';
    }
    html += '<div class="pin event" style="left:' + positions[sorted.length] + '%"><span class="lbl">At the time</span>' +
      '<span class="dot">' + icon(eventIcon) + '</span><span class="sub"></span></div></div>';
    return html;
  }

  function renderList(listId) {
    const list = state.lists[listId];
    if (!list) {
      state.view = { name: 'home', id: null };
      return renderHome();
    }
    let html = '<div class="nav"><button class="btn" data-action="home" aria-label="Lists">' + icon('caret-left') + '</button>' +
      '<button class="btn" data-action="edit-list" data-id="' + escapeHtml(list.id) + '">Edit</button></div>' +
      '<div class="hero" style="' + colourStyle(list.color) + '">' + icon(list.icon, 'glyph') + '<div class="name">' + escapeHtml(list.name) + '</div></div>';
    html += rulerMarkup(list.alerts, list.color, list.icon, 'edit-list', null);
    const entries = shownItems(listId);
    if (entries.length === 0) {
      html += '<div class="empty">No Reminders</div>';
    } else {
      html += '<div class="rows">';
      for (const entry of entries) {
        html += rowMarkup(entry, false);
      }
      html += '</div>';
    }
    html += '<button class="add-row" data-action="new-reminder" data-list="' + escapeHtml(list.id) + '">' + icon('plus') + 'Add Reminder</button>';
    return html;
  }

  function renderMain() {
    const main = byId('main');
    if (!state.loaded) {
      main.innerHTML = '';
      return;
    }
    main.innerHTML = state.view.name === 'list' ? renderList(state.view.id) : renderHome();
  }

  function renderBar() {
    const bar = byId('bar');
    if (state.undo) {
      bar.innerHTML = '<div class="bar"><span>' + escapeHtml(state.undo.label) + '</span><button data-action="undo">Undo</button></div>';
    } else if (state.message) {
      bar.innerHTML = '<div class="bar"><span>' + escapeHtml(state.message) + '</span></div>';
    } else {
      bar.innerHTML = '';
    }
  }

  function renderAll() {
    renderMain();
    renderSheets();
    renderBar();
  }

  /* ---------- Sheets ---------- */

  function topSheet() {
    return state.sheets.length > 0 ? state.sheets[state.sheets.length - 1] : null;
  }

  function sheetFrame(sheetClass, title, saveLabel, saveEnabled, bodyHtml) {
    const disabled = saveEnabled ? '' : ' disabled';
    return '<div class="layer"><div class="scrim" data-action="close-sheet"></div><div class="sheet ' + sheetClass + '">' +
      '<div class="grab"></div><div class="nav"><button class="btn" data-action="close-sheet">Cancel</button>' +
      '<span class="mid">' + escapeHtml(title) + '</span>' +
      '<button class="btn fill" id="sheet-save" data-action="save-sheet"' + disabled + '>' + escapeHtml(saveLabel) + '</button></div>' +
      '<div class="sheet-body" id="sheet-body">' + bodyHtml + '</div></div></div>';
  }

  function renderSheets() {
    const container = byId('sheets');
    const sheet = topSheet();
    if (!sheet) {
      container.innerHTML = '';
      return;
    }
    const previousBody = byId('sheet-body');
    const scrollTop = previousBody ? previousBody.scrollTop : 0;
    if (sheet.type === 'reminder') {
      container.innerHTML = reminderSheetMarkup(sheet);
    } else if (sheet.type === 'list') {
      container.innerHTML = listSheetMarkup(sheet);
    } else {
      container.innerHTML = alertSheetMarkup(sheet);
    }
    const body = byId('sheet-body');
    if (body) {
      body.scrollTop = scrollTop;
    }
  }

  function openSheet(sheet) {
    state.sheets.push(sheet);
    renderSheets();
  }

  function closeSheet() {
    state.sheets.pop();
    renderSheets();
  }

  /* ----- Reminder sheet: a title, Date, Time and Repeat (founder, 2026-10-12) ----- */

  function newReminderDraft(listId) {
    return {
      type: 'reminder', id: null, title: '', list: listId, date: todayText(), time: nextWholeHour(),
      repeatKey: 'never', repeat: null, timeZone: deviceZone()
    };
  }

  function editReminderDraft(item) {
    return {
      type: 'reminder', id: item.id, title: item.title, list: item.list, date: item.date, time: item.time,
      repeatKey: Logic.optionForRepeat(item.repeat), repeat: item.repeat, timeZone: item.timeZone
    };
  }

  function draftRepeat(draft) {
    if (draft.repeatKey === 'custom') {
      return draft.repeat || null;
    }
    return Logic.repeatForOption(draft.repeatKey);
  }

  function reminderCanSave(draft) {
    const hasTitle = draft.title.trim() !== '';
    return hasTitle && Boolean(draft.date) && Boolean(draft.time) && Boolean(state.lists[draft.list]);
  }

  function timeRow(label, field, value) {
    return '<div class="row">' + icon('clock') + '<div class="grow">' + escapeHtml(label) + '</div>' +
      '<span class="val"><input type="time" data-field="' + field + '" value="' + escapeHtml(value) + '"></span></div>';
  }

  function repeatOptionsMarkup(draft) {
    let html = '';
    for (const option of Logic.REPEAT_OPTIONS) {
      const selected = option.key === draft.repeatKey ? ' selected' : '';
      html += '<option value="' + option.key + '"' + selected + '>' + escapeHtml(option.label) + '</option>';
    }
    if (draft.repeatKey === 'custom') {
      html += '<option value="custom" selected>Custom</option>';
    }
    return html;
  }

  // The reminder shows its list's icon and colour; there is nothing to pick
  function reminderSheetMarkup(draft) {
    const list = state.lists[draft.list];
    const colourId = list ? list.color : 'charcoal';
    let body = '<div class="title-field" style="' + colourStyle(colourId) + '"><span class="ichip">' + icon(list ? list.icon : 'bell') + '</span>' +
      '<input class="txt" data-field="title" placeholder="Title" autocomplete="off" value="' + escapeHtml(draft.title) + '"></div>' +
      '<div class="kv">' +
      '<div class="row">' + icon('calendar-dots') + '<div class="grow">Date</div><span class="val"><input type="date" data-field="date" value="' + escapeHtml(draft.date) + '"></span></div>' +
      timeRow('Time', 'time', draft.time) +
      '<div class="row">' + icon('repeat') + '<div class="grow">Repeat</div><span class="val"><select data-field="repeatKey">' + repeatOptionsMarkup(draft) + '</select></span></div>' +
      '</div>';
    if (draft.id) {
      body += '<button class="text-btn" data-action="delete-reminder">Delete Reminder</button>';
    }
    const title = draft.id ? 'Edit Reminder' : 'New Reminder';
    const saveLabel = draft.id ? 'Save' : 'Add';
    return sheetFrame('', title, saveLabel, reminderCanSave(draft), body);
  }

  /* ----- List sheet ----- */

  function newListDraft() {
    return { type: 'list', id: null, name: '', icon: 'list', color: 'butter', alerts: [], iconTab: 0, editingRuleId: null };
  }

  function editListDraft(list) {
    let iconTab = 0;
    for (let index = 0; index < ICON_TABS.length; index += 1) {
      if (ICON_TABS[index].icons.indexOf(list.icon) !== -1) {
        iconTab = index;
        break;
      }
    }
    return { type: 'list', id: list.id, name: list.name, icon: list.icon, color: list.color, alerts: Logic.copyJson(list.alerts), iconTab: iconTab, editingRuleId: null };
  }

  function listCanSave(draft) {
    return draft.name.trim() !== '';
  }

  function listSheetMarkup(draft) {
    let body = '<div class="title-field" style="' + colourStyle(draft.color) + '"><span class="ichip">' + icon(draft.icon) + '</span>' +
      '<input class="txt" data-field="name" placeholder="Name" autocomplete="off" value="' + escapeHtml(draft.name) + '"></div>';
    body += '<div class="lab">Icon</div><div class="tabs">';
    for (let index = 0; index < ICON_TABS.length; index += 1) {
      const tabClass = index === draft.iconTab ? 'on' : '';
      body += '<button class="' + tabClass + '" data-action="icon-tab" data-index="' + index + '">' + escapeHtml(ICON_TABS[index].name) + '</button>';
    }
    body += '</div><div class="grid6" style="' + colourStyle(draft.color) + '">';
    for (const name of ICON_TABS[draft.iconTab].icons) {
      const chipClass = name === draft.icon ? 'ichip on' : 'ichip';
      body += '<button class="' + chipClass + '" data-action="list-icon" data-icon="' + escapeHtml(name) + '" aria-label="' + escapeHtml(name) + '">' + icon(name) + '</button>';
    }
    body += '</div><div class="lab">Colour</div><div class="grid7">';
    for (const colour of Logic.COLOURS) {
      const swatchClass = colour.id === draft.color ? 'sw on' : 'sw';
      body += '<button class="' + swatchClass + '" data-action="list-colour" data-colour="' + colour.id + '" style="--c:' + colour.hex + '" aria-label="' + escapeHtml(colour.name) + '"></button>';
    }
    body += '</div><div class="lab">Alerts</div>' + rulerMarkup(draft.alerts, draft.color, draft.icon, 'edit-alert', null);
    if (draft.alerts.length < MAX_RULES) {
      body += '<button class="add-pin" data-action="add-alert">' + icon('plus') + 'Add Alert</button>';
    }
    const listOverride = { id: draft.id, alerts: draft.alerts };
    body += bookingWarning(bookingsWith([], [], draft.id ? listOverride : null));
    if (draft.id) {
      body += '<button class="hold" data-hold="delete-list"><span class="prog"></span><span class="lbl">' + icon('trash') + 'Hold to Delete</span></button>';
    }
    const title = draft.id ? 'Edit List' : 'New List';
    const saveLabel = draft.id ? 'Save' : 'Add';
    return sheetFrame('', title, saveLabel, listCanSave(draft), body);
  }

  /* ----- Alert sheet (one rule) ----- */

  // Alerts belong to lists only; the alert sheet always edits the Edit List sheet under it
  function parentRules(parent) {
    return parent.alerts;
  }

  function exampleTitleOf(parent) {
    return parent.name.trim() || 'Reminder';
  }

  function openAlertSheet(ruleId) {
    const parent = topSheet();
    const rules = parentRules(parent);
    let rule = null;
    for (const candidate of rules) {
      if (candidate.id === ruleId) {
        rule = Logic.copyJson(candidate);
      }
    }
    const isNew = rule === null;
    if (isNew) {
      rule = Logic.makeRule('before');
    }
    openSheet({ type: 'alert', rule: rule, isNew: isNew, exampleTitle: exampleTitleOf(parent), textEdited: typeof rule.text === 'string' });
  }

  // An example reminder tomorrow at 13:00 for the wording preview
  function previewText(sheet) {
    const zone = deviceZone();
    const tomorrow = Logic.addDays(todayText(), 1);
    const occurrence = Logic.wallClockToInstant(tomorrow, '13:00', zone).getTime();
    const rule = Logic.cleanRule(sheet.rule);
    const alertAt = Logic.alertMoment(rule, occurrence, zone);
    return Logic.renderWording(rule, sheet.exampleTitle, occurrence, alertAt, zone);
  }

  function stepperMarkup(action, valueText) {
    return '<div class="stepper"><button data-action="' + action + '" data-step="-1" aria-label="Less">−</button><b>' + escapeHtml(valueText) +
      '</b><button data-action="' + action + '" data-step="1" aria-label="More">+</button></div>';
  }

  function alertSheetMarkup(sheet) {
    const rule = sheet.rule;
    const kinds = [{ kind: 'daysBefore', label: 'Day Before' }, { kind: 'morningOf', label: 'Morning Of' }, { kind: 'before', label: 'Before' }];
    let body = '<div class="tabs" style="padding-top:8px">';
    for (const entry of kinds) {
      const tabClass = entry.kind === rule.kind ? 'on' : '';
      body += '<button class="' + tabClass + '" data-action="alert-kind" data-kind="' + entry.kind + '">' + entry.label + '</button>';
    }
    body += '</div><div class="kv" style="margin-top:6px">';
    if (rule.kind === 'daysBefore') {
      body += '<div class="row">' + icon('calendar-dots') + '<div class="grow">Days Before</div>' + stepperMarkup('step-days', String(rule.days)) + '</div>';
      body += timeRow('Time', 'ruleTime', rule.time);
    } else if (rule.kind === 'morningOf') {
      body += timeRow('Time', 'ruleTime', rule.time);
    } else {
      body += '<div class="row">' + icon('clock') + '<div class="grow">How Long</div>' + stepperMarkup('step-before', Logic.leadText(rule.minutes)) + '</div>';
    }
    const template = Logic.templateOf(Logic.cleanRule(rule));
    body += '<div class="row">' + icon('pencil-simple') + '<input class="wording" data-field="wording" autocomplete="off" value="' + escapeHtml(template) + '"></div></div>';
    body += '<div class="preview" id="alert-preview">' + escapeHtml(previewText(sheet)) + '</div>';
    if (!sheet.isNew) {
      body += '<button class="text-btn" data-action="delete-alert">Delete Alert</button>';
    }
    return sheetFrame('short', 'Alert', 'Save', true, body);
  }

  // Changing the kind or lead resets wording the person did not write themselves
  function resetDefaultWording(sheet) {
    if (!sheet.textEdited) {
      sheet.rule.text = null;
    }
  }

  function saveAlertSheet() {
    const sheet = state.sheets.pop();
    const parent = topSheet();
    const rules = parentRules(parent);
    const rule = Logic.cleanRule(sheet.rule);
    rule.id = rule.id || newId('r');
    let replaced = false;
    for (let index = 0; index < rules.length; index += 1) {
      if (rules[index].id === rule.id) {
        rules[index] = rule;
        replaced = true;
      }
    }
    if (!replaced) {
      rules.push(rule);
    }
    renderSheets();
  }

  function deleteAlertFromSheet() {
    const sheet = state.sheets.pop();
    const parent = topSheet();
    const rules = parentRules(parent);
    const kept = [];
    for (const rule of rules) {
      if (rule.id !== sheet.rule.id) {
        kept.push(rule);
      }
    }
    parent.alerts = kept;
    renderSheets();
  }

  /* ---------- Saving sheets ---------- */

  async function saveTopSheet() {
    const sheet = topSheet();
    if (sheet.type === 'alert') {
      saveAlertSheet();
      return;
    }
    if (sheet.type === 'list') {
      if (!listCanSave(sheet)) {
        return;
      }
      state.sheets.pop();
      renderSheets();
      const listId = await queueTask(function saveListFromSheet() {
        return saveListTask(sheet);
      });
      if (!sheet.id) {
        state.view = { name: 'list', id: listId };
      }
      renderAll();
      return;
    }
    if (!reminderCanSave(sheet)) {
      return;
    }
    state.sheets.pop();
    renderSheets();
    const draft = Logic.copyJson(sheet);
    draft.repeat = draftRepeat(sheet);
    await queueTask(function saveReminderFromSheet() {
      return saveReminderTask(draft);
    });
    renderAll();
  }

  async function deleteListFromSheet() {
    const sheet = topSheet();
    if (!sheet || sheet.type !== 'list' || !sheet.id) {
      return;
    }
    const listName = sheet.name || 'List';
    state.sheets = [];
    state.view = { name: 'home', id: null };
    renderAll();
    const snapshot = await queueTask(function deleteListFromHold() {
      return deleteListTask(sheet.id);
    });
    renderAll();
    offerUndo('Deleted ' + listName, snapshot);
  }

  async function deleteReminderFromSheet() {
    const sheet = topSheet();
    const title = sheet.title || 'Reminder';
    state.sheets = [];
    renderSheets();
    const snapshot = await queueTask(function deleteReminderFromButton() {
      return deleteReminderTask(sheet.id);
    });
    renderAll();
    offerUndo('Deleted ' + title, snapshot);
  }

  /* ======================================================================
     Events
     ====================================================================== */

  function handleAction(actionElement) {
    const action = actionElement.getAttribute('data-action');
    const id = actionElement.getAttribute('data-id');
    const sheet = topSheet();
    if (action === 'open-list') {
      state.view = { name: 'list', id: id };
      renderMain();
      window.scrollTo(0, 0);
    } else if (action === 'home') {
      state.view = { name: 'home', id: null };
      renderMain();
    } else if (action === 'done') {
      const doneRun = queueFromScreen(function markDoneFromScreen() {
        return markDoneTask(id);
      });
      doneRun.then(renderAll);
    } else if (action === 'not-done') {
      const notDoneRun = queueFromScreen(function markNotDoneFromScreen() {
        return markNotDoneTask(id);
      });
      notDoneRun.then(renderAll);
    } else if (action === 'new-list') {
      openSheet(newListDraft());
    } else if (action === 'edit-list') {
      const listId = id || state.view.id;
      if (state.lists[listId]) {
        openSheet(editListDraft(state.lists[listId]));
      }
    } else if (action === 'new-reminder') {
      // Reminders are added inside a list only
      const listId = actionElement.getAttribute('data-list');
      if (state.lists[listId]) {
        openSheet(newReminderDraft(listId));
      }
    } else if (action === 'edit-reminder') {
      if (state.items[id]) {
        openSheet(editReminderDraft(state.items[id]));
      }
    } else if (action === 'close-sheet') {
      closeSheet();
    } else if (action === 'save-sheet') {
      saveTopSheet();
    } else if (action === 'undo') {
      undoLatest();
    } else if (sheet) {
      handleSheetAction(action, actionElement, sheet);
    }
  }

  function handleSheetAction(action, actionElement, sheet) {
    if (action === 'add-alert') {
      openAlertSheet(null);
    } else if (action === 'edit-alert') {
      openAlertSheet(actionElement.getAttribute('data-rule'));
    } else if (action === 'icon-tab') {
      sheet.iconTab = Number(actionElement.getAttribute('data-index'));
      renderSheets();
    } else if (action === 'list-icon') {
      sheet.icon = actionElement.getAttribute('data-icon');
      renderSheets();
    } else if (action === 'list-colour') {
      sheet.color = actionElement.getAttribute('data-colour');
      renderSheets();
    } else if (action === 'alert-kind') {
      const kind = actionElement.getAttribute('data-kind');
      const fresh = Logic.makeRule(kind);
      fresh.id = sheet.rule.id;
      fresh.text = sheet.textEdited ? sheet.rule.text : null;
      sheet.rule = fresh;
      renderSheets();
    } else if (action === 'step-days') {
      const step = Number(actionElement.getAttribute('data-step'));
      sheet.rule.days = Math.min(Logic.MAX_DAYS_BEFORE, Math.max(1, sheet.rule.days + step));
      resetDefaultWording(sheet);
      renderSheets();
    } else if (action === 'step-before') {
      const step = Number(actionElement.getAttribute('data-step'));
      sheet.rule.minutes = Logic.stepBefore(sheet.rule.minutes, step);
      resetDefaultWording(sheet);
      renderSheets();
    } else if (action === 'delete-alert') {
      deleteAlertFromSheet();
    } else if (action === 'delete-reminder') {
      deleteReminderFromSheet();
    }
  }

  function handleClick(clickEvent) {
    const actionElement = clickEvent.target.closest('[data-action]');
    if (!actionElement || actionElement.disabled) {
      return;
    }
    clickEvent.preventDefault();
    handleAction(actionElement);
  }

  // Typing and picking: the draft follows the field; only derived parts are redrawn, so the
  // field being edited (and an open picker) is not replaced
  function handleFieldInput(inputEvent) {
    const field = inputEvent.target.getAttribute('data-field');
    const sheet = topSheet();
    if (!field || !sheet) {
      return;
    }
    const value = inputEvent.target.value;
    if (sheet.type === 'reminder') {
      updateReminderField(sheet, field, value);
    } else if (sheet.type === 'list') {
      if (field === 'name') {
        sheet.name = value;
        byId('sheet-save').disabled = !listCanSave(sheet);
      }
    } else {
      updateAlertField(sheet, field, value);
    }
  }

  function updateReminderField(sheet, field, value) {
    if (field === 'title') {
      sheet.title = value;
    } else if (field === 'date') {
      sheet.date = value;
    } else if (field === 'time') {
      sheet.time = value;
    } else if (field === 'repeatKey') {
      sheet.repeatKey = value;
    }
    const save = byId('sheet-save');
    if (save) {
      save.disabled = !reminderCanSave(sheet);
    }
  }

  function updateAlertField(sheet, field, value) {
    if (field === 'ruleTime') {
      sheet.rule.time = value || sheet.rule.time;
    } else if (field === 'wording') {
      sheet.rule.text = value;
      sheet.textEdited = value.trim() !== '';
    }
    const preview = byId('alert-preview');
    if (preview) {
      preview.textContent = previewText(sheet);
    }
  }

  /* ----- Hold to Delete ----- */

  function handlePointerDown(pointerEvent) {
    const holdElement = pointerEvent.target.closest('[data-hold]');
    if (!holdElement) {
      return;
    }
    pointerEvent.preventDefault();
    holdElement.classList.add('holding');
    clearTimeout(holdTimer);
    holdTimer = setTimeout(deleteListFromSheet, HOLD_MS);
  }

  function cancelHold() {
    clearTimeout(holdTimer);
    holdTimer = null;
    const holding = document.querySelector('.hold.holding');
    if (holding) {
      holding.classList.remove('holding');
    }
  }

  /* ---------- Coming back to the page ---------- */

  // The shell may have written Done or Snooze into records while the page was away
  function handleVisibilityChange() {
    if (document.visibilityState === 'visible') {
      queueFromScreen(syncAndRender);
    }
  }

  function handleTick() {
    if (document.visibilityState === 'visible') {
      renderMain();
    }
  }

  async function firstLoad() {
    await seedStarterLists();
    await publishWidgets();
    await syncAll();
    renderAll();
  }

  let readyPromise = null;

  function start() {
    document.addEventListener('click', handleClick);
    document.addEventListener('input', handleFieldInput);
    document.addEventListener('change', handleFieldInput);
    document.addEventListener('pointerdown', handlePointerDown);
    document.addEventListener('pointerup', cancelHold);
    document.addEventListener('pointercancel', cancelHold);
    document.addEventListener('visibilitychange', handleVisibilityChange);
    window.addEventListener('pageshow', handleVisibilityChange);
    setInterval(handleTick, TICK_MS);
    readyPromise = queueTask(firstLoad);
    readyPromise.catch(showLoadFailure);
  }

  function showLoadFailure() {
    state.loaded = true;
    renderAll();
    showMessage('Can’t Open Reminders');
  }

  start();

  /* ---------- For tests: the same operations the screen uses ---------- */

  function whenReady() {
    return readyPromise;
  }

  function saveList(draft) {
    return queueTask(function saveListForCaller() {
      return saveListTask(draft);
    });
  }

  function saveReminder(draft) {
    return queueTask(function saveReminderForCaller() {
      return saveReminderTask(draft);
    });
  }

  async function deleteList(listId) {
    const snapshot = await queueTask(function deleteListForCaller() {
      return deleteListTask(listId);
    });
    offerUndo('Deleted List', snapshot);
    return snapshot;
  }

  function markDone(itemId) {
    return queueTask(function markDoneForCaller() {
      return markDoneTask(itemId);
    });
  }

  function markNotDone(itemId) {
    return queueTask(function markNotDoneForCaller() {
      return markNotDoneTask(itemId);
    });
  }

  function sync() {
    return queueTask(syncAndRender);
  }

  function bookings() {
    return bookingsWith([], [], null);
  }

  function snapshotState() {
    return Logic.copyJson({ lists: state.lists, items: state.items, view: state.view });
  }

  return {
    whenReady: whenReady, saveList: saveList, saveReminder: saveReminder, deleteList: deleteList, undo: undoLatest,
    markDone: markDone, markNotDone: markNotDone, sync: sync, bookings: bookings, state: snapshotState
  };
})();
</script>
</body>
</html>
