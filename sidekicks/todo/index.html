function listOf(todo) {
  return state.lists[todo.list] || state.lists[Logic.INBOX_ID];
}

function metaHtml(todo) {
  var viewName = state.view.name;
  var today = todayKey();
  var parts = [];
  if (viewName !== 'list' && todo.list && todo.list !== Logic.INBOX_ID) {
    var list = listOf(todo);
    parts.push('<span class="m">' + esc((list.emoji ? list.emoji + ' ' : '') + list.name) + '</span>');
  }
  if (todo.when && !todo.done) {
    if (todo.when < today) {
      // Overdue without shame (TD-DAY-04): red only in the Overdue model
      var isOverdueModel = state.settings.todayModel === 'stay';
      var lateText = isOverdueModel ? Logic.friendlyDay(todo.when, today) : 'Since ' + Logic.friendlyDay(todo.when, today);
      parts.push('<span class="m ' + (isOverdueModel ? 'late' : '') + '">' + esc(lateText) + '</span>');
    } else if (viewName !== 'today' && viewName !== 'upcoming') {
      var dayClass = todo.when === today ? 'today' : 'soon';
      parts.push('<span class="m ' + dayClass + '">' + ICON.cal + esc(Logic.friendlyDay(todo.when, today)) + '</span>');
    }
  }
  if (todo.time) {
    parts.push('<span class="m">' + ICON.clock + esc(Logic.friendlyTime(todo.time)) + '</span>');
  }
  if (todo.recur) {
    parts.push('<span class="m">' + ICON.repeat + esc(Logic.REPEAT_LABEL[todo.recur.every]) + '</span>');
  }
  if (todo.deadline && !todo.done) {
    var soon = Logic.daysBetween(today, todo.deadline) <= 1 ? 'late' : '';
    parts.push('<span class="m ' + soon + '">' + ICON.flag + esc(Logic.friendlyDay(todo.deadline, today)) + '</span>');
  }
  if (todo.subtasks && todo.subtasks.length) {
    var doneSubtasks = 0;
    for (var index = 0; index < todo.subtasks.length; index++) {
      if (todo.subtasks[index].done) {
        doneSubtasks++;
      }
    }
    parts.push('<span class="m">' + ICON.subs + doneSubtasks + '/' + todo.subtasks.length + '</span>');
  }
  if (todo.notes) {
    parts.push('<span class="m">' + ICON.note + '</span>');
  }
  if (!parts.length) {
    return '';
  }
  return '<div class="row-meta">' + parts.join('') + '</div>';
}

function hexToHsl(hex) {
  var red = parseInt(hex.slice(1, 3), 16) / 255;
  var green = parseInt(hex.slice(3, 5), 16) / 255;
  var blue = parseInt(hex.slice(5, 7), 16) / 255;
  var max = Math.max(red, green, blue);
  var min = Math.min(red, green, blue);
  var hue = 0;
  var saturation = 0;
  var lightness = (max + min) / 2;
  if (max !== min) {
    var range = max - min;
    saturation = lightness > 0.5 ? range / (2 - max - min) : range / (max + min);
    if (max === red) {
      hue = (green - blue) / range + (green < blue ? 6 : 0);
    } else if (max === green) {
      hue = (blue - red) / range + 2;
    } else {
      hue = (red - green) / range + 4;
    }
    hue *= 60;
  }
  return { h: hue, s: saturation * 100, l: lightness * 100 };
}

// Heat look: each row a step warmer down the list, from the accent
function heatColor(index, count) {
  var hsl = hexToHsl(state.settings.accent);
  var span = count > 1 ? index / (count - 1) : 0;
  var hue = (hsl.h + span * 38) % 360;
  var light = Math.min(58, 44 + span * 10);
  return 'hsl(' + hue.toFixed(0) + ' ' + Math.max(70, hsl.s).toFixed(0) + '% ' + light.toFixed(0) + '%)';
}

function rowHtml(todo, index, count, extraHtml) {
  var classes = ['row'];
  if (todo.done) {
    classes.push('done');
  }
  var style = '';
  if (todo.color) {
    classes.push('hl');
    style += '--hl:' + todo.color + ';';
  }
  if (state.settings.look === 'heat' && !todo.done) {
    style += '--heat:' + heatColor(index, count) + ';';
  }
  var badge = '<span class="badge">' + esc(todo.emoji || '•') + '</span>';
  var emoji = todo.emoji ? '<span class="emo">' + esc(todo.emoji) + '</span>' : '';
  return '<div class="' + classes.join(' ') + '" data-id="' + esc(todo.id) + '" style="' + style + '">' +
    '<div class="swipe-bg"></div>' +
    '<div class="row-inner">' +
      badge +
      '<button class="check" data-action="tick" aria-label="' + (todo.done ? 'Not Done' : 'Done') + '">' + ICON.check + '</button>' +
      '<div class="row-main" data-action="open"><div class="row-title">' + emoji + '<span class="t">' + esc(todo.title) + '</span></div>' + metaHtml(todo) + '</div>' +
      (extraHtml || '') +
    '</div></div>';
}

function addRowHtml(label) {
  if (state.settings.add !== 'row') {
    return '';
  }
  return '<div class="add-row" data-action="inline-add"><span class="dot"></span><span>' + esc(label || 'New To-Do') + '</span></div>';
}

// A section: header, rows, the hidden-done toggle, the add row
function sectionHtml(options) {
  var items = options.items;
  var arranged = Logic.arrangeDone(items, state.settings.doneGoes);
  var attributes = ' data-section="1"';
  if (options.when) {
    attributes += ' data-when="' + esc(options.when) + '"';
  }
  if (options.part) {
    attributes += ' data-part="' + esc(options.part) + '"';
  }
  if (options.list) {
    attributes += ' data-list="' + esc(options.list) + '"';
  }
  var classes = 'sec' + (options.isToday ? ' is-today' : '');
  var html = '<section class="' + classes + '"' + attributes + (options.tint ? ' style="--tint:' + options.tint + '"' : '') + '>';
  if (options.title) {
    var open = Logic.openCount(items);
    var countHtml = options.showCount && open ? ' <span class="count">' + open + '</span>' : '';
    var subHtml = options.sub ? '<span class="sub">' + esc(options.sub) + '</span>' : '';
    html += '<h3 class="sec-h">' + (options.titleHtml || esc(options.title)) + countHtml + subHtml + '</h3>';
  }
  var main = arranged.main;
  for (var index = 0; index < main.length; index++) {
    html += rowHtml(main[index], index, main.length);
  }
  if (arranged.done.length) {
    var toggleLabel = state.showDone ? 'Hide Done' : 'Show Done (' + arranged.done.length + ')';
    html += '<div class="add-row" data-action="toggle-done"><span>' + toggleLabel + '</span></div>';
    if (state.showDone) {
      for (var doneIndex = 0; doneIndex < arranged.done.length; doneIndex++) {
        html += rowHtml(arranged.done[doneIndex], doneIndex, arranged.done.length);
      }
    }
  }
  if (!options.noAdd) {
    html += addRowHtml(options.addLabel);
  }
  html += '</section>';
  return html;
}

function emptyHtml(title, action, iconName) {
  var actionHtml = action ? '<button class="act" data-action="empty-add">' + esc(action) + '</button>' : '';
  return '<div class="empty"><div class="icon">' + ICON[iconName || 'check'] + '</div><h2>' + esc(title) + '</h2>' + actionHtml + '</div>';
}

  }
  if (view.name === 'upcoming') {
    return { title: 'Upcoming', icon: ICON.cal, color: '#E5484D' };
  }
  if (view.name === 'all') {
    return { title: 'All', icon: ICON.tray, color: '#12A594' };
  }
  if (view.name === 'someday') {
    return { title: 'Someday', icon: ICON.box, color: '#C9A86A' };
  }
  if (view.name === 'logbook') {
    return { title: 'Logbook', icon: ICON.book, color: '#30A46C' };
  }
  if (view.name === 'trash') {
    return { title: 'Trash', icon: ICON.trash, color: '#8D8A82' };
  }
  if (view.name === 'search') {

function addLabelForEmpty() {

function suggestionsHtml(today) {
  var suggestions = Logic.freshSuggestions(state, today);
  if (!suggestions.length) {
    return '';
  }
  var html = '<div class="suggest"><div class="sg-h"><span>Add to Today</span><button data-action="add-all">Add All</button></div>';
  for (var index = 0; index < Math.min(suggestions.length, 5); index++) {
    var suggestion = suggestions[index];
    var why = 'Planned';
    if (suggestion.inToday && suggestion.inToday < today) {
      why = 'From ' + Logic.friendlyDay(suggestion.inToday, today);
    } else if (suggestion.when < today) {
      why = 'Since ' + Logic.friendlyDay(suggestion.when, today);
    }
    html += '<div class="sg-row"><div class="t">' + (suggestion.emoji ? esc(suggestion.emoji) + ' ' : '') + esc(suggestion.title) +
      '<div class="m">' + esc(why) + '</div></div><button data-action="suggest-add" data-id="' + esc(suggestion.id) + '" aria-label="Add">' + ICON.plus + '</button></div>';
  }
  return html + '</div>';
}

function partTitleHtml(part) {
  var icon = part === 'evening' ? ICON.moon : (part === 'none' ? '' : ICON.sun);
  var iconHtml = state.settings.look === 'soft' || !icon ? '' : '<span class="part-icon" style="color:' + PART_TINT[part] + '">' + icon + '</span>';
  return iconHtml + esc(Logic.PART_LABEL[part]);
}

function renderToday() {
  var settings = state.settings;
  var today = todayKey();
  var items = Logic.todayItems(state, today, state.justTicked);
  var html = settings.todayModel === 'fresh' ? suggestionsHtml(today) : '';
  if (!items.length) {
    return html + emptyHtml('Nothing Today', addLabelForEmpty(), 'star');
  }
  if (Logic.openCount(items) === 0 && settings.doneGoes !== 'stay' && settings.doneGoes !== 'sink') {
    return html + emptyHtml('All Done', '', 'check');
  }
  var sections = Logic.todaySections(state, items, today);
  for (var index = 0; index < sections.length; index++) {
    var section = sections[index];
    if (section.kind === 'overdue') {
      html += sectionHtml({ title: 'Overdue', items: section.items, showCount: true, when: today, noAdd: true });
    } else if (section.kind === 'part') {
      var tint = 'color-mix(in srgb, ' + PART_TINT[section.part] + ' 18%, var(--surface))';
      html += sectionHtml({ title: Logic.PART_LABEL[section.part], titleHtml: partTitleHtml(section.part), items: section.items, when: today, part: section.part, showCount: true, tint: tint, isToday: true });
    } else {
      html += sectionHtml({ items: section.items, when: today, isToday: true });
    }
  }
  return html;
}

function renderUpcoming() {
  var today = todayKey();
  var html = '';
  for (var offset = 1; offset <= 14; offset++) {
    var key = Logic.addDays(today, offset);
    var items = Logic.upcomingDay(state, key, today, state.justTicked);
    if (!items.length && offset > 7 && state.settings.add !== 'row') {
      continue;
    }
    var date = Logic.parseDay(key);
    var label = offset === 1 ? 'Tomorrow' : Logic.WEEKDAYS[date.getDay()];
    var titleHtml = '<span class="day-num">' + date.getDate() + '</span> <span class="day-label">' + label + '</span>';
    html += sectionHtml({ title: label, titleHtml: titleHtml, items: items, when: key });
  }
  return html;
}

function listTitle(list) {
  return (list.emoji ? list.emoji + ' ' : '') + list.name;
}

function renderAll() {
  var lists = Logic.sortedLists(state);
  var today = todayKey();
  var html = '';
  for (var index = 0; index < lists.length; index++) {
    var items = Logic.listItems(state, lists[index].id, today, state.justTicked);
    if (!items.length && lists[index].id !== Logic.INBOX_ID && state.settings.add !== 'row') {
      continue;
    }
    html += sectionHtml({ title: listTitle(lists[index]), items: items, list: lists[index].id, showCount: true });
  }
  return html || emptyHtml('No To-Dos', 'New To-Do', 'tray');
}

function renderList() {
  var id = state.view.listId;
  var today = todayKey();
  var items = Logic.listItems(state, id, today, state.justTicked);
  var later = state.settings.todayModel === 'gated' ? Logic.laterCount(state, id, today) : 0;
  if (!items.length && state.settings.add !== 'row') {
    var laterHtml = later ? '<div class="empty later">' + later + ' Later</div>' : '';
    return emptyHtml('No To-Dos', addLabelForEmpty(), 'list') + laterHtml;
  }
  var html = sectionHtml({ items: items, list: id });
  if (later) {
    html += '<div class="add-row static">' + later + ' Later</div>';
  }
  return html;
}

function renderSomeday() {
  var items = Logic.somedayItems(state, todayKey(), state.justTicked);
  if (!items.length && state.settings.add !== 'row') {
    return emptyHtml('Nothing for Someday', '', 'box');
  }
  return sectionHtml({ items: items });
}

function renderLogbook() {
  var items = Logic.logbookItems(state);
  if (!items.length) {
    return emptyHtml('Nothing Done Yet', '', 'book');
  }
  var today = todayKey();
  var days = [];
  var byDay = {};
  for (var index = 0; index < items.length; index++) {
    var day = Logic.localDateKey(Date.parse(items[index].completedAt));
    if (!byDay[day]) {
      byDay[day] = [];
      days.push(day);
    }
    byDay[day].push(items[index]);
  }
  var html = '';
  for (var dayIndex = 0; dayIndex < days.length; dayIndex++) {
    var dayItems = byDay[days[dayIndex]];
    html += sectionHtml({ title: Logic.friendlyDay(days[dayIndex], today), items: dayItems, sub: dayItems.length + ' done', noAdd: true });
  }
  return html;
}

function renderTrash() {
  var items = Logic.trashItems(state);
  if (!items.length) {
    return emptyHtml('Trash Is Empty', '', 'trash');
  }
  var today = todayKey();
  var html = '<section class="sec">';
  for (var index = 0; index < items.length; index++) {
    var todo = items[index];
    var deletedDay = Logic.localDateKey(Date.parse(todo.deletedAt));
    html += '<div class="trash-item"><div class="t">' + (todo.emoji ? esc(todo.emoji) + ' ' : '') + esc(todo.title) +
      '<div class="m">' + esc('Deleted ' + Logic.friendlyDay(deletedDay, today)) + '</div></div>' +
      '<button class="chip parsed" data-action="restore" data-id="' + esc(todo.id) + '">Restore</button>' +
      '<button class="chip danger-chip" data-action="delete-now" data-id="' + esc(todo.id) + '">Delete Now</button></div>';
  }
  return html + '</section>';
}

function renderSearch() {
  var html = '<div class="search-wrap"><input id="searchInput" class="search-pill" placeholder="Search" value="' + esc(state.query) + '" autocomplete="off"></div>';
  var found = Logic.searchItems(state, state.query);
  if (!state.query.trim()) {
    return html;
  }
  if (!found.open.length && !found.done.length) {
    return html + emptyHtml('No Results', '', 'search');
  }
  if (found.open.length) {
    html += '<section class="sec"><h3 class="sec-h">To-Dos</h3>';
    for (var index = 0; index < found.open.length; index++) {
      html += rowHtml(found.open[index], index, found.open.length);
    }
    html += '</section>';
  }
  if (found.done.length) {
    html += '<section class="sec"><h3 class="sec-h">Done</h3>';
    for (var doneIndex = 0; doneIndex < found.done.length; doneIndex++) {
      // A done item can come back as a new to-do (grocery reuse, checklist P-new-21)
      var againButton = '<button class="chip parsed again" data-action="again" data-id="' + esc(found.done[doneIndex].id) + '">Add Again</button>';
      html += rowHtml(found.done[doneIndex], doneIndex, found.done.length, againButton);
    }
    html += '</section>';
  }
  return html;
}

function smartRows() {
  var today = todayKey();
  var lateCount = state.settings.todayModel === 'stay' ? Logic.overdueCount(state, today) : 0;
  return [
    { view: 'today', label: 'Today', icon: ICON.star, color: '#FFB224', count: Logic.openTodayCount(state, today), late: lateCount },
    { view: 'upcoming', label: 'Upcoming', icon: ICON.cal, color: '#E5484D', count: Logic.countUpcoming(state, today) },
    { view: 'all', label: 'All', icon: ICON.tray, color: '#12A594', count: Logic.countOpen(state) },
    { view: 'someday', label: 'Someday', icon: ICON.box, color: '#C9A86A', count: Logic.somedayItems(state, today, null).length },
    { view: 'logbook', label: 'Logbook', icon: ICON.book, color: '#30A46C', count: 0 }
  ];
}

function listRowsHtml(cardStyle) {
  var lists = Logic.sortedLists(state);
  var html = '';
  for (var index = 0; index < lists.length; index++) {
    var list = lists[index];
    var dot = '<span class="list-dot" style="background:' + esc(list.color) + '">' + (list.emoji ? esc(list.emoji) : ICON.tray) + '</span>';
    html += '<button class="nav-row" data-action="go-list" data-id="' + esc(list.id) + '">' + dot + '<span>' + esc(list.name) + '</span><span class="n">' + (Logic.openCountInList(state, list.id) || '') + '</span></button>';
  }
  return cardStyle ? '<div class="card-list">' + html + '</div>' : html;
}

function trashRowHtml() {
  var count = Logic.trashItems(state).length;
  return '<div class="nav-gap"></div><button class="nav-row" data-action="go" data-view="trash"><span class="ic" style="color:#8D8A82">' + ICON.trash + '</span><span>Trash</span><span class="n">' + (count || '') + '</span></button>';
}

function renderHome() {
  var settings = state.settings;
  var html = '<button class="search-pill" data-action="go-search">' + ICON.search + '<span>Search</span></button>';
  var rows = smartRows();
  var listsHeader = '<div class="nav-h"><span>Lists</span><button data-action="new-list">New List</button></div>';
  if (settings.home === 'tiles') {
    html += '<div class="tiles">';
    var tileColors = { today: settings.accent, upcoming: '#E5484D', all: '#3A3A3C', someday: '#C9A86A', logbook: '#30A46C' };
    for (var index = 0; index < rows.length; index++) {
      html += '<button class="tile" data-action="go" data-view="' + rows[index].view + '" style="background:' + tileColors[rows[index].view] + '"><span class="ic">' + rows[index].icon + '</span><span class="n">' + (rows[index].count || '') + '</span><span class="l">' + rows[index].label + '</span></button>';
    }
    html += '</div>' + listsHeader + listRowsHtml(true) + trashRowHtml();
    return html;
  }
  for (var rowIndex = 0; rowIndex < rows.length; rowIndex++) {
    if (rowIndex === 4) {
      html += '<div class="nav-gap"></div>';
    }
    var counts = (rows[rowIndex].late ? '<span class="late-n">' + rows[rowIndex].late + '</span>' : '') + '<span class="n">' + (rows[rowIndex].count || '') + '</span>';
    html += '<button class="nav-row" data-action="go" data-view="' + rows[rowIndex].view + '"><span class="ic" style="color:' + rows[rowIndex].color + '">' + rows[rowIndex].icon + '</span><span>' + rows[rowIndex].label + '</span>' + counts + '</button>';
  }
  html += listsHeader + listRowsHtml(false) + trashRowHtml();
  return html;
}

function isRootView(viewName) {
  if (state.settings.home === 'tabs') {
    return ['today', 'upcoming', 'lists', 'search'].indexOf(viewName) !== -1;
  }
  return viewName === 'home';
}

function renderTopbar() {
  var viewName = state.view.name;
  var left = isRootView(viewName) ? '' : '<button class="glass" data-action="back" aria-label="Back">' + ICON.back + '</button>';
  var right = '';
  if (viewName !== 'search' && viewName !== 'home') {
    right += '<button class="glass" data-action="go-search" aria-label="Search">' + ICON.search + '</button>';
  }
  if (viewName === 'list') {
    right += '<button class="glass" data-action="edit-list" aria-label="Edit List">' + ICON.more + '</button>';
  }
  right += '<button class="glass" data-action="panel" aria-label="Make It Yours">' + ICON.gear + '</button>';
  if (state.homeScreen && isRootView(viewName)) {
    right = '<button class="glass help-q" data-action="help" aria-label="Help">?</button>' + right;
  }
  document.getElementById('topbar').innerHTML = '<div>' + left + '</div><div class="right">' + right + '</div>';
}

function renderTitle() {
  var viewName = state.view.name;
  if (viewName === 'home') {
    return '';
  }
  if (viewName === 'lists') {
    return '<div class="title-wrap"><h1 class="big-title">Lists</h1></div>';
  }
  var info = viewTitle();
  var icon = info.icon ? '<span class="ti" style="color:' + info.color + '">' + info.icon + '</span>' : '';
  if (info.isList && info.emoji) {
    icon = '<span>' + esc(info.emoji) + '</span>';
  }
  var look = state.settings.look;
  var titleColor = info.isList && look !== 'wallpaper' && look !== 'heat' ? ' style="color:' + esc(info.color) + '"' : '';
  var subHtml = info.sub ? '<div class="subtitle">' + esc(info.sub) + '</div>' : '';
  if (look === 'heat' && viewName !== 'search') {
    var heatSub = info.sub ? '<div class="subtitle" style="color:rgba(255,255,255,.8)">' + esc(info.sub) + '</div>' : '';
    return '<div class="title-wrap" style="background:' + heatColor(0, 2) + ';margin-bottom:0;padding-top:14px;padding-bottom:14px"><h1 class="big-title" style="color:#fff">' + esc(info.title) + '</h1>' + heatSub + '</div>';
  }
  return '<div class="title-wrap"><h1 class="big-title"' + titleColor + '>' + icon + esc(info.title) + '</h1>' + subHtml + '</div>';
}

function canAddHere(viewName) {
  return ['logbook', 'search', 'home', 'lists', 'trash'].indexOf(viewName) === -1;
}

function renderBottom() {
  var settings = state.settings;
  var html = '';
  var viewName = state.view.name;
  var canAdd = canAddHere(viewName);
  if (canAdd && (settings.add === 'fab' || settings.add === 'dragFab')) {
    html += '<button class="fab" id="fab" aria-label="New To-Do">' + ICON.plus + '</button>';
  }
  if (canAdd && settings.add === 'bar') {
    html += '<div class="addbar"><div class="preview" id="barPreview"></div><input id="barInput" placeholder="I want to…" autocomplete="off" enterkeyhint="done"></div>';
  }
  if (settings.home === 'tabs') {
    var tabs = [['today', 'Today', ICON.star], ['upcoming', 'Upcoming', ICON.cal], ['lists', 'Lists', ICON.list], ['search', 'Search', ICON.search]];
    html += '<nav class="tabbar">';
    for (var index = 0; index < tabs.length; index++) {
      var underLists = tabs[index][0] === 'lists' && ['list', 'all', 'someday', 'logbook', 'trash'].indexOf(viewName) !== -1;
      var on = viewName === tabs[index][0] || underLists;
      html += '<button class="tab' + (on ? ' on' : '') + '" data-action="tab" data-view="' + tabs[index][0] + '">' + tabs[index][2] + tabs[index][1] + '</button>';
    }
    html += '</nav>';
  }
  document.getElementById('bottom').innerHTML = html;
  var screen = document.getElementById('screen');
  screen.classList.toggle('has-tabs', settings.home === 'tabs');
  screen.classList.toggle('has-bar', canAdd && settings.add === 'bar');
}

function resolvedTheme() {
  if (state.settings.theme !== 'auto') {
    return state.settings.theme;
  }
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

var FONTS = {
  system: '-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif',
  serif: '-apple-system, BlinkMacSystemFont, system-ui, sans-serif',
  rounded: 'ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif',
  mono: 'ui-monospace, "SF Mono", Menlo, monospace'
};
var TEXT_SIZES = { s: 15, m: 17, l: 19, xl: 22 };

function applyLook() {
  var settings = state.settings;
  var screen = document.getElementById('screen');
  screen.dataset.look = settings.look;
  screen.dataset.theme = settings.look === 'heat' ? 'dark' : resolvedTheme();
  screen.dataset.checkbox = settings.checkbox;
  screen.classList.toggle('compact', settings.density === 'compact');
  screen.classList.toggle('no-meta', !settings.showMeta);
  screen.classList.toggle('date-colors', settings.dateColors);
  screen.style.setProperty('--accent', settings.accent);
  screen.style.setProperty('--fs', TEXT_SIZES[settings.textSize] + 'px');
  screen.style.setProperty('--font', FONTS[settings.font]);
  screen.style.setProperty('--font-head', settings.font === 'serif' ? '"New York", ui-serif, Georgia, serif' : FONTS[settings.font]);
  var wall = 'linear-gradient(165deg, ' + settings.accent + ' 0%, color-mix(in srgb, ' + settings.accent + ' 55%, #000) 100%)';
  if (state.view.name === 'list') {
    var list = state.lists[state.view.listId];
    wall = list && WALLPAPERS[list.wallpaper] ? WALLPAPERS[list.wallpaper] : WALLPAPERS.ocean;
  }
  screen.style.setProperty('--wall', wall);
}

function viewBody(viewName) {
  if (viewName === 'home' || viewName === 'lists') {
    return renderHome();
  }
  if (viewName === 'upcoming') {
    return renderUpcoming();
  }
  if (viewName === 'all') {
    return renderAll();
  }
  if (viewName === 'list') {
    return renderList();
  }
  if (viewName === 'someday') {
    return renderSomeday();
  }
  if (viewName === 'logbook') {
    return renderLogbook();
  }
  if (viewName === 'trash') {
    return renderTrash();
  }
  if (viewName === 'search') {
    return renderSearch();
  }
  return renderToday();
}

function render() {
  applyLook();
  renderTopbar();
  var viewName = state.view.name;
  var scroller = document.getElementById('scroller');
  var viewId = viewName + (state.view.listId || '');
  var keepScroll = render.lastView === viewId;
  var top = scroller.scrollTop;
  if (!state.loaded) {
    // Nothing until the store answers, so empty is never mixed up with loading (TD-SET-03)
    scroller.innerHTML = state.loadFailed ? emptyHtml('Can’t Load To-Dos', '', 'tray') : '';
  } else {
    scroller.innerHTML = renderTitle() + viewBody(viewName);
  }
  if (keepScroll) {
    scroller.scrollTop = top;
  }
  render.lastView = viewId;
  renderBottom();
  renderPanel();
  bindViewInputs();
}

function bindViewInputs() {
  var search = document.getElementById('searchInput');
  if (search) {
    search.addEventListener('input', handleSearchInput);
    if (document.activeElement !== search && state.view.name === 'search' && !bindViewInputs.typed) {
      search.focus();
    }
  }
  var bar = document.getElementById('barInput');
  if (bar) {
    bar.addEventListener('input', handleBarInput);
    bar.addEventListener('keydown', handleBarKey);
  }
  var fab = document.getElementById('fab');
  if (fab) {
    fab.addEventListener('pointerdown', handleFabDown);
  }
}

function handleSearchInput(event) {
  state.query = event.target.value;
  var caret = event.target.selectionStart;
  bindViewInputs.typed = true;
  render();
  var again = document.getElementById('searchInput');
  again.focus();
  again.setSelectionRange(caret, caret);
}

function chipsHtml(labels) {
  var html = '';
  for (var index = 0; index < labels.length; index++) {
    html += '<span class="chip parsed">' + esc(labels[index]) + '</span>';
  }
  return html;
}

function parsedChipsHtml(parsed) {
  return chipsHtml(Logic.parsedChipLabels(parsed, state, todayKey()));
}

function handleBarInput(event) {
  var text = event.target.value;
  var parsed = Logic.parseEntry(text, state, todayKey());
  var hasPreview = Logic.previewHtml(text, parsed) !== '';
  document.getElementById('barPreview').innerHTML = hasPreview ? '<div class="chips bar-chips">' + parsedChipsHtml(parsed) + '</div>' : '';
}

async function handleBarKey(event) {
  if (event.key !== 'Enter') {
    return;
  }
  var text = event.target.value;
  var todo = await createFromText(text, contextFields(null));
  if (!todo) {
    return;
  }
  event.target.value = '';
  document.getElementById('barPreview').innerHTML = '';
  render();
  document.getElementById('barInput').focus();
}

/* ---------- Navigation ---------- */

function go(view) {
  state.history.push(state.view);
  state.view = view;
  state.showDone = false;
  closeMenu();
  render();
  document.getElementById('scroller').scrollTop = 0;
}

function homeView() {
  return state.settings.home === 'tabs' ? { name: 'lists' } : { name: 'home' };
}

function goBack() {
  var previous = state.history.pop();
  if (!previous || previous.name === state.view.name) {
    previous = homeView();
  }
  state.view = previous;
  render();
}

/* ---------- Sheets: quick entry (TD-ADD-01), detail card (TD-ITEM-01), list editor, menu ---------- */

function openScrim() {
  var scrim = document.getElementById('scrim');
  scrim.hidden = false;
  requestAnimationFrame(showScrim);
}

function showScrim() {
  document.getElementById('scrim').classList.add('on');
}

function closeAll() {
  var scrim = document.getElementById('scrim');
  scrim.classList.remove('on');
  scrim.hidden = true;
  document.getElementById('quick').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
  closeMenu();
  if (closeAll.dirty) {
    closeAll.dirty = false;
    render();
  }
}

function whenChoiceOf(fields) {
  var today = todayKey();
  if (fields.someday) {
    return 'someday';
  }
  if (fields.when === today) {
    return 'today';
  }
  if (fields.when === Logic.addDays(today, 1)) {
    return 'tomorrow';
  }
  return fields.when ? 'keep' : 'none';
}

function listOptionsHtml(selectedId) {
  var lists = Logic.sortedLists(state);
  var html = '';
  for (var index = 0; index < lists.length; index++) {
    var selected = selectedId === lists[index].id ? ' selected' : '';
    html += '<option value="' + esc(lists[index].id) + '"' + selected + '>' + esc(listTitle(lists[index])) + '</option>';
  }
  return html;
}

var quickContext = null;
function openQuick(fields, insertOrder) {
  quickContext = { fields: fields || contextFields(null), order: insertOrder || null };
  var whenValue = whenChoiceOf(quickContext.fields);
  var keepOption = whenValue === 'keep' ? '<option value="keep" selected>' + esc(Logic.friendlyDay(quickContext.fields.when, todayKey())) + '</option>' : '';
  var whenOptions = '';
  for (var index = 0; index < Logic.WHEN_CHOICES.length; index++) {
    var choice = Logic.WHEN_CHOICES[index];
    whenOptions += '<option value="' + choice + '"' + (whenValue === choice ? ' selected' : '') + '>' + Logic.WHEN_CHOICE_LABEL[choice] + '</option>';
  }
  var quick = document.getElementById('quick');
  quick.innerHTML =
    '<input class="quick-title" id="quickTitle" placeholder="New To-Do" autocomplete="off" enterkeyhint="done">' +
    '<div class="preview" id="quickPreview"></div>' +
    '<div class="chips"><span id="quickParsed" class="chips inline"></span>' +
      '<select class="chip" id="quickWhen">' + keepOption + whenOptions + '</select>' +
      '<select class="chip" id="quickList">' + listOptionsHtml(quickContext.fields.list || Logic.INBOX_ID) + '</select>' +
      '<button class="save-btn" id="quickSave">Save</button>' +
    '</div>';
  openScrim();
  quick.classList.add('on');
  var input = document.getElementById('quickTitle');
  input.addEventListener('input', handleQuickInput);
  input.addEventListener('keydown', handleQuickKey);
  document.getElementById('quickSave').addEventListener('click', saveQuick);
  setTimeout(focusQuick, 30);
}

function focusQuick() {
  document.getElementById('quickTitle').focus();
}

function handleQuickInput(event) {
  var text = event.target.value;
  var parsed = Logic.parseEntry(text, state, todayKey());
  document.getElementById('quickPreview').innerHTML = Logic.previewHtml(text, parsed);
  document.getElementById('quickParsed').innerHTML = parsedChipsHtml(parsed);
}

function handleQuickKey(event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    saveQuick();
  }
  if (event.key === 'Escape') {
    closeAll();
  }
}

async function saveQuick() {
  var input = document.getElementById('quickTitle');
  var text = input.value;
  if (!text.trim()) {
    closeAll();
    return;
  }
  var fields = Logic.copyJson(quickContext.fields);
  var whenChoice = document.getElementById('quickWhen').value;
  var today = todayKey();
  if (whenChoice === 'today') {
    fields.when = today;
    fields.someday = false;
  }
  if (whenChoice === 'tomorrow') {
    fields.when = Logic.addDays(today, 1);
    fields.someday = false;
  }
  if (whenChoice === 'someday') {
    fields.when = null;
    fields.someday = true;
  }
  if (whenChoice === 'none') {
    fields.when = null;
    fields.someday = false;
  }
  fields.list = document.getElementById('quickList').value;
  if (quickContext.order !== null) {
    fields.order = quickContext.order;
  }
  var todo = await createFromText(text, fields);
  if (todo) {
    // Rapid entry: the card stays open for the next one, placed after this one
    if (quickContext.order !== null) {
      quickContext.order = todo.order + 0.0001;
    }
    offerUndo('Added: ' + todo.title, [{ id: todo.id, missing: true }]);
  }
  input.value = '';
  document.getElementById('quickPreview').innerHTML = '';
  document.getElementById('quickParsed').innerHTML = '';
  closeAll.dirty = true;
  render();
  input.focus();
}

/* Detail card */
var detailId = null;
function openDetail(id) {
  detailId = id;
  renderDetail();
  openScrim();
  document.getElementById('sheet').classList.add('on');
}

function optionHtml(value, label, selectedValue) {
  return '<option value="' + value + '"' + (selectedValue === value ? ' selected' : '') + '>' + label + '</option>';
}

function renderDetail() {
  var todo = state.todos[detailId];
  if (!todo) {
    closeAll();
    return;
  }
  var today = todayKey();
  var subtasks = '';
  for (var index = 0; index < todo.subtasks.length; index++) {
    var subtask = todo.subtasks[index];
    subtasks += '<div class="sub-row' + (subtask.done ? ' done' : '') + '"><button class="check" data-sub-tick="' + esc(subtask.id) + '">' + ICON.check + '</button><span class="st">' + esc(subtask.title) + '</span><button class="x" data-sub-del="' + esc(subtask.id) + '" aria-label="Delete">×</button></div>';
  }
  var emojiButtons = '<button data-emoji="" class="' + (!todo.emoji ? 'on' : '') + '">–</button>';
  for (var emojiIndex = 0; emojiIndex < Logic.EMOJIS.length; emojiIndex++) {
    var emoji = Logic.EMOJIS[emojiIndex];
    emojiButtons += '<button data-emoji="' + emoji + '" class="' + (todo.emoji === emoji ? 'on' : '') + '">' + emoji + '</button>';
  }
  var swatches = '<button class="sw none' + (!todo.color ? ' on' : '') + '" data-color="" aria-label="No Colour"></button>';
  for (var colorIndex = 0; colorIndex < Logic.ITEM_COLORS.length; colorIndex++) {
    var color = Logic.ITEM_COLORS[colorIndex];
    swatches += '<button class="sw' + (todo.color === color ? ' on' : '') + '" data-color="' + color + '" style="background:' + color + '"></button>';
  }
  var recur = todo.recur || {};
  var whenLabel = todo.someday ? 'Someday' : (todo.when ? Logic.friendlyDay(todo.when, today) : 'No Date');
  var whenQuick = '<select id="dWhenQuick"><option value="">' + esc(whenLabel) + '</option>';
  for (var choiceIndex = 0; choiceIndex < Logic.WHEN_CHOICES.length; choiceIndex++) {
    var choice = Logic.WHEN_CHOICES[choiceIndex];
    whenQuick += '<option value="' + choice + '">' + Logic.WHEN_CHOICE_LABEL[choice] + '</option>';
  }
  whenQuick += '</select>';
  var partSelect = '<select id="dPart"><option value="">Anytime</option>' + optionHtml('morning', 'Morning', todo.part) + optionHtml('afternoon', 'Afternoon', todo.part) + optionHtml('evening', 'Evening', todo.part) + '</select>';
  var repeatSelect = '<select id="dRepeat"><option value="">Never</option>' + optionHtml('day', 'Daily', recur.every) + optionHtml('weekday', 'Weekdays', recur.every) + optionHtml('week', 'Weekly', recur.every) + optionHtml('month', 'Monthly', recur.every) + '</select>';
  var repeatFrom = todo.recur ? '<select id="dRepeatFrom">' + optionHtml('schedule', 'On Schedule', recur.from) + optionHtml('done', 'After Done', recur.from) + '</select>' : '';
  var tickStyle = todo.done ? ' on' : '';
  document.getElementById('sheet').innerHTML =
    '<div class="grab"></div>' +
    '<div class="sheet-head"><button class="check sheet-check' + tickStyle + '" data-detail-tick="1" aria-label="' + (todo.done ? 'Not Done' : 'Done') + '">' + ICON.check + '</button><span></span><button class="round-btn primary" data-close="1" aria-label="Done">' + ICON.check + '</button></div>' +
    '<textarea class="d-title" id="dTitle" rows="1">' + esc(todo.title) + '</textarea>' +
    '<textarea class="d-notes" id="dNotes" placeholder="Notes">' + esc(todo.notes || '') + '</textarea>' +
    subtasks + '<input class="sub-add" id="dSubAdd" placeholder="Add Subtask">' +
    '<div class="field"><label>When</label><span class="pair">' + whenQuick + '<input type="date" id="dWhen" value="' + esc(todo.when || '') + '"></span></div>' +
    '<div class="field"><label>Part of Day</label>' + partSelect + '</div>' +
    '<div class="field"><label>Time</label><input type="time" id="dTime" value="' + esc(todo.time || '') + '"></div>' +
    '<div class="field"><label>Deadline</label><input type="date" id="dDeadline" value="' + esc(todo.deadline || '') + '"></div>' +
    '<div class="field"><label>Repeat</label><span class="pair">' + repeatSelect + repeatFrom + '</span></div>' +
    '<div class="field"><label>List</label><select id="dList">' + listOptionsHtml(todo.list) + '</select></div>' +

    '<div class="field"><label>Colour</label><div class="swatches">' + swatches + '</div></div>' +
    '<button class="danger" data-detail-delete="1">Delete To-Do</button>';
  bindDetail();
}

function bindDetail() {
  document.getElementById('dTitle').addEventListener('change', handleDetailField);
  document.getElementById('dNotes').addEventListener('change', handleDetailField);
  document.getElementById('dSubAdd').addEventListener('keydown', handleSubAdd);
  var ids = ['dWhenQuick', 'dWhen', 'dPart', 'dTime', 'dDeadline', 'dRepeat', 'dRepeatFrom', 'dList'];
  for (var index = 0; index < ids.length; index++) {
    var element = document.getElementById(ids[index]);
    if (element) {
      element.addEventListener('change', handleDetailField);
    }
  }
  document.getElementById('sheet').onclick = handleDetailClick;
}

async function handleDetailField(event) {
  var todo = Logic.copyJson(state.todos[detailId]);
  var fieldId = event.target.id;
  var value = event.target.value;
  var today = todayKey();
  if (fieldId === 'dWhenQuick') {
    if (value) {
      await setWhen(detailId, value);
      renderDetail();
    }
    return;
  }
  if (fieldId === 'dTitle') {
    todo.title = value.trim() || todo.title;
  }
  if (fieldId === 'dNotes') {
    todo.notes = value;
  }
  if (fieldId === 'dWhen') {
    todo = value ? Logic.withWhenDay(todo, value, undefined, state.settings, today) : Logic.withWhenChoice(todo, 'none', state.settings, today);
  }
  if (fieldId === 'dPart') {
    todo.part = value || null;
  }
  if (fieldId === 'dTime') {
    todo.time = value || null;
  }
  if (fieldId === 'dDeadline') {
    todo.deadline = value || null;
  }
  if (fieldId === 'dRepeat') {
    var from = todo.recur ? todo.recur.from : 'schedule';
    todo.recur = value ? { every: value, from: from } : null;
    if (todo.recur && !todo.when) {
      todo.when = today;
    }
  }
  if (fieldId === 'dRepeatFrom') {
    todo.recur.from = value;
  }
  if (fieldId === 'dList') {
    todo.list = value;
  }
  await saveTodo(todo);
  closeAll.dirty = true;
  if (fieldId === 'dRepeat' || fieldId === 'dWhen') {
    renderDetail();
  }
}

async function handleSubAdd(event) {
  if (event.key !== 'Enter' || !event.target.value.trim()) {
    return;
  }
  var todo = Logic.copyJson(state.todos[detailId]);
  todo.subtasks.push({ id: Logic.newId(Date.now()), title: event.target.value.trim(), done: false });
  await saveTodo(todo);
  closeAll.dirty = true;
  renderDetail();
  document.getElementById('dSubAdd').focus();
}

async function handleDetailClick(event) {
  var target = event.target.closest('button');
  if (!target) {
    return;
  }
  var todo = Logic.copyJson(state.todos[detailId]);
  if (target.dataset.close) {
    closeAll();
    return;
  }
  if (target.dataset.detailTick) {
    closeAll();
    await toggleDone(detailId, null);
    render();
    return;
  }
  if (target.dataset.detailDelete) {
    closeAll();
    await deleteTodo(detailId);
    return;
  }
  if (target.dataset.subTick) {
    for (var index = 0; index < todo.subtasks.length; index++) {
      if (todo.subtasks[index].id === target.dataset.subTick) {
        todo.subtasks[index].done = !todo.subtasks[index].done;
        if (todo.subtasks[index].done) {
          playTick();
          buzz();
        }
      }
    }
  }
  if (target.dataset.subDel) {
    var kept = [];
    for (var subIndex = 0; subIndex < todo.subtasks.length; subIndex++) {
      if (todo.subtasks[subIndex].id !== target.dataset.subDel) {
        kept.push(todo.subtasks[subIndex]);
      }
    }
    todo.subtasks = kept;
  }
  if (target.dataset.emoji !== undefined) {
    todo.emoji = target.dataset.emoji || null;
  }
  if (target.dataset.color !== undefined) {
    todo.color = target.dataset.color || null;
  }
  await saveTodo(todo);
  closeAll.dirty = true;
  renderDetail();
}

/* List editor (new list, rename, emoji, colour, wallpaper, delete) */
var editingList = null;
function openListEditor(listId) {
  var isNew = !listId;
  if (isNew) {
    editingList = { id: Logic.newId(Date.now()), name: '', emoji: null, color: Logic.ITEM_COLORS[5], wallpaper: 'ocean', order: Logic.sortedLists(state).length + 1, externalId: null, stored: null, isNew: true };
  } else {
    editingList = Logic.copyJson(state.lists[listId]);
    editingList.isNew = false;
  }
  renderListEditor();
  openScrim();
  document.getElementById('sheet').classList.add('on');
  setTimeout(focusListName, 60);
}

function focusListName() {
  var element = document.getElementById('lName');
  if (element && !element.value) {
    element.focus();
  }
}

function renderListEditor() {
  var list = editingList;
  var emojiButtons = '<button data-lemoji="" class="' + (!list.emoji ? 'on' : '') + '">–</button>';
  for (var index = 0; index < Logic.EMOJIS.length; index++) {
    var emoji = Logic.EMOJIS[index];
    emojiButtons += '<button data-lemoji="' + emoji + '" class="' + (list.emoji === emoji ? 'on' : '') + '">' + emoji + '</button>';
  }
  var swatches = '';
  for (var colorIndex = 0; colorIndex < Logic.ITEM_COLORS.length; colorIndex++) {
    var color = Logic.ITEM_COLORS[colorIndex];
    swatches += '<button class="sw' + (list.color === color ? ' on' : '') + '" data-lcolor="' + color + '" style="background:' + color + '"></button>';
  }
  var walls = '';
  for (var wallIndex = 0; wallIndex < Logic.WALLPAPER_NAMES.length; wallIndex++) {
    var name = Logic.WALLPAPER_NAMES[wallIndex];
    walls += '<button class="sw' + (list.wallpaper === name ? ' on' : '') + '" data-lwall="' + name + '" style="background:' + WALLPAPERS[name] + '"></button>';
  }
  var plan = Logic.listDeletePlan(state, list.id);
  var deleteHtml = '';
  if (!list.isNew && plan.allowed) {
    deleteHtml = '<button class="danger" data-ldelete="1">Delete List</button>';
    if (state.confirmDelete === list.id) {
      deleteHtml += '<div class="field plain"><span>Delete List and ' + plan.openCount + ' To-Dos?</span><span class="pair"><button class="chip" data-lcancel="1">Cancel</button><button class="chip confirm" data-lconfirm="1">Delete</button></span></div>';
    }
  }
  document.getElementById('sheet').innerHTML =
    '<div class="grab"></div><div class="sheet-head"><h3>' + (list.isNew ? 'New List' : 'Edit List') + '</h3><button class="round-btn primary" data-lsave="1" aria-label="Done">' + ICON.check + '</button></div>' +
    '<div class="field plain"><input type="text" class="list-name" id="lName" placeholder="List Name" value="' + esc(list.name) + '"></div>' +
    '<div class="field"><label>Icon</label><div class="emoji-pick">' + emojiButtons + '</div></div>' +
    '<div class="field"><label>Colour</label><div class="swatches">' + swatches + '</div></div>' +
    '<div class="field"><label>Wallpaper</label><div class="swatches">' + walls + '</div></div>' +
    deleteHtml;
  document.getElementById('sheet').onclick = handleListEditorClick;
}

function listToSave(list) {
  var saved = Logic.copyJson(list);
  delete saved.isNew;
  return saved;
}

async function handleListEditorClick(event) {
  var target = event.target.closest('button');
  if (!target) {
    return;
  }
  var list = editingList;
  var nameElement = document.getElementById('lName');
  if (nameElement) {
    list.name = nameElement.value.trim().slice(0, 80);
  }
  if (target.dataset.lemoji !== undefined) {
    list.emoji = target.dataset.lemoji || null;
  }
  if (target.dataset.lcolor) {
    list.color = target.dataset.lcolor;
  }
  if (target.dataset.lwall) {
    list.wallpaper = target.dataset.lwall;
  }
  if (target.dataset.lsave) {
    closeAll();
    if (!list.name) {
      render();
      return;
    }
    await saveList(listToSave(list));
    if (state.view.name !== 'list' || state.view.listId !== list.id) {
      go({ name: 'list', listId: list.id });
    } else {
      render();
    }
    return;
  }
  if (target.dataset.ldelete) {
    // A bulk delete asks first (checklist P-new-24); one to-do never does
    if (!Logic.listDeletePlan(state, list.id).asksFirst) {
      await deleteList(list.id);
      return;
    }
    state.confirmDelete = list.id;
  }
  if (target.dataset.lcancel) {
    state.confirmDelete = null;
  }
  if (target.dataset.lconfirm) {
    state.confirmDelete = null;
    await deleteList(list.id);
    return;
  }
  renderListEditor();
  if (list.name && !list.isNew) {
    await saveList(listToSave(list));
    closeAll.dirty = true;
  }
}

// The list goes and its to-dos go to the Trash; Undo brings both back
async function deleteList(listId) {
  var plan = Logic.listDeletePlan(state, listId);
  if (!plan.allowed) {
    return;
  }
  var saved = snapshot(plan.todoIds);
  var list = Logic.copyJson(state.lists[listId]);
  var now = Date.now();
  for (var index = 0; index < plan.todoIds.length; index++) {
    await saveTodo(Logic.trashedTodo(state.todos[plan.todoIds[index]], now));
  }
  await removeList(listId);
  closeAll();
  state.view = homeView();
  offerUndo('Deleted: ' + list.name, saved);
  state.undo.list = list;
  render();
}

/* Long-press menu (TD-GEST-03) */
function openMenu(id, x, y) {

  menu.className = 'menu';
  menu.id = 'menu';

  var screenRect = screen.getBoundingClientRect();

function closeMenu() {

  if (menu) {

}

async function handleMenuClick(event) {
  var target = event.target.closest('button');
  if (!target) {

    return;
  }
  await setWhen(id, choice);
}

/* ---------- Gestures on rows: tap, swipe (TD-GEST-01), long press to lift and drag (TD-GEST-02) ---------- */

var gesture = null;

function handleRowDown(event) {
  var row = event.target.closest('.row');
  if (!row || row.classList.contains('editing') || event.button > 0) {
    return;
  }
  if (event.target.closest('[data-action="tick"], [data-action="again"]')) {
    return;
  }
  var screenRect = document.getElementById('screen').getBoundingClientRect();
  gesture = {
    row: row, id: row.dataset.id, startX: event.clientX, startY: event.clientY, x: event.clientX, y: event.clientY,
    mode: 'pending', pointerId: event.pointerId,
    edge: event.clientX - screenRect.left < EDGE_PT
  };
  gesture.timer = setTimeout(startLift, LONG_PRESS_MS);
}

function handleRowMove(event) {
  if (!gesture || event.pointerId !== gesture.pointerId) {
    return;
  }
  gesture.x = event.clientX;
  gesture.y = event.clientY;
  var dx = event.clientX - gesture.startX;
  var dy = event.clientY - gesture.startY;
  if (gesture.mode === 'pending') {
    var isSideways = Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.3;
    if (isSideways && !gesture.edge && canSwipe()) {
      clearTimeout(gesture.timer);
      gesture.mode = 'swipe';
      gesture.row.classList.add('swiping');
      gesture.row.setPointerCapture(event.pointerId);
    } else if (Math.abs(dy) > 8 || Math.abs(dx) > 10) {
      clearTimeout(gesture.timer);
      gesture.mode = 'scroll';
    }
  }
  if (gesture.mode === 'swipe') {
    updateSwipe(dx);
  }
  if (gesture.mode === 'lift') {
    updateLift();
  }
}

function canSwipe() {
  var settings = state.settings;
  return settings.swipeRight !== 'none' || settings.swipeLeft !== 'none' || settings.checkbox === 'none';
}

var SWIPE_STYLE = {
  complete: { color: '#30A46C', label: 'Done' },
  tomorrow: { color: '#2F6FEB', label: 'Tomorrow' },
  delete: { color: '#E5484D', label: 'Delete' }
};

function swipeAction(dx) {
  var settings = state.settings;
  // With no checkbox, a right swipe always ticks, so a tick is never out of reach
  var right = settings.checkbox === 'none' && settings.swipeRight === 'none' ? 'complete' : settings.swipeRight;
  return dx > 0 ? right : settings.swipeLeft;
}

function updateSwipe(dx) {
  var swipe = swipeAction(dx);
  var inner = gesture.row.querySelector('.row-inner');
  var background = gesture.row.querySelector('.swipe-bg');
  var shown = swipe === 'none' ? dx * 0.15 : dx;
  inner.style.transform = 'translateX(' + shown + 'px)';
  var style = SWIPE_STYLE[swipe];
  var todo = state.todos[gesture.id];
  if (style) {
    var label = swipe === 'complete' && todo && todo.done ? 'Not Done' : style.label;
    var armed = Math.abs(dx) > 90;
    background.style.background = armed ? style.color : 'color-mix(in srgb, ' + style.color + ' 55%, #888)';
    background.className = 'swipe-bg ' + (dx > 0 ? 'go-right' : 'go-left');
    background.textContent = label;
  }
}

async function handleRowUp(event) {
  if (!gesture || event.pointerId !== gesture.pointerId) {
    return;
  }
  clearTimeout(gesture.timer);
  var finished = gesture;
  gesture = null;
  var dx = event.clientX - finished.startX;
  // The click that follows a swipe or lift is swallowed; the flag expires if no click comes
  setTimeout(clearSwallow, 350, finished.row);
  if (finished.mode === 'swipe') {
    var inner = finished.row.querySelector('.row-inner');
    finished.row.classList.remove('swiping');
    inner.style.transform = '';
    var swipe = swipeAction(dx);
    finished.row.dataset.swallow = '1';
    if (Math.abs(dx) > 90 && swipe !== 'none') {
      await runSwipe(swipe, finished);
    }
    return;
  }
  if (finished.mode === 'lift') {
    await finishLift(finished);
  }
}

async function runSwipe(swipe, finished) {
  if (swipe === 'complete') {
    await toggleDone(finished.id, finished.row.querySelector('.check'));
  }
  if (swipe === 'tomorrow') {
    await moveToTomorrow(finished.id);
  }
  if (swipe === 'delete') {
    await deleteTodo(finished.id);
  }
}

function clearSwallow(row) {
  delete row.dataset.swallow;
}

function handleRowCancel() {
  if (!gesture) {
    return;
  }
  clearTimeout(gesture.timer);
  if (gesture.mode === 'swipe') {
    gesture.row.classList.remove('swiping');
    gesture.row.querySelector('.row-inner').style.transform = '';
  }
  if (gesture.mode === 'lift') {
    cancelLift(gesture);
  }
  gesture = null;
}

/* Lift and drag: the drop line sits where the row will land; the lifted row floats above the finger */
function startLift() {
  if (!gesture || gesture.mode !== 'pending') {
    return;
  }
  var viewName = state.view.name;
  if (viewName === 'search' || viewName === 'logbook') {
    return;
  }
  gesture.mode = 'lift';
  gesture.moved = false;
  var row = gesture.row;
  var rect = row.getBoundingClientRect();
  var clone = row.cloneNode(true);
  clone.classList.add('lifted');
  clone.style.position = 'fixed';
  clone.style.left = rect.left + 'px';
  clone.style.width = rect.width + 'px';
  clone.style.top = rect.top + 'px';
  document.body.appendChild(clone);
  gesture.clone = clone;
  gesture.offsetY = gesture.startY - rect.top;
  row.classList.add('lift-ghost');
  try {
    row.setPointerCapture(gesture.pointerId);
  } catch (error) {
    // The pointer is already gone
  }
  buzz();
  updateLift();
}

function showDropLine(target) {
  var line = document.getElementById('dropLine');
  if (!target) {
    line.style.display = 'none';
    return;
  }
  var screenRect = document.getElementById('screen').getBoundingClientRect();
  line.style.display = 'block';
  line.style.top = (target.lineY - screenRect.top - 1.5) + 'px';
}

function updateLift() {
  var lifted = gesture;
  if (Math.abs(lifted.y - lifted.startY) > 6 || Math.abs(lifted.x - lifted.startX) > 6) {
    lifted.moved = true;
  }
  // Float 18 px above the finger so the drop line stays visible (checklist P-new-10)
  lifted.clone.style.top = (lifted.y - lifted.offsetY - 18) + 'px';
  var target = dropTarget(lifted.y, lifted.row);
  lifted.target = target;
  showDropLine(target);
  if (target) {
    autoScroll(lifted.y);
  }
}

function autoScroll(y) {
  var scroller = document.getElementById('scroller');
  var rect = scroller.getBoundingClientRect();
  if (y < rect.top + 60) {
    scroller.scrollTop -= 8;
  }
  if (y > rect.bottom - 80) {
    scroller.scrollTop += 8;
  }
}

// Where a drop at height y lands: section, the row before and after, and the line position.
// A drop always lands between rows, never into one (no accidental nesting, TD-GEST-02).
function dropTarget(y, excludeRow) {
  var sections = document.querySelectorAll('#scroller [data-section]');
  for (var sectionIndex = 0; sectionIndex < sections.length; sectionIndex++) {
    var section = sections[sectionIndex];
    var rect = section.getBoundingClientRect();
    if (y < rect.top - 12 || y > rect.bottom + 12) {
      continue;
    }
    var rows = section.querySelectorAll('.row:not(.lifted)');
    var previousId = null;
    var nextId = null;
    var lineY = null;
    for (var rowIndex = 0; rowIndex < rows.length; rowIndex++) {
      if (rows[rowIndex] === excludeRow || !rows[rowIndex].dataset.id) {
        continue;
      }
      var rowRect = rows[rowIndex].getBoundingClientRect();
      if (y < rowRect.top + rowRect.height / 2) {
        nextId = rows[rowIndex].dataset.id;
        lineY = rowRect.top;
        break;
      }
      previousId = rows[rowIndex].dataset.id;
      lineY = rowRect.bottom;
    }
    if (lineY === null) {
      var head = section.querySelector('.sec-h');
      lineY = head ? head.getBoundingClientRect().bottom + 2 : rect.top + 4;
    }
    return { section: section, prevId: previousId, nextId: nextId, lineY: lineY };
  }
  return null;
}

async function finishLift(lifted) {
  document.getElementById('dropLine').style.display = 'none';
  if (lifted.clone) {
    lifted.clone.remove();
  }
  lifted.row.classList.remove('lift-ghost');
  lifted.row.dataset.swallow = '1';
  if (!lifted.moved) {
    openMenu(lifted.id, lifted.startX, lifted.startY);
    return;
  }
  if (!lifted.target) {
    render();
    return;
  }
  var todo = Logic.copyJson(state.todos[lifted.id]);
  var saved = snapshot([lifted.id]);
  todo.order = Logic.orderBetween(orderOf(lifted.target.prevId), orderOf(lifted.target.nextId), Date.now());
  var section = lifted.target.section;
  // Dropping into another day or part of day moves it there; never into another to-do
  if (section.dataset.when && section.dataset.when !== todo.when && state.view.name === 'upcoming') {
    todo.when = section.dataset.when;
  }
  if (section.dataset.part) {
    todo.part = section.dataset.part === 'none' ? null : section.dataset.part;
  }
  if (section.dataset.list && state.view.name === 'all') {
    todo.list = section.dataset.list;
  }
  await saveTodo(todo);
  state.undo = { saved: saved, created: [], list: null };
  render();
}

function cancelLift(lifted) {
  document.getElementById('dropLine').style.display = 'none';
  if (lifted.clone) {
    lifted.clone.remove();
  }
  lifted.row.classList.remove('lift-ghost');
}

function preventScrollWhileDragging(event) {
  if ((gesture && gesture.mode === 'lift') || fabDrag) {
    event.preventDefault();
  }
}

/* Drag the + to a spot (TD-ADD-02) */
var fabDrag = null;
function handleFabDown(event) {
  var fab = event.currentTarget;
  fabDrag = { fab: fab, startX: event.clientX, startY: event.clientY, dragging: false, pointerId: event.pointerId };
  fab.setPointerCapture(event.pointerId);
  fab.addEventListener('pointermove', handleFabMove);
  fab.addEventListener('pointerup', handleFabUp);
  fab.addEventListener('pointercancel', handleFabUp);
}

function handleFabMove(event) {
  if (!fabDrag) {
    return;
  }
  var dx = event.clientX - fabDrag.startX;
  var dy = event.clientY - fabDrag.startY;
  if (!fabDrag.dragging && state.settings.add === 'dragFab' && Math.hypot(dx, dy) > 8) {
    fabDrag.dragging = true;
    fabDrag.fab.classList.add('dragging');
    buzz();
  }
  if (!fabDrag.dragging) {
    return;
  }
  fabDrag.fab.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.1)';
  var target = dropTarget(event.clientY - 30, null);
  fabDrag.target = target;
  showDropLine(target);
  if (target) {
    autoScroll(event.clientY);
  }
}

function handleFabUp() {
  if (!fabDrag) {
    return;
  }
  var drag = fabDrag;
  fabDrag = null;
  drag.fab.removeEventListener('pointermove', handleFabMove);
  drag.fab.removeEventListener('pointerup', handleFabUp);
  drag.fab.removeEventListener('pointercancel', handleFabUp);
  document.getElementById('dropLine').style.display = 'none';
  drag.fab.classList.remove('dragging');
  drag.fab.style.transform = '';
  if (!drag.dragging || !drag.target) {
    openQuick(null, null);
    return;
  }
  openInlineEditor(drag.target.section, drag.target.prevId, drag.target.nextId);
}

/* Inline editor: a new row typed in place (TD-ADD-04, TD-ADD-06) */
function openInlineEditor(sectionElement, previousId, nextId) {
  closeInlineEditor();
  var editor = document.createElement('div');
  editor.className = 'row editing';
  editor.id = 'inlineEditor';
  editor.innerHTML = '<div class="row-inner"><button class="check" tabindex="-1"></button><div class="row-main"><input class="inline-input" id="inlineInput" placeholder="New To-Do" autocomplete="off" enterkeyhint="next"><div class="preview" id="inlinePreview"></div></div></div>';
  var anchor = nextId ? sectionElement.querySelector('.row[data-id="' + nextId + '"]') : null;
  if (!anchor) {
    anchor = sectionElement.querySelector('.add-row');
  }
  if (anchor) {
    sectionElement.insertBefore(editor, anchor);
  } else {
    sectionElement.appendChild(editor);
  }
  var input = document.getElementById('inlineInput');
  input.dataset.prev = previousId || '';
  input.dataset.next = nextId || '';
  input.addEventListener('keydown', handleInlineKey);
  input.addEventListener('input', handleInlineInput);
  input.addEventListener('blur', handleInlineBlur);
  input.focus();
  editor.scrollIntoView({ block: 'nearest' });
}

function closeInlineEditor() {
  var editor = document.getElementById('inlineEditor');
  if (editor) {
    editor.remove();
  }
}

function handleInlineInput(event) {
  var text = event.target.value;
  var parsed = Logic.parseEntry(text, state, todayKey());
  document.getElementById('inlinePreview').innerHTML = Logic.previewHtml(text, parsed) ? parsedChipsHtml(parsed) : '';
}

async function handleInlineKey(event) {
  if (event.key === 'Escape') {
    event.target.value = '';
    closeInlineEditor();
    return;
  }
  if (event.key !== 'Enter') {
    return;
  }
  event.preventDefault();
  var input = event.target;
  var sectionElement = input.closest('[data-section]');
  var fields = contextFields(sectionElement);
  fields.order = Logic.orderBetween(orderOf(input.dataset.prev || null), orderOf(input.dataset.next || null), Date.now());
  var todo = await createFromText(input.value, fields);
  if (!todo) {
    closeInlineEditor();
    return;
  }
  input.removeEventListener('blur', handleInlineBlur);
  render();
  // Rapid entry: the next new row opens right after the one just added
  var newSection = findSectionFor(sectionElement);
  if (newSection) {
    openInlineEditor(newSection, todo.id, input.dataset.next || null);
  }
}

function handleInlineBlur(event) {
  if (!event.target.value.trim()) {
    setTimeout(closeInlineEditor, 120);
  }
}

function findSectionFor(oldSection) {
  var sections = document.querySelectorAll('#scroller [data-section]');
  for (var index = 0; index < sections.length; index++) {
    var section = sections[index];
    var sameDay = section.dataset.when === oldSection.dataset.when;
    var samePart = section.dataset.part === oldSection.dataset.part;
    var sameList = section.dataset.list === oldSection.dataset.list;
    if (sameDay && samePart && sameList) {
      return section;
    }
  }
  return sections[0] || null;
}

/* ---------- Import from Apple Reminders (TD-SET-04): the shell reads them, the page brings them in ---------- */

async function requestImport() {
  document.body.classList.remove('panel-open');
  var requestKey = Logic.REQUEST_PREFIX + 'i' + Logic.newId(Date.now());
  try {
    await store.set(requestKey, { kind: Logic.IMPORT_KIND, status: 'pending', createdAt: new Date().toISOString() });
  } catch (error) {
    showImportProblem('Import Failed', '', true);
    return;
  }
  setTimeout(checkImportRequest, IMPORT_POLL_MS, requestKey, Date.now());
}

// The shell answers by rewriting the request record: done, denied, cancelled or failed
async function checkImportRequest(requestKey, startedAt) {
  var request = null;
  try {
    request = await store.get(requestKey);
  } catch (error) {
    request = null;
  }
  var status = request ? request.status : null;
  if (!request || status === 'pending') {
    if (Date.now() - startedAt < IMPORT_POLL_LIMIT_MS) {
      setTimeout(checkImportRequest, IMPORT_POLL_MS, requestKey, startedAt);
    }
    return;
  }
  if (status === 'done') {
    await bringInImport(requestKey, request);
    return;
  }
  await removeRecords([requestKey]);
  if (status === 'denied') {
    showImportProblem('No Access to Reminders', 'Settings › Apps › Midas › Reminders › Full Access', false);
  } else if (status === 'failed') {
    showImportProblem('Import Failed', '', true);
  }
}

async function removeRecords(keys) {
  for (var index = 0; index < keys.length; index++) {
    try {
      await store.delete(keys[index]);
    } catch (error) {
      // Left behind it does no harm: nothing reads request: or import: records again
    }
  }
}

async function bringInImport(requestKey, request) {
  var prefix = String(request.prefix || '');
  var partRecords = [];
  try {
    partRecords = prefix ? await store.query(prefix) : [];
  } catch (error) {
    partRecords = [];
  }
  var cleanupKeys = [requestKey];
  for (var index = 0; index < partRecords.length; index++) {
    cleanupKeys.push(partRecords[index].key);
  }
  var exported = Logic.joinImportParts(partRecords);
  if (!exported) {
    await removeRecords(cleanupKeys);
    showImportProblem('Import Failed', '', true);
    return;
  }
  showImportSheet('<div class="sheet-head"><h3>Importing…</h3></div>');
  var plan = Logic.importPlan(state, exported, Date.now());
  var failed = 0;
  for (var listIndex = 0; listIndex < plan.lists.length; listIndex++) {
    await saveList(plan.lists[listIndex]);
  }
  for (var todoIndex = 0; todoIndex < plan.todos.length; todoIndex++) {
    var todo = plan.todos[todoIndex];
    try {
      await store.set(Logic.todoKey(todo.id), Logic.todoRecordValue(todo, deviceTimeZone()));
      state.todos[todo.id] = todo;
    } catch (error) {
      failed += 1;
    }
  }
  await removeRecords(cleanupKeys);
  showImportResult(plan.counts, failed);
  render();
}

function showImportSheet(html) {
  var sheet = document.getElementById('sheet');
  sheet.innerHTML = '<div class="grab"></div>' + html;
  sheet.onclick = handleImportSheetClick;
  openScrim();
  sheet.classList.add('on');
}

function resultRowHtml(label, count) {
  if (!count) {
    return '';
  }
  return '<div class="result-row"><span>' + label + '</span><span>' + count.toLocaleString('en-US') + '</span></div>';
}

function showImportResult(counts, failed) {
  var rows = resultRowHtml('Imported', counts.imported) + resultRowHtml('Updated', counts.updated) +
    resultRowHtml('Up to date', counts.upToDate) + resultRowHtml('Repeats not imported', counts.repeatsNotImported) +
    resultRowHtml('Not saved', failed);
  var close = '<button class="round-btn" data-import-close="1" aria-label="Close">' + ICON.close + '</button>';
  showImportSheet('<div class="sheet-head"><h3>Imported</h3>' + close + '</div>' + rows);
}

function showImportProblem(title, line, canRetry) {
  var close = '<button class="round-btn" data-import-close="1" aria-label="Close">' + ICON.close + '</button>';
  var lineHtml = line ? '<p class="result-line">' + esc(line) + '</p>' : '';
  var retry = canRetry ? '<button class="save-btn" data-import-retry="1">Try Again</button>' : '';
  showImportSheet('<div class="sheet-head"><h3>' + esc(title) + '</h3>' + close + '</div>' + lineHtml + retry);
}

function handleImportSheetClick(event) {
  var target = event.target.closest('button');
  if (!target) {
    return;
  }
  if (target.dataset.importClose) {
    closeAll();
  }
  if (target.dataset.importRetry) {
    closeAll();
    requestImport();
  }
}

/* ---------- Clicks ---------- */

async function handleScreenClick(event) {
  var row = event.target.closest('.row');
  if (row && row.dataset.swallow) {
    delete row.dataset.swallow;
    return;
  }
  var element = event.target.closest('[data-action]');
  if (!element) {
    return;
  }
  var action = element.dataset.action;
  if (action === 'tick') {
    await toggleDone(element.closest('.row').dataset.id, element);
    return;
  }
  if (action === 'open') {
    var id = element.closest('.row').dataset.id;
    // Heat with no checkbox: a double tap ticks, as in Clear
    if (state.settings.checkbox === 'none' && state.settings.look === 'heat' && event.detail === 2) {
      await toggleDone(id, element);
      return;
    }
    openDetail(id);
    return;
  }
  if (action === 'again') {
    var copy = Logic.againTodo(state.todos[element.dataset.id], todayKey(), Date.now());
    await saveTodo(copy);
    offerUndo('Added: ' + copy.title, [{ id: copy.id, missing: true }]);
    render();
    return;
  }
  await handleNavigationClick(action, element);
}

async function handleNavigationClick(action, element) {
  if (action === 'inline-add') {
    var section = element.closest('[data-section]');
    openInlineEditor(section, lastRowId(section), null);
  } else if (action === 'toggle-done') {
    state.showDone = !state.showDone;
    render();
  } else if (action === 'empty-add') {
    startAdd();
  } else if (action === 'suggest-add') {
    await addToToday(element.dataset.id);
  } else if (action === 'add-all') {
    await addAllSuggestions();
  } else if (action === 'restore') {
    await restoreTodo(element.dataset.id);
  } else if (action === 'delete-now') {
    await deleteNow(element.dataset.id);
  } else if (action === 'go') {
    go({ name: element.dataset.view });
  } else if (action === 'go-list') {
    go({ name: 'list', listId: element.dataset.id });
  } else if (action === 'go-search') {
    bindViewInputs.typed = false;
    go({ name: 'search' });
  } else if (action === 'tab') {
    state.history = [];
    state.view = { name: element.dataset.view };
    bindViewInputs.typed = false;
    render();
    document.getElementById('scroller').scrollTop = 0;
  } else if (action === 'back') {
    goBack();
  } else if (action === 'panel') {
    document.body.classList.add('panel-open');
  } else if (action === 'help') {
    openHelpMenu(element);
  } else if (action === 'new-list') {
    openListEditor(null);
  } else if (action === 'edit-list') {
    state.confirmDelete = null;
    openListEditor(state.view.listId);
  }
}

function lastRowId(sectionElement) {
  var rows = sectionElement.querySelectorAll('.row[data-id]');
  return rows.length ? rows[rows.length - 1].dataset.id : null;
}

// A new to-do from a key press or the empty state, in whatever way adding is set up
function startAdd() {
  var settings = state.settings;
  if (!canAddHere(state.view.name)) {
    state.view = { name: 'today' };
    render();
  }
  if (settings.add === 'bar') {
    var bar = document.getElementById('barInput');
    if (bar) {
      bar.focus();
    }
    return;
  }
  if (settings.add === 'row') {
    var section = document.querySelector('#scroller [data-section]');
    if (section) {
      openInlineEditor(section, lastRowId(section), null);
      return;
    }
  }
  openQuick(null, null);
}

function handleKeys(event) {
  var tag = (event.target.tagName || '').toLowerCase();
  var typing = tag === 'input' || tag === 'textarea' || tag === 'select';
  if (event.key === 'Escape') {
    closeAll();
    closeInlineEditor();
    document.body.classList.remove('panel-open');
    return;
  }
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'z' && !typing) {
    event.preventDefault();
    runUndo();
    return;
  }
  if (typing || event.metaKey || event.ctrlKey || event.altKey) {
    return;
  }
  if (event.key === 'n') {
    event.preventDefault();
    startAdd();
  }
  if (event.key === '/') {
    event.preventDefault();
    bindViewInputs.typed = false;
    go({ name: 'search' });
  }
  if (event.key === 't') {
    state.view = { name: 'today' };
    render();
  }
}

/* ---------- Make It Yours (TD-SET-01, TD-SET-02) ---------- */

function choiceButtonHtml(field, value, label, isOn) {
  var encoded = esc(JSON.stringify(value));
  return '<button class="' + (isOn ? 'on' : '') + '" data-set="' + field + '" data-val="' + encoded + '">' + esc(label) + '</button>';
}

function renderPanel() {
  var settings = state.settings;
  var html = '<button class="round-btn panel-close" data-panel-close="1" aria-label="Close">' + ICON.close + '</button>';
  html += '<h2>Make It Yours</h2><h4>Start From</h4><div class="presets">';
  for (var presetIndex = 0; presetIndex < Logic.PRESET_IDS.length; presetIndex++) {
    var presetId = Logic.PRESET_IDS[presetIndex];
    html += '<button class="' + (state.preset === presetId ? 'on' : '') + '" data-preset="' + presetId + '">' + Logic.PRESETS[presetId].name + '</button>';
  }
  html += '</div>';
  for (var groupIndex = 0; groupIndex < Logic.PANEL.length; groupIndex++) {
    var group = Logic.PANEL[groupIndex];
    html += '<h4>' + group[0] + '</h4>';
    for (var optionIndex = 0; optionIndex < group[1].length; optionIndex++) {
      var option = group[1][optionIndex];
      var field = option[0];
      html += '<div class="opt"><div class="ol"><span>' + option[1] + '</span></div>';
      if (option[2] === 'accent') {
        html += '<div class="accent-row">';
        for (var accentIndex = 0; accentIndex < Logic.ACCENTS.length; accentIndex++) {
          var accent = Logic.ACCENTS[accentIndex];
          html += '<button class="sw' + (settings.accent === accent ? ' on' : '') + '" data-set="accent" data-val="' + esc(JSON.stringify(accent)) + '" style="background:' + accent + '" aria-label="' + accent + '"></button>';
        }
        html += '</div></div>';
        continue;
      }
      html += '<div class="seg">';
      for (var choiceIndex = 0; choiceIndex < option[2].length; choiceIndex++) {
        var choice = option[2][choiceIndex];
        html += choiceButtonHtml(field, choice[0], choice[1], settings[field] === choice[0]);
      }
      html += '</div></div>';
    }
  }
  html += '<h4>Import</h4><div class="row-btns"><button data-panel-import="1">Import Apple Reminders</button></div>';
  document.getElementById('panel').innerHTML = html;
}

// Views a home style does not have give way to its own start
function fitViewToHome() {
  if (state.settings.home === 'tabs' && state.view.name === 'home') {
    state.view = { name: 'today' };
  }
  if (state.settings.home !== 'tabs' && state.view.name === 'lists') {
    state.view = { name: 'home' };
  }
}

async function handlePanelClick(event) {
  var element = event.target.closest('button');
  if (!element) {
    return;
  }
  if (element.dataset.panelClose) {
    document.body.classList.remove('panel-open');
    return;
  }
  if (element.dataset.panelImport) {
    await requestImport();
    return;
  }
  if (element.dataset.preset) {
    state.preset = element.dataset.preset;
    state.settings = Logic.presetSettings(element.dataset.preset);
    await saveSettings();
    fitViewToHome();
    render();
    return;
  }
  if (element.dataset.set) {
    var field = element.dataset.set;
    var value = JSON.parse(element.dataset.val);
    if (!Logic.isSettingValue(field, value)) {
      return;
    }
    state.settings[field] = value;
    state.preset = Logic.CUSTOM_PRESET;
    fitViewToHome();
    await saveSettings();
    render();
    if (field === 'tickSound') {
      playTick();
    }
  }
}

/* ---------- Start ---------- */

function watchTheDay() {
  // A new day re-draws Today (the today model works on read, no timer job needed)
  if (watchTheDay.day && watchTheDay.day !== todayKey()) {
    render();
  }
  watchTheDay.day = todayKey();
}

// Back on screen: read again, so a tick from a notification or jess shows
async function handleVisibilityChange() {
  if (document.visibilityState !== 'visible' || !state.loaded) {
    return;
  }
  try {
    await loadAll();
  } catch (error) {
    return;
  }
  render();
}

async function start() {
  var screen = document.getElementById('screen');
  screen.addEventListener('click', handleScreenClick);
  screen.addEventListener('pointerdown', handleRowDown);
  window.addEventListener('pointermove', handleRowMove);
  window.addEventListener('pointerup', handleRowUp);
  window.addEventListener('pointercancel', handleRowCancel);
  document.addEventListener('touchmove', preventScrollWhileDragging, { passive: false });
  document.getElementById('scrim').addEventListener('click', closeAll);
  document.getElementById('toastUndo').addEventListener('click', runUndo);
  document.getElementById('panel').addEventListener('click', handlePanelClick);
  document.addEventListener('keydown', handleKeys);
  document.addEventListener('visibilitychange', handleVisibilityChange);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
  render();
  try {
    await loadAll();
    state.loaded = true;
  } catch (error) {
    state.loadFailed = true;
  }
  if (state.loaded) {
    await publishWidget();
  }
  state.homeScreen = await shellShowsHomeScreenSteps();
  state.view = { name: 'today' };
  state.history = [homeView()];
  watchTheDay();
  setInterval(watchTheDay, 30000);
  render();
}

start();
